<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>会议记录</title>
    <link rel="stylesheet" href="floating.css" />
  </head>
  <body>
    <div class="bar" id="dragHandle" title="拖动移动窗口">
      <div class="row top">
        <span class="dot" id="statusDot"></span>
        <span class="timer" id="timer">00:00:00</span>
        <span class="status-text" id="statusText">待机</span>
      </div>
      <div class="row actions" id="actionRow">
        <button type="button" class="btn primary" id="btnStart">开始</button>
        <button type="button" class="btn" id="btnPause" disabled>暂停</button>
        <button type="button" class="btn danger" id="btnStop" disabled>结束</button>
      </div>
      <div class="row progress hidden" id="progressRow">
        <span class="progress-text" id="progressText">正在转写…</span>
      </div>
    </div>
    <script src="floating.js"></script>
  </body>
</html>
