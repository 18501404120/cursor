<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>会议记录</title>
    <link rel="stylesheet" href="floating.css" />
  </head>
  <body>
    <div class="bar" id="dragHandle" title="拖动移动">
      <div class="row main">
        <button type="button" class="btn-icon btn-close" id="btnClose" title="取消录音" aria-label="取消录音">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <span class="dot" id="statusDot" title="状态"></span>
        <span class="timer" id="timer">00:00</span>
        <div class="actions" id="actionRow">
          <button type="button" class="btn-icon primary" id="btnStart" title="开始录音" aria-label="开始">
            <svg class="ico-start" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>
          </button>
          <button type="button" class="btn-icon" id="btnPause" disabled title="暂停" aria-label="暂停">
            <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h3v10H8V7zm5 0h3v10h-3V7z" fill="currentColor"/></svg>
            <svg class="ico-resume" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12l10-6L8 6z" fill="currentColor"/></svg>
          </button>
          <button type="button" class="btn-icon danger" id="btnStop" disabled title="结束并转写" aria-label="结束">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>
          </button>
          <span class="spinner hidden" id="busySpinner" title="转写中"></span>
        </div>
      </div>
    </div>
    <script src="floating.js"></script>
  </body>
</html>
