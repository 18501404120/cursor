<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>超参数因子管理（公私库）— 需求原型</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #fff;
      --border: #d9dee8;
      --text: #1a1d26;
      --muted: #5c6370;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --tag-pub: #059669;
      --tag-pub-bg: #d1fae5;
      --tag-priv: #7c3aed;
      --tag-priv-bg: #ede9fe;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }
    header.page-head {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }
    .breadcrumb {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .breadcrumb span { color: var(--border); margin: 0 6px; }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .wrap { padding: 20px 24px 40px; max-width: 1280px; margin: 0 auto; }
    .filters {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 16px;
    }
    .filters label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .filters input[type="text"],
    .filters input[type="date"],
    .filters select {
      min-width: 160px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }
    .btn {
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost {
      background: #fff;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
    }
    .table-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .table-scroll-wrap {
      overflow: auto;
      max-height: min(65vh, 640px);
    }
    .table-scroll-wrap thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #f8fafc;
      box-shadow: 0 1px 0 var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: #f8fafc;
      font-weight: 600;
      font-size: 12px;
      color: var(--muted);
      user-select: none;
    }
    th.sortable { cursor: pointer; }
    th.sortable:hover { color: var(--primary); }
    tr:hover td { background: #fafbfc; }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
    }
    .tag-pub { background: var(--tag-pub-bg); color: var(--tag-pub); }
    .tag-priv { background: var(--tag-priv-bg); color: var(--tag-priv); }
    .actions button {
      margin-right: 8px;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
    }
    .actions button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 100;
    }
    .toast.show { opacity: 1; }
    /* modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 10px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    }
    .modal-head {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body { padding: 20px; }
    .modal-body .row { margin-bottom: 16px; }
    .modal-body label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .modal-body input, .modal-body select, .modal-body textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
    }
    .modal-body textarea { min-height: 72px; resize: vertical; }
    .radio-row { display: flex; gap: 20px; margin-top: 8px; }
    .radio-row label { display: flex; align-items: center; gap: 6px; flex-direction: row; font-size: 14px; color: var(--text); }
    .perm-note {
      font-size: 12px;
      color: var(--muted);
      background: #f1f5f9;
      padding: 10px 12px;
      border-radius: 6px;
      margin-top: 8px;
    }
    .modal-foot {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .role-sim {
      font-size: 12px;
      color: var(--muted);
      margin-left: 8px;
    }
    .role-sim select { padding: 4px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <!-- 本原型根据 需求文档.md 生成，数据为模拟，仅用于演示 -->

  <header class="page-head">
    <nav class="breadcrumb">数据中心 <span>→</span> 预测配置 <span>→</span> 超参数因子管理</nav>
    <h1>超参数因子管理（公有 / 私有）</h1>
  </header>

  <div class="wrap">
    <section class="filters" aria-label="筛选">
      <label>因子类型
        <select id="fType">
          <option value="all">全部（按权限）</option>
          <option value="public">公有</option>
          <option value="private">我的私有</option>
        </select>
      </label>
      <label>关键词
        <input type="text" id="fKeyword" placeholder="名称 / 说明" />
      </label>
      <label>生效结束 ≥
        <input type="date" id="fDate" />
      </label>
      <label class="role-sim">模拟当前用户角色
        <select id="fRole">
          <option value="planner">计划员（无公有维护权）</option>
          <option value="tl">TL / STR（有公有维护权）</option>
        </select>
      </label>
      <button type="button" class="btn btn-primary" id="btnQuery">查询</button>
      <button type="button" class="btn btn-ghost" id="btnReset">重置</button>
    </section>

    <div class="toolbar">
      <p class="hint">私有因子仅创建人可见；公有因子全员可见，仅 TL/STR 可创建/编辑（角色名以系统为准）。</p>
      <button type="button" class="btn btn-primary" id="btnNew">新建因子</button>
    </div>

    <section class="table-card">
      <div class="table-scroll-wrap">
      <table>
        <thead>
          <tr>
            <th>因子名称</th>
            <th>类型</th>
            <th class="sortable" data-sort="coef">系数</th>
            <th>作用时间</th>
            <th>创建人</th>
            <th>已应用</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <span id="modalTitle">新建超参数因子</span>
        <button type="button" class="btn btn-ghost" id="modalClose" style="padding:4px 10px">关闭</button>
      </div>
      <div class="modal-body">
        <div class="row">
          <label>因子类型</label>
          <div class="radio-row">
            <label><input type="radio" name="newType" value="private" checked /> 私有（仅自己可见）</label>
            <label><input type="radio" name="newType" value="public" /> 公有（需维护权限）</label>
          </div>
          <div class="perm-note" id="typeNote">私有因子仅您可见，不会在他人因子库中出现。</div>
        </div>
        <div class="row">
          <label>因子名称</label>
          <input type="text" id="newName" placeholder="例如：退市清仓-北美" />
        </div>
        <div class="row">
          <label>系数（乘法）</label>
          <input type="number" id="newCoef" step="0.1" value="1" min="0.1" max="5" />
        </div>
        <div class="row">
          <label>作用时间</label>
          <div id="wrapNewDateRange"></div>
        </div>
        <div class="row">
          <label>说明</label>
          <textarea id="newDesc" placeholder="可选：业务背景，便于后续筛选"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="modalCancel">取消</button>
        <button type="button" class="btn btn-primary" id="modalSave">保存</button>
      </div>
    </div>
  </div>

  <script src="../../规范/assets/date-range-picker.js"></script>
  <script>
    const CURRENT_USER = "张三";

    let rows = [
      { id: 1, name: "Prime Day 流量加成", type: "public", coef: 1.2, start: "2026-06-01", end: "2026-07-15", creator: "李TL", applied: true },
      { id: 2, name: "竞品降价-临时下调", type: "private", coef: 0.85, start: "2026-03-01", end: "2026-05-31", creator: "张三", applied: false },
      { id: 3, name: "供应链断供-保守预估", type: "private", coef: 0.6, start: "2026-02-01", end: "2026-04-30", creator: "王五", applied: true },
      { id: 4, name: "品类大促-全站", type: "public", coef: 1.35, start: "2026-11-20", end: "2026-12-05", creator: "李TL", applied: false },
      { id: 5, name: "新品爬坡观察", type: "private", coef: 1.1, start: "2026-03-10", end: "2026-06-10", creator: "张三", applied: false }
    ];

    let sortKey = null;
    let sortDir = 1;

    function getRole() {
      return document.getElementById("fRole").value;
    }

    function canMaintainPublic() {
      return getRole() === "tl";
    }

    function visibleRows() {
      const t = document.getElementById("fType").value;
      const kw = document.getElementById("fKeyword").value.trim().toLowerCase();
      const d = document.getElementById("fDate").value;

      return rows.filter((r) => {
        if (r.type === "private" && r.creator !== CURRENT_USER) return false;
        if (t === "public" && r.type !== "public") return false;
        if (t === "private" && (r.type !== "private" || r.creator !== CURRENT_USER)) return false;
        if (kw && !r.name.toLowerCase().includes(kw)) return false;
        if (d && r.end < d) return false;
        return true;
      });
    }

    function render() {
      let data = visibleRows();
      if (sortKey === "coef") {
        data = [...data].sort((a, b) => (a.coef - b.coef) * sortDir);
      }
      const coefTh = document.querySelector('th.sortable[data-sort="coef"]');
      if (coefTh) {
        coefTh.textContent = sortKey === "coef" ? (sortDir === 1 ? "系数 ↑" : "系数 ↓") : "系数";
      }
      const tb = document.getElementById("tbody");
      tb.innerHTML = data
        .map((r) => {
          const tag = r.type === "public"
            ? '<span class="tag tag-pub">公有</span>'
            : '<span class="tag tag-priv">私有</span>';
          const delDisabled = r.applied;
          const editDisabled = r.type === "public" && !canMaintainPublic();
          const creatorShow = r.type === "private" ? r.creator : r.creator;
          return `<tr>
            <td>${escapeHtml(r.name)}</td>
            <td>${tag}</td>
            <td>${r.coef}</td>
            <td>${r.start} ~ ${r.end}</td>
            <td>${escapeHtml(creatorShow)}</td>
            <td>${r.applied ? "是" : "否"}</td>
            <td class="actions">
              <button type="button" data-act="edit" data-id="${r.id}" ${editDisabled ? "disabled title='无公有因子编辑权限'" : ""}>编辑</button>
              <button type="button" data-act="del" data-id="${r.id}" ${delDisabled ? "disabled title='已应用不可删除'" : ""}>删除</button>
            </td>
          </tr>`;
        })
        .join("");
      tb.querySelectorAll("button[data-act]").forEach((btn) => {
        btn.addEventListener("click", onRowAction);
      });
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2200);
    }

    function onRowAction(e) {
      const id = Number(e.target.getAttribute("data-id"));
      const act = e.target.getAttribute("data-act");
      const r = rows.find((x) => x.id === id);
      if (!r) return;
      if (act === "del") {
        rows = rows.filter((x) => x.id !== id);
        toast("已删除（模拟：未应用因子）");
        render();
      }
      if (act === "edit") {
        toast("编辑表单可复用新建弹窗（原型略）");
      }
    }

    document.getElementById("btnQuery").addEventListener("click", () => {
      render();
      toast("已按条件筛选（模拟）");
    });
    document.getElementById("btnReset").addEventListener("click", () => {
      document.getElementById("fType").value = "all";
      document.getElementById("fKeyword").value = "";
      document.getElementById("fDate").value = "";
      render();
    });

    document.querySelectorAll("th.sortable").forEach((th) => {
      th.addEventListener("click", () => {
        const k = th.getAttribute("data-sort");
        if (sortKey === k) sortDir *= -1;
        else {
          sortKey = k;
          sortDir = 1;
        }
        render();
      });
    });

    function updateTypeNote() {
      const pub = document.querySelector('input[name="newType"]:checked').value === "public";
      const el = document.getElementById("typeNote");
      if (pub) {
        el.textContent = canMaintainPublic()
          ? "公有因子将对可见范围内用户展示；请使用规范命名便于他人复用。"
          : "您当前角色无「公有因子维护」权限，保存时将提示切换为私有或联系管理员。";
      } else {
        el.textContent = "私有因子仅您可见，不会在他人因子库中出现。";
      }
    }

    document.querySelectorAll('input[name="newType"]').forEach((r) => {
      r.addEventListener("change", updateTypeNote);
    });
    document.getElementById("fRole").addEventListener("change", () => {
      updateTypeNote();
      render();
    });

    const backdrop = document.getElementById("modalBackdrop");
    let apiNewModalRange = null;
    document.getElementById("btnNew").addEventListener("click", () => {
      updateTypeNote();
      backdrop.classList.add("open");
      setTimeout(function () {
        var el = document.getElementById("wrapNewDateRange");
        if (!el || typeof DateRangePicker === "undefined") return;
        if (apiNewModalRange) apiNewModalRange.destroy();
        var t = new Date();
        var iso =
          t.getFullYear() +
          "-" +
          (t.getMonth() + 1 < 10 ? "0" : "") +
          (t.getMonth() + 1) +
          "-" +
          (t.getDate() < 10 ? "0" : "") +
          t.getDate();
        var endDefault = iso.slice(0, 8) + "31";
        apiNewModalRange = DateRangePicker.mount(el, {
          zIndex: 500,
          start: iso,
          end: endDefault,
          onChange: function () {}
        });
      }, 0);
    });
    document.getElementById("modalClose").addEventListener("click", () => backdrop.classList.remove("open"));
    document.getElementById("modalCancel").addEventListener("click", () => backdrop.classList.remove("open"));
    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) backdrop.classList.remove("open");
    });

    document.getElementById("modalSave").addEventListener("click", () => {
      let type = document.querySelector('input[name="newType"]:checked').value;
      if (type === "public" && !canMaintainPublic()) {
        toast("无公有维护权限，已改为私有保存（模拟）");
        type = "private";
      }
      const name = document.getElementById("newName").value.trim() || "未命名因子";
      const coef = Number(document.getElementById("newCoef").value) || 1;
      let start = "2026-03-01";
      let end = "2026-12-31";
      if (apiNewModalRange) {
        const vr = apiNewModalRange.get();
        if (vr.start) start = vr.start;
        if (vr.end) end = vr.end;
      }
      const id = Math.max(0, ...rows.map((r) => r.id)) + 1;
      rows.push({
        id,
        name,
        type,
        coef,
        start,
        end,
        creator: CURRENT_USER,
        applied: false
      });
      backdrop.classList.remove("open");
      document.getElementById("newName").value = "";
      render();
      toast("已保存（模拟）");
    });

    render();
  </script>
</body>
</html>
