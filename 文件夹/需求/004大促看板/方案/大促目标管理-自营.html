<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>大促目标管理</title>
  <style>
    :root { --blue: #1677ff; --sider: #001529; --muted: #8c8c8c; --line: #f0f0f0; --bad: #cf1322; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #1f2937; background: #f0f2f5; font-size: 13px; }
    button, select, input { font-family: inherit; }
    a { color: var(--blue); text-decoration: none; }
    .app { display: flex; min-height: 100vh; }
    .sider { width: 64px; background: var(--sider); color: rgba(255,255,255,.75); flex: none; }
    .sider .logo { height: 48px; display: grid; place-items: center; color: #fff; font-weight: 700; background: #002140; }
    .sider .item { height: 56px; display: grid; place-items: center; font-size: 12px; }
    .sider .item.on { background: var(--blue); color: #fff; }
    .main { flex: 1; min-width: 0; }
    .top { height: 48px; background: var(--blue); color: #fff; display: flex; align-items: center; padding: 0 16px; gap: 18px; }
    .top b { font-size: 14px; }
    .top a { color: rgba(255,255,255,.85); }
    .top a.on { color: #fff; font-weight: 700; }
    .body { padding: 10px; }
    .note, .warn { border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; line-height: 1.6; }
    .note { background: #fffbe6; border: 1px solid #ffe58f; }
    .warn { background: #fff2f0; border: 1px solid #ffccc7; color: var(--bad); }
    .card { background: #fff; border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; }
    .tabs { display: flex; }
    .tabs button, .btn { height: 32px; border: 1px solid #d9d9d9; background: #fff; padding: 0 12px; cursor: pointer; }
    .tabs button.on, .btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .row, .ops { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .ops { justify-content: flex-end; margin-bottom: 8px; }
    select, input { height: 32px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 0 8px; }
    .scroll { overflow: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid var(--line); padding: 6px 8px; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
    th { background: #fafafa; text-align: center; color: #4b5563; }
    td.lab, th.lab { text-align: left; }
    .link { color: var(--blue); cursor: pointer; background: none; border: 0; padding: 0 6px 0 0; }
    .sub { color: var(--muted); font-size: 12px; }
    .mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 20; }
    .mask.show { display: block; }
    .modal { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); width: min(980px, calc(100% - 24px)); background: #fff; border-radius: 8px; z-index: 21; display: none; padding: 16px; max-height: calc(100vh - 48px); overflow: auto; }
    .modal.show { display: block; }
    .modal h3 { margin: 0 0 8px; }
    .form { display: grid; grid-template-columns: 88px 1fr 88px 1fr; gap: 8px 10px; align-items: center; margin: 10px 0; }
    .cols { display: flex; flex-wrap: wrap; gap: 6px; }
    .cols span { background: #e6f4ff; color: #0958d9; border-radius: 4px; padding: 4px 8px; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 8px 14px; border-radius: 6px; display: none; z-index: 30; }
    .toast.show { display: block; }
    input.cell { width: 110px; height: 28px; text-align: right; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sider">
      <div class="logo">智</div>
      <div class="item">销售</div>
      <div class="item">看板</div>
      <div class="item on">目标</div>
    </aside>
    <div class="main">
      <header class="top">
        <b>运营平台 / 销售系统</b>
        <a href="./大促看板-自营.html">大促看板</a>
        <a class="on" href="./大促目标管理-自营.html">大促目标管理</a>
      </header>
      <div class="body">
        <div class="note">
          本次只改项目。年度、季度、日目标不动。项目里按 SKU 填一档窗口目标：销量、营业收入、毛利、营业利润。定价、原价、计划最低成交价、折扣力度保留。成本、划线价折扣、Discounts 和各项费用不在这里填，看板用实际数计算。三个渠道分开维护项目。
        </div>
        <div class="warn" id="lockText"></div>
        <section class="card">
          <div class="row">
            <div class="tabs" id="tabs">
              <button type="button" data-tab="project" class="on">项目目标</button>
              <button type="button" data-tab="collection">项目集</button>
            </div>
            <select id="channel">
              <option value="amazon">亚马逊</option>
              <option value="shopify" selected>Shopify</option>
              <option value="app">APP 商城</option>
            </select>
            <input id="kw" placeholder="项目集 / 项目 / SKU" />
            <button class="btn primary" id="search" type="button">搜索</button>
          </div>
        </section>
        <section class="card">
          <div class="ops" id="ops"></div>
          <div class="scroll" id="view"></div>
        </section>
      </div>
    </div>
  </div>
  <div class="mask" id="mask"></div>
  <div class="modal" id="modal"></div>
  <div class="toast" id="toast"></div>
  <script>
    function sku(sku, shop, line, price, qty, revenue, margin, profit, origin, floor, discount) {
      return { sku: sku, shop: shop, line: line, price: price, qty: qty, revenue: revenue, margin: margin, profit: profit, origin: origin, floor: floor, discount: discount };
    }
    const state = {
      amazon: {
        lock: "2026-11-20 前可更新该渠道项目集，2026-11-21 起锁定项目目标。",
        collections: [
          { id: 1, name: "2026-Amazon-北美-BFCM", by: "林子杰", at: "2026-10-08" },
          { id: 2, name: "2026-Amazon-EU-黑五", by: "董小倩", at: "2026-10-09" }
        ],
        projects: [
          { id: 11, cid: 1, name: "2026-Amazon-US-BFCM", start: "2026-11-27", end: "2026-12-03", status: "未开始" },
          { id: 12, cid: 2, name: "2026-Amazon-DE-黑五", start: "2026-11-27", end: "2026-12-01", status: "未开始" }
        ],
        lines: {
          11: [
            sku("H61991", "Amazon US", "照明 / 主力", 69.99, 9600, 1820000, 1240000, 520000, 79.99, 59, "26%"),
            sku("H6072", "Amazon US", "照明 / 新品", 49.99, 6200, 1180000, 800000, 340000, 59.99, 42, "30%")
          ],
          12: [sku("H61E1", "Amazon DE", "照明 / 常规", 64.99, 4200, 800000, 560000, 240000, 74.99, 55, "27%")]
        }
      },
      shopify: {
        lock: "2026-11-20 前可更新该渠道项目集，2026-11-21 起锁定项目目标。",
        collections: [
          { id: 3, name: "2026-Shopify-北美-BFCM", by: "林子杰", at: "2026-10-12" },
          { id: 4, name: "2026-Shopify-EU-黑五", by: "董小倩", at: "2026-10-18" }
        ],
        projects: [
          { id: 21, cid: 3, name: "2026-Shopify-US-BFCM", start: "2026-11-27", end: "2026-12-03", status: "未开始" },
          { id: 22, cid: 4, name: "2026-Shopify-EU-黑五", start: "2026-11-27", end: "2026-12-01", status: "未开始" }
        ],
        lines: {
          21: [
            sku("H61991", "Govee US", "照明 / 主力", 69.99, 8000, 1420000, 970000, 430000, 79.99, 62, "22%"),
            sku("H6072", "Govee US", "照明 / 新品", 49.99, 5200, 760000, 510000, 220000, 59.99, 45, "25%")
          ],
          22: [sku("H61E1", "Govee EU", "照明 / 常规", 64.99, 2800, 620000, 420000, 200000, 74.99, 58, "23%")]
        }
      },
      app: {
        lock: "2026-11-20 前可更新该渠道项目集，2026-11-21 起锁定项目目标。",
        collections: [{ id: 5, name: "2026-APP-北美-BFCM", by: "林子杰", at: "2026-10-15" }],
        projects: [{ id: 31, cid: 5, name: "2026-APP-US-BFCM", start: "2026-11-27", end: "2026-12-03", status: "未开始" }],
        lines: {
          31: [sku("H61991", "APP US", "照明 / 主力", 69.99, 4200, 740000, 500000, 230000, 79.99, 64, "20%")]
        }
      }
    };
    let ch = "shopify";
    let tab = "project";
    let kw = "";
    function data() { return state[ch]; }
    function money(n) { return Math.round(Number(n) || 0).toLocaleString("en-US"); }
    function projects() {
      return data().projects.filter((p) => {
        const c = data().collections.find((x) => x.id === p.cid);
        const text = (p.name + (c ? c.name : "")).toLowerCase();
        return !kw || text.indexOf(kw.toLowerCase()) >= 0;
      });
    }
    function toast(text) {
      const el = document.getElementById("toast");
      el.textContent = text;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1600);
    }
    function openModal(html) {
      document.getElementById("modal").innerHTML = html;
      document.getElementById("modal").classList.add("show");
      document.getElementById("mask").classList.add("show");
    }
    function closeModal() {
      document.getElementById("modal").classList.remove("show");
      document.getElementById("mask").classList.remove("show");
    }
    function lineTable(pid, edit) {
      const rows = data().lines[pid] || [];
      let html = "<table><thead><tr><th class='lab'>SKU</th><th>店铺</th><th>品线 / 定位</th><th>定价</th><th>目标销量</th><th>目标营业收入</th><th>目标毛利</th><th>目标营业利润</th><th>原价</th><th>计划最低成交价</th><th>折扣力度</th></tr></thead><tbody>";
      rows.forEach((s, i) => {
        if (!edit) {
          html += "<tr><td class='lab'>" + s.sku + "</td><td>" + s.shop + "</td><td style='text-align:left'>" + s.line + "</td><td>" + s.price + "</td><td>" + money(s.qty) + "</td><td>" + money(s.revenue) + "</td><td>" + money(s.margin) + "</td><td>" + money(s.profit) + "</td><td>" + s.origin + "</td><td>" + s.floor + "</td><td>" + s.discount + "</td></tr>";
        } else {
          html += "<tr data-i='" + i + "'><td class='lab'>" + s.sku + "</td><td>" + s.shop + "</td><td style='text-align:left'>" + s.line + "</td>";
          ["price", "qty", "revenue", "margin", "profit", "origin", "floor", "discount"].forEach((k) => {
            html += "<td><input class='cell' data-k='" + k + "' value='" + s[k] + "'></td>";
          });
          html += "</tr>";
        }
      });
      return html + "</tbody></table>";
    }
    function renderProject() {
      let html = "<table><thead><tr><th class='lab'>项目集</th><th>项目名称</th><th>开始</th><th>结束</th><th>状态</th><th>操作</th></tr></thead><tbody>";
      projects().forEach((p) => {
        const c = data().collections.find((x) => x.id === p.cid);
        html += "<tr><td class='lab'>" + (c ? c.name : "-") + "</td><td style='text-align:left'>" + p.name + "</td><td>" + p.start + "</td><td>" + p.end + "</td><td>" + p.status + "</td><td><button class='link' data-edit='" + p.id + "'>编辑目标</button></td></tr>";
        html += "<tr><td colspan='6'>" + lineTable(p.id, false) + "</td></tr>";
      });
      return html + "</tbody></table>";
    }
    function renderCollection() {
      const list = data().collections.filter((c) => !kw || c.name.toLowerCase().indexOf(kw.toLowerCase()) >= 0);
      let html = "<table><thead><tr><th class='lab'>项目集名称</th><th>项目数量</th><th>创建人</th><th>创建时间</th><th>操作</th></tr></thead><tbody>";
      list.forEach((c) => {
        const n = data().projects.filter((p) => p.cid === c.id).length;
        html += "<tr><td class='lab'>" + c.name + "</td><td><button class='link' data-open='" + c.id + "'>" + n + "</button></td><td>" + c.by + "</td><td>" + c.at + "</td><td><button class='link' data-addp='" + c.id + "'>新增项目</button></td></tr>";
      });
      return html + "</tbody></table>";
    }
    function render() {
      document.getElementById("lockText").textContent = data().lock;
      document.getElementById("ops").innerHTML = tab === "project"
        ? "<button class='btn primary' data-act='import' type='button'>导入项目目标</button><button class='btn' data-act='add' type='button'>新增项目</button>"
        : "<button class='btn primary' data-act='addc' type='button'>新增项目集</button>";
      document.getElementById("view").innerHTML = tab === "project" ? renderProject() : renderCollection();
    }
    function editProject(id) {
      const p = data().projects.find((x) => x.id === Number(id));
      const c = data().collections.find((x) => x.id === p.cid);
      openModal("<h3>编辑项目目标 · " + p.name + "</h3><div class='form'><span>项目集</span><input value='" + c.name + "' disabled><span>项目名称</span><input id='pname' value='" + p.name + "'><span>开始</span><input id='pstart' value='" + p.start + "'><span>结束</span><input id='pend' value='" + p.end + "'></div><p class='sub'>下面每个 SKU 填这一档项目窗口的目标。毛利、营业利润单独填写，不由费用倒算。</p>" + lineTable(p.id, true) + "<p style='text-align:right;margin-top:12px'><button class='btn' id='closeModal' type='button'>取消</button> <button class='btn primary' id='saveProject' data-id='" + p.id + "' type='button'>保存</button></p>");
    }
    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      tab = btn.dataset.tab;
      document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b === btn));
      render();
    });
    document.getElementById("channel").addEventListener("change", (e) => { ch = e.target.value; render(); });
    document.getElementById("search").addEventListener("click", () => { kw = document.getElementById("kw").value.trim(); render(); });
    document.getElementById("ops").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.dataset.act === "import") {
        const cols = ["渠道", "项目集", "项目", "店铺", "SKU", "定价", "目标销量", "目标营业收入", "目标毛利", "目标营业利润", "原价", "计划最低成交价", "折扣力度"];
        openModal("<h3>导入模板列</h3><p class='sub'>没有成本、费用、零售销售额、销售收入。毛利和营业利润是目标值。</p><div class='cols'>" + cols.map((c) => "<span>" + c + "</span>").join("") + "</div><p style='text-align:right;margin-top:12px'><button class='btn primary' id='closeModal' type='button'>知道了</button></p>");
      }
      if (btn.dataset.act === "add" || btn.dataset.act === "addc") {
        openModal(btn.dataset.act === "addc"
          ? "<h3>新增项目集</h3><div class='form'><span>名称</span><input id='newName' placeholder='渠道-站点-大促'></div><p style='text-align:right'><button class='btn' id='closeModal' type='button'>取消</button> <button class='btn primary' id='createCol' type='button'>保存</button></p>"
          : "<h3>新增项目</h3><div class='form'><span>项目集</span><select id='newCid'>" + data().collections.map((c) => "<option value='" + c.id + "'>" + c.name + "</option>").join("") + "</select><span>项目名称</span><input id='newName' placeholder='例如 2026-Shopify-US-网一'><span>开始</span><input id='newStart' value='2026-11-27'><span>结束</span><input id='newEnd' value='2026-12-03'></div><p style='text-align:right'><button class='btn' id='closeModal' type='button'>取消</button> <button class='btn primary' id='createProject' type='button'>保存</button></p>");
      }
    });
    document.getElementById("view").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.dataset.edit) editProject(btn.dataset.edit);
      if (btn.dataset.open) { tab = "project"; document.querySelector("[data-tab='project']").click(); }
      if (btn.dataset.addp) toast("新增后在项目里按 SKU 填四项目标和价格");
    });
    document.getElementById("modal").addEventListener("click", (e) => {
      if (e.target.id === "closeModal") closeModal();
      if (e.target.id === "saveProject") {
        const pid = Number(e.target.dataset.id);
        const p = data().projects.find((x) => x.id === pid);
        p.name = document.getElementById("pname").value;
        p.start = document.getElementById("pstart").value;
        p.end = document.getElementById("pend").value;
        document.querySelectorAll("#modal tbody tr").forEach((tr) => {
          const row = data().lines[pid][Number(tr.dataset.i)];
          tr.querySelectorAll("input").forEach((input) => {
            const k = input.dataset.k;
            row[k] = (k === "discount" || k === "price" || k === "origin") ? input.value : Number(input.value);
          });
        });
        toast("已保存项目目标");
        closeModal();
        render();
      }
      if (e.target.id === "createCol") {
        data().collections.push({ id: Date.now(), name: document.getElementById("newName").value || "未命名项目集", by: "当前用户", at: "2026-10-14" });
        toast("已新增项目集");
        closeModal();
        render();
      }
      if (e.target.id === "createProject") {
        const id = Date.now();
        data().projects.push({ id: id, cid: Number(document.getElementById("newCid").value), name: document.getElementById("newName").value || "未命名项目", start: document.getElementById("newStart").value, end: document.getElementById("newEnd").value, status: "未开始" });
        data().lines[id] = [];
        toast("已新增项目，可继续补 SKU 目标");
        closeModal();
        tab = "project";
        render();
      }
    });
    document.getElementById("mask").addEventListener("click", closeModal);
    render();
  </script>
</body>
</html>
