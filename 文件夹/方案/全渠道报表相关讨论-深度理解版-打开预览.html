<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全渠道报表相关讨论｜深度理解版（预览）</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.7);
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans",
          "Liberation Sans", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        width: min(1100px, calc(100% - 40px));
        margin: 0 auto;
        padding: 24px 0 40px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      a.btn {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        background: rgba(255, 255, 255, 0.06);
      }
      a.btn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      img {
        width: 100%;
        height: auto;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.02);
      }
      code {
        padding: 2px 6px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>全渠道报表相关讨论｜深度理解版（本地预览）</h1>
        <div class="muted">
          - 预览图：<code>全渠道报表相关讨论-深度理解版.png</code><br />
          - 可编辑源文件：<code>全渠道报表相关讨论-深度理解版.excalidraw</code><br />
          <br />
          想继续编辑：先确保 Excalidraw Canvas 在运行（通常是 <code>http://localhost:3000</code>），然后在 Canvas 页面里
          使用 Import 导入 <code>.excalidraw</code> 文件即可。
        </div>
        <div class="btns">
          <a class="btn" href="./全渠道报表相关讨论-深度理解版.png" target="_blank">打开 PNG 预览（新窗口）</a>
          <a class="btn" href="./全渠道报表相关讨论-深度理解版.excalidraw" target="_blank">下载/打开 .excalidraw 源文件</a>
          <a class="btn" href="http://localhost:3000" target="_blank">打开本地 Canvas（用于导入编辑）</a>
        </div>
      </div>

      <img src="./全渠道报表相关讨论-深度理解版.png" alt="全渠道报表相关讨论-深度理解版 预览图" />
    </div>
  </body>
</html>
