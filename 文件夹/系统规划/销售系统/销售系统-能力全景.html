<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>销售系统能力全景</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --text: #1f1f1f;
      --muted: #595959;
      --line: #d9d9d9;
      --chip-line: #c4c4c4;
      --build: #ffe566;
      --build-line: #e3c84a;
      --gap: #e8c99a;
      --gap-line: #c9a36a;
      --blue: #1677ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #e7edf5;
      line-height: 1.5;
    }
    .frame {
      max-width: 1360px;
      margin: 16px auto 32px;
      padding: 16px 18px 18px;
      background: var(--bg);
      border: 3px solid #5b8ec9;
    }
    .top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px 12px;
      margin-bottom: 12px;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; }
    .legend button {
      font: inherit;
      font-size: 13px;
      height: 32px;
      padding: 0 12px;
      border-radius: 2px;
      cursor: pointer;
      color: var(--text);
    }
    .legend button.have { background: #fff; border: 1px solid var(--chip-line); }
    .legend button.build { background: var(--build); border: 1px solid var(--build-line); }
    .legend button.gap { background: var(--gap); border: 1px solid var(--gap-line); }
    .legend button[aria-pressed="false"] { opacity: .38; }
    .legend button:focus-visible, .domain:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 26px;
      letter-spacing: 2px;
      font-weight: 700;
    }
    .map { display: flex; flex-direction: column; gap: 14px; }
    .row { display: grid; gap: 12px; align-items: stretch; }
    .row[hidden] { display: none; }
    .domain {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      appearance: none;
    }
    .domain-name {
      margin: 0 0 6px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
    }
    .domain.on .domain-name { color: #1f1f1f; }
    .panel {
      flex: 1;
      padding: 10px;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      align-content: start;
    }
    .domain.on .panel { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
    .panel.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chip {
      min-height: 34px;
      padding: 4px 8px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      line-height: 1.25;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .chip.have { background: #fff; border: 1px solid var(--chip-line); }
    .chip.build { background: var(--build); border: 1px solid var(--build-line); }
    .chip.gap { background: var(--gap); border: 1px solid var(--gap-line); }
    .chip.span-2 { grid-column: span 2; }
    .detail {
      margin-top: 14px;
      min-height: 72px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 14px;
    }
    .detail b { font-size: 15px; }
    .detail p { margin: 6px 0 0; }
    .detail .line { margin: 4px 0 0; }
    .detail .k { color: var(--muted); }
    @media (max-width: 980px) {
      .top { grid-template-columns: 1fr; }
      h1 { text-align: left; }
      .row { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="legend" id="legend"></div>
      <h1>销售系统</h1>
      <div></div>
    </div>
    <div class="map" id="map"></div>
    <div class="detail" id="detail">点一个板块，查看这一块在做什么。</div>
  </div>
  <script>
    const STATUS = { have: "已有能力", build: "建设中能力", gap: "待补齐能力" };

    const rows = [
      {
        domains: [
          {
            name: "看板",
            span: "1fr",
            intro: "看销售结果和经营结构。即时销售、销售报表、产品、流量、库存、库龄、利润、结算、大促、海运比和 PSI 指标都已能看。广告放在即时看板和产品分析里，成品库龄另有金蝶、金蝶计划两套视图。管报看板用来看全渠道收入、成本和费用。",
            items: [
              { name: "销售即时看板", status: "have" },
              { name: "销售报表", status: "have" },
              { name: "产品分析看板", status: "have" },
              { name: "流量分析看板", status: "have" },
              { name: "广告分析看板", status: "have" },
              { name: "FBA仓储费报表", status: "have" },
              { name: "产品库存看板", status: "have" },
              { name: "库存监控看板", status: "have" },
              { name: "成品库龄看板", status: "have" },
              { name: "大促看板", status: "have" },
              { name: "海运比看板", status: "have" },
              { name: "销售利润报表", status: "have" },
              { name: "结算中心", status: "have" },
              { name: "PSI指标看板", status: "have" },
              { name: "市场调研看板", status: "gap" },
              { name: "管报看板", status: "gap" }
            ]
          }
        ]
      },
      {
        domains: [
          {
            name: "目标",
            span: "1fr",
            cols: 2,
            intro: "定目标、看达成。销售目标制定维护项目、版本和汇率，海运目标单独制定。销售和产品各有进度看板，销量目标达成率看预测达成。",
            items: [
              { name: "销售目标制定", status: "have" },
              { name: "海运目标制定", status: "have" },
              { name: "销售目标进度看板", status: "have" },
              { name: "产品目标进度看板", status: "have" },
              { name: "销量目标达成率", status: "have" }
            ]
          },
          {
            name: "需求",
            span: "1fr",
            cols: 2,
            intro: "管销量预测和备货判断。Forecast、新版和泛欧都带审核，提前期配在 Forecast 里；PSI 管 Sell out 评审和审核；销量预测、配置中心和超参数因子已在用，备货提醒负责现有预警。清库存需求预警每天按店铺和 SKU 计算未来各周覆盖天数和库龄，同时点亮断货、积压、采购逾期、季节四类灯，再按可配置的动作阶梯给出此刻建议：提拉在途、跨店调拨、控价、空运或卡航。档级决定能忍断货还是积压，物流时效决定此刻允许用多贵的运输方式。一期只出预警、建议动作和跳转，不自动下单。",
            items: [
              { name: "备货提醒", status: "have" },
              { name: "Forecast", status: "have" },
              { name: "Forecast（新）", status: "have" },
              { name: "泛欧Forecast", status: "have" },
              { name: "PSI管理", status: "have" },
              { name: "PSI审核", status: "have" },
              { name: "销量预测管理", status: "have" },
              { name: "销量预测配置中心", status: "have" },
              { name: "超参数因子管理", status: "have" },
              { name: "金蝶手工建单看板", status: "have" },
              { name: "清库存需求预警", status: "build" }
            ]
          },
          {
            name: "采购",
            span: "1fr",
            cols: 2,
            intro: "把预测落到采购。智能采购有新旧两版，采购计划管理和入库明细已在用。",
            items: [
              { name: "智能采购", status: "have" },
              { name: "智能采购(新)", status: "have" },
              { name: "采购计划管理", status: "have" },
              { name: "入库明细", status: "have" }
            ]
          },
          {
            name: "发运",
            span: "1fr",
            cols: 2,
            intro: "把货发出去，并管样品和透明计划。智能发货含创建计划；发货计划、物流计划、样品推广订单、返工调拨、透明计划商品和 APP 商城库存申请已在用。",
            items: [
              { name: "智能发货", status: "have" },
              { name: "创建发货计划", status: "have" },
              { name: "发货计划管理", status: "have" },
              { name: "物流计划管理", status: "have" },
              { name: "样品推广订单", status: "have" },
              { name: "返工调拨单", status: "have" },
              { name: "透明计划商品列表", status: "have" },
              { name: "APP商城库存申请", status: "have" },
              { name: "品牌样品FBA发放", status: "build" },
              { name: "红人样品MCF发放", status: "build" }
            ]
          }
        ]
      },
      {
        domains: [
          {
            name: "风控",
            span: "1fr",
            cols: 2,
            intro: "盯店铺、库存和价格风险。店铺绩效含明细，FBA 库龄、产品呆滞、促销价格已能查，订单排除用来修正价格统计。",
            items: [
              { name: "店铺绩效看板", status: "have" },
              { name: "FBA绩效与库龄看板", status: "have" },
              { name: "产品呆滞看板", status: "have" },
              { name: "促销价格查询", status: "have" },
              { name: "订单排除配置", status: "have" },
              { name: "风控看板", status: "gap" },
              { name: "价格毛利预警", status: "gap" }
            ]
          },
          {
            name: "运营",
            span: "1.7fr",
            intro: "做价格、促销、渠道和货件差异。调价含创建申请；推广渠道含落地页、活动、Attribution 和 UTM；促销信息、货件接收差异和 Deals 已在用。亚马逊促销规划生成助手按月给出建议活动类型、建议活动时间和建议价格，依据是历史销量、历史促销活动和 baseline 规则。",
            items: [
              { name: "产品即时销售报告", status: "have" },
              { name: "调价申请", status: "have" },
              { name: "促销管理", status: "have" },
              { name: "促销信息列表", status: "have" },
              { name: "推广渠道需求", status: "have" },
              { name: "货件接收差异", status: "have" },
              { name: "Deals管理", status: "have" },
              { name: "亚马逊促销规划生成助手", status: "gap", span: 2 }
            ]
          }
        ]
      },
      {
        domains: [
          {
            name: "工具",
            span: "1fr",
            intro: "给销售查数、算费用、下报表。物流计算、Shipment 查询、流量报表上传、亚马逊报表和财务报告、仓库类型、发票凭证、透明计划盘点提醒都已在用。",
            items: [
              { name: "物流计算器", status: "have" },
              { name: "透明计划盘点提醒", status: "have" },
              { name: "Shipment查询", status: "have" },
              { name: "流量报表上传", status: "have" },
              { name: "亚马逊财务报告下载", status: "have" },
              { name: "亚马逊报表导出", status: "have" },
              { name: "仓库类型配置管理", status: "have" },
              { name: "发票凭证导出", status: "have" }
            ]
          },
          {
            name: "信息",
            span: "1.25fr",
            intro: "维护销售主数据和店铺授权。品线、MSKU 资料和成本、库存归属、透明计划库存、Listing 价格、大促退货率、相关 SKU、清关资料、SKU 信息和物流信息都在这里维护。",
            items: [
              { name: "品线管理", status: "have" },
              { name: "MSKU基础信息", status: "have" },
              { name: "MSKU成本信息", status: "have" },
              { name: "MSKU库存归属配置", status: "have" },
              { name: "透明计划库存管理", status: "have" },
              { name: "线上Listing价格监控", status: "have" },
              { name: "大促退货率管理", status: "have" },
              { name: "相关SKU管理", status: "have" },
              { name: "销售清关资料补充", status: "have" },
              { name: "SKU信息", status: "have" },
              { name: "物流信息管理", status: "have" },
              { name: "店铺授权", status: "have" }
            ]
          }
        ]
      }
    ];

    const on = { have: true, build: true, gap: true };
    let selected = null;

    function allItems() {
      const list = [];
      rows.forEach((row) => row.domains.forEach((d) => d.items.forEach((item) => list.push(item))));
      return list;
    }

    function visibleItems(domain) {
      return domain.items.filter((item) => on[item.status]);
    }

    function findDomain(name) {
      for (const row of rows) {
        const domain = row.domains.find((d) => d.name === name);
        if (domain) return domain;
      }
      return null;
    }

    function renderLegend() {
      const items = allItems();
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      Object.keys(STATUS).forEach((key) => {
        const count = items.filter((item) => item.status === key).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = key;
        btn.setAttribute("aria-pressed", on[key] ? "true" : "false");
        btn.textContent = STATUS[key] + " " + count;
        btn.addEventListener("click", () => {
          const solo = on[key] && Object.keys(on).every((k) => on[k] === (k === key));
          Object.keys(on).forEach((k) => { on[k] = solo ? true : k === key; });
          render();
        });
        legend.appendChild(btn);
      });
    }

    function statusNames(domain, status) {
      return domain.items.filter((item) => item.status === status).map((item) => item.name);
    }

    function renderDetail() {
      const box = document.getElementById("detail");
      const domain = selected ? findDomain(selected) : null;
      if (!domain || !visibleItems(domain).length) {
        selected = null;
        box.textContent = "点一个板块，查看这一块在做什么。";
        return;
      }
      box.replaceChildren();
      const title = document.createElement("b");
      title.textContent = domain.name;
      const lead = document.createElement("p");
      lead.textContent = domain.intro;
      box.append(title, lead);
      [["build", "建设中"], ["gap", "待补齐"]].forEach(([status, label]) => {
        const names = statusNames(domain, status);
        if (!names.length) return;
        const line = document.createElement("p");
        line.className = "line";
        const k = document.createElement("span");
        k.className = "k";
        k.textContent = label + "：";
        line.append(k, document.createTextNode(names.join("、")));
        box.append(line);
      });
    }

    function render() {
      renderLegend();
      const map = document.getElementById("map");
      map.innerHTML = "";
      rows.forEach((row) => {
        const visible = row.domains.filter((d) => visibleItems(d).length);
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        if (!visible.length) {
          rowEl.hidden = true;
          map.appendChild(rowEl);
          return;
        }
        rowEl.style.gridTemplateColumns = visible.map((d) => d.span || "1fr").join(" ");
        visible.forEach((domain) => {
          const wrap = document.createElement("button");
          wrap.type = "button";
          wrap.className = "domain" + (selected === domain.name ? " on" : "");
          const title = document.createElement("div");
          title.className = "domain-name";
          title.textContent = domain.name;
          const panel = document.createElement("div");
          panel.className = "panel" + (domain.cols ? " cols-" + domain.cols : "");
          visibleItems(domain).forEach((item) => {
            const chip = document.createElement("div");
            chip.className = "chip " + item.status + (item.span ? " span-" + item.span : "");
            chip.textContent = item.name;
            panel.appendChild(chip);
          });
          wrap.append(title, panel);
          wrap.addEventListener("click", () => {
            selected = domain.name;
            render();
            document.getElementById("detail").scrollIntoView({ block: "nearest" });
          });
          rowEl.appendChild(wrap);
        });
        map.appendChild(rowEl);
      });
      renderDetail();
    }

    render();
  </script>
</body>
</html>
