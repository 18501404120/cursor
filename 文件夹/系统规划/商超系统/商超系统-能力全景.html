<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商超系统能力全景</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --text: #1f1f1f;
      --muted: #595959;
      --line: #d9d9d9;
      --chip-line: #c4c4c4;
      --build: #ffe566;
      --build-line: #e3c84a;
      --gap: #e8c99a;
      --gap-line: #c9a36a;
      --blue: #1677ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #e7edf5;
      line-height: 1.5;
    }
    .frame {
      max-width: 1360px;
      margin: 16px auto 32px;
      padding: 16px 18px 18px;
      background: var(--bg);
      border: 3px solid #5b8ec9;
    }
    .top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px 12px;
      margin-bottom: 12px;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; }
    .legend button {
      font: inherit;
      font-size: 13px;
      height: 32px;
      padding: 0 12px;
      border-radius: 2px;
      cursor: pointer;
      color: var(--text);
    }
    .legend button.have { background: #fff; border: 1px solid var(--chip-line); }
    .legend button.build { background: var(--build); border: 1px solid var(--build-line); }
    .legend button.gap { background: var(--gap); border: 1px solid var(--gap-line); }
    .legend button[aria-pressed="false"] { opacity: .38; }
    .legend button:focus-visible, .domain:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    h1 {
      margin: 0;
      text-align: center;
      font-size: 26px;
      letter-spacing: 2px;
      font-weight: 700;
    }
    .map { display: flex; flex-direction: column; gap: 14px; }
    .row { display: grid; gap: 12px; align-items: stretch; }
    .row[hidden] { display: none; }
    .domain {
      display: flex;
      flex-direction: column;
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
      appearance: none;
    }
    .domain-name {
      margin: 0 0 6px;
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      color: #1f1f1f;
    }
    .panel {
      flex: 1;
      padding: 10px;
      background: #fff;
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
      align-content: start;
    }
    .domain.on .panel { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
    .panel.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .chip {
      min-height: 34px;
      padding: 4px 8px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 13px;
      line-height: 1.25;
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    .chip.have { background: #fff; border: 1px solid var(--chip-line); }
    .chip.build { background: var(--build); border: 1px solid var(--build-line); }
    .chip.gap { background: var(--gap); border: 1px solid var(--gap-line); }
    .detail {
      margin-top: 14px;
      min-height: 72px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 14px;
    }
    .detail b { font-size: 15px; }
    .detail p { margin: 6px 0 0; }
    .detail .line { margin: 4px 0 0; }
    .detail .k { color: var(--muted); }
    @media (max-width: 980px) {
      .top { grid-template-columns: 1fr; }
      h1 { text-align: left; }
      .row { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="legend" id="legend"></div>
      <h1>商超系统</h1>
      <div></div>
    </div>
    <div class="map" id="map"></div>
    <div class="detail" id="detail">点一个板块，查看这一块在做什么。</div>
  </div>
  <script>
    const STATUS = { have: "已有能力", build: "建设中能力", gap: "待补齐能力" };

    const rows = [
      {
        domains: [
          {
            name: "看板",
            span: "1fr",
            intro: "看商超 Sell In、Sell Out、零售商和产品表现。产品分析、产品销售列表、零售商分析、产品对比和商超利润报表都已能看。管报看板用来看全渠道收入、成本和费用，商超 3P 的销售成本也进这张看板。",
            items: [
              { name: "Sell In看板", status: "have" },
              { name: "Sell Out看板", status: "have" },
              { name: "商超产品分析看板", status: "have" },
              { name: "产品销售列表", status: "have" },
              { name: "零售商分析", status: "have" },
              { name: "商超产品对比分析", status: "have" },
              { name: "商超利润报表", status: "have" },
              { name: "管报看板", status: "gap" }
            ]
          }
        ]
      },
      {
        domains: [
          {
            name: "备货",
            span: "1.15fr",
            cols: 2,
            intro: "维护零售商 Forecast，并做测算和模拟试算。WFS 库存与借调按品牌拆可用库存，记录借调消耗，并控制多平台共用同一 WFS 库存池时的超卖。",
            items: [
              { name: "零售商Forecast", status: "have" },
              { name: "测算零售商Forecast", status: "have" },
              { name: "WFS库存与借调", status: "gap" }
            ]
          },
          {
            name: "订单",
            span: "1.45fr",
            intro: "管终端销量、线下采购订单和线上 3P 订单，并跟到发货。SO 负责导入零售商周销量。商超订单管理是线下 EDI 采购订单，可从订单创建发货。商超电商订单覆盖 Walmart、Best Buy、Lowe's，WF 订单单独查。发货单做审核、截单、改地址、签收和索赔；线下发货在商超发货管理里跟。",
            items: [
              { name: "商超销售管理（SO）", status: "have" },
              { name: "商超订单管理", status: "have" },
              { name: "商超电商订单", status: "have" },
              { name: "WF订单", status: "have" },
              { name: "商超电商发货单", status: "have" },
              { name: "WF发货单", status: "have" },
              { name: "商超发货管理", status: "have" }
            ]
          },
          {
            name: "往来账款",
            span: "1.15fr",
            cols: 2,
            intro: "管商超应收、回款和扣款。签收后生成应收单，回款单核销到账，扣款单登记费用和差异。商超收款核对 Walmart DC Checkout 付款单，并做财务审核。",
            items: [
              { name: "应收单", status: "have" },
              { name: "回款单", status: "have" },
              { name: "扣款单", status: "have" },
              { name: "商超收款", status: "have" }
            ]
          }
        ]
      },
      {
        domains: [
          {
            name: "尾程",
            span: "1fr",
            cols: 2,
            intro: "维护尾程运费报价，并和承运商账单对账。海外仓尾程账单、尾程对账也在这一块。",
            items: [
              { name: "尾程运费报价", status: "have" },
              { name: "尾程运费对账", status: "have" },
              { name: "海外仓尾程账单", status: "have" },
              { name: "海外仓尾程对账", status: "have" }
            ]
          },
          {
            name: "信息",
            span: "1.35fr",
            intro: "维护商超客户、客户主档、产品 MAP 报价和 UPC、GTIN 条码。下单和看板还会用到 SKU 信息和 MSKU 基础信息。多平台 Listing 把各商超平台的上架资料集中维护，并支持类目映射和跨平台复用。",
            items: [
              { name: "商超客户管理", status: "have" },
              { name: "客户管理", status: "have" },
              { name: "商超产品基础信息", status: "have" },
              { name: "商超产品条码管理", status: "have" },
              { name: "SKU信息", status: "have" },
              { name: "MSKU基础信息", status: "have" },
              { name: "多平台Listing维护", status: "gap" }
            ]
          },
          {
            name: "退货",
            span: "0.7fr",
            cols: 2,
            intro: "导入和导出零售商 RMA 退货数据。",
            items: [
              { name: "商超RMA管理", status: "have" }
            ]
          }
        ]
      }
    ];

    const on = { have: true, build: true, gap: true };
    let selected = null;

    function allItems() {
      const list = [];
      rows.forEach((row) => row.domains.forEach((d) => d.items.forEach((item) => list.push(item))));
      return list;
    }

    function visibleItems(domain) {
      return domain.items.filter((item) => on[item.status]);
    }

    function findDomain(name) {
      for (const row of rows) {
        const domain = row.domains.find((d) => d.name === name);
        if (domain) return domain;
      }
      return null;
    }

    function renderLegend() {
      const items = allItems();
      const legend = document.getElementById("legend");
      legend.innerHTML = "";
      Object.keys(STATUS).forEach((key) => {
        const count = items.filter((item) => item.status === key).length;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = key;
        btn.setAttribute("aria-pressed", on[key] ? "true" : "false");
        btn.textContent = STATUS[key] + " " + count;
        btn.addEventListener("click", () => {
          const solo = on[key] && Object.keys(on).every((k) => on[k] === (k === key));
          Object.keys(on).forEach((k) => { on[k] = solo ? true : k === key; });
          render();
        });
        legend.appendChild(btn);
      });
    }

    function statusNames(domain, status) {
      return domain.items.filter((item) => item.status === status).map((item) => item.name);
    }

    function renderDetail() {
      const box = document.getElementById("detail");
      const domain = selected ? findDomain(selected) : null;
      if (!domain || !visibleItems(domain).length) {
        selected = null;
        box.textContent = "点一个板块，查看这一块在做什么。";
        return;
      }
      box.replaceChildren();
      const title = document.createElement("b");
      title.textContent = domain.name;
      const lead = document.createElement("p");
      lead.textContent = domain.intro;
      box.append(title, lead);
      [["build", "建设中"], ["gap", "待补齐"]].forEach(([status, label]) => {
        const names = statusNames(domain, status);
        if (!names.length) return;
        const line = document.createElement("p");
        line.className = "line";
        const k = document.createElement("span");
        k.className = "k";
        k.textContent = label + "：";
        line.append(k, document.createTextNode(names.join("、")));
        box.append(line);
      });
    }

    function render() {
      renderLegend();
      const map = document.getElementById("map");
      map.innerHTML = "";
      rows.forEach((row) => {
        const visible = row.domains.filter((d) => visibleItems(d).length);
        const rowEl = document.createElement("div");
        rowEl.className = "row";
        if (!visible.length) {
          rowEl.hidden = true;
          map.appendChild(rowEl);
          return;
        }
        rowEl.style.gridTemplateColumns = visible.map((d) => d.span || "1fr").join(" ");
        visible.forEach((domain) => {
          const wrap = document.createElement("button");
          wrap.type = "button";
          wrap.className = "domain" + (selected === domain.name ? " on" : "");
          const title = document.createElement("div");
          title.className = "domain-name";
          title.textContent = domain.name;
          const panel = document.createElement("div");
          panel.className = "panel" + (domain.cols ? " cols-" + domain.cols : "");
          visibleItems(domain).forEach((item) => {
            const chip = document.createElement("div");
            chip.className = "chip " + item.status;
            chip.textContent = item.name;
            panel.appendChild(chip);
          });
          wrap.append(title, panel);
          wrap.addEventListener("click", () => {
            selected = domain.name;
            render();
            document.getElementById("detail").scrollIntoView({ block: "nearest" });
          });
          rowEl.appendChild(wrap);
        });
        map.appendChild(rowEl);
      });
      renderDetail();
    }

    render();
  </script>
</body>
</html>
