<head>

  <style>
    :root {
      --brand: #1677ff;
      --bg: #f4f6fa;
      --panel: #fff;
      --line: #e8edf3;
      --text: rgba(0, 0, 0, 0.88);
      --sub: rgba(0, 0, 0, 0.45);
      --nav: #0f1a2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .topbar {
      height: 48px;
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 600;
    }
    .layout {
      display: grid;
      grid-template-columns: 48px 1fr;
      min-height: calc(100vh - 48px);
    }
    .sider {
      background: var(--nav);
      color: #9fb0d0;
      padding-top: 8px;
      border-right: 1px solid #111a28;
    }
    .sider .item {
      width: 32px;
      height: 32px;
      margin: 6px auto;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.04);
      font-size: 12px;
    }
    .sider .item.active {
      color: #fff;
      background: rgba(22, 119, 255, 0.4);
    }
    .main {
      padding: 10px 12px 14px;
      overflow: auto;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .tab {
      height: 28px;
      border-radius: 999px;
      padding: 0 12px;
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      font-size: 12px;
      background: #fff;
      color: #334155;
    }
    .tab.active {
      border-color: var(--brand);
      color: var(--brand);
      background: #eef5ff;
      font-weight: 700;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .toolbar {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(6, minmax(140px, 1fr)) 88px;
      gap: 8px;
    }
    .toolbar input,
    .toolbar select {
      width: 100%;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
      color: #334155;
      background: #fff;
    }
    .btn {
      height: 30px;
      border-radius: 6px;
      border: 1px solid var(--brand);
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    .hint {
      padding: 8px 10px;
      font-size: 12px;
      color: #475569;
      background: #f8fbff;
      border-bottom: 1px solid var(--line);
    }
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 235px);
    }
    table {
      width: 100%;
      min-width: 1250px;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border-bottom: 1px solid #f0f4f8;
      padding: 10px 8px;
      text-align: left;
      white-space: nowrap;
      vertical-align: top;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #fafcff;
      color: #475569;
      font-weight: 700;
    }
    td.addr {
      max-width: 230px;
      white-space: normal;
      line-height: 1.6;
    }
    .op {
      color: var(--brand);
      cursor: pointer;
      margin-right: 12px;
      text-decoration: none;
      font-weight: 600;
    }
    .unit {
      color: #0f766e;
      font-weight: 600;
    }
    .mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.38);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .modal {
      width: min(680px, 92vw);
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: 0 16px 42px rgba(15, 23, 42, 0.24);
      overflow: hidden;
    }
    .modal-head {
      height: 44px;
      border-bottom: 1px solid var(--line);
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
    }
    .modal-body {
      padding: 14px;
      font-size: 12px;
      color: #334155;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px 12px;
      align-items: center;
    }
    .form-grid .label {
      color: #64748b;
      font-weight: 600;
    }
    .form-grid input {
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
    }
    .modal-foot {
      padding: 10px 14px 14px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .btn-lite {
      height: 30px;
      border-radius: 6px;
      padding: 0 12px;
      border: 1px solid var(--line);
      background: #fff;
      color: #334155;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-primary {
      height: 30px;
      border-radius: 6px;
      padding: 0 12px;
      border: 1px solid var(--brand);
      background: var(--brand);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    .log-table {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      font-size: 12px;
    }
    .log-table th, .log-table td {
      border: 1px solid #edf2f7;
      padding: 8px;
      white-space: nowrap;
    }
    .empty {
      text-align: center;
      color: #94a3b8;
      padding: 28px 0;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div>全渠道系统</div>
    <div>管报模块 / 海外仓仓租费率管理</div>
  </div>
  <div class="layout">
    <aside class="sider">
      <div class="item">首</div>
      <div class="item">销</div>
      <div class="item active">管</div>
      <div class="item">财</div>
      <div class="item">工</div>
    </aside>
    <main class="main">
      <div class="tabs">
        <span class="tab active">海外仓仓租费率管理</span>
      </div>
      <section class="panel">
        <div class="toolbar">
          <input id="qService" placeholder="服务仓" />
          <input id="qCode" placeholder="仓库编码" />
          <input id="qName" placeholder="服务仓仓库名称" />
          <input id="qCountry" placeholder="所在国家地区" />
          <input id="qContact" placeholder="联系人" />
          <input id="qPhone" placeholder="联系电话" />
          <button class="btn" id="btnSearch">搜索</button>
        </div>
        <div class="hint">
          数据来源：物流系统「海外仓管理 > 服务仓」。本页面仅维护“仓租费率（1立方1天）”，其他字段只读展示。
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>服务仓</th>
                <th>仓库编码</th>
                <th>服务仓仓库名称</th>
                <th>所在国家地区</th>
                <th>地址</th>
                <th>联系人</th>
                <th>联系电话</th>
                <th data-pa-key="rateColumn">仓租费率（1立方1天）</th>
                <th data-pa-key="actionColumn">操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div class="mask" id="rateMask">
    <div class="modal">
      <div class="modal-head">
        <span>费率维护</span>
        <button class="btn-lite" id="closeRate">关闭</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="label">服务仓</div><div id="fService">-</div>
          <div class="label">仓库编码</div><div id="fCode">-</div>
          <div class="label">仓租费率</div>
          <div>
            <input id="fRate" type="number" min="0" step="0.01" />
            <span class="unit">（USD / 立方 / 天）</span>
          </div>
          <div class="label">变更说明</div>
          <div><input id="fReason" placeholder="请输入本次费率调整原因" /></div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-lite" id="cancelRate">取消</button>
        <button class="btn-primary" id="saveRate">确定</button>
      </div>
    </div>
  </div>

  <div class="mask" id="logMask">
    <div class="modal">
      <div class="modal-head">
        <span>仓租费率变更日志</span>
        <button class="btn-lite" id="closeLog">关闭</button>
      </div>
      <div class="modal-body">
        <div id="logTitle" style="margin-bottom:8px;color:#64748b;">-</div>
        <table class="log-table">
          <thead>
            <tr>
              <th>变更时间</th>
              <th>变更前费率</th>
              <th>变更后费率</th>
              <th>操作人</th>
              <th>变更说明</th>
            </tr>
          </thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
      <div class="modal-foot">
        <button class="btn-primary" id="okLog">我知道了</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var rows = [
        { id: 1, service: "谷仓", code: "USWE", name: "美西5仓", country: "美国-西岸", addr: "Ontario-Trading路1号", contact: "Cindy", phone: "+1-909-112-8301", rate: 2.13 },
        { id: 2, service: "谷仓", code: "USAE", name: "美东13仓", country: "美国-中东", addr: "新泽西 Newark 园区B2", contact: "Aiden", phone: "+1-551-271-9002", rate: 3.21 },
        { id: 3, service: "谷仓", code: "UK", name: "英国5号仓", country: "英国-中部", addr: "Birmingham Unit 3", contact: "Oliver", phone: "+44-20-7001-2203", rate: 2.57 },
        { id: 4, service: "谷仓", code: "DE", name: "德国9号仓", country: "德国-北部", addr: "Hamburg Hafenallee 18", contact: "Lena", phone: "+49-40-7789-2201", rate: 2.84 },
        { id: 5, service: "递四方", code: "GLBTNA", name: "洛杉矶海外仓", country: "美国-西岸", addr: "Los Angeles South Gate", contact: "Mason", phone: "+1-323-909-3308", rate: 2.46 },
        { id: 6, service: "递四方", code: "121", name: "波兰5号服务仓", country: "波兰", addr: "Warsaw DC-5", contact: "Iga", phone: "+48-22-681-9800", rate: 1.92 }
      ];

      var logs = {
        1: [
          { time: "2026-05-21 09:21", before: 2.02, after: 2.13, user: "KA", reason: "按仓租合同更新" },
          { time: "2026-04-08 17:10", before: 1.95, after: 2.02, user: "KA", reason: "季度调价" }
        ],
        2: [
          { time: "2026-05-19 14:45", before: 3.05, after: 3.21, user: "KA", reason: "物业涨价同步" }
        ]
      };

      var currentId = null;

      var tbody = document.getElementById("tbody");
      var rateMask = document.getElementById("rateMask");
      var logMask = document.getElementById("logMask");
      var qService = document.getElementById("qService");
      var qCode = document.getElementById("qCode");
      var qName = document.getElementById("qName");
      var qCountry = document.getElementById("qCountry");
      var qContact = document.getElementById("qContact");
      var qPhone = document.getElementById("qPhone");

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function match(v, q) {
        return String(v).toLowerCase().indexOf(q.toLowerCase()) > -1;
      }

      function render() {
        var filtered = rows.filter(function (r) {
          return match(r.service, qService.value || "")
            && match(r.code, qCode.value || "")
            && match(r.name, qName.value || "")
            && match(r.country, qCountry.value || "")
            && match(r.contact, qContact.value || "")
            && match(r.phone, qPhone.value || "");
        });

        if (!filtered.length) {
          tbody.innerHTML = '<tr><td colspan="9" class="empty">暂无数据</td></tr>';
          return;
        }

        tbody.innerHTML = filtered.map(function (r) {
          return '<tr>'
            + '<td>' + escapeHtml(r.service) + '</td>'
            + '<td>' + escapeHtml(r.code) + '</td>'
            + '<td>' + escapeHtml(r.name) + '</td>'
            + '<td>' + escapeHtml(r.country) + '</td>'
            + '<td class="addr">' + escapeHtml(r.addr) + '</td>'
            + '<td>' + escapeHtml(r.contact) + '</td>'
            + '<td>' + escapeHtml(r.phone) + '</td>'
            + '<td><span class="unit">$' + r.rate.toFixed(2) + '</span></td>'
            + '<td>'
            + '<a class="op" data-op="edit" data-id="' + r.id + '">费率维护</a>'
            + '<a class="op" data-op="log" data-id="' + r.id + '">日志</a>'
            + '</td>'
            + '</tr>';
        }).join("");
      }

      function openRate(id) {
        currentId = id;
        var row = rows.find(function (x) { return x.id === id; });
        document.getElementById("fService").textContent = row.service;
        document.getElementById("fCode").textContent = row.code;
        document.getElementById("fRate").value = row.rate.toFixed(2);
        document.getElementById("fReason").value = "";
        rateMask.style.display = "flex";
      }

      function closeRate() {
        rateMask.style.display = "none";
        currentId = null;
      }

      function openLog(id) {
        var row = rows.find(function (x) { return x.id === id; });
        var items = logs[id] || [];
        document.getElementById("logTitle").textContent = row.service + " / " + row.code + " / " + row.name;
        var logBody = document.getElementById("logBody");
        if (!items.length) {
          logBody.innerHTML = '<tr><td colspan="5" class="empty">暂无费率变更记录</td></tr>';
        } else {
          logBody.innerHTML = items.map(function (it) {
            return "<tr>"
              + "<td>" + escapeHtml(it.time) + "</td>"
              + "<td>$" + it.before.toFixed(2) + "</td>"
              + "<td>$" + it.after.toFixed(2) + "</td>"
              + "<td>" + escapeHtml(it.user) + "</td>"
              + "<td>" + escapeHtml(it.reason) + "</td>"
              + "</tr>";
          }).join("");
        }
        logMask.style.display = "flex";
      }

      function closeLog() {
        logMask.style.display = "none";
      }

      document.getElementById("btnSearch").addEventListener("click", render);
      tbody.addEventListener("click", function (e) {
        var el = e.target;
        if (!el || !el.getAttribute) return;
        var op = el.getAttribute("data-op");
        var id = Number(el.getAttribute("data-id"));
        if (!op || !id) return;
        if (op === "edit") openRate(id);
        if (op === "log") openLog(id);
      });

      document.getElementById("closeRate").addEventListener("click", closeRate);
      document.getElementById("cancelRate").addEventListener("click", closeRate);
      document.getElementById("closeLog").addEventListener("click", closeLog);
      document.getElementById("okLog").addEventListener("click", closeLog);

      document.getElementById("saveRate").addEventListener("click", function () {
        if (!currentId) return;
        var row = rows.find(function (x) { return x.id === currentId; });
        var nextRate = Number(document.getElementById("fRate").value);
        var reason = (document.getElementById("fReason").value || "").trim();
        if (!Number.isFinite(nextRate) || nextRate < 0) {
          alert("请输入有效的仓租费率。");
          return;
        }
        if (!reason) {
          alert("请填写变更说明。");
          return;
        }

        var now = new Date();
        var t = now.getFullYear() + "-"
          + String(now.getMonth() + 1).padStart(2, "0") + "-"
          + String(now.getDate()).padStart(2, "0") + " "
          + String(now.getHours()).padStart(2, "0") + ":"
          + String(now.getMinutes()).padStart(2, "0");

        logs[currentId] = logs[currentId] || [];
        logs[currentId].unshift({
          time: t,
          before: row.rate,
          after: nextRate,
          user: "KA",
          reason: reason
        });
        row.rate = nextRate;
        closeRate();
        render();
      });

      rateMask.addEventListener("click", function (e) {
        if (e.target === rateMask) closeRate();
      });
      logMask.addEventListener("click", function (e) {
        if (e.target === logMask) closeLog();
      });

      render();
    })();
  </script>
