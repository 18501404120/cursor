<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>经营分析看板</title>
  <style>
    :root {
      --bg:#071429; --panel:#0b1d38; --line:#1f3b63; --text:#dbeafe; --muted:#8fb0d9;
      --blue:#60a5fa; --cyan:#22d3ee; --green:#34d399; --yellow:#fbbf24; --orange:#fb923c; --red:#f87171; --violet:#8b5cf6;
    }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 20% 0%,#12325d 0%,var(--bg) 36%);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif}
    .screen{min-height:100vh;max-width:1580px;margin:0 auto;padding:12px;display:grid;gap:10px;align-content:start}
    .header,.filters,.kpi,.panel{border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#0c2242 0%,#0a1d38 100%)}
    .header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
    .title{font-size:24px;font-weight:800;letter-spacing:.04em}
    .meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
    .tag{padding:3px 8px;border:1px solid #315483;border-radius:999px;background:#0d2a50}

    .filters{display:flex;align-items:center;gap:6px 8px;padding:8px;flex-wrap:nowrap;overflow-x:auto;flex-shrink:0}
    .filters label{font-size:12px;color:#9ec5f0;white-space:nowrap;flex-shrink:0}
    .filters select{height:28px;border-radius:6px;border:1px solid #32557f;background:#0e2a50;color:#dbeafe;font-size:12px;padding:0 6px}
    .filters select#fStore{max-width:118px;min-width:0}
    .filters .sku-inp{height:28px;border-radius:6px;border:1px solid #32557f;background:#0e2a50;color:#dbeafe;font-size:12px;padding:0 8px;width:132px;min-width:0;flex-shrink:0}

    #dateRangeMount .drp-wrap,#compareRangeMount .drp-wrap{flex-shrink:0}
    #dateRangeMount .drp-trigger,#compareRangeMount .drp-trigger{
      background:#0e2a50!important;border-color:#32557f!important;color:#dbeafe!important;
      min-width:158px!important;max-width:178px!important;height:28px!important;font-size:11px!important;
      padding-left:26px!important;padding-right:22px!important;
    }
    #dateRangeMount .drp-text,#compareRangeMount .drp-text{color:#dbeafe!important}
    #dateRangeMount .drp-text.drp-ph,#compareRangeMount .drp-text.drp-ph{color:#6b8aaf!important}
    #dateRangeMount .drp-ico-clear,#compareRangeMount .drp-ico-clear{
      border:none!important;border-radius:0!important;background:transparent!important;
      width:18px!important;height:18px!important;color:#9ec5f0!important;font-size:16px!important;line-height:1!important;
      box-shadow:none!important;
    }
    #dateRangeMount .drp-ico-clear:hover,#compareRangeMount .drp-ico-clear:hover{
      color:#fff!important;background:transparent!important;
    }
    #dateRangeMount .drp-trigger.drp-focus,#compareRangeMount .drp-trigger.drp-focus,
    #dateRangeMount .drp-trigger.drp-open,#compareRangeMount .drp-trigger.drp-open{
      box-shadow:0 0 0 1px rgba(34,211,238,.35)!important;border-color:#22d3ee!important;
    }

    .hint-bar{display:none}
    .compare-bar{display:flex;flex-wrap:wrap;gap:10px 16px;padding:6px 10px;border:1px solid #2b4f7c;border-radius:8px;background:rgba(8,33,63,.55);font-size:11px;color:#b6d4f8;margin-top:6px}
    .compare-bar .k{color:#9ec5f0}
    .pie-stat{cursor:pointer;transition:box-shadow .15s,border-color .15s}
    .pie-stat:hover{border-color:#60a5fa!important}
    .pie-stat.pie-stat-on{box-shadow:0 0 0 1px #22d3ee inset;border-color:#22d3ee!important}

    .kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    .kpi{padding:8px 10px}
    .kpi .n{font-size:13px;color:#9ec5f0;font-weight:700}
    .kpi .v{margin-top:3px;font-size:24px;font-weight:800;line-height:1.1}
    .kpi .list{margin-top:7px;display:grid;gap:3px;font-size:11px;color:#b6d4f8}
    .kpi .line{display:flex;justify-content:space-between;gap:8px}
    .kpi .label{opacity:.9}

    .row-3col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .structure-bundle{padding:10px 12px}
    .structure-bundle .metric-tabs{margin:0 0 10px}
    .structure-metric-title{font-size:13px;color:#bfe1ff;font-weight:700;margin-right:12px;white-space:nowrap;align-self:center}
    .structure-cols{align-items:stretch}
    .str-panel{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:8px;background:rgba(9,25,49,.35);padding:8px}
    .str-panel h4{margin:0 0 8px;font-size:13px;color:#bfe1ff;font-weight:700}
    .str-body{flex:1;min-height:0;overflow:auto;padding:2px 0}
    .row-funnel{display:grid;grid-template-columns:1fr;gap:10px}
    .panel{padding:8px 10px;display:flex;flex-direction:column;min-height:0}
    .panel h3{margin:0 0 6px;font-size:13px;color:#bfe1ff;display:flex;gap:10px;align-items:center;justify-content:flex-start}
    .h3-note{font-size:12px;color:#9ec5f0;font-weight:600}
    .box{flex:1;min-height:0;border:1px dashed #315483;border-radius:8px;padding:8px;background:rgba(9,25,49,.5);overflow:auto}

    .pie-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .pie-path{font-size:12px;color:#9ec5f0}
    .pie-path:empty{display:none}
    .pie-back{height:24px;border-radius:5px;border:1px solid #355f8f;background:#11325d;color:#cfe6ff;cursor:pointer;font-size:12px;padding:0 8px}
    .pie-stats{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:8px;margin:0 auto 8px;font-size:12px;max-width:620px}
    .pie-stat{border:1px solid #2f527f;border-radius:8px;padding:6px 8px;background:#0d274a;user-select:none}
    .pie-stat .k{color:#9ec5f0}
    .pie-stat .v{margin-top:2px;font-weight:700}
    .pie-wrap{display:grid;grid-template-columns:168px 1fr;gap:10px;align-items:center}
    .pie-legend{display:grid;gap:6px}
    .pie-legend .pie-row{display:flex;align-items:center;gap:10px;font-size:11px;padding:5px 6px;border-radius:6px;cursor:pointer;flex-wrap:nowrap;white-space:nowrap}
    .pie-legend .pie-row:hover{background:rgba(96,165,250,.08)}
    .pie-legend .pie-row.active{background:rgba(34,211,238,.15);box-shadow:0 0 0 1px rgba(34,211,238,.45) inset}
    .dot{width:10px;height:10px;border-radius:50%}
    .pie-name{flex:1;min-width:0;color:#d6e8ff;overflow:hidden;text-overflow:ellipsis}
    .pie-num{flex:0 0 auto;text-align:right;color:#dbeafe;font-variant-numeric:tabular-nums}
    .pie-val{flex:0 0 auto;min-width:3.2em;text-align:right;color:#9ec5f0;font-variant-numeric:tabular-nums}
    .pie-stat .pie-stat-dual{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px;font-weight:700;white-space:nowrap}
    .pie-stat .pie-stat-dual .sub{color:#9ec5f0;font-weight:700}

    .gap-good{color:#34d399}.gap-bad{color:#f87171}

    .funnel-wrap{display:grid;grid-template-columns:minmax(760px,1fr) 300px;gap:10px}
    .funnel-fees{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
    .fee-chip{border:1px solid #5f56b7;background:linear-gradient(180deg,#16285a 0%,#101f47 100%);color:#d7d4ff;border-radius:10px;padding:7px;font-size:11px;cursor:pointer;text-align:center;font-weight:700}
    .fee-chip.active{border-color:#9b8eff;box-shadow:0 0 0 1px #9b8eff inset,0 0 12px rgba(139,92,246,.35)}
    .funnel-main .sub-box{border-top:1px dashed #355d8a;padding-top:8px;font-size:14px;color:#d8e8ff}
    .sub-title{margin-bottom:8px;color:#9ec5f0;font-size:12px}
    .sub-line{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:700}
    .side-card{border:1px solid #315483;border-radius:10px;background:linear-gradient(180deg,#0d274a 0%,#0a1f3d 100%);padding:10px}
    .side-card h4{margin:0 0 10px;font-size:13px;color:#d8e8ff}
    .side-list{display:grid;gap:6px}
    .side-item{border:1px solid #2e527d;border-radius:8px;padding:8px;background:#0b2546}
    .side-item .nm{font-size:12px;color:#9ec5f0}
    .side-item .vv{margin-top:2px;display:flex;justify-content:space-between;font-weight:700;font-size:13px}
    .side-current{margin:2px 2px 8px;padding:2px 0 8px;border-bottom:1px dashed #2e527d}
    .side-current .nm{font-size:12px;color:#9ec5f0}
    .side-current .row{margin-top:4px;display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700}
    .side-current .main{font-size:13px;font-weight:700;line-height:1.2;white-space:nowrap}
    .svg-chip{cursor:pointer}
    .svg-chip rect{fill:#122a56;stroke:#6f63c6;stroke-width:1.5}
    .svg-chip.top rect{stroke:#f59e0b}
    .svg-chip.active rect{stroke:#c4b5fd;filter:url(#glow)}

    .trend-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .trend-panel h3{margin:0 0 8px}
    .trend-inner{min-height:120px;padding:4px 0}
    .trend-legends{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .trend-legends button{height:26px;padding:0 12px;border-radius:6px;border:1px solid #355f8f;background:#0e2a50;color:#9ec5f0;font-size:12px;cursor:pointer;white-space:nowrap}
    .trend-legends button.on{background:linear-gradient(180deg,#1e4a7a 0%,#153a63 100%);color:#dbeafe;border-color:#60a5fa;box-shadow:0 0 0 1px rgba(96,165,250,.35)}
    .grain-seg{display:inline-flex;border:1px solid #cbd5e1;border-radius:6px;overflow:hidden;background:#fff}
    .grain-seg button{margin:0;padding:0 14px;height:28px;border:none;background:#fff;color:#475569;font-size:12px;font-weight:600;cursor:pointer;border-right:1px solid #cbd5e1}
    .grain-seg button:last-child{border-right:none}
    .grain-seg button.on{background:#2563eb;color:#fff}
    .top-wrap{margin-top:4px}
    .top-table{width:100%;border-collapse:collapse;font-size:12px}
    .top-table th,.top-table td{border:1px solid #2f527f;padding:6px 8px;text-align:left}
    .top-table th{background:#0d274a;color:#9ec5f0;font-weight:700}
    .top-table tbody tr:hover{background:rgba(34,211,238,.06)}
    .top-table .num{text-align:right;font-variant-numeric:tabular-nums}
    .top-link{color:#60a5fa;cursor:pointer;text-decoration:underline}
    .metric-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0;padding:0;border:none;background:transparent;border-radius:0}
    .metric-tabs button{height:26px;padding:0 12px;border-radius:6px;border:1px solid #355f8f;background:#0e2a50;color:#9ec5f0;font-size:12px;cursor:pointer}
    .metric-tabs button.on{background:linear-gradient(180deg,#1e4a7a 0%,#153a63 100%);color:#dbeafe;border-color:#60a5fa;box-shadow:0 0 0 1px rgba(96,165,250,.35)}
    .trend-toolbar{display:flex;flex-wrap:wrap;align-items:center;width:100%;margin-bottom:8px;gap:8px;font-size:12px;color:#9ec5f0}
    .trend-toolbar__left{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start;align-items:center}
    .trend-toolbar__mid .trend-mini-legend{display:inline-flex;flex-wrap:wrap;align-items:center;gap:12px;font-size:11px;color:#9ec5f0}
    .trend-toolbar__right{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center}
    .trend-panel .trend-toolbar{display:flex}
    .trend-panel .trend-toolbar label{display:flex;align-items:center;gap:6px}
    .th-sort{cursor:pointer;user-select:none;white-space:nowrap}
    .th-sort:hover{color:#60a5fa}
    .th-sort .sort-ico{font-size:10px;margin-left:4px;opacity:.45;font-weight:400}
    .th-sort.th-sort-active{color:#60a5fa}
    .th-sort.th-sort-active .sort-ico{opacity:1;color:#22d3ee;font-weight:800}
    .btn-view{padding:2px 10px;border-radius:5px;border:1px solid #355f8f;background:#11325d;color:#60a5fa;font-size:12px;cursor:pointer}
    .btn-view:hover{border-color:#60a5fa}

    @media (max-width:1360px){
      .kpi-row{grid-template-columns:repeat(2,1fr)}
      .row-3col,.row-funnel,.structure-cols{grid-template-columns:1fr}
      .funnel-wrap{grid-template-columns:1fr}
      .funnel-fees{grid-template-columns:repeat(3,1fr)}
      .pie-wrap{grid-template-columns:1fr}
      .pie-name{width:auto}
      .filters{flex-wrap:wrap}
    }
  </style>
</head>
<body>
<div class="screen">
  <section class="header">
    <div class="title">经营分析看板</div>
    <div class="meta">
      <span class="tag" id="metaRange">统计区间：--</span>
      <span class="tag">币种：USD</span>
      <span id="metaTime">更新时间：--</span>
    </div>
  </section>

  <section class="filters">
    <label>统计区间</label><div id="dateRangeMount" style="display:inline-block;vertical-align:middle"></div>
    <label>对比日期范围</label><div id="compareRangeMount" style="display:inline-block;vertical-align:middle"></div>
    <label>区域</label><select id="fRegion"></select>
    <label>国家</label><select id="fCountry"></select>
    <label>渠道</label><select id="fChannel"></select>
    <label>店铺</label><select id="fStore"></select>
    <label>场景</label><select id="fScene"></select>
    <label>品类</label><select id="fCategory"></select>
    <label>SKU</label><input type="text" class="sku-inp" id="fSkuText" placeholder="model / sku / msku" autocomplete="off" />
  </section>

  <section class="kpi-row">
    <article class="kpi" id="cardSalesAmount"></article>
    <article class="kpi" id="cardRevenue"></article>
    <article class="kpi" id="cardGross"></article>
    <article class="kpi" id="cardSales"></article>
    <article class="kpi" id="cardMargin"></article>
  </section>

  <section class="panel trend-panel">
    <h3>趋势</h3>
    <div class="trend-inner" id="trendBox"></div>
  </section>

  <section class="panel structure-bundle">
    <div class="metric-tabs" id="structureMetricTabs"></div>
    <div class="row-3col structure-cols">
      <article class="str-panel"><h4>1）区域</h4><div class="str-body" id="regionBox"></div></article>
      <article class="str-panel"><h4>2）渠道</h4><div class="str-body" id="channelBox"></div></article>
      <article class="str-panel"><h4>3）场景</h4><div class="str-body" id="sceneBox"></div></article>
    </div>
  </section>

  <section class="row-funnel">
    <article class="panel"><h3>4）营收→毛利费用结构（点击费用条查看子项）</h3><div class="box" id="funnelBox"></div></article>
  </section>

  <section class="panel top-wrap">
    <h3>5）需重点关注的 SKU（TOP10）</h3>
    <div class="box" id="topSkuBox"></div>
  </section>
</div>

<script src="../../../规范/assets/date-range-picker.js"></script>
<script>
(function(){
  var YEARS=[2025,2026];
  var REGIONS={"亚太区":["CN","JP"],"欧洲区":["DE","GB"],"北美区":["US","CA"]};
  var CHANNELS=["亚马逊","独立站","TikTok","线下"];
  var STORES={"亚马逊":["AMZ-US-01","AMZ-DE-01","AMZ-GB-01"],"独立站":["DTC-Global-01"],"TikTok":["TT-US-01","TT-UK-01"],"线下":["Retail-US-01","Retail-DE-01"]};
  var SCENES={"居家":["灯带","落地灯","灯泡"],"观影":["TV灯带","氛围灯"],"户外":["户外灯带","庭院灯"]};

  function $(id){return document.getElementById(id);} 
  function fmtMoney(n){var v=Number(n)||0; if(Math.abs(v)>=1e6) return '$'+(v/1e6).toFixed(1)+'M'; if(Math.abs(v)>=1e3) return '$'+(v/1e3).toFixed(1)+'K'; return '$'+v.toFixed(0);} 
  function fmtPct(n){return (Number(n)||0).toFixed(1)+'%';}

  var DATA=[]; var id=1;
  YEARS.forEach(function(y){
    for(var m=1;m<=12;m++){
      Object.keys(REGIONS).forEach(function(r,ri){
        REGIONS[r].forEach(function(c,ci){
          CHANNELS.forEach(function(ch,chi){
            STORES[ch].forEach(function(st,si){
              Object.keys(SCENES).forEach(function(sc,sci){
                SCENES[sc].forEach(function(cat,cai){
                  var seed=(y%100)*100000+m*10000+ri*2000+ci*800+chi*300+si*70+sci*20+cai*7;
                  var bpRev=12000+(seed%5000);
                  var bizRev=Math.round(bpRev*(0.82+(seed%35)/100));
                  var finRev=Math.round(bizRev*(0.94+(seed%9)/100));
                  var bpSales=Math.round(bpRev*1.12), bizSales=Math.round(bizRev*1.12), finSales=Math.round(finRev*1.12);
                  var bpAd=Math.round(bpRev*0.11), bpLog=Math.round(bpRev*0.08), bpPla=Math.round(bpRev*0.06), bpOth=Math.round(bpRev*0.01);
                  var bizAd=Math.round(bizRev*(0.09+(seed%4)/100)), finAd=Math.round(bizAd*(0.95+(seed%8)/100));
                  var bizLog=Math.round(bizRev*(0.06+(seed%3)/100)), finLog=Math.round(bizLog*(0.96+(seed%8)/100));
                  var bizPla=Math.round(bizRev*(0.05+(seed%3)/100)), finPla=Math.round(bizPla*(0.95+(seed%8)/100));
                  var bizOth=Math.round(bizRev*0.01), finOth=Math.round(bizOth*(0.95+(seed%8)/100));
                  var bizGross=bizRev-bizAd-bizLog-bizPla-bizOth-Math.round(bizRev*0.38);
                  var finGross=finRev-finAd-finLog-finPla-finOth-Math.round(finRev*0.39);

                  function split4(total,a,b,c){var x=Math.round(total*a),y2=Math.round(total*b),z=Math.round(total*c);return [x,y2,z,total-x-y2-z];}
                  var adB=split4(bizAd,0.5,0.25,0.2), adF=split4(finAd,0.5,0.25,0.2);
                  var lgB=split4(bizLog,0.36,0.22,0.24), lgF=split4(finLog,0.36,0.22,0.24);
                  var plB=split4(bizPla,0.44,0.27,0.19), plF=split4(finPla,0.44,0.27,0.19);
                  var otB=split4(bizOth,0.55,0.45,0), otF=split4(finOth,0.55,0.45,0);

                  DATA.push({id:id++,year:y,month:m,region:r,country:c,channel:ch,store:st,scene:sc,category:cat,
                    model:'MDL-'+(1000+(seed%8999)),
                    sku:'SKU-'+String(100000+((seed*17)%899999)),
                    msku:'8'+String(10000000+((seed*13)%8999999)).slice(-7),
                    bp:{revenue:bpRev,sales:bpSales,gross:Math.round(bpRev*0.39),units:Math.round(bpRev/25+seed%80), ad:bpAd, logistics:bpLog, platform:bpPla, other:bpOth,
                        ad_perf:Math.round(bpAd*0.75),ad_brand:0,ad_promo:Math.round(bpAd*0.2),ad_sample:bpAd-Math.round(bpAd*0.75)-Math.round(bpAd*0.2),
                        logistics_head:Math.round(bpLog*0.36),logistics_return:Math.round(bpLog*0.22),logistics_storage:Math.round(bpLog*0.24),logistics_tariff:bpLog-Math.round(bpLog*0.36)-Math.round(bpLog*0.22)-Math.round(bpLog*0.24),
                        platform_commission:Math.round(bpPla*0.44),platform_service:Math.round(bpPla*0.27),platform_payment:Math.round(bpPla*0.19),platform_storefee:bpPla-Math.round(bpPla*0.44)-Math.round(bpPla*0.27)-Math.round(bpPla*0.19),
                        other_misc:Math.round(bpOth*0.55),other_reserve:bpOth-Math.round(bpOth*0.55)},
                    biz:{revenue:bizRev,sales:bizSales,gross:bizGross,units:Math.round(bizRev/25+seed%70),ad:bizAd,logistics:bizLog,platform:bizPla,other:bizOth,
                        ad_perf:adB[0]+adB[1],ad_brand:0,ad_promo:adB[2],ad_sample:adB[3],
                        logistics_head:lgB[0],logistics_return:lgB[1],logistics_storage:lgB[2],logistics_tariff:lgB[3],
                        platform_commission:plB[0],platform_service:plB[1],platform_payment:plB[2],platform_storefee:plB[3],
                        other_misc:otB[0],other_reserve:otB[1]},
                    fin:{revenue:finRev,sales:finSales,gross:finGross,units:Math.round(finRev/25+seed%65),ad:finAd,logistics:finLog,platform:finPla,other:finOth,
                        ad_perf:adF[0]+adF[1],ad_brand:0,ad_promo:adF[2],ad_sample:adF[3],
                        logistics_head:lgF[0],logistics_return:lgF[1],logistics_storage:lgF[2],logistics_tariff:lgF[3],
                        platform_commission:plF[0],platform_service:plF[1],platform_payment:plF[2],platform_storefee:plF[3],
                        other_misc:otF[0],other_reserve:otF[1]}
                  });
                });
              });
            });
          });
        });
      });
    }
  });

  var state={
    expenseDrill:'ad',channelDrill:null,regionDrill:null,sceneDrill:null,
    channelFocus:null,regionFocus:null,sceneFocus:null,
    pieStatMode:'cur',
    structureMetric:'revenue',
    trendDim:'revenue',
    trendGrain:'month',
    topKeyType:'sku',
    topSort:{field:'revAch',dir:1}
  };
  var dateRangeApi=null;
  var compareRangeApi=null;

  function parseYmdLocal(s){
    if(window.DateRangePicker&&DateRangePicker.parseYmd) return DateRangePicker.parseYmd(s);
    var p=(s||'').trim().split('-');
    if(p.length!==3) return null;
    var d=new Date(+p[0],+p[1]-1,+p[2]);
    if(d.getFullYear()!==+p[0]||d.getMonth()!==+p[1]-1||d.getDate()!==+p[2]) return null;
    return d;
  }
  function fmtYmdLocal(d){
    if(!d) return '';
    if(window.DateRangePicker&&DateRangePicker.fmtYmd) return DateRangePicker.fmtYmd(d);
    var pad=function(n){return (n<10?'0':'')+n;};
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function monthIntersects(ds,de,y,m){
    var sd=parseYmdLocal(ds), ed=parseYmdLocal(de);
    if(!sd||!ed) return true;
    var m0=new Date(y,m-1,1), m1=new Date(y,m,0,23,59,59,999);
    return m1>=sd && m0<=ed;
  }
  function shiftYearYmd(ymd,deltaY){
    var d=parseYmdLocal(ymd);
    if(!d) return '';
    var nd=new Date(d.getFullYear()+deltaY,d.getMonth(),d.getDate());
    return fmtYmdLocal(nd);
  }

  var METRICS={
    revenue:'营收',sales:'销售额',gross:'毛利',margin:'毛利率',units:'销量',
    ad:'广告宣传小计',logistics:'物流成本小计',platform:'交易及平台费用小计',other:'其他费用',
    ad_perf:'广告费',ad_brand:'品牌营销费',ad_promo:'推广费',ad_sample:'样品费',
    logistics_head:'头程运费',logistics_return:'退货运费',logistics_storage:'仓储费',logistics_tariff:'关税',
    platform_commission:'FBA佣金',platform_service:'平台服务费',platform_payment:'收单费用',platform_storefee:'店铺费用',
    other_misc:'运杂费',other_reserve:'预留毛利'
  };
  function setOptions(id,arr,all){var el=$(id);var h=all?'<option value="">全部</option>':'';arr.forEach(function(x){h+='<option value="'+x+'">'+x+'</option>';});el.innerHTML=h;}

  function defaultCompareRangeFromMain(){
    var f=mainDateRange();
    var ed=parseYmdLocal(f.dateEnd);
    if(!ed) return {s:'2026-01-01',e:'2026-01-31'};
    var pmEnd=new Date(ed.getFullYear(),ed.getMonth(),0);
    var pmStart=new Date(ed.getFullYear(),ed.getMonth()-1,1);
    return {s:fmtYmdLocal(pmStart),e:fmtYmdLocal(pmEnd)};
  }
  function mainDateRange(){
    var ds='2026-01-01', de='2026-01-31';
    if(dateRangeApi){var g=dateRangeApi.get(); if(g.start) ds=g.start; if(g.end) de=g.end;}
    return {dateStart:ds,dateEnd:de};
  }
  function compareDateRange(){
    var d=defaultCompareRangeFromMain();
    var ds=d.s, de=d.e;
    if(compareRangeApi){var g=compareRangeApi.get(); if(g.start) ds=g.start; if(g.end) de=g.end;}
    return {dateStart:ds,dateEnd:de};
  }

  function currentFilter(){
    var m=mainDateRange();
    return {dateStart:m.dateStart,dateEnd:m.dateEnd,region:$('fRegion').value,country:$('fCountry').value,channel:$('fChannel').value,store:$('fStore').value,scene:$('fScene').value,category:$('fCategory').value,skuText:(($('fSkuText')&&$('fSkuText').value)||'').trim().toLowerCase()};
  }

  function passesSkuFilter(r,f){
    if(!f.skuText) return true;
    var q=f.skuText;
    var skuKey=(r.store||'')+'-'+(r.category||'');
    var blob=(r.model||'')+' '+(r.sku||'')+' '+(r.msku||'')+' '+skuKey;
    return blob.toLowerCase().indexOf(q)>=0;
  }

  function passesDimFilter(r,f){
    if(f.region&&r.region!==f.region) return false;
    if(f.country&&r.country!==f.country) return false;
    if(f.channel&&r.channel!==f.channel) return false;
    if(f.store&&r.store!==f.store) return false;
    if(f.scene&&r.scene!==f.scene) return false;
    if(f.category&&r.category!==f.category) return false;
    return true;
  }

  function filteredRows(){
    var f=currentFilter();
    return DATA.filter(function(r){
      if(!monthIntersects(f.dateStart,f.dateEnd,r.year,r.month)) return false;
      if(!passesDimFilter(r,f)) return false;
      if(!passesSkuFilter(r,f)) return false;
      return true;
    });
  }

  function sumBy(rows,sys,key){return rows.reduce(function(s,r){return s+(Number((r[sys]&&r[sys][key])||0));},0);} 

  function filteredRowsDateSpan(ds,de){
    var f=currentFilter();
    return DATA.filter(function(r){
      if(!monthIntersects(ds,de,r.year,r.month)) return false;
      if(!passesDimFilter(r,f)) return false;
      if(!passesSkuFilter(r,f)) return false;
      return true;
    });
  }

  function aggBizMetric(rows,mk){
    if(!rows.length) return 0;
    if(mk==='margin'){
      var gr=sumBy(rows,'biz','revenue');
      return gr?sumBy(rows,'biz','gross')/gr:0;
    }
    if(mk==='units') return sumBy(rows,'biz','units');
    return sumBy(rows,'biz',mk);
  }
  function aggBpMetric(rows,mk){
    if(!rows.length) return 0;
    if(mk==='margin'){
      var gr=sumBy(rows,'bp','revenue');
      return gr?sumBy(rows,'bp','gross')/gr:0;
    }
    if(mk==='units') return sumBy(rows,'bp','units');
    return sumBy(rows,'bp',mk);
  }

  function renderStructureMetricTabs(){
    var tabs=[{k:'revenue',n:'营收'},{k:'gross',n:'毛利'},{k:'units',n:'销量'},{k:'margin',n:'毛利率'}];

      return '<button type="button" class="'+(state.structureMetric===t.k?'on':'')+'" data-sm="'+t.k+'">'+t.n+'</button>';
    }).join('');
    Array.prototype.forEach.call($('structureMetricTabs').querySelectorAll('button[data-sm]'),function(b){
      b.onclick=function(){
        state.structureMetric=b.getAttribute('data-sm')||'revenue';
        state.channelDrill=null;state.regionDrill=null;state.sceneDrill=null;
        renderStructureMetricTabs();
        renderRegion();renderChannel();renderScene();
      };
    });

  function updateDeps(){
    var region=$('fRegion').value, channel=$('fChannel').value, scene=$('fScene').value;
    var countries=region?REGIONS[region]:Object.keys(REGIONS).reduce(function(a,k){return a.concat(REGIONS[k]);},[]);
    var stores=channel?STORES[channel]:Object.keys(STORES).reduce(function(a,k){return a.concat(STORES[k]);},[]);
    var cats=scene?SCENES[scene]:Object.keys(SCENES).reduce(function(a,k){return a.concat(SCENES[k]);},[]);
    var keepCountry=$('fCountry').value, keepStore=$('fStore').value, keepCat=$('fCategory').value;
    setOptions('fCountry',countries,true); setOptions('fStore',stores,true); setOptions('fCategory',cats,true);
    if(countries.indexOf(keepCountry)>=0) $('fCountry').value=keepCountry;
    if(stores.indexOf(keepStore)>=0) $('fStore').value=keepStore;
    if(cats.indexOf(keepCat)>=0) $('fCategory').value=keepCat;
  }

  function updateMetaRange(){
    var f=currentFilter();
    $('metaRange').textContent='统计区间：'+f.dateStart+' 至 '+f.dateEnd;
  }

  function yoyPct(cur,prev){return prev?((cur-prev)/prev*100):0;}

  function renderMetricCard(target,title,key,isRate){
    var f=currentFilter();
    var rows=filteredRows();
    var lyS=shiftYearYmd(f.dateStart,-1), lyE=shiftYearYmd(f.dateEnd,-1);
    var rowsLy=filteredRowsDateSpan(lyS,lyE);
    var cf=compareDateRange();
    var rowsCmp=filteredRowsDateSpan(cf.dateStart,cf.dateEnd);

    var bpTotal,bizTotal,bizAch,gap,curVal,lyVal,cmpVal;
    if(isRate){
      bpTotal=sumBy(rows,'bp','gross')/Math.max(1,sumBy(rows,'bp','revenue'));
      bizTotal=sumBy(rows,'biz','gross')/Math.max(1,sumBy(rows,'biz','revenue'));
      bizAch=bpTotal?bizTotal/bpTotal*100:0;
      gap=(bizTotal-bpTotal)*100;
      curVal=bizTotal*100;
      lyVal=(sumBy(rowsLy,'biz','gross')/Math.max(1,sumBy(rowsLy,'biz','revenue')))*100;
      cmpVal=(sumBy(rowsCmp,'biz','gross')/Math.max(1,sumBy(rowsCmp,'biz','revenue')))*100;
    }else{
      bpTotal=sumBy(rows,'bp',key);
      bizTotal=sumBy(rows,'biz',key);
      bizAch=bpTotal?bizTotal/bpTotal*100:0;
      gap=bizTotal-bpTotal;
      curVal=bizTotal;
      lyVal=sumBy(rowsLy,'biz',key);
      cmpVal=sumBy(rowsCmp,'biz',key);
    }

    var gapCls=gap>=0?'gap-good':'gap-bad';
    var h='';
    h+='<div class="n">'+title+'</div>';
    h+='<div class="v">'+(isRate?fmtPct(curVal):fmtMoney(curVal))+'</div>';
    h+='<div class="list">';
    h+='<div class="line"><span class="label">目标（区间内合计）</span><span>'+(isRate?fmtPct(bpTotal*100):fmtMoney(bpTotal))+'</span></div>';
    h+='<div class="line"><span class="label">实际（区间内合计）</span><span>'+(isRate?fmtPct(bizTotal*100):fmtMoney(bizTotal))+'</span></div>';
    h+='<div class="line"><span class="label">目标达成率</span><span>'+fmtPct(bizAch)+'</span></div>';
    h+='<div class="line"><span class="label">同比</span><span>'+fmtPct(yoyPct(curVal,lyVal))+'</span></div>';
    h+='<div class="line"><span class="label">对比</span><span>'+fmtPct(yoyPct(curVal,cmpVal))+'</span></div>';
    h+='<div class="line"><span class="label">与目标差额</span><span class="'+gapCls+'">'+(gap>=0?'+':'')+(isRate?fmtPct(gap):fmtMoney(gap))+'</span></div>';
    h+='</div>';
    $(target).innerHTML=h;
  }

  function renderKPI(){
    renderMetricCard('cardSalesAmount','销售额','sales',false);
    renderMetricCard('cardRevenue','营收','revenue',false);
    renderMetricCard('cardGross','毛利','gross',false);
    renderMetricCard('cardSales','销量','units',false);
    renderMetricCard('cardMargin','毛利率','margin',true);
    $('metaTime').textContent='更新时间：'+new Date().toLocaleString('zh-CN',{hour12:false});
  }

  function metricValue(sys,key){
    var v=Number((sys&&sys[key])||0);
    return Number.isFinite(v)?v:0;
  }
  function groupByMetric(rows,key,mk){
    var agg={};
    rows.forEach(function(r){
      var k=r[key];
      if(!agg[k]) agg[k]={rev:0,g:0,u:0,bprev:0,bpg:0,bpu:0};
      agg[k].rev+=r.biz.revenue; agg[k].g+=r.biz.gross; agg[k].u+=r.biz.units;
      agg[k].bprev+=r.bp.revenue; agg[k].bpg+=r.bp.gross; agg[k].bpu+=r.bp.units;
    });
    return Object.keys(agg).map(function(k){
      var o=agg[k];
      var val,bpT;
      if(mk==='margin'){val=o.rev?o.g/o.rev:0; bpT=o.bprev?o.bpg/o.bprev:0;}
      else if(mk==='units'){val=o.u; bpT=o.bpu;}
      else if(mk==='gross'){val=o.g; bpT=o.bpg;}
      else {val=o.rev; bpT=o.bprev;}
      return {key:k,val:val,bpVal:bpT};
    }).sort(function(a,b){return b.val-a.val;});
  }
  function rowsForScope(year,ds,de,scope){
    var f=currentFilter();
    return DATA.filter(function(r){
      if(r.year!==year) return false;
      if(!monthIntersects(ds,de,r.year,r.month)) return false;
      if(!passesDimFilter(r,f)) return false;
      if(!passesSkuFilter(r,f)) return false;
      if(scope&&scope.channel&&r.channel!==scope.channel) return false;
      if(scope&&scope.store&&r.store!==scope.store) return false;
      if(scope&&scope.region&&r.region!==scope.region) return false;
      if(scope&&scope.country&&r.country!==scope.country) return false;
      if(scope&&scope.scene&&r.scene!==scope.scene) return false;
      if(scope&&scope.category&&r.category!==scope.category) return false;
      return true;
    });
  }
  function applyScope(rows,scope){
    if(!scope) return rows;
    return rows.filter(function(r){
      if(scope.channel&&r.channel!==scope.channel) return false;
      if(scope.store&&r.store!==scope.store) return false;
      if(scope.region&&r.region!==scope.region) return false;
      if(scope.country&&r.country!==scope.country) return false;
      if(scope.scene&&r.scene!==scope.scene) return false;
      if(scope.category&&r.category!==scope.category) return false;
      return true;
    });
  }
  function metricStatsFromScope(metricKey,scope){
    var f=currentFilter();
    var curRows=applyScope(filteredRows(),scope);
    var lyS=shiftYearYmd(f.dateStart,-1), lyE=shiftYearYmd(f.dateEnd,-1);
    var lyRows=applyScope(filteredRowsDateSpan(lyS,lyE),scope);
    var cf=compareDateRange();
    var cmpRows=applyScope(filteredRowsDateSpan(cf.dateStart,cf.dateEnd),scope);
    var cur=aggBizMetric(curRows,metricKey);
    var bp=aggBpMetric(curRows,metricKey);
    var lyV=aggBizMetric(lyRows,metricKey);
    var cmpV=aggBizMetric(cmpRows,metricKey);
    return {cur:cur,bp:bp,ach:bp?cur/bp*100:0,yoy:yoyPct(cur,lyV),ly:lyV,cmpV:cmpV,cmpPct:yoyPct(cur,cmpV)};
  }

  function arc(cx,cy,r,start,end){
    var x1=cx+r*Math.cos(start), y1=cy+r*Math.sin(start);
    var x2=cx+r*Math.cos(end), y2=cy+r*Math.sin(end);
    var large=(end-start)>Math.PI?1:0;
    return 'M '+cx+' '+cy+' L '+x1+' '+y1+' A '+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z';
  }

  function fmtMetricCell(mk,v){
    if(mk==='margin') return fmtPct(v*100);
    if(mk==='units') return String(Math.round(v));
    return fmtMoney(v);
  }

  function renderPie(container,title,path,list,colors,summary,selectedKey,onSelect,onDrill,onBack,dim,mk,rowsBase){
    if(state.pieStatMode==='yoycmp') state.pieStatMode='yoy';
    var total=list.reduce(function(s,x){return s+x.val;},0)||1;
    var start=-Math.PI/2, cx=84, cy=84, r=70;
    var seg='';
    list.forEach(function(x,i){
      var ratio=x.val/total;
      var end=start+ratio*2*Math.PI;
      seg+='<path d="'+arc(cx,cy,r,start,end)+'" fill="'+colors[i%colors.length]+'" opacity="0.95" data-k="'+x.key+'"></path>';
      start=end;
    });
    var f=currentFilter();
    var lyS=shiftYearYmd(f.dateStart,-1), lyE=shiftYearYmd(f.dateEnd,-1);
    var lyAll=filteredRowsDateSpan(lyS,lyE);
    var cf=compareDateRange();
    var cmpAll=filteredRowsDateSpan(cf.dateStart,cf.dateEnd);
    function lyDim(k){return aggBizMetric(lyAll.filter(function(r){return r[dim]===k;}),mk);}
    function cmpDim(k){return aggBizMetric(cmpAll.filter(function(r){return r[dim]===k;}),mk);}

    var legend=list.map(function(x,i){
      var pct=total?x.val/total*100:0;
      var sl=rowsBase.filter(function(r){return r[dim]===x.key;});
      var cur=aggBizMetric(sl,mk), bp=aggBpMetric(sl,mk), ach=bp?cur/bp*100:0;
      var lyV=lyDim(x.key), cmpV=cmpDim(x.key);
      var mode=state.pieStatMode;
      var rowCls='pie-row'+(selectedKey===x.key?' active':'');
      if(mode==='cur'){
        var p2=mk==='margin'?'—':fmtPct(pct);
        return '<div class="'+rowCls+'" data-k="'+x.key+'"><span class="dot" style="background:'+colors[i%colors.length]+'"></span><span class="pie-name">'+x.key+'</span><span class="pie-num">'+fmtMetricCell(mk,cur)+'</span><span class="pie-val">'+p2+'</span></div>';
      }
      if(mode==='ach'){
        return '<div class="'+rowCls+'" data-k="'+x.key+'"><span class="dot" style="background:'+colors[i%colors.length]+'"></span><span class="pie-name">'+x.key+'</span><span class="pie-num">'+fmtMetricCell(mk,bp)+' / '+fmtMetricCell(mk,cur)+'</span><span class="pie-val">'+fmtPct(ach)+'</span></div>';
      }
      if(mode==='yoy'){
        return '<div class="'+rowCls+'" data-k="'+x.key+'"><span class="dot" style="background:'+colors[i%colors.length]+'"></span><span class="pie-name">'+x.key+'</span><span class="pie-num">'+fmtMetricCell(mk,lyV)+'</span><span class="pie-val">'+fmtPct(yoyPct(cur,lyV))+'</span></div>';
      }
      return '<div class="'+rowCls+'" data-k="'+x.key+'"><span class="dot" style="background:'+colors[i%colors.length]+'"></span><span class="pie-name">'+x.key+'</span><span class="pie-num">'+fmtMetricCell(mk,cur)+'</span><span class="pie-val">'+fmtPct(yoyPct(cur,cmpV))+'</span></div>';
    }).join('');

    var sCur=mk==='margin'?fmtPct(summary.cur*100): (mk==='units'?String(Math.round(summary.cur)):fmtMoney(summary.cur));
    var sLy=mk==='margin'?fmtPct(summary.ly*100): (mk==='units'?String(Math.round(summary.ly)):fmtMoney(summary.ly));
    var modes=[
      {m:'cur',k:'当前值',v:sCur},
      {m:'ach',k:'目标达成率',v:fmtPct(summary.ach)},
      {m:'yoy',k:'同比',html:'<div class="v pie-stat-dual"><span>'+sLy+'</span><span class="sub">'+fmtPct(summary.yoy)+'</span></div>'},
      {m:'cmp',k:'对比',v:fmtPct(summary.cmpPct)}
    ];
    var stats=modes.map(function(x){
      var on=state.pieStatMode===x.m?' pie-stat-on':'';
      var body=x.html!=null?x.html:('<div class="v">'+x.v+'</div>');
      return '<div class="pie-stat'+on+'" data-pie-mode="'+x.m+'"><div class="k">'+x.k+'</div>'+body+'</div>';
    }).join('');
    var h='';
    h+='<div class="pie-hd">'+(path?'<div class="pie-path">'+path+'</div>':'<div class="pie-path"></div>')+(onBack?'<button class="pie-back" id="'+container+'Back">返回上层</button>':'')+'</div>';
    h+='<div class="pie-stats">'+stats+'</div>';
    h+='<div class="pie-wrap">';
    h+='<svg viewBox="0 0 168 168" width="164" height="164">'+seg+'<circle cx="84" cy="84" r="40" fill="#0c2242"></circle></svg>';
    h+='<div class="pie-legend">'+legend+'</div>';
    h+='</div>';
    $(container).innerHTML=h;
    if(onBack) $(container+'Back').onclick=onBack;
    Array.prototype.forEach.call($(container).querySelectorAll('[data-pie-mode]'),function(el){
      el.onclick=function(e){
        e.stopPropagation();
        state.pieStatMode=el.getAttribute('data-pie-mode')||'cur';
        renderRegion();renderChannel();renderScene();
      };
    });
    if(onSelect){
      Array.prototype.forEach.call($(container).querySelectorAll('.pie-row'),function(el){
        el.onclick=function(){onSelect(el.getAttribute('data-k'));};
      });
    }
    if(onDrill){
      Array.prototype.forEach.call($(container).querySelectorAll('path[data-k]'),function(el){
        el.onclick=function(){onDrill(el.getAttribute('data-k'));};
      });
    }
  }

  function renderChannel(){
    var rows=filteredRows(), mk=state.structureMetric;
    if(!state.channelDrill){
      var list=groupByMetric(rows,'channel',mk);
      if(!list.length){$('channelBox').innerHTML='';return;}

      var scope=state.channelFocus?{channel:state.channelFocus}:null;
      renderPie('channelBox','','渠道',list,['#60a5fa','#22d3ee','#34d399','#fbbf24'],metricStatsFromScope(mk,scope),state.channelFocus,function(k){state.channelFocus=k;renderChannel();},function(k){state.channelDrill=k;state.channelFocus=null;renderAll();},null,'channel',mk,rows);

  function renderScene(){
    var rows=filteredRows(), mk=state.structureMetric;
    if(!state.sceneDrill){
      var list=groupByMetric(rows,'scene',mk);
      if(!list.length){$('sceneBox').innerHTML='';return;}

  function funnelValue(rows,sys,key){
    var salesV=sumBy(rows,sys,'sales');
    var revV=sumBy(rows,sys,'revenue');
    var diff=Math.max(0,salesV-revV);
    if(key==='discount') return Math.round(diff*0.5);
    if(key==='returns') return Math.round(diff*0.24);
    if(key==='vat') return Math.max(0,diff-Math.round(diff*0.5)-Math.round(diff*0.24));
    return sumBy(rows,sys,key);
  }

  function eachMonthOverlapping(){
    var f=currentFilter(), out=[], sd=parseYmdLocal(f.dateStart), ed=parseYmdLocal(f.dateEnd);
    if(!sd||!ed) return [];
    var cur=new Date(sd.getFullYear(),sd.getMonth(),1);
    var endM=new Date(ed.getFullYear(),ed.getMonth(),1);
    while(cur<=endM){
      out.push({y:cur.getFullYear(),m:cur.getMonth()+1});
      cur.setMonth(cur.getMonth()+1);
    }
    return out;
  }

  function daysInMonth(y,m){return new Date(y,m,0).getDate();}
  function eachDayInclusive(ds,de){
    var a=parseYmdLocal(ds), b=parseYmdLocal(de);
    if(!a||!b||a>b) return [];
    var o=[], d=new Date(a.getTime());
    while(d<=b){o.push(fmtYmdLocal(new Date(d))); d.setDate(d.getDate()+1);}
    return o;
  }
  function overlapDayCount(bs,be,y,m){
    var ms=fmtYmdLocal(new Date(y,m-1,1)), me=fmtYmdLocal(new Date(y,m,0));
    var fs=bs>ms?bs:ms;
    var fe=be<me?be:me;
    var sd=parseYmdLocal(fs), ed=parseYmdLocal(fe);
    if(!sd||!ed||sd>ed) return 0;
    return Math.round((ed-sd)/864e5)+1;
  }
  function rowDim(sys,r,dim){
    if(dim==='margin'){
      var rv=Number((r[sys]&&r[sys].revenue)||0);
      return rv?Number((r[sys]&&r[sys].gross)||0)/rv:0;
    }
    if(dim==='units') return Number((r[sys]&&r[sys].units)||0);
    if(dim==='gross') return Number((r[sys]&&r[sys].gross)||0);
    return Number((r[sys]&&r[sys].revenue)||0);
  }
  function bucketAgg(rows,bs,be,dim){
    var bpV=0,bizV=0;
    rows.forEach(function(r){
      var od=overlapDayCount(bs,be,r.year,r.month);
      if(!od) return;
      var di=daysInMonth(r.year,r.month);
      var f=od/di;
      bpV+=rowDim('bp',r,dim)*f;
      bizV+=rowDim('biz',r,dim)*f;
    });
    var ach=(dim==='margin')?0:(bpV?bizV/bpV*100:0);
    return {bp:bpV,biz:bizV,ach:ach};
  }
  function trendBuckets(f,grain,rows){
    var out=[];
    if(grain==='month'){
      eachMonthOverlapping().forEach(function(mm){
        var ms=fmtYmdLocal(new Date(mm.y,mm.m-1,1)), me=fmtYmdLocal(new Date(mm.y,mm.m,0));
        var bs=f.dateStart>ms?f.dateStart:ms;
        var be=f.dateEnd<me?f.dateEnd:me;
        out.push({label:mm.m+'月',bs:bs,be:be});
      });
      return out;
    }
    if(grain==='day'){
      eachDayInclusive(f.dateStart,f.dateEnd).forEach(function(ymd){
        out.push({label:ymd.slice(5),bs:ymd,be:ymd});
      });
      return out;
    }
    var days=eachDayInclusive(f.dateStart,f.dateEnd);
    for(var i=0;i<days.length;i+=7){
      var chunk=days.slice(i,i+7);
      if(!chunk.length) break;
      out.push({label:chunk[0].slice(5)+'~'+chunk[chunk.length-1].slice(5),bs:chunk[0],be:chunk[chunk.length-1]});
    }
    return out;
  }

  function renderTrend(){
    var f=currentFilter();
    var rows=filteredRows();
    var dim=state.trendDim;
    var grain=state.trendGrain;
    var buckets=trendBuckets(f,grain,rows);
    if(!buckets.length){
      $('trendBox').innerHTML='<div style="font-size:12px;color:#9ec5f0;padding:8px">请先在顶部选择有效统计区间。</div>';
      return;
    }
    var agg=buckets.map(function(b){
      var o=bucketAgg(rows,b.bs,b.be,dim);
      return {label:b.label,bp:o.bp,biz:o.biz,ach:o.ach};
    });

    var maxL=agg.reduce(function(mx,x){return Math.max(mx,x.bp,x.biz);},1);
    var minL=agg.reduce(function(mn,x){return Math.min(mn,x.bp,x.biz);},0);
    if(minL>0) minL=0;
    var maxA=100,minA=0;
    var w=980,h=360,left=54,right=dim==='margin'?18:52,top=32,bottom=40;
    var cw=w-left-right,ch=h-top-bottom;
    var yb=top+ch;
    function xOf(i){return agg.length<=1?left+cw/2:left+i*(cw/Math.max(1,agg.length-1));}
    function yL(v){return top+(maxL===minL?ch/2:(maxL-v)/(maxL-minL)*ch);}

    var yGrid='';
    for(var gi=0;gi<=4;gi++){
      var y=top+gi*(ch/4), v=maxL-(maxL-minL)*(gi/4);

    }

    var vGrid='';
    agg.forEach(function(x,i){
      var px=xOf(i);
      vGrid+='<line x1="'+px.toFixed(1)+'" y1="'+top.toFixed(1)+'" x2="'+px.toFixed(1)+'" y2="'+yb.toFixed(1)+'" stroke="#1c3558" stroke-dasharray="3 5" opacity="0.85"></line>';
    });

    function pts(k){

      }

    }
    function dots(k,color){return agg.map(function(x,i){var px=xOf(i),py=yL(x[k]);return '<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.4" fill="'+color+'" stroke="#0c2242" stroke-width="0.5"></circle>';}).join('');}

    var areaPath='';
    if(agg.length>=2){
      var topLine=agg.map(function(x,i){return xOf(i).toFixed(1)+','+yL(x.biz).toFixed(1);}).join(' L ');
      areaPath='<path d="M '+xOf(0).toFixed(1)+','+yb.toFixed(1)+' L '+topLine+' L '+xOf(agg.length-1).toFixed(1)+','+yb.toFixed(1)+' Z" fill="url(#trendAreaFill)" opacity="0.5"></path>';

        var px=xOf(i);

    dims.forEach(function(t){
      htm+='<button type="button" class="'+(dim===t[0]?'on':'')+'" data-trend-dim="'+t[0]+'">'+t[1]+'</button>';

    htm+='</div></div>';

    });
    htm+='</div>';

    htm+='<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'">';

        revA:o.bizRev, revAch:o.bpRev?o.bizRev/o.bpRev*100:0,
        qtyA:o.bizU, qtyAch:o.bpU?o.bizU/o.bpU*100:0,
        grsA:o.bizG, grsAch:o.bpG?o.bizG/o.bpG*100:0
      };
    });
    var sf=state.topSort.field, sd=state.topSort.dir;
    arr.sort(function(a,b){
      var av=a[sf], bv=b[sf];
      if(av===bv) return a.key<b.key?-1:1;
      return av<bv?-sd:sd;
    });
    arr=arr.slice(0,10);

    var dimOpts=[{v:'sku',n:'SKU'},{v:'model',n:'MODEL'},{v:'msku',n:'MSKU'}];
    var dimSel='<select id="topKeyTypeSel" style="height:22px;border-radius:4px;border:1px solid #355f8f;background:#11325d;color:#cfe6ff;font-size:11px">';
    dimOpts.forEach(function(o){
      dimSel+='<option value="'+o.v+'"'+(state.topKeyType===o.v?' selected':'')+'>'+o.n+'</option>';
    });
    dimSel+='</select>';

    function th(field,label){return sortTh(field,label);}

    var h='<table class="top-table"><thead><tr><th>#</th><th>主键 '+dimSel+'</th>';
    h+=th('revA','实际营收')+th('revAch','营收达成率')+th('qtyA','实际销量')+th('qtyAch','销量达成率')+th('grsA','实际毛利')+th('grsAch','毛利达成率')+'<th>操作</th></tr></thead><tbody>';
    arr.forEach(function(r,i){
      var q='keyType='+encodeURIComponent(state.topKeyType)+'&key='+encodeURIComponent(r.key)+'&dateStart='+encodeURIComponent(currentFilter().dateStart)+'&dateEnd='+encodeURIComponent(currentFilter().dateEnd);
      h+='<tr><td>'+(i+1)+'</td><td>'+r.key+'</td>';
      h+='<td class="num">'+fmtMoney(r.revA)+'</td><td class="num">'+fmtPct(r.revAch)+'</td>';
      h+='<td class="num">'+String(Math.round(r.qtyA))+'</td><td class="num">'+fmtPct(r.qtyAch)+'</td>';
      h+='<td class="num">'+fmtMoney(r.grsA)+'</td><td class="num">'+fmtPct(r.grsAch)+'</td>';
      h+='<td><button type="button" class="btn-view" data-href="经营分析明细看板.html?'+q+'">查看</button></td></tr>';
    });
    h+='</tbody></table>';
    $('topSkuBox').innerHTML=h;
    $('topKeyTypeSel').onchange=function(){
      state.topKeyType=this.value||'sku';
      renderTopSku();
    };
    Array.prototype.forEach.call($('topSkuBox').querySelectorAll('th[data-ts]'),function(el){
      el.onclick=function(){
        var fd=el.getAttribute('data-ts');
        if(state.topSort.field===fd) state.topSort.dir*=-1;
        else{state.topSort.field=fd;state.topSort.dir=1;}
        renderTopSku();
      };
    });
    Array.prototype.forEach.call($('topSkuBox').querySelectorAll('button.btn-view'),function(btn){
      btn.onclick=function(){window.location.href=btn.getAttribute('data-href');};
    });
  }

  function renderAll(){
    updateMetaRange();
    renderStructureMetricTabs();
    renderKPI();
    renderTrend();
    renderRegion();
    renderChannel();
    renderScene();
    renderFunnel();
    renderTopSku();
  }

  function init(){
    if(!window.DateRangePicker){
      $('dateRangeMount').innerHTML='<span style="color:#f87171;font-size:12px">日期范围控件脚本未加载，请用本地静态服务打开本页或检查 ../../../规范/assets/date-range-picker.js 路径。</span>';
    }else{
      dateRangeApi=DateRangePicker.mount($('dateRangeMount'),{start:'2026-01-01',end:'2026-01-31',compact:true,zIndex:1200,onChange:function(){renderAll();}});
      var dc=defaultCompareRangeFromMain();
      compareRangeApi=DateRangePicker.mount($('compareRangeMount'),{start:dc.s,end:dc.e,compact:true,zIndex:1200,onChange:function(){renderAll();}});
    }

    setOptions('fRegion',Object.keys(REGIONS),true);
    setOptions('fCountry',Object.keys(REGIONS).reduce(function(a,k){return a.concat(REGIONS[k]);},[]),true);
    setOptions('fChannel',CHANNELS,true);
    setOptions('fStore',Object.keys(STORES).reduce(function(a,k){return a.concat(STORES[k]);},[]),true);
    setOptions('fScene',Object.keys(SCENES),true);
    setOptions('fCategory',Object.keys(SCENES).reduce(function(a,k){return a.concat(SCENES[k]);},[]),true);

    ['fRegion','fCountry','fChannel','fStore','fScene','fCategory'].forEach(function(id){
      $(id).addEventListener('change',function(){
        if(id==='fRegion'||id==='fChannel'||id==='fScene') updateDeps();
        renderAll();
      });
    });
    if($('fSkuText')) $('fSkuText').addEventListener('input',function(){renderAll();});

    updateDeps();
    renderAll();
  }

  init();
})();
</script>
</body>
</html>
