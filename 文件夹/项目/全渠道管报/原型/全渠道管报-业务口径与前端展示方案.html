<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全渠道管报 · 图形方案</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef1f8;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 12px 10px 40px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 0.02em;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      align-items: center;
      margin-bottom: 10px;
      font-size: 11px;
      color: #475569;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .sw { width: 14px; height: 14px; border-radius: 3px; border: 2px solid #334155; }
    .sw.d { background: #e0f2fe; border-color: #0284c7; }
    .sw.f { background: #ede9fe; border-color: #7c3aed; }
    .sw.r { background: #fff7ed; border-style: dashed; border-color: #c2410c; }
    svg { width: 100%; height: auto; display: block; background: #fff; border-radius: 12px; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <div class="page">
    <h1>全渠道管报</h1>
    <div class="legend" aria-label="图例">
      <span><i class="sw d"></i>直连</span>
      <span><i class="sw f"></i>公式</span>
      <span><i class="sw r"></i>12月占比</span>
    </div>

    <!-- viewBox: 主图 收入→费用栈→毛利 -->
    <svg viewBox="0 0 1200 960" role="img" aria-label="费用项与合并关系">
      <defs>
        <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
        </marker>
        <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/>
        </marker>
        <filter id="sh" x="-5%" y="-5%" width="110%" height="110%">
          <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-opacity="0.12"/>
        </filter>
      </defs>


      <!-- 销售额 -->
      <g filter="url(#sh)">
        <rect x="24" y="44" width="100" height="40" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
        <text x="74" y="70" text-anchor="middle" font-size="11" fill="#1e3a8a">销售额</text>
      </g>
      <line x1="124" y1="64" x2="148" y2="64" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

      <!-- 扣减栈 → 收入净额 -->
      <g>
        <rect x="148" y="40" width="88" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="192" y="56" text-anchor="middle" font-size="9.5" fill="#0c4a6e">折扣</text>
        <rect x="148" y="66" width="88" height="22" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="192" y="82" text-anchor="middle" font-size="9.5" fill="#4c1d95">直接扣减折扣</text>
        <path d="M236 52 L252 52 M236 76 L252 76" stroke="#94a3b8"/>
        <text x="258" y="58" font-size="9" fill="#64748b">+</text>
        <rect x="148" y="92" width="88" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="192" y="108" text-anchor="middle" font-size="9.5" fill="#0c4a6e">销售退款</text>
        <rect x="148" y="118" width="88" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="192" y="134" text-anchor="middle" font-size="9.5" fill="#0c4a6e">销售税/VAT</text>
        <path d="M192 140 L192 158" stroke="#64748b" stroke-width="1.5"/>
        <polygon points="192,168 182,158 202,158" fill="#64748b"/>
        <rect x="136" y="170" width="112" height="32" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
        <text x="192" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">收入净额</text>
      </g>

      <line x1="248" y1="186" x2="288" y2="186" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>

      <!-- 收入净额大框作为费用扣减起点 -->
      <g filter="url(#sh)">
        <rect x="288" y="160" width="110" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
        <text x="343" y="195" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">收入净额</text>
      </g>


      <!-- 五列费用栈 -->
      <!-- 列1 货值 -->
      <g transform="translate(24,268)">
        <rect x="0" y="0" width="100" height="26" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="50" y="18" text-anchor="middle" font-size="10" fill="#4c1d95">发货成本</text>
        <rect x="0" y="32" width="100" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="50" y="50" text-anchor="middle" font-size="10" fill="#0c4a6e">退货成本</text>
        <rect x="0" y="64" width="100" height="26" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 2"/>
        <text x="50" y="82" text-anchor="middle" font-size="9.5" fill="#9a3412">平台赔偿</text>
        <line x1="50" y1="90" x2="50" y2="108" stroke="#64748b" stroke-width="1.5"/>
        <polygon points="50,118 40,108 60,108" fill="#64748b"/>
        <rect x="-4" y="120" width="108" height="34" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="50" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">货值成本净额</text>
      </g>

      <!-- 列2 广告宣传 -->
      <g transform="translate(148,268)">
        <rect x="0" y="0" width="100" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="50" y="18" text-anchor="middle" font-size="10" fill="#0c4a6e">广告费</text>
        <rect x="0" y="32" width="100" height="26" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 2"/>
        <text x="50" y="50" text-anchor="middle" font-size="9.5" fill="#9a3412">推广费</text>
        <rect x="0" y="64" width="100" height="26" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 2"/>
        <text x="50" y="82" text-anchor="middle" font-size="9.5" fill="#9a3412">样品费</text>
        <line x1="50" y1="90" x2="50" y2="108" stroke="#64748b" stroke-width="1.5"/>
        <polygon points="50,118 40,108 60,108" fill="#64748b"/>
        <rect x="-4" y="120" width="108" height="34" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="50" y="142" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">广告宣传小计</text>
      </g>

      <!-- 列3 物流 -->
      <g transform="translate(272,268)">
        <rect x="0" y="0" width="100" height="22" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="50" y="15" text-anchor="middle" font-size="9.5" fill="#4c1d95">头程</text>
        <rect x="0" y="26" width="100" height="22" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="50" y="41" text-anchor="middle" font-size="9" fill="#9a3412">尾程/FBA</text>
        <rect x="0" y="52" width="100" height="22" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="50" y="67" text-anchor="middle" font-size="9" fill="#9a3412">退货运费</text>
        <rect x="0" y="78" width="100" height="22" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="50" y="93" text-anchor="middle" font-size="9" fill="#9a3412">仓储费</text>
        <rect x="0" y="104" width="100" height="22" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="50" y="119" text-anchor="middle" font-size="9.5" fill="#4c1d95">关税</text>
        <line x1="50" y1="126" x2="50" y2="138" stroke="#64748b" stroke-width="1.5"/>
        <polygon points="50,148 40,138 60,138" fill="#64748b"/>
        <rect x="-4" y="150" width="108" height="34" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="50" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">物流成本小计</text>
      </g>

      <!-- 列4 交易及平台 -->
      <g transform="translate(396,268)">
        <rect x="0" y="0" width="108" height="24" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="54" y="16" text-anchor="middle" font-size="9.5" fill="#4c1d95">FBA佣金</text>
        <rect x="0" y="30" width="108" height="24" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="54" y="46" text-anchor="middle" font-size="9" fill="#9a3412">平台服务费</text>
        <rect x="0" y="60" width="108" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="54" y="76" text-anchor="middle" font-size="9.5" fill="#0c4a6e">收单费用</text>
        <rect x="0" y="90" width="108" height="24" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="54" y="106" text-anchor="middle" font-size="9" fill="#9a3412">店铺费用</text>
        <rect x="0" y="120" width="108" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="54" y="136" text-anchor="middle" font-size="9.5" fill="#0c4a6e">佣金费</text>
        <line x1="54" y1="144" x2="54" y2="156" stroke="#64748b" stroke-width="1.5"/>
        <polygon points="54,166 44,156 64,156" fill="#64748b"/>
        <rect x="-4" y="168" width="116" height="34" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="54" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">交易及平台费用小计</text>
      </g>

      <!-- 列5 运杂费 -->
      <g transform="translate(532,268)">
        <rect x="0" y="0" width="100" height="36" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="50" y="23" text-anchor="middle" font-size="10" fill="#9a3412">运杂费</text>
        <line x1="50" y1="36" x2="50" y2="52" stroke="#64748b" stroke-width="1.5"/>
        <polygon points="50,62 40,52 60,52" fill="#64748b"/>
        <rect x="-4" y="64" width="108" height="34" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="50" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">（单项）</text>
      </g>

      <!-- 从收入净额引向各栈的扣减弧线 -->
      <path d="M343 220 C343 240 74 240 74 262" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M343 220 C343 245 198 245 198 262" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M343 220 C343 250 322 250 322 262" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M343 220 C343 252 450 252 450 262" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
      <path d="M343 220 C343 248 582 248 582 262" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>

      <!-- 小计横向合并 → 扣减带 -->

      <g transform="translate(24,512)">
        <rect x="0" y="0" width="120" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="60" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">货值成本净额</text>
        <rect x="136" y="0" width="120" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="196" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">广告宣传小计</text>
        <rect x="272" y="0" width="120" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="332" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">物流成本小计</text>
        <rect x="408" y="0" width="140" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="478" y="26" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">交易及平台费用小计</text>
        <rect x="564" y="0" width="88" height="40" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
        <text x="608" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">运杂费</text>
      </g>

      <text x="360" y="582" font-size="28" fill="#64748b" font-weight="300">−</text>
      <line x1="343" y1="560" x2="343" y2="600" stroke="#64748b" stroke-width="1.5"/>
      <line x1="74" y1="560" x2="632" y2="560" stroke="#cbd5e1" stroke-width="1"/>

      <g transform="translate(280,600)" filter="url(#sh)">
        <rect x="0" y="0" width="200" height="44" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
        <text x="100" y="29" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">预留毛利</text>
      </g>

      <line x1="380" y1="644" x2="380" y2="668" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>

      <g transform="translate(280,676)" filter="url(#sh)">
        <rect x="0" y="0" width="200" height="48" rx="10" fill="#bbf7d0" stroke="#15803d" stroke-width="2.5"/>
        <text x="100" y="32" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">毛利</text>
      </g>

      <!-- 叉：去掉的项 -->
      <g transform="translate(900,268)" opacity="0.85">
        <line x1="0" y1="0" x2="260" y2="0" stroke="#cbd5e1"/>
        <rect x="0" y="36" width="120" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="60" y="60" text-anchor="middle" font-size="10" fill="#64748b">边际贡献额</text>
        <line x1="10" y1="42" x2="110" y2="78" stroke="#ef4444" stroke-width="2"/>
        <line x1="110" y1="42" x2="10" y2="78" stroke="#ef4444" stroke-width="2"/>
        <rect x="140" y="36" width="120" height="36" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="200" y="60" text-anchor="middle" font-size="10" fill="#64748b">其他费用</text>
        <line x1="150" y1="42" x2="250" y2="78" stroke="#ef4444" stroke-width="2"/>
        <line x1="250" y1="42" x2="150" y2="78" stroke="#ef4444" stroke-width="2"/>
      </g>

      <!-- 占比引擎小图 -->
      <g transform="translate(900,432)">
        <rect x="0" y="0" width="88" height="32" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="44" y="21" text-anchor="middle" font-size="9.5" fill="#9a3412">店铺</text>
        <text x="96" y="22" font-size="14" fill="#64748b">+</text>
        <rect x="112" y="0" width="88" height="32" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="156" y="21" text-anchor="middle" font-size="9.5" fill="#9a3412">渠道</text>
        <text x="208" y="22" font-size="14" fill="#64748b">+</text>
        <rect x="224" y="0" width="88" height="32" rx="5" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="268" y="21" text-anchor="middle" font-size="9.5" fill="#9a3412">费用项</text>
        <line x1="156" y1="40" x2="156" y2="54" stroke="#64748b"/>
        <polygon points="156,64 146,54 166,54" fill="#64748b"/>
        <rect x="100" y="68" width="112" height="36" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
        <text x="156" y="91" text-anchor="middle" font-size="10" font-weight="700" fill="#9a3412">近12月占比</text>
        <line x1="156" y1="104" x2="156" y2="120" stroke="#2563eb" marker-end="url(#arrB)"/>
        <rect x="92" y="124" width="128" height="36" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
        <text x="156" y="147" text-anchor="middle" font-size="10" fill="#0c4a6e">× 当期基数</text>
      </g>

      <!-- 页面模块：极简方框 -->
      <g transform="translate(24,808)">
        <rect x="0" y="0" width="130" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="65" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">驾驶舱</text>
        <rect x="146" y="0" width="130" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="211" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">渠道</text>
        <rect x="292" y="0" width="130" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="357" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">店铺·SKU</text>
        <rect x="438" y="0" width="130" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="503" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">费用血缘</text>
        <rect x="584" y="0" width="130" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
        <text x="649" y="28" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">口径</text>
      </g>

      <text x="24" y="900" font-size="9" fill="#cbd5e1">v1.1</text>
    </svg>
  </div>
</body>
</html>
