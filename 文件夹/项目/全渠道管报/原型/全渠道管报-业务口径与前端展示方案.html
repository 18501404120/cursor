<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全渠道管报 · 图形方案</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef1f8; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    .page { max-width: 900px; margin: 0 auto; padding: 12px 10px 32px; }
    h1 { margin: 0 0 8px; font-size: 1rem; font-weight: 700; color: #0f172a; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-bottom: 8px; font-size: 11px; color: #475569; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .sw { width: 14px; height: 14px; border-radius: 3px; border: 2px solid #334155; }
    .sw.d { background: #e0f2fe; border-color: #0284c7; }
    .sw.f { background: #ede9fe; border-color: #7c3aed; }
    .sw.r { background: #fff7ed; border-style: dashed; border-color: #c2410c; }
    svg { width: 100%; height: auto; display: block; background: #fff; border-radius: 12px; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>
  <div class="page">
    <h1>全渠道管报</h1>
    <div class="legend" aria-label="图例">
      <span><i class="sw d"></i>直连</span>
      <span><i class="sw f"></i>公式</span>
      <span><i class="sw r"></i>12月占比</span>
    </div>

    <svg viewBox="0 0 800 860" role="img" aria-label="营收与毛利计算路径">
      <defs>
        <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker>
        <marker id="arrB" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0891b2"/></marker>
        <marker id="arrG" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#15803d"/></marker>
        <filter id="sh" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.1"/></filter>
      </defs>

      <!-- ========== 营收区 ========== -->
      <rect x="8" y="8" width="784" height="208" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2" opacity="0.95"/>
      <text x="22" y="30" font-size="14" font-weight="800" fill="#0e7490">营收</text>

      <g filter="url(#sh)">
        <rect x="24" y="52" width="96" height="38" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
        <text x="72" y="76" text-anchor="middle" font-size="11" fill="#1e3a8a">销售额</text>
      </g>
      <line x1="120" y1="71" x2="138" y2="71" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

      <g>
        <rect x="138" y="48" width="86" height="20" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="181" y="62" text-anchor="middle" font-size="9" fill="#0c4a6e">折扣</text>
        <rect x="138" y="72" width="86" height="20" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="181" y="86" text-anchor="middle" font-size="9" fill="#4c1d95">直接扣减折扣</text>
        <rect x="138" y="96" width="86" height="20" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="181" y="110" text-anchor="middle" font-size="9" fill="#0c4a6e">销售退款</text>
        <rect x="138" y="120" width="86" height="20" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="181" y="134" text-anchor="middle" font-size="9" fill="#0c4a6e">销售税/VAT</text>
        <path d="M181 140 L181 152" stroke="#64748b" stroke-width="1.5"/>
        <polygon points="181,160 174,152 188,152" fill="#64748b"/>
        <rect x="128" y="162" width="106" height="30" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
        <text x="181" y="182" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1e3a8a">收入净额</text>
      </g>

      <line x1="234" y1="177" x2="258" y2="177" stroke="#0891b2" stroke-width="2.5" marker-end="url(#arrB)"/>
      <g filter="url(#sh)">
        <rect x="258" y="154" width="104" height="46" rx="8" fill="#a5f3fc" stroke="#0e7490" stroke-width="2.5"/>
        <text x="310" y="184" text-anchor="middle" font-size="12" font-weight="800" fill="#155e75">营收</text>
      </g>

      <!-- 营收区 → 毛利区 衔接 -->
      <path d="M181 192 L181 228" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arrB)"/>

      <!-- ========== 毛利区 ========== -->
      <rect x="8" y="228" width="784" height="618" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" opacity="0.95"/>
      <text x="22" y="252" font-size="14" font-weight="800" fill="#166534">毛利</text>

      <g filter="url(#sh)">
        <rect x="126" y="262" width="110" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="181" y="288" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">收入净额</text>
      </g>

      <!-- 五列费用栈 -->
      <g transform="translate(20,318)">
        <rect x="0" y="0" width="92" height="24" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="46" y="16" text-anchor="middle" font-size="9" fill="#4c1d95">发货成本</text>
        <rect x="0" y="28" width="92" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="46" y="44" text-anchor="middle" font-size="9" fill="#0c4a6e">退货成本</text>
        <rect x="0" y="56" width="92" height="24" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="46" y="72" text-anchor="middle" font-size="8.5" fill="#9a3412">平台赔偿</text>
        <line x1="46" y1="80" x2="46" y2="90" stroke="#64748b"/>
        <polygon points="46,98 39,90 53,90" fill="#64748b"/>
        <rect x="-3" y="100" width="98" height="28" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
        <text x="46" y="118" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">货值成本净额</text>
      </g>
      <g transform="translate(128,318)">
        <rect x="0" y="0" width="92" height="24" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="46" y="16" text-anchor="middle" font-size="9" fill="#0c4a6e">广告费</text>
        <rect x="0" y="28" width="92" height="24" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="46" y="44" text-anchor="middle" font-size="8.5" fill="#9a3412">推广费</text>
        <rect x="0" y="56" width="92" height="24" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="46" y="72" text-anchor="middle" font-size="8.5" fill="#9a3412">样品费</text>
        <line x1="46" y1="80" x2="46" y2="90" stroke="#64748b"/>
        <polygon points="46,98 39,90 53,90" fill="#64748b"/>
        <rect x="-3" y="100" width="98" height="28" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
        <text x="46" y="118" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">广告宣传小计</text>
      </g>
      <g transform="translate(236,318)">
        <rect x="0" y="0" width="92" height="20" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="46" y="14" text-anchor="middle" font-size="8.5" fill="#4c1d95">头程</text>
        <rect x="0" y="24" width="92" height="20" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="46" y="38" text-anchor="middle" font-size="8" fill="#9a3412">尾程/FBA</text>
        <rect x="0" y="48" width="92" height="20" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="46" y="62" text-anchor="middle" font-size="8" fill="#9a3412">退货运费</text>
        <rect x="0" y="72" width="92" height="20" rx="3" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="46" y="86" text-anchor="middle" font-size="8" fill="#9a3412">仓储费</text>
        <rect x="0" y="96" width="92" height="20" rx="3" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="46" y="110" text-anchor="middle" font-size="8.5" fill="#4c1d95">关税</text>
        <line x1="46" y1="116" x2="46" y2="124" stroke="#64748b"/>
        <polygon points="46,132 39,124 53,124" fill="#64748b"/>
        <rect x="-3" y="134" width="98" height="28" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
        <text x="46" y="152" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">物流成本小计</text>
      </g>
      <g transform="translate(344,318)">
        <rect x="0" y="0" width="100" height="22" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="50" y="15" text-anchor="middle" font-size="8.5" fill="#4c1d95">FBA佣金</text>
        <rect x="0" y="26" width="100" height="22" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="50" y="41" text-anchor="middle" font-size="8" fill="#9a3412">平台服务费</text>
        <rect x="0" y="52" width="100" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="50" y="67" text-anchor="middle" font-size="8.5" fill="#0c4a6e">收单费用</text>
        <rect x="0" y="78" width="100" height="22" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="50" y="93" text-anchor="middle" font-size="8" fill="#9a3412">店铺费用</text>
        <rect x="0" y="104" width="100" height="22" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
        <text x="50" y="119" text-anchor="middle" font-size="8.5" fill="#0c4a6e">佣金费</text>
        <line x1="50" y1="126" x2="50" y2="134" stroke="#64748b"/>
        <polygon points="50,142 43,134 57,134" fill="#64748b"/>
        <rect x="-4" y="144" width="108" height="28" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
        <text x="50" y="162" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">交易及平台费用小计</text>
      </g>
      <g transform="translate(464,318)">
        <rect x="0" y="0" width="92" height="36" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="4 2"/>
        <text x="46" y="23" text-anchor="middle" font-size="9" fill="#9a3412">运杂费</text>
        <line x1="46" y1="36" x2="46" y2="46" stroke="#64748b"/>
        <polygon points="46,54 39,46 53,46" fill="#64748b"/>
        <rect x="-3" y="56" width="98" height="28" rx="5" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
        <text x="46" y="74" text-anchor="middle" font-size="9.5" font-weight="700" fill="#334155">小计</text>
      </g>

      <!-- 自收入净额到各列 -->
      <path d="M181 302 C181 310 66 310 66 318" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M181 302 C181 310 174 310 174 318" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M181 302 C181 310 282 310 282 318" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M181 302 C181 310 394 310 394 318" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M181 302 C181 310 510 310 510 318" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>

      <!-- 小计横排 → 预留毛利 → 毛利 -->
      <g transform="translate(40,500)">
        <rect x="0" y="0" width="100" height="36" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
        <text x="50" y="23" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">货值成本净额</text>
        <rect x="112" y="0" width="100" height="36" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
        <text x="162" y="23" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">广告宣传小计</text>
        <rect x="224" y="0" width="100" height="36" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
        <text x="274" y="23" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">物流成本小计</text>
        <rect x="336" y="0" width="118" height="36" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
        <text x="395" y="23" text-anchor="middle" font-size="8.5" font-weight="700" fill="#334155">交易及平台费用小计</text>
        <rect x="468" y="0" width="88" height="36" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.8"/>
        <text x="512" y="23" text-anchor="middle" font-size="9" font-weight="700" fill="#334155">运杂费</text>
      </g>

      <line x1="181" y1="480" x2="181" y2="492" stroke="#64748b" stroke-width="1.2"/>
      <line x1="66" y1="468" x2="556" y2="468" stroke="#cbd5e1" stroke-width="1"/>
      <text x="600" y="472" font-size="20" fill="#64748b">−</text>

      <line x1="181" y1="302" x2="181" y2="500" stroke="#16a34a" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>

      <g transform="translate(300,556)" filter="url(#sh)">
        <rect x="0" y="0" width="200" height="42" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
        <text x="100" y="27" text-anchor="middle" font-size="11.5" font-weight="800" fill="#854d0e">预留毛利</text>
      </g>
      <line x1="400" y1="598" x2="400" y2="612" stroke="#15803d" stroke-width="2" marker-end="url(#arrG)"/>
      <g transform="translate(300,618)" filter="url(#sh)">
        <rect x="0" y="0" width="200" height="46" rx="10" fill="#86efac" stroke="#15803d" stroke-width="2.5"/>
        <text x="100" y="31" text-anchor="middle" font-size="13" font-weight="800" fill="#14532d">毛利</text>
      </g>

      <text x="22" y="820" font-size="9" fill="#cbd5e1">v1.2</text>
    </svg>
  </div>
</body>
</html>
