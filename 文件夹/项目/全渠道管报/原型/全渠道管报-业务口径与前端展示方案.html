<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全渠道管报 · 图形方案</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(165deg, #eef2f9 0%, #e8f0fc 100%); font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    .page { max-width: 960px; margin: 0 auto; padding: 20px 14px 40px; }
    h1 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 700; color: #0f172a; letter-spacing: 0.02em; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-bottom: 14px; font-size: 11px; color: #475569; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .sw { width: 13px; height: 13px; border-radius: 4px; border: 2px solid #334155; }
    .sw.d { background: #e0f2fe; border-color: #0284c7; }
    .sw.f { background: #ede9fe; border-color: #7c3aed; }
    .sw.r { background: #fff7ed; border-style: dashed; border-color: #c2410c; }
    .svg-wrap {
      border-radius: 20px;
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
      overflow: hidden;
    }
    svg { width: 100%; height: auto; display: block; }
  </style>
</head>
<body>
  <div class="page">
    <h1>全渠道管报</h1>
    <div class="legend" aria-label="图例">
      <span><i class="sw d"></i>直连</span>
      <span><i class="sw f"></i>公式</span>
      <span><i class="sw r"></i>12月占比</span>
    </div>
    <div class="svg-wrap">
    <svg viewBox="0 0 820 900" role="img" aria-label="营收与毛利嵌套结构">
      <defs>
        <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#94a3b8"/></marker>
        <marker id="arrC" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#0ea5e9"/></marker>
        <marker id="arrG" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#16a34a"/></marker>
        <filter id="card" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/></filter>
        <filter id="lift" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-opacity="0.09"/></filter>
        <linearGradient id="chipRev" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ecfeff"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
        <linearGradient id="chipGp" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0fdf4"/><stop offset="100%" stop-color="#ecfdf5"/></linearGradient>
      </defs>

      <!-- ===== 营收：外层白卡片（无粗色框）+ 内套 ===== -->
      <g filter="url(#card)">
        <rect x="14" y="14" width="792" height="218" rx="22" fill="#ffffff" stroke="#e8edf5" stroke-width="1"/>
      </g>
      <rect x="28" y="26" width="86" height="28" rx="8" fill="url(#chipRev)" stroke="#a5f3fc" stroke-width="1"/>
      <text x="71" y="45" text-anchor="middle" font-size="12" font-weight="800" fill="#0e7490">营收</text>

      <!-- 内层：流水区 -->
      <rect x="28" y="62" width="764" height="154" rx="16" fill="#fafdff" stroke="#bae6fd" stroke-width="1.25"/>
      <g filter="url(#lift)">
        <rect x="44" y="82" width="98" height="40" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.75"/>
        <text x="93" y="107" text-anchor="middle" font-size="11" font-weight="700" fill="#1e3a8a">销售额</text>
      </g>
      <line x1="142" y1="102" x2="158" y2="102" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

      <!-- 扣减：再套一层浅框 -->
      <rect x="158" y="76" width="118" height="124" rx="12" fill="#ffffff" stroke="#e0f2fe" stroke-width="1.5"/>
      <rect x="168" y="86" width="98" height="22" rx="5" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.25"/>
      <text x="217" y="101" text-anchor="middle" font-size="9" fill="#0369a1">折扣</text>
      <rect x="168" y="112" width="98" height="22" rx="5" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.25"/>
      <text x="217" y="127" text-anchor="middle" font-size="8.5" fill="#5b21b6">直接扣减折扣</text>
      <rect x="168" y="138" width="98" height="22" rx="5" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.25"/>
      <text x="217" y="153" text-anchor="middle" font-size="9" fill="#0369a1">销售退款</text>
      <rect x="168" y="164" width="98" height="22" rx="5" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.25"/>
      <text x="217" y="179" text-anchor="middle" font-size="9" fill="#0369a1">销售税/VAT</text>
      <path d="M217 186 L217 196" stroke="#94a3b8" stroke-width="1.5"/>
      <polygon points="217,204 210,196 224,196" fill="#94a3b8"/>
      <rect x="162" y="206" width="110" height="32" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="217" y="227" text-anchor="middle" font-size="10.5" font-weight="800" fill="#1d4ed8">收入净额</text>

      <line x1="276" y1="222" x2="298" y2="222" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#arrC)"/>
      <g filter="url(#lift)">
        <rect x="298" y="198" width="112" height="52" rx="12" fill="#67e8f9" fill-opacity="0.35" stroke="#0891b2" stroke-width="2"/>
        <text x="354" y="231" text-anchor="middle" font-size="13" font-weight="800" fill="#155e75">营收</text>
      </g>

      <path d="M217 238 Q300 285 410 324" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrC)"/>

      <!-- ===== 毛利：外层白卡片 + 多层内套 ===== -->
      <g filter="url(#card)">
        <rect x="14" y="276" width="792" height="598" rx="22" fill="#ffffff" stroke="#e8edf5" stroke-width="1"/>
      </g>
      <rect x="28" y="288" width="86" height="28" rx="8" fill="url(#chipGp)" stroke="#bbf7d0" stroke-width="1"/>
      <text x="71" y="307" text-anchor="middle" font-size="12" font-weight="800" fill="#166534">毛利</text>

      <!-- 内层1：起点 -->
      <rect x="28" y="324" width="764" height="58" rx="14" fill="#fafefa" stroke="#d1fae5" stroke-width="1.25"/>
      <g filter="url(#lift)">
        <rect x="352" y="334" width="116" height="40" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
        <text x="410" y="359" text-anchor="middle" font-size="11" font-weight="800" fill="#1d4ed8">收入净额</text>
      </g>

      <!-- 内层2：五列费用（大套盒） -->
      <rect x="28" y="392" width="764" height="228" rx="16" fill="#fafffe" stroke="#bbf7d0" stroke-width="1.25"/>

      <g transform="translate(40,422)">
        <rect x="0" y="0" width="100" height="178" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
        <rect x="10" y="12" width="80" height="24" rx="5" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.25"/>
        <text x="50" y="28" text-anchor="middle" font-size="9" fill="#5b21b6">发货成本</text>
        <rect x="10" y="42" width="80" height="24" rx="5" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.25"/>
        <text x="50" y="58" text-anchor="middle" font-size="9" fill="#0369a1">退货成本</text>
        <rect x="10" y="72" width="80" height="24" rx="5" fill="#fffbeb" stroke="#ea580c" stroke-dasharray="3 2"/>
        <text x="50" y="88" text-anchor="middle" font-size="8.5" fill="#c2410c">平台赔偿</text>
        <line x1="50" y1="98" x2="50" y2="108" stroke="#cbd5e1"/>
        <polygon points="50,116 44,108 56,108" fill="#94a3b8"/>
        <rect x="6" y="118" width="88" height="30" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
        <text x="50" y="137" text-anchor="middle" font-size="9" font-weight="800" fill="#334155">货值成本净额</text>
      </g>
      <g transform="translate(152,422)">
        <rect x="0" y="0" width="100" height="178" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
        <rect x="10" y="12" width="80" height="24" rx="5" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.25"/>
        <text x="50" y="28" text-anchor="middle" font-size="9" fill="#0369a1">广告费</text>
        <rect x="10" y="42" width="80" height="24" rx="5" fill="#fffbeb" stroke="#ea580c" stroke-dasharray="3 2"/>
        <text x="50" y="58" text-anchor="middle" font-size="8.5" fill="#c2410c">推广费</text>
        <rect x="10" y="72" width="80" height="24" rx="5" fill="#fffbeb" stroke="#ea580c" stroke-dasharray="3 2"/>
        <text x="50" y="88" text-anchor="middle" font-size="8.5" fill="#c2410c">样品费</text>
        <line x1="50" y1="98" x2="50" y2="108" stroke="#cbd5e1"/>
        <polygon points="50,116 44,108 56,108" fill="#94a3b8"/>
        <rect x="6" y="118" width="88" height="30" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
        <text x="50" y="137" text-anchor="middle" font-size="9" font-weight="800" fill="#334155">广告宣传小计</text>
      </g>
      <g transform="translate(264,422)">
        <rect x="0" y="0" width="100" height="178" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
        <rect x="10" y="10" width="80" height="20" rx="4" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.25"/>
        <text x="50" y="24" text-anchor="middle" font-size="8.5" fill="#5b21b6">头程</text>
        <rect x="10" y="34" width="80" height="20" rx="4" fill="#fffbeb" stroke="#ea580c" stroke-dasharray="3 2"/>
        <text x="50" y="48" text-anchor="middle" font-size="8" fill="#c2410c">尾程/FBA</text>
        <rect x="10" y="58" width="80" height="20" rx="4" fill="#fffbeb" stroke="#ea580c" stroke-dasharray="3 2"/>
        <text x="50" y="72" text-anchor="middle" font-size="8" fill="#c2410c">退货运费</text>
        <rect x="10" y="82" width="80" height="20" rx="4" fill="#fffbeb" stroke="#ea580c" stroke-dasharray="3 2"/>
        <text x="50" y="96" text-anchor="middle" font-size="8" fill="#c2410c">仓储费</text>
        <rect x="10" y="102" width="80" height="20" rx="4" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.25"/>
        <text x="50" y="116" text-anchor="middle" font-size="8.5" fill="#5b21b6">关税</text>
        <line x1="50" y1="124" x2="50" y2="132" stroke="#cbd5e1"/>
        <polygon points="50,140 44,132 56,132" fill="#94a3b8"/>
        <rect x="6" y="142" width="88" height="30" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
        <text x="50" y="161" text-anchor="middle" font-size="9" font-weight="800" fill="#334155">物流成本小计</text>
      </g>
      <g transform="translate(376,422)">
        <rect x="0" y="0" width="108" height="178" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
        <rect x="9" y="10" width="90" height="22" rx="5" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.25"/>
        <text x="54" y="25" text-anchor="middle" font-size="8.5" fill="#5b21b6">FBA佣金</text>
        <rect x="9" y="36" width="90" height="22" rx="5" fill="#fffbeb" stroke="#ea580c" stroke-dasharray="3 2"/>
        <text x="54" y="51" text-anchor="middle" font-size="8" fill="#c2410c">平台服务费</text>
        <rect x="9" y="62" width="90" height="22" rx="5" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.25"/>
        <text x="54" y="77" text-anchor="middle" font-size="8.5" fill="#0369a1">收单费用</text>
        <rect x="9" y="88" width="90" height="22" rx="5" fill="#fffbeb" stroke="#ea580c" stroke-dasharray="3 2"/>
        <text x="54" y="103" text-anchor="middle" font-size="8" fill="#c2410c">店铺费用</text>
        <rect x="9" y="114" width="90" height="22" rx="5" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.25"/>
        <text x="54" y="129" text-anchor="middle" font-size="8.5" fill="#0369a1">佣金费</text>
        <line x1="54" y1="138" x2="54" y2="146" stroke="#cbd5e1"/>
        <polygon points="54,154 48,146 60,146" fill="#94a3b8"/>
        <rect x="4" y="156" width="100" height="30" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
        <text x="54" y="175" text-anchor="middle" font-size="8.5" font-weight="800" fill="#334155">交易及平台费用小计</text>
      </g>
      <g transform="translate(496,422)">
        <rect x="0" y="0" width="100" height="178" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
        <rect x="10" y="40" width="80" height="36" rx="6" fill="#fffbeb" stroke="#ea580c" stroke-dasharray="3 2"/>
        <text x="50" y="63" text-anchor="middle" font-size="9.5" fill="#c2410c">运杂费</text>
        <line x1="50" y1="78" x2="50" y2="88" stroke="#cbd5e1"/>
        <polygon points="50,96 44,88 56,88" fill="#94a3b8"/>
        <rect x="6" y="98" width="88" height="30" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
        <text x="50" y="117" text-anchor="middle" font-size="9" font-weight="800" fill="#334155">小计</text>
      </g>

      <!-- 连线：收入净额 → 五列 -->
      <path d="M410 382 C410 400 90 400 90 422" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M410 382 C410 400 202 400 202 422" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M410 382 C410 400 314 400 314 422" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M410 382 C410 400 430 400 430 422" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="M410 382 C410 400 546 400 546 422" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 2"/>

      <!-- 内层3：汇总扣减 -->
      <rect x="28" y="632" width="764" height="64" rx="14" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.25"/>
      <g transform="translate(44,658)">
        <rect x="0" y="0" width="102" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
        <text x="51" y="22" text-anchor="middle" font-size="8.5" font-weight="800" fill="#374151">货值成本净额</text>
        <rect x="114" y="0" width="102" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
        <text x="165" y="22" text-anchor="middle" font-size="8.5" font-weight="800" fill="#374151">广告宣传小计</text>
        <rect x="228" y="0" width="102" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
        <text x="279" y="22" text-anchor="middle" font-size="8.5" font-weight="800" fill="#374151">物流成本小计</text>
        <rect x="342" y="0" width="120" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
        <text x="402" y="22" text-anchor="middle" font-size="8" font-weight="800" fill="#374151">交易及平台费用小计</text>
        <rect x="474" y="0" width="90" height="34" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.25"/>
        <text x="519" y="22" text-anchor="middle" font-size="8.5" font-weight="800" fill="#374151">运杂费</text>
      </g>
      <text x="630" y="688" font-size="22" fill="#9ca3af" font-weight="300">−</text>

      <line x1="410" y1="600" x2="410" y2="632" stroke="#d1d5db" stroke-width="1.2"/>

      <!-- 内层4：结果 -->
      <rect x="28" y="712" width="764" height="138" rx="16" fill="#fffef8" stroke="#fde68a" stroke-width="1" fill-opacity="1"/>
      <g filter="url(#lift)">
        <rect x="310" y="728" width="200" height="44" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
        <text x="410" y="756" text-anchor="middle" font-size="12" font-weight="800" fill="#854d0e">预留毛利</text>
      </g>
      <line x1="410" y1="772" x2="410" y2="786" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrG)"/>
      <g filter="url(#lift)">
        <rect x="310" y="792" width="200" height="48" rx="14" fill="#86efac" fill-opacity="0.55" stroke="#15803d" stroke-width="2.25"/>
        <text x="410" y="822" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">毛利</text>
      </g>

      <text x="28" y="888" font-size="9" fill="#d1d5db">v1.3</text>
    </svg>
    </div>
  </div>
</body>
</html>
