<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>全渠道产品分析看板</title>
  <style>
    :root {
      --page-bg: #f0f2f5;
      --panel: #ffffff;
      --line: #e8edf3;
      --text: rgba(0, 0, 0, 0.88);
      --text-sub: rgba(0, 0, 0, 0.45);
      --blue: #1677ff;
      --nav: #001529;
      --green: #22c55e;
      --red: #ef4444;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      --head-bg: #fafafa;
      --pivot-w-first: 140px;
      --pivot-w-cur: 72px;
      --pivot-w-yoy: 104px;
      --pivot-w-cmp: 104px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--page-bg);
    }
    .layout { display: flex; min-height: 100vh; }
    .sider {
      width: 56px;
      flex-shrink: 0;
      background: var(--nav);
      border-right: 1px solid #002140;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 0;
    }
    .sider-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #69b1ff, #2f54eb);
      margin-bottom: 8px;
      position: relative;
    }
    .sider-logo::after {
      content: "全";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }
    .sider-item {
      width: 40px;
      min-height: 40px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.65);
      font-size: 11px;
      line-height: 1.15;
      text-align: center;
      padding: 3px;
    }
    .sider-item.active {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .header {
      height: 48px;
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      box-shadow: 0 1px 4px rgba(0, 21, 41, 0.12);
    }
    .header .title { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
    .header .meta { display: flex; align-items: center; gap: 12px; font-size: 12px; opacity: 0.95; flex-wrap: wrap; justify-content: flex-end; }
    .page { flex: 1; overflow: auto; padding: 16px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      background: linear-gradient(180deg, #fafafa 0%, #fff 100%);
      gap: 12px;
      flex-wrap: wrap;
    }
    .panel-title { font-size: 14px; font-weight: 700; }
    .panel-sub { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
    .panel-body { padding: 12px 16px 14px; }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 16px 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .field label { font-size: 12px; color: #595959; white-space: nowrap; }
    .field input[type="text"] {
      height: 28px;
      min-width: 200px;
      max-width: 280px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      padding: 0 8px;
      font-size: 12px;
      font-family: inherit;
    }
    .field input:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12);
    }
    .compare-row-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .btn {
      height: 28px;
      padding: 0 14px;
      border-radius: 4px;
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn.secondary { background: #fff; color: var(--blue); }
    .btn:hover { opacity: 0.92; }
    .date-mount .drp-trigger {
      min-width: 168px !important;
      max-width: 188px !important;
      font-size: 11px !important;
      padding-left: 26px !important;
      padding-right: 22px !important;
    }
    .table-scroll-wrap {
      overflow: auto;
      max-height: min(58vh, 680px);
      border: 1px solid #f0f0f0;
      border-radius: 8px;
    }
    .data-table {
      width: max-content;
      min-width: 100%;
      border-collapse: collapse;
      border-spacing: 0;
      font-size: 11px;
    }
    .data-table th,
    .data-table td {
      border: 1px solid #f0f0f0;
      padding: 6px 8px;
      text-align: right;
      white-space: nowrap;
    }
    .data-table col.col-first { width: 300px; min-width: 280px; max-width: 400px; }
    .data-table th.metric-grp {
      white-space: normal;
      line-height: 1.25;
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      vertical-align: middle;
      padding: 8px 4px;
    }
    .data-table th.sub-h {
      font-size: 10px;
      font-weight: 600;
      color: #595959;
      text-align: center;
      width: 68px;
      min-width: 68px;
      max-width: 68px;
      box-sizing: border-box;
      padding: 6px 2px;
    }
    .data-table.pivot-table {
      table-layout: fixed;
      width: auto;
      border: 1px solid #c9cdd4;
    }
    .data-table.pivot-table th,
    .data-table.pivot-table td {
      border: 1px solid #c9cdd4;
    }
    .data-table.pivot-table thead th {
      text-align: center;
      vertical-align: middle;
    }
    .data-table.pivot-table tbody td:not(:first-child) {
      text-align: left;
    }
    .data-table.pivot-table th:first-child,
    .data-table.pivot-table td:first-child {
      min-width: var(--pivot-w-first);
      max-width: 200px;
      width: var(--pivot-w-first);
      box-sizing: border-box;
    }
    .data-table.pivot-table td.tri-cur {
      width: var(--pivot-w-cur);
      min-width: var(--pivot-w-cur);
      max-width: var(--pivot-w-cur);
      box-sizing: border-box;
      padding: 5px 6px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      vertical-align: middle;
      line-height: 1.35;
      font-size: 11px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }
    .data-table.pivot-table td.tri-yoy {
      width: var(--pivot-w-yoy);
      min-width: var(--pivot-w-yoy);
      max-width: var(--pivot-w-yoy);
      box-sizing: border-box;
      padding: 5px 6px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      vertical-align: middle;
      line-height: 1.35;
      font-size: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }
    .data-table.pivot-table td.tri-cmp {
      width: var(--pivot-w-cmp);
      min-width: var(--pivot-w-cmp);
      max-width: var(--pivot-w-cmp);
      box-sizing: border-box;
      padding: 5px 6px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      vertical-align: middle;
      line-height: 1.35;
      font-size: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }
    .data-table.pivot-table thead tr.h3 th.sub-h-tri:nth-child(3n + 1) {
      width: var(--pivot-w-cur);
      min-width: var(--pivot-w-cur);
      max-width: var(--pivot-w-cur);
      font-size: 10px;
      font-weight: 600;
      color: #595959;
      text-align: center;
      vertical-align: middle;
      padding: 5px 3px;
      box-sizing: border-box;
      background: #f5f7fa;
      white-space: nowrap;
    }
    .data-table.pivot-table thead tr.h3 th.sub-h-tri:nth-child(3n + 2) {
      width: var(--pivot-w-yoy);
      min-width: var(--pivot-w-yoy);
      max-width: var(--pivot-w-yoy);
      font-size: 10px;
      font-weight: 600;
      color: #595959;
      text-align: center;
      vertical-align: middle;
      padding: 5px 3px;
      box-sizing: border-box;
      background: #f5f7fa;
      white-space: nowrap;
    }
    .data-table.pivot-table thead tr.h3 th.sub-h-tri:nth-child(3n + 3) {
      width: var(--pivot-w-cmp);
      min-width: var(--pivot-w-cmp);
      max-width: var(--pivot-w-cmp);
      font-size: 10px;
      font-weight: 600;
      color: #595959;
      text-align: center;
      vertical-align: middle;
      padding: 5px 3px;
      box-sizing: border-box;
      background: #f5f7fa;
      white-space: nowrap;
    }
    .data-table.pivot-table th.sub-h-ch {
      font-size: 10px;
      font-weight: 600;
      color: #434343;
      text-align: center;
      vertical-align: middle;
      padding: 6px 4px;
      background: #eef2f8;
      white-space: normal;
      line-height: 1.25;
    }
    .data-table.pivot-table th.sku-h1 {
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      background: var(--head-bg);
      border-bottom: 1px solid #c9cdd4;
      vertical-align: middle;
      white-space: normal;
      line-height: 1.35;
      padding: 8px 6px;
      box-sizing: border-box;
    }
    .data-table th:first-child,
    .data-table td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      z-index: 3;
      min-width: 280px;
      max-width: 400px;
    }
    .data-table.pivot-table thead tr.h1 th {
      position: sticky;
      top: 0;
      z-index: 5;
      background: var(--head-bg);
      box-shadow: 0 1px 0 #c9cdd4;
    }
    .data-table.pivot-table thead tr.h1 th.corner-th {
      z-index: 7;
      vertical-align: middle;
      font-size: 12px;
      max-width: none;
      white-space: nowrap;
    }
    .data-table.pivot-table thead tr.h2 th {
      position: sticky;
      top: var(--pivot-sync-h1, 48px);
      z-index: 5;
      background: #eef2f8;
      box-shadow: 0 1px 0 #c9cdd4;
    }
    .data-table.pivot-table thead tr.h3 th {
      position: sticky;
      top: calc(var(--pivot-sync-h1, 48px) + var(--pivot-sync-h2, 52px));
      z-index: 5;
      background: #f5f7fa;
      box-shadow: 0 1px 0 #c9cdd4;
    }
    .data-table tbody td:first-child { background: #fff; }
    .data-table tbody tr.row-target td:first-child { background: #f0f9ff; }
    .data-table tbody tr.row-target td:not(:first-child) { background: #f7fcff; }
    .data-table tbody tr.row-compare td:first-child { background: #fffbf0; }
    .data-table tbody tr.row-compare td:not(:first-child) { background: #fffdf5; }
    .num-pos { color: var(--green); font-weight: 600; }
    .num-neg { color: var(--red); font-weight: 600; }
    .tree-cell { display: flex; align-items: center; gap: 6px; }
    .tree-spacer {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }
    .tree-toggle {
      width: 22px;
      height: 22px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
      color: #595959;
    }
    .tree-toggle:hover { border-color: var(--blue); color: var(--blue); }
    .tree-toggle:disabled {
      visibility: hidden;
      pointer-events: none;
    }
    .tree-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .tree-pad-1 .tree-spacer,
    .tree-pad-1 .tree-toggle { margin-left: 22px; }
    .load-err { font-size: 12px; color: #b91c1c; padding: 8px 0; }
    .table-empty { margin: 0; padding: 12px; font-size: 12px; color: var(--text-sub); }
    .ref-link { color: var(--blue); text-decoration: none; }
    .ref-link:hover { text-decoration: underline; }
    .th-help {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      margin-left: 2px;
      border-radius: 50%;
      border: 1px solid #bfbfbf;
      background: #fafafa;
      color: #8c8c8c;
      font-size: 10px;
      font-weight: 600;
      line-height: 1;
      cursor: help;
      vertical-align: middle;
    }
    .filter-bar-wide {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #f0f0f0;
    }
    .filter-row-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 8px 12px;
      width: 100%;
    }
    .filter-row-actions .field {
      flex-shrink: 0;
      gap: 3px;
    }
    .filter-row-actions .field label {
      white-space: nowrap;
    }
    .filter-row-actions .sku-strip-label {
      flex-shrink: 0;
      line-height: 28px;
    }
    .filter-row-actions .sku-chips {
      flex: 0 1 auto;
      min-width: 0;
      max-width: 100%;
    }
    .filter-row-actions #btnOpenProductModal,
    .filter-row-actions #applyBtn,
    .filter-row-actions #resetBtn {
      flex-shrink: 0;
    }
    .msf-field {
      min-width: 200px;
      max-width: 260px;
      flex: 1 1 200px;
    }
    .msf-field > label {
      display: block;
      font-size: 12px;
      color: #595959;
      margin-bottom: 4px;
    }
    .sku-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e8edf3;
      border-radius: 8px;
      background: linear-gradient(180deg, #fafcff 0%, #fff 100%);
    }
    .sku-strip-label {
      font-size: 12px;
      color: #595959;
      flex-shrink: 0;
    }
    .sku-chips {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .sku-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 4px 8px 4px 10px;
      border-radius: 6px;
      border: 1px solid #d9d9d9;
      background: #fff;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    .sku-chip .nm {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }
    .sku-chip .rm {
      border: none;
      background: #f5f5f5;
      color: #8c8c8c;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      flex-shrink: 0;
    }
    .sku-chip .rm:hover {
      color: var(--red);
      background: #fff1f0;
    }
    .mode-inline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: #434343;
    }
    .mode-inline label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .sku-combo {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
      min-width: 0;
    }
    .sku-combo:focus-within {
      border-color: var(--blue);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12);
    }
    .sku-combo select {
      border: none;
      border-right: 1px solid #d9d9d9;
      background: #fafafa;
      font-size: 12px;
      padding: 0 8px;
      color: #434343;
      min-width: 72px;
      cursor: pointer;
      font-family: inherit;
    }
    .sku-combo select:focus {
      outline: none;
    }
    .sku-combo input {
      border: none;
      min-width: 160px;
      flex: 1;
      padding: 0 8px;
      font-size: 12px;
      font-family: inherit;
    }
    .sku-combo input:focus {
      outline: none;
    }
    .metric-details summary {
      cursor: pointer;
      font-size: 12px;
      color: var(--blue);
      user-select: none;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 6px 14px;
      margin-top: 10px;
      max-height: 220px;
      overflow: auto;
      padding: 4px 2px;
    }
    .metric-grid label {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 12px;
      color: #434343;
      cursor: pointer;
      line-height: 1.35;
    }
    .metric-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 800;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-mask.show {
      display: flex;
    }
    .modal-box {
      width: min(520px, 100%);
      max-height: min(86vh, 640px);
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-hd {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #f0f0f0;
      background: #fafafa;
    }
    .modal-hd .ttl {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
    }
    .modal-close {
      border: none;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: #8c8c8c;
      padding: 4px 6px;
      border-radius: 4px;
    }
    .modal-close:hover {
      color: var(--text);
      background: #f0f0f0;
    }
    .modal-bd {
      padding: 12px 14px;
      overflow: auto;
      flex: 1;
    }
    .modal-ft {
      padding: 10px 14px 12px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      background: #fff;
    }
    .pick-list {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      max-height: 240px;
      overflow: auto;
    }
    .pick-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid #f5f5f5;
      font-size: 12px;
    }
    .pick-list li:last-child {
      border-bottom: none;
    }
    .pick-list li:hover {
      background: #fafafa;
    }
    .data-table tbody tr.row-sku-0 td:first-child {
      background: #f0f9ff;
    }
    .data-table tbody tr.row-sku-0 td:not(:first-child) {
      background: #f7fcff;
    }
    .data-table tbody tr.row-sku-1 td:first-child {
      background: #fffbf0;
    }
    .data-table tbody tr.row-sku-1 td:not(:first-child) {
      background: #fffdf5;
    }
    .data-table tbody tr.row-sku-2 td:first-child {
      background: #f6ffed;
    }
    .data-table tbody tr.row-sku-2 td:not(:first-child) {
      background: #fafff5;
    }
    .data-table tbody tr.row-sku-3 td:first-child {
      background: #faf5ff;
    }
    .data-table tbody tr.row-sku-3 td:not(:first-child) {
      background: #fcfaff;
    }
    .data-table tbody tr.row-sku-4 td:first-child {
      background: #fff0f6;
    }
    .data-table tbody tr.row-sku-4 td:not(:first-child) {
      background: #fff7fb;
    }
    .data-table tbody tr.row-sku-5 td:first-child {
      background: #f0f5ff;
    }
    .data-table tbody tr.row-sku-5 td:not(:first-child) {
      background: #f7f9ff;
    }
  </style>
  <script src="../../../规范/assets/date-range-picker.js"></script>
  <script src="../../../规范/assets/multi-select-filter.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sider">
      <div class="sider-logo"></div>
      <div class="sider-item">首页</div>
      <div class="sider-item">流量</div>
      <div class="sider-item">经营</div>

  <script>
    (function () {

      var BIZ_FEE_METRICS = [
        "净销售额",
        "运费收入",

        "折扣",

      /**
       * 产品分析看板在业务指标池之后增补的维度（非财务明细表强制列，顺序以本页为准）。
       */
      var PRODUCT_ANALYSIS_EXTRA_METRICS = [
        "ASP",

        "Browser Sessions",

      var ALL_TABLE_METRICS = BIZ_FEE_METRICS.concat(PRODUCT_ANALYSIS_EXTRA_METRICS);

      /** 默认仅展示的关键经营指标（其余在「自定义显示指标」中勾选） */

        "B-CR",

        "营收",

      /** 演示用 MSKU 列表（实际应由检索接口返回） */

        "H6072-US01",
        "H6078-EU01",
        "H6199-US01",
        "H6199-DE01",
        "H5010-US01",
        "H5010-UK01",
        "H6056-CA01",
        "H6056-US02",
        "H6080-JP01",
        "H6080-US01",
        "H6090-EU01",
        "H6090-US01"
      ];

      var DEMO_PROD_LIST = ["H6199", "H6072", "H6078", "H5010", "H6056", "H6080"];

      function hashStr(s) {
        var h = 0;
        for (var i = 0; i < s.length; i++) {
          h = ((h << 5) - h + s.charCodeAt(i)) | 0;
        }
        return Math.abs(h);
      }

      /** 与透视表渠道列种子一致，用于演示默认「达成率最低」的 MSKU */
      var ACH_DEMO_CHANNEL_KEYS = ["Govee", "独立站", "Offline", "线下分销", "TTS", "京东"];

      function worstDemoAchievementRatePct(msku) {
        var minR = 999;
        for (var c = 0; c < ACH_DEMO_CHANNEL_KEYS.length; c++) {
          var sub = "CH|" + ACH_DEMO_CHANNEL_KEYS[c];
          var h = hashStr(msku + "|" + sub + "|营收达成率");
          var rate = 68 + (h % 28);
          if (rate < minR) minR = rate;
        }
        return minR;
      }

      function pickDefaultLowestAchievementMsku() {
        var best = DEMO_MSKU_LIST[0];
        var worst = worstDemoAchievementRatePct(best);
        for (var i = 1; i < DEMO_MSKU_LIST.length; i++) {
          var m = DEMO_MSKU_LIST[i];
          var r = worstDemoAchievementRatePct(m);
          if (r < worst || (r === worst && m.localeCompare(best) < 0)) {
            worst = r;
            best = m;
          }
        }
        return best;
      }

      var MAX_COMPARE_SKU = 8;

      var selectedProducts = [pickDefaultLowestAchievementMsku()];
      var metricVisible = {};
      var modalMsf = null;
      var modalDim = "msku";

      function initMetricVisibleMap() {
        metricVisible = {};
        for (var i = 0; i < ALL_TABLE_METRICS.length; i++) {
          var nm = ALL_TABLE_METRICS[i];
          metricVisible[nm] = DEFAULT_VISIBLE_METRICS.indexOf(nm) >= 0;
        }
      }
      initMetricVisibleMap();

      var BIZ_METRIC_DESC = {
        净销售额: "RRP价×销售数量（含退货数量）",
        销售额: "净销售额+包装收入+运费收入",
        营收: "业务口径下的营业收入（与数仓/管报定义一致，演示为模拟值）",
        销量: "订单销量（扣减退货）",
        毛利: "收入净额减各成本费用项后的毛利（以 Excel 取值为准）",
        ASP: "Average Selling Price，客单价（含税/口径以数仓定义为准，演示为模拟值）",
        "Total Sessions": "总会话/访问会话数（全站或渠道口径以埋点定义为准）",
        "Browser Sessions": "浏览器会话数（与 App 会话互斥口径以埋点为准）",
        日均流量: "主期内日均会话或日均 UV（口径以埋点/数仓定义为准）",
        订单: "主期内有效订单量（与销量、GMV 同周期对齐）",
        "T-CR": "Total Conversion Rate：订单数 ÷ Total Sessions（或业务约定口径）",
        "B-CR": "Browser Conversion Rate：订单数 ÷ Browser Sessions（或业务约定口径）",
        营收达成率: "营收相对目标或计划的达成比例（演示为随机百分比，正式环境以目标配置与数仓为准）"
      };

      var channelData = null;
      var mainStart = "2026-02-01";
      var mainEnd = "2026-04-30";
      var cmpStart = "2025-11-01";
      var cmpEnd = "2026-01-31";
      var pickerMain = null;
      var pickerCmp = null;

      function $(id) {
        return document.getElementById(id);
      }

      function getVisibleMetrics() {
        var out = [];
        for (var i = 0; i < ALL_TABLE_METRICS.length; i++) {
          var nm = ALL_TABLE_METRICS[i];
          if (metricVisible[nm]) out.push(nm);
        }
        return out;
      }

      function getModelOpts() {
        var out = [];
        for (var i = 0; i < DEMO_MSKU_LIST.length; i++) {
          var pr = (DEMO_MSKU_LIST[i].split("-")[0] || DEMO_MSKU_LIST[i]).trim();
          if (pr && out.indexOf(pr) < 0) out.push(pr);
        }
        out.sort();
        return out;
      }

      function expandPrefixToMskus(prefix) {
        var out = [];
        for (var i = 0; i < DEMO_MSKU_LIST.length; i++) {
          var m = DEMO_MSKU_LIST[i];
          var p = m.split("-")[0] || m;
          if (p === prefix || m.indexOf(prefix) === 0) out.push(m);
        }
        return out;
      }

      function uniqPush(arr, v) {
        if (v && arr.indexOf(v) < 0) arr.push(v);
      }

      function expandDimToProducts(dim, values) {
        var out = [];
        var i;
        if (dim === "msku") {
          for (i = 0; i < values.length; i++) uniqPush(out, values[i]);
          return out;
        }
        if (dim === "sku") {
          for (i = 0; i < values.length; i++) {
            var exp = expandPrefixToMskus(values[i]);
            for (var j = 0; j < exp.length; j++) uniqPush(out, exp[j]);
          }
          return out;
        }
        if (dim === "model") {
          for (i = 0; i < values.length; i++) {
            var exp2 = expandPrefixToMskus(values[i]);
            for (var k = 0; k < exp2.length; k++) uniqPush(out, exp2[k]);
          }
        }
        return out;
      }

      function getDisplayProducts() {
        if (!selectedProducts.length) return ["（请先添加产品）"];
        return selectedProducts.slice(0, MAX_COMPARE_SKU);
      }

      function syncMetricCheckboxes() {
        var grid = $("metricCheckGrid");
        if (!grid) return;
        var boxes = grid.querySelectorAll("input[type=\"checkbox\"][data-metric]");
        for (var i = 0; i < boxes.length; i++) {
          var b = boxes[i];
          var k = b.getAttribute("data-metric");
          b.checked = !!metricVisible[k];
        }
      }

      function buildMetricCheckGrid() {
        var grid = $("metricCheckGrid");
        if (!grid) return;
        var html = [];
        for (var i = 0; i < ALL_TABLE_METRICS.length; i++) {
          var nm = ALL_TABLE_METRICS[i];
          var id = "mchk_" + i;
          var ck = metricVisible[nm] ? " checked" : "";
          html.push(
            "<label><input type=\"checkbox\" data-metric=\"" +
              esc(nm) +
              "\" id=\"" +
              id +
              "\"" +
              ck +
              " />" +
              esc(nm) +
              "</label>"
          );
        }
        grid.innerHTML = html.join("");
        grid.onchange = function (e) {
          var tgt = e.target;
          if (!tgt || tgt.getAttribute("data-metric") == null) return;
          metricVisible[tgt.getAttribute("data-metric")] = !!tgt.checked;
          apply();
        };
      }

      function renderProductChips() {
        var host = $("productChips");
        if (!host) return;
        if (!selectedProducts.length) {
          host.innerHTML =
            "<span style=\"font-size:12px;color:#8c8c8c\">暂无已选产品，请点击「添加产品」。</span>";
          return;
        }
        var parts = [];
        for (var i = 0; i < selectedProducts.length; i++) {
          var s = selectedProducts[i];
          parts.push(
            "<span class=\"sku-chip\"><span class=\"nm\" title=\"" +
              esc(s) +
              "\">" +
              esc(s) +
              "</span><button type=\"button\" class=\"rm\" data-rm-prod=\"" +
              esc(s) +
              "\" aria-label=\"移除 " +
              esc(s) +
              "\">×</button></span>"
          );
        }
        host.innerHTML = parts.join("");
        host.onclick = function (e) {
          var btn = e.target.closest("[data-rm-prod]");
          if (!btn) return;
          var val = btn.getAttribute("data-rm-prod");
          selectedProducts = selectedProducts.filter(function (x) {
            return x !== val;
          });
          renderProductChips();
          apply();
        };
      }

      function getModalDim() {
        var r = document.querySelector('input[name="pickDim"]:checked');
        return r ? r.value : "msku";
      }

      function mountModalMsf() {
        var MSF = window.MultiSelectFilter;
        if (!MSF || !$("modalMsfMount")) return;
        if (modalMsf && modalMsf.destroy) modalMsf.destroy();
        modalDim = getModalDim();
        var opts = [];
        var placeholder = "请选择";
        if (modalDim === "msku") {
          placeholder = "请选择 MSKU";
          opts = DEMO_MSKU_LIST.map(function (x) {
            return { value: x, label: x };
          });
        } else if (modalDim === "sku") {
          placeholder = "请选择 SKU";
          opts = DEMO_PROD_LIST.map(function (x) {
            return { value: x, label: x };
          });
        } else {
          placeholder = "请选择 Model";
          opts = getModelOpts().map(function (x) {
            return { value: x, label: x };
          });
        }
        modalMsf = MSF.mount($("modalMsfMount"), {
          placeholder: placeholder,
          showSelectAll: false,
          zIndex: 900,
          getOptions: function () {
            return opts;
          },
          initialValues: [],
          onChange: function () {}
        });
      }

      function openProductModal() {
        $("productModal").classList.add("show");
        mountModalMsf();
      }

      function closeProductModal() {
        $("productModal").classList.remove("show");
      }

      function applyProductModal() {
        if (!modalMsf) return;
        var dim = getModalDim();
        var vals = modalMsf.getValues() || [];
        if (!vals.length) {
          alert("请至少勾选一个产品。");
          return;
        }
        var toAdd = expandDimToProducts(dim, vals);
        for (var i = 0; i < toAdd.length; i++) {
          if (selectedProducts.indexOf(toAdd[i]) < 0) selectedProducts.push(toAdd[i]);
        }
        if (selectedProducts.length > MAX_COMPARE_SKU) {
          selectedProducts = selectedProducts.slice(0, MAX_COMPARE_SKU);
          alert("最多并排对比 " + MAX_COMPARE_SKU + " 个产品，已截断。");
        }
        closeProductModal();
        renderProductChips();
        apply();
      }

      function showLoadError(msg) {
        var el = $("dataLoadError");
        el.hidden = false;
        el.textContent = msg;
      }

      function daysBetween(a, b) {
        var d1 = new Date(a.replace(/-/g, "/"));
        var d2 = new Date(b.replace(/-/g, "/"));
        return Math.max(1, Math.round((d2 - d1) / 86400000) + 1);
      }

      function addDays(ymd, delta) {
        var p = ymd.split("-");
        var d = new Date(+p[0], +p[1] - 1, +p[2] + delta);
        function z(n) { return (n < 10 ? "0" : "") + n; }
        return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
      }

      function momRange(mainS, mainE) {
        var n = daysBetween(mainS, mainE);
        var prevEnd = addDays(mainS, -1);
        var prevStart = addDays(prevEnd, -(n - 1));
        return { start: prevStart, end: prevEnd };
      }

      function fmtInt(n) {
        return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }

      function fmtMoney(n) {
        var sign = n < 0 ? "-" : "";
        return sign + "$" + fmtInt(Math.abs(Math.round(n)));
      }

      function fmtMoney2(n) {
        var sign = n < 0 ? "-" : "";
        var cents = Math.round(Math.abs(n) * 100);
        var whole = Math.floor(cents / 100);
        var frac = cents % 100;
        return sign + "$" + fmtInt(whole) + "." + (frac < 10 ? "0" : "") + frac;
      }

      function fmtPct2(seed) {
        var v = 1 + (seed % 400) / 100;
        return v.toFixed(2) + "%";
      }

      function pctClass(s) {
        if (typeof s !== "string") return "";
        var v = parseFloat(String(s).replace("%", "").replace("pt", ""));
        if (isNaN(v)) return "";
        if (v < 0) return "num-neg";
        if (v > 0) return "num-pos";
        return "";
      }

      function pctOnly(seed) {
        var v = ((seed % 70) - 30) / 10;
        var s = (v >= 0 ? "+" : "") + v.toFixed(1) + "%";
        return s;
      }

      function ptOnly(seed) {
        var v = ((seed % 20) - 10) / 10;
        return (v >= 0 ? "+" : "") + v.toFixed(1) + "pt";
      }

      function formatCurrent(metricName, h) {
        if (metricName === "销量") {
          return fmtInt(200 + (h % 12000));
        }
        if (metricName === "ASP") {
          return fmtMoney2(95 + (h % 5000) / 100);
        }
        if (metricName === "Total Sessions") {
          return fmtInt(5000 + (h % 50000));
        }
        if (metricName === "Browser Sessions") {
          return fmtInt(1000 + (h % 12000));
        }
        if (metricName === "日均流量") {
          return (50 + (h % 8000) / 100).toFixed(2);
        }
        if (metricName === "订单") {
          return fmtInt(200 + (h % 2000));
        }
        if (metricName === "T-CR" || metricName === "B-CR") {
          return fmtPct2(h);
        }
        if (metricName === "营收达成率") {
          return (68 + (h % 28)).toFixed(1) + "%";
        }
        if (metricName.indexOf("税") >= 0 || metricName.indexOf("VAT") >= 0) {
          return fmtMoney(500 + (h % 80000) / 5);
        }
        return fmtMoney(3000 + (h % 900000) / 3);
      }

      function isPtYoyCmp(metricName) {
        if (metricName === "营收达成率") return false;
        if (metricName === "毛利") return true;
        if (metricName.indexOf("率") >= 0) return true;
        if (metricName === "T-CR" || metricName === "B-CR") return true;
        return false;
      }

      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/\"/g, "&quot;");
      }

      /**
       * 渠道透视列：第二层为渠道名；第三层固定为「当前 / 同比 / 对比」三列。
       * channel_name 须与基础数据 JSON 中 channels[].channel_name 一致。
       */
      var CHANNEL_PIVOT_PREF = [
        { channel_name: "Govee", colLabel: "亚马逊", subNote: "Govee" },
        { channel_name: "独立站", colLabel: "Shopify", subNote: "独立站" },
        { channel_name: "Offline", colLabel: "线下商超", subNote: "Offline" },
        { channel_name: "线下分销", colLabel: "线下分销", subNote: "" },
        { channel_name: "TTS", colLabel: "TTS", subNote: "" },
        { channel_name: "京东", colLabel: "京东", subNote: "" }
      ];

      function getChannelPivotColumns() {
        if (!channelData || !channelData.channels) return [];
        var byName = {};
        channelData.channels.forEach(function (ch) {
          byName[ch.channel_name] = true;
        });
        var out = [];
        for (var i = 0; i < CHANNEL_PIVOT_PREF.length; i++) {
          var p = CHANNEL_PIVOT_PREF[i];
          if (byName[p.channel_name]) out.push(p);
        }
        if (!out.length) {
          channelData.channels.slice(0, 8).forEach(function (ch) {
            out.push({
              channel_name: ch.channel_name,
              colLabel: ch.channel_name,
              subNote: ""
            });
          });
        }
        return out;
      }

      var PIVOT_SUB_COLS = 3;
      var PIVOT_TRI_LABELS = ["当前", "同比", "对比"];

      function pivotTripleCells(sku, subRowKey, metricName) {
        var hCur = hashStr(sku + "|" + subRowKey + "|" + metricName);
        var hYoyAbs = hashStr(sku + "|" + subRowKey + "|" + metricName + "|同期额");
        var hCmpAbs = hashStr(sku + "|" + subRowKey + "|" + metricName + "|对比额");
        var cur = formatCurrent(metricName, hCur);
        var yoyVal = formatCurrent(metricName, hYoyAbs);
        var cmpVal = formatCurrent(metricName, hCmpAbs);
        var yoyRate = isPtYoyCmp(metricName) ? ptOnly(hCur + 11) : pctOnly(hCur + 11);
        var cmpRate = isPtYoyCmp(metricName) ? ptOnly(hCur + 911) : pctOnly(hCur + 911);
        var clsY = pctClass(yoyRate);
        var clsC = pctClass(cmpRate);
        return (
          "<td class=\"tri-cur\">" +
          esc(cur) +
          "</td><td class=\"tri-yoy\">" +
          esc(yoyVal) +
          " " +
          (clsY ? "<span class=\"" + esc(clsY) + "\">" : "<span>") +
          esc(yoyRate) +
          "</span></td><td class=\"tri-cmp\">" +
          esc(cmpVal) +
          " " +
          (clsC ? "<span class=\"" + esc(clsC) + "\">" : "<span>") +
          esc(cmpRate) +
          "</span></td>"
        );
      }

      function buildPivotColgroup(nSku, nCh, colsPerCh) {
        colsPerCh = colsPerCh || PIVOT_SUB_COLS;
        var wCur = 72;
        var wY = 104;
        var wC = 104;
        var html = [
          '<colgroup><col class="col-first" style="width:140px;min-width:140px;max-width:200px" />'
        ];
        for (var si = 0; si < nSku; si++) {
          for (var ci = 0; ci < nCh; ci++) {
            html.push('<col style="width:' + wCur + 'px" />');
            html.push('<col style="width:' + wY + 'px" />');
            html.push('<col style="width:' + wC + 'px" />');
          }
        }
        html.push("</colgroup>");
        return html.join("");
      }

      function buildPivotThead(displaySkus, subCols) {
        var nCh = subCols.length;
        var tri = PIVOT_SUB_COLS;
        if (!displaySkus.length || !nCh) {
          return (
            "<thead><tr class=\"h1\"><th class=\"corner-th\">对比项</th><th>（无列）</th></tr></thead>"
          );
        }
        var spanPerSku = nCh * tri;
        var r1 = '<tr class="h1"><th rowspan="3" class="corner-th">对比项</th>';
        for (var si = 0; si < displaySkus.length; si++) {
          var skuLabel = displaySkus[si];
          r1 +=
            '<th colspan="' +
            spanPerSku +
            '" class="sku-h1" title="' +
            esc(skuLabel) +
            '">产品：' +
            esc(skuLabel) +
            "</th>";
        }
        r1 += "</tr>";
        var r2 = '<tr class="h2">';
        for (si = 0; si < displaySkus.length; si++) {
          for (var ci = 0; ci < nCh; ci++) {
            var col = subCols[ci];
            var lab;
            if (col.colLabel != null) {
              lab = esc(col.colLabel);
              if (col.subNote) {
                lab +=
                  "<br /><span style=\"font-size:9px;color:#8c8c8c;font-weight:400\">" +
                  esc(col.subNote) +
                  "</span>";
              }
            } else {
              lab = esc(col.label || col.channel_name);
            }
            r2 += '<th colspan="' + tri + '" class="sub-h-ch">' + lab + "</th>";
          }
        }
        r2 += "</tr>";
        var r3 = '<tr class="h3">';
        for (si = 0; si < displaySkus.length; si++) {
          for (ci = 0; ci < nCh; ci++) {
            for (var t = 0; t < tri; t++) {
              r3 += '<th class="sub-h-tri">' + PIVOT_TRI_LABELS[t] + "</th>";
            }
          }
        }
        r3 += "</tr>";
        return "<thead>" + r1 + r2 + r3 + "</thead>";
      }

      function buildPivotTbody(displaySkus, subCols, subKeyFromCol) {
        var metrics = getVisibleMetrics();
        var nCh = subCols.length;
        var tri = PIVOT_SUB_COLS;
        var nSku = displaySkus.length;
        var totalSpan = 1 + nSku * nCh * tri;
        if (!metrics.length) {
          return (
            "<tbody><tr><td colspan=\"" +
            Math.max(2, totalSpan) +
            "\">请至少在「自定义显示指标」中勾选一个对比项。</td></tr></tbody>"
          );
        }
        if (!nSku || !nCh) {
          return (
            "<tbody><tr><td colspan=\"" +
            Math.max(2, totalSpan) +
            "\">请先添加产品或等待基础数据加载。</td></tr></tbody>"
          );
        }
        var rows = [];
        for (var mi = 0; mi < metrics.length; mi++) {
          var mname = metrics[mi];
          var tit = BIZ_METRIC_DESC[mname] ? esc(BIZ_METRIC_DESC[mname]) : esc(mname);
          var headInner = esc(mname);
          if (mname === "T-CR" || mname === "B-CR" || mname === "营收达成率") {
            headInner +=
              "<span class=\"th-help\" title=\"" +
              tit +
              "\" aria-label=\"" +
              tit +
              "\">?</span>";
          }
          var parts = ["<tr><td>" + headInner + "</td>"];
          for (var si = 0; si < displaySkus.length; si++) {
            var sku = displaySkus[si];
            for (var ci = 0; ci < nCh; ci++) {
              var subKey = subKeyFromCol(subCols[ci]);
              parts.push(pivotTripleCells(sku, subKey, mname));
            }
          }
          parts.push("</tr>");
          rows.push(parts.join(""));
        }
        return "<tbody>" + rows.join("") + "</tbody>";
      }

      function renderChannelPivotHtml() {
        if (!channelData || !channelData.channels) return "<p class=\"table-empty\">无渠道数据</p>";
        if (!getVisibleMetrics().length) {
          return "<p class=\"table-empty\">请至少在「自定义显示指标」中勾选一个对比项。</p>";
        }
        var chCols = getChannelPivotColumns();
        var displaySkus = getDisplayProducts();
        var nCh = chCols.length;
        var nSku = displaySkus.length;
        return (
          "<table class=\"data-table pivot-table\">" +
          buildPivotColgroup(nSku, nCh, PIVOT_SUB_COLS) +
          buildPivotThead(displaySkus, chCols) +
          buildPivotTbody(displaySkus, chCols, function (col) {
            return "CH|" + col.channel_name;
          }) +
          "</table>"
        );
      }

      function syncPivotStickyTops() {
        function run() {
          var wrap = $("channelBlocks");
          if (!wrap) return;
          var tbl = wrap.querySelector("table.pivot-table");
          if (!tbl) return;
          var h1 = tbl.querySelector("thead tr.h1");
          var h2 = tbl.querySelector("thead tr.h2");
          var h3 = tbl.querySelector("thead tr.h3");
          if (!h1 || !h2 || !h3) return;
          var h1Rect = h1.getBoundingClientRect();
          var h2Rect = h2.getBoundingClientRect();
          var h3Rect = h3.getBoundingClientRect();
          var r1 = Math.max(1, Math.ceil(h2Rect.top - h1Rect.top));
          var r2 = Math.max(1, Math.ceil(h3Rect.top - h2Rect.top));
          tbl.style.setProperty("--pivot-sync-h1", r1 + "px");
          tbl.style.setProperty("--pivot-sync-h2", r2 + "px");
        }
        setTimeout(run, 0);
      }

      function renderChannelBlocks() {
        $("channelBlocks").innerHTML = renderChannelPivotHtml();
        syncPivotStickyTops();
        if (!window._pivotStickyResizeBound) {
          window._pivotStickyResizeBound = true;
          window.addEventListener("resize", function () {
            clearTimeout(window._pivotStickyResizeTimer);
            window._pivotStickyResizeTimer = setTimeout(syncPivotStickyTops, 120);
          });
        }
      }

      function refreshPeriodNotes() {
        var skuPart = "已选产品：" + (selectedProducts.join("、") || "无");
        $("metaBar").textContent =
          skuPart +
          " ｜ 主期 " +
          mainStart +
          "～" +
          mainEnd +
          " ｜ 对比期 " +
          cmpStart +
          "～" +
          cmpEnd;
      }

      function apply() {
        refreshPeriodNotes();
        renderChannelBlocks();
      }

      function resetAll() {
        selectedProducts = [pickDefaultLowestAchievementMsku()];
        initMetricVisibleMap();
        mainStart = "2026-02-01";
        mainEnd = "2026-04-30";
        var m = momRange(mainStart, mainEnd);
        cmpStart = m.start;
        cmpEnd = m.end;
        if (pickerMain) pickerMain.set(mainStart, mainEnd);
        if (pickerCmp) pickerCmp.set(cmpStart, cmpEnd);
        buildMetricCheckGrid();
        renderProductChips();
        apply();
      }

      function initPickers() {
        var m0 = momRange(mainStart, mainEnd);
        cmpStart = m0.start;
        cmpEnd = m0.end;
        pickerMain = window.DateRangePicker.mount($("dateMainMount"), {
          start: mainStart,
          end: mainEnd,
          placeholder: "请选择日期范围",
          zIndex: 400,
          onChange: function (s, e) {
            if (s) mainStart = s;
            if (e) mainEnd = e;
          }
        });
        pickerCmp = window.DateRangePicker.mount($("dateCompareMount"), {
          start: cmpStart,
          end: cmpEnd,
          placeholder: "请选择对比日期范围",
          zIndex: 420,
          onChange: function (s, e) {
            if (s) cmpStart = s;
            if (e) cmpEnd = e;
          }
        });
      }

      $("applyBtn").addEventListener("click", apply);
      $("resetBtn").addEventListener("click", resetAll);

      $("btnOpenProductModal").addEventListener("click", openProductModal);
      $("productModalClose").addEventListener("click", closeProductModal);
      $("productModalCancel").addEventListener("click", closeProductModal);
      $("productModalApply").addEventListener("click", applyProductModal);
      $("productModal").addEventListener("click", function (e) {
        if (e.target === $("productModal")) closeProductModal();
      });
      document.querySelectorAll('input[name="pickDim"]').forEach(function (r) {
        r.addEventListener("change", mountModalMsf);
      });

      $("btnMetricDef").addEventListener("click", function () {
        initMetricVisibleMap();
        buildMetricCheckGrid();
        apply();
      });
      $("btnMetricAll").addEventListener("click", function () {
        for (var i = 0; i < ALL_TABLE_METRICS.length; i++) metricVisible[ALL_TABLE_METRICS[i]] = true;
        buildMetricCheckGrid();
        apply();
      });
      $("btnMetricNone").addEventListener("click", function () {
        for (var i = 0; i < ALL_TABLE_METRICS.length; i++) metricVisible[ALL_TABLE_METRICS[i]] = false;
        buildMetricCheckGrid();
        apply();
      });

      fetch(BASE + "渠道店铺基础数据_v1.json")
        .then(function (r) {
          if (!r.ok) throw new Error("渠道店铺基础数据加载失败");
          return r.json();
        })
        .then(function (ch) {
          channelData = ch;
          initPickers();
          renderProductChips();
          buildMetricCheckGrid();
          apply();
        })
        .catch(function (e) {
          showLoadError(
            e.message +
              "。请使用本地 HTTP 打开本页（在本目录执行 python3 -m http.server 8765），以便读取规范目录下的 JSON。"
          );
          channelData = {
            channels: [
              { channel_name: "Govee", stores: ["Govee_US", "Govee_DE"] },
              { channel_name: "独立站", stores: ["独立站-US", "独立站-EU"] },
              { channel_name: "Offline", stores: ["Offline-US"] },
              { channel_name: "线下分销", stores: ["分销-华东"] },
              { channel_name: "TTS", stores: ["TTS-US"] },
              { channel_name: "京东", stores: ["京东旗舰店"] }
            ]
          };
          initPickers();
          renderProductChips();
          buildMetricCheckGrid();
          apply();
        });
    })();
  </script>
</body>
</html>
