<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全渠道管报 - 原型预览</title>
    <style>
      :root {
        --bg: #f0f2f5;
        --panel: #fff;
        --line: #e8edf3;
        --text: rgba(0, 0, 0, 0.88);
        --sub: rgba(0, 0, 0, 0.45);
        --brand: #1677ff;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 960px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 18px 18px 14px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 12px;
        color: var(--sub);
        font-size: 13px;
        line-height: 1.6;
      }
      ul {
        margin: 0;
        padding: 0 0 0 18px;
      }
      li {
        margin: 10px 0;
      }
      a {
        color: var(--brand);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      code {
        background: #f5f5f5;
        padding: 1px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">

          <code>file://</code> 下部分行为异常。
        </p>
        <ul>
