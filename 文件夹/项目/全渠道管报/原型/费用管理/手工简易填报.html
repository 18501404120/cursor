<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工费用填报</title>
  <link rel="stylesheet" href="fee-mgmt-common.css">
  <style>
    :root {
      --jd-blue: #2f6bff;
      --jd-blue-dark: #1f55d8;
      --jd-red: #e1251b;
      --jd-bg: #f5f7fb;
      --jd-border: #e5e7eb;
      --jd-sub: #6b7280;
    }
    body { background: var(--jd-bg); }
    .header { background: #1f3a8a; }
    .page { padding: 14px 16px 20px; }
    .jd-card {
      background: #fff;
      border: 1px solid var(--jd-border);
      border-radius: 6px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .jd-card-hd {
      min-height: 44px;
      padding: 0 16px;
      border-bottom: 1px solid #eef0f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fbfcff;
      gap: 12px;
    }
    .jd-card-title { font-size: 14px; font-weight: 600; color: #111827; }
    .filter-panel { padding: 14px 16px; border-bottom: 1px solid #eef0f5; }
    .filter-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
    }
    .f-item { display: flex; align-items: center; gap: 8px; }
    .f-item > label { color: #374151; font-size: 12px; white-space: nowrap; }
    .f-item select,
    .f-item input {
      height: 32px;
      min-width: 120px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 0 9px;
      font-size: 13px;
      background: #fff;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label { color: #374151; font-size: 12px; }
    .field .req { color: var(--jd-red); margin-right: 2px; }
    .field input,
    .field select,
    .field textarea {
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 0 9px;
      font-size: 13px;
      background: #fff;
    }
    .field textarea {
      height: 70px;
      padding: 8px 9px;
      resize: vertical;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--jd-blue);
      box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
    }
    #entryModal .form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px 18px;
    }
    #entryModal .form-grid .full { grid-column: 1 / -1; }
    .btn-primary {
      background: var(--jd-blue);
      border-color: var(--jd-blue);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--jd-blue-dark);
      border-color: var(--jd-blue-dark);
      color: #fff;
    }
    .hint {
      margin: 0 0 12px;
      padding: 9px 12px;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      line-height: 1.6;
    }
    .hit-box {
      border: 1px solid #c7d2fe;
      background: #eef2ff;
      border-radius: 6px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 4px;
    }
    .hit-item span {
      display: block;
      color: #64748b;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .hit-item strong {
      display: block;
      color: #1e3a8a;
      font-size: 14px;
      word-break: break-all;
    }
    .status-dot {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #ecfdf3;
      color: #067647;
      border: 1px solid #abefc6;
    }
    .status-dot.draft {
      background: #f9fafb;
      color: #475467;
      border-color: #d0d5dd;
    }
    .status-dot.void {
      background: #fef3f2;
      color: #b42318;
      border-color: #fecdca;
    }
    .op-link {
      border: none;
      background: transparent;
      color: var(--jd-blue);
      cursor: pointer;
      padding: 0 4px;
      font-size: 13px;
    }
    .op-link:hover { text-decoration: underline; }
    .table-wrap { max-height: calc(100vh - 280px); min-height: 240px; }
    .data-table th {
      background: #f9fafb;
      color: #374151;
      font-weight: 600;
    }
    .data-table td,
    .data-table th { border-color: #e5e7eb; }
    .toolbar-line { display: flex; gap: 8px; align-items: center; }
    @media (max-width: 900px) {
      #entryModal .form-grid,
      .hit-box { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="sider-logo" aria-hidden="true"></div>
    <a class="sider-item active" href="index.html">费用</a>
    <a class="sider-item" href="../经营分析明细.html">管报</a>
  </aside>
  <main class="main">
    <header class="header">
      <div class="title">手工费用填报</div>
      <nav class="nav-links">
        <a href="index.html">目录</a>
        <a href="计提规则配置与月度运行.html">费用来源</a>
        <a class="active" href="手工简易填报.html">手工填报</a>
      </nav>
    </header>

    <div class="page">
      <div class="breadcrumb"><a href="index.html">费用管理</a> / 手工费用填报</div>

      <section class="jd-card">
        <div class="filter-panel">
          <div class="filter-grid">
            <div class="f-item">
              <label for="filterFee">费用项</label>
              <select id="filterFee">
                <option value="">全部</option>
                <option>内容制作费</option>
                <option>展会物料费</option>
                <option>其它平台杂费</option>
                <option>渠道临时推广费</option>
              </select>
            </div>
            <div class="f-item">
              <label for="filterMonth">会计月份</label>
              <input id="filterMonth" type="month">
            </div>
            <div class="f-item">
              <label for="filterRegion">区域</label>
              <select id="filterRegion">
                <option value="">全部</option>
                <option>北美</option>
                <option>欧洲</option>
                <option>亚太</option>
              </select>
            </div>
            <div class="f-item">
              <label for="filterChannel">渠道</label>
              <select id="filterChannel">
                <option value="">全部</option>
                <option>亚马逊</option>
                <option>独立站</option>
                <option>线下商超</option>
                <option>分销</option>
              </select>
            </div>
            <div class="f-item">
              <label for="filterStatus">状态</label>
              <select id="filterStatus">
                <option value="">全部</option>
                <option>草稿</option>
                <option>已确认</option>
                <option>已作废</option>
              </select>
            </div>
            <div class="f-item">
              <button type="button" class="btn btn-primary" id="btnSearch">查询</button>
            </div>
          </div>
        </div>
        <div class="jd-card-hd" style="border-top:1px solid #eef0f5;">
          <span class="jd-card-title">填报记录</span>
          <div class="toolbar-line">
            <button type="button" class="btn" id="btnImport">模板导入</button>
            <button type="button" class="btn btn-primary" id="btnAdd">新增填报</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>批次号</th>
                <th>费用项</th>
                <th>月份</th>
                <th>适用范围</th>
                <th>命中 SKU</th>
                <th class="num">金额</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="recordBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<div class="modal-mask" id="entryModal" role="dialog" aria-modal="true" aria-labelledby="entryModalTitle">
  <div class="modal modal-lg">
    <div class="modal-hd">
      <h2 id="entryModalTitle">新增手工填报</h2>
      <div class="modal-hd-actions">
        <button type="button" class="modal-close" id="entryModalClose" aria-label="关闭">×</button>
      </div>
    </div>
    <div class="modal-bd">
      <p class="hint">
        国家随区域联动；品类非必填。提交前点击「预览命中 SKU」，系统会在区域、国家、渠道、场景、品类范围内找营收最高的 SKU，并把该笔费用挂到该 SKU。
      </p>
      <div class="form-grid">
        <div class="field">
          <label><span class="req">*</span> 费用项</label>
          <select id="feeItem">
            <option value="F012">内容制作费</option>
            <option value="F013">展会物料费</option>
            <option value="F018">其它平台杂费</option>
            <option value="F020">渠道临时推广费</option>
          </select>
        </div>
        <div class="field">
          <label><span class="req">*</span> 会计月份</label>
          <input id="month" type="month" value="2026-05">
        </div>
        <div class="field">
          <label><span class="req">*</span> 金额</label>
          <input id="amount" type="number" step="0.01" placeholder="请输入金额">
        </div>
        <div class="field">
          <label><span class="req">*</span> 币种</label>
          <select id="currency">
            <option>CNY</option>
            <option>USD</option>
            <option>EUR</option>
          </select>
        </div>
        <div class="field">
          <label><span class="req">*</span> 区域</label>
          <select id="region">
            <option value="NA">北美</option>
            <option value="EU">欧洲</option>
            <option value="APAC">亚太</option>
          </select>
        </div>
        <div class="field">
          <label><span class="req">*</span> 国家</label>
          <select id="country"></select>
        </div>
        <div class="field">
          <label><span class="req">*</span> 渠道</label>
          <select id="channel">
            <option>亚马逊</option>
            <option>独立站</option>
            <option>线下商超</option>
            <option>分销</option>
          </select>
        </div>
        <div class="field">
          <label><span class="req">*</span> 场景</label>
          <select id="scene">
            <option>居家</option>
            <option>户外</option>
            <option>照明</option>
            <option>安防</option>
          </select>
        </div>
        <div class="field">
          <label>品类（非必填）</label>
          <select id="category">
            <option value="">全部品类</option>
            <option>香薰</option>
            <option>灯带</option>
            <option>摄像头</option>
            <option>庭院灯</option>
          </select>
        </div>
        <div class="field">
          <label>附件编号</label>
          <input id="attachmentNo" placeholder="如合同/账单编号">
        </div>
        <div class="field full">
          <label>备注</label>
          <textarea id="remark" placeholder="补充费用背景、适用活动或特殊说明"></textarea>
        </div>
        <div class="field full">
          <div class="hit-box" id="hitBox">
            <div class="hit-item">
              <span>命中 SKU</span>
              <strong id="hitSku">待预览</strong>
            </div>
            <div class="hit-item">
              <span>SKU 说明</span>
              <strong id="hitName">—</strong>
            </div>
            <div class="hit-item">
              <span>匹配范围</span>
              <strong id="hitScope">—</strong>
            </div>
            <div class="hit-item">
              <span>费用挂账金额</span>
              <strong id="hitAmount">—</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button type="button" class="btn" id="entryModalCancel">取消</button>
      <button type="button" class="btn" id="btnPreview">预览命中 SKU</button>
      <button type="button" class="btn" id="btnDraft">保存草稿</button>
      <button type="button" class="btn btn-primary" id="btnConfirm">确认提交</button>
    </div>
  </div>
</div>

<script>
(function () {
  var countryMap = {
    NA: ['US', 'CA'],
    EU: ['DE', 'UK', 'FR', 'ES', 'IT'],
    APAC: ['JP', 'AU', 'SG']
  };
  var skuPool = [
    { sku: 'H6199A001', name: '香薰机 Pro', country: 'US', channel: '亚马逊', scene: '居家', category: '香薰', revenue: 1280000 },
    { sku: 'H7050A001', name: '户外灯带', country: 'US', channel: '独立站', scene: '户外', category: '灯带', revenue: 980000 },
    { sku: 'B6008A001', name: '商超香薰套装', country: 'US', channel: '线下商超', scene: '居家', category: '香薰', revenue: 760000 },
    { sku: 'H6110D001', name: '德国灯带基础款', country: 'DE', channel: '亚马逊', scene: '照明', category: '灯带', revenue: 690000 },
    { sku: 'C3100U001', name: '安防摄像头', country: 'UK', channel: '独立站', scene: '安防', category: '摄像头', revenue: 510000 }
  ];
  var records = [
    { id: 'MN-202605-012', fee: '内容制作费', month: '2026-05', scope: '北美 / US / 亚马逊 / 居家 / 香薰', sku: 'H6199A001', amount: 86000, status: '已确认', region: 'NA', country: 'US', channel: '亚马逊', scene: '居家', category: '香薰', currency: 'CNY' },
    { id: 'MN-202605-018', fee: '其它平台杂费', month: '2026-05', scope: '欧洲 / DE / 亚马逊 / 照明 / 灯带', sku: 'H6110D001', amount: 12800, status: '已确认', region: 'EU', country: 'DE', channel: '亚马逊', scene: '照明', category: '灯带', currency: 'CNY' },
    { id: 'MN-202605-013', fee: '展会物料费', month: '2026-05', scope: '北美 / US / 线下商超 / 居家 / 全部品类', sku: 'B6008A001', amount: 45000, status: '草稿', region: 'NA', country: 'US', channel: '线下商超', scene: '居家', category: '', currency: 'CNY' }
  ];
  var seq = 21;
  var editingId = null;
  var latestHit = null;

  function regionLabel(code) {
    return { NA: '北美', EU: '欧洲', APAC: '亚太' }[code] || code;
  }

  function formatAmount(n) {
    return Number(n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderCountries(selected) {
    var region = document.getElementById('region').value;
    var list = countryMap[region] || [];
    document.getElementById('country').innerHTML = list.map(function (c) {
      return '<option' + (c === selected ? ' selected' : '') + '>' + c + '</option>';
    }).join('');
  }

  function resetHitPreview() {
    latestHit = null;
    document.getElementById('hitSku').textContent = '待预览';
    document.getElementById('hitName').textContent = '—';
    document.getElementById('hitScope').textContent = '—';
    document.getElementById('hitAmount').textContent = '—';
  }

  function formData() {
    return {
      fee: document.getElementById('feeItem').selectedOptions[0].text,
      month: document.getElementById('month').value,
      amount: Number(document.getElementById('amount').value || 0),
      currency: document.getElementById('currency').value,
      region: document.getElementById('region').value,
      country: document.getElementById('country').value,
      channel: document.getElementById('channel').value,
      scene: document.getElementById('scene').value,
      category: document.getElementById('category').value
    };
  }

  function validate(d) {
    if (!d.amount || d.amount <= 0) {
      alert('请填写有效金额');
      return false;
    }
    if (!d.month || !d.country || !d.channel || !d.scene) {
      alert('请补齐月份、区域、国家、渠道、场景');
      return false;
    }
    return true;
  }

  function hitSku() {
    var d = formData();
    if (!validate(d)) return null;
    var matched = skuPool.filter(function (s) {
      return s.country === d.country &&
        s.channel === d.channel &&
        s.scene === d.scene &&
        (!d.category || s.category === d.category);
    }).sort(function (a, b) { return b.revenue - a.revenue; });
    latestHit = matched[0] || null;
    document.getElementById('hitSku').textContent = latestHit ? latestHit.sku : '未命中';
    document.getElementById('hitName').textContent = latestHit ? latestHit.name : '当前范围内没有可用 SKU';
    document.getElementById('hitScope').textContent = regionLabel(d.region) + ' / ' + d.country + ' / ' + d.channel + ' / ' + d.scene + ' / ' + (d.category || '全部品类');
    document.getElementById('hitAmount').textContent = d.currency + ' ' + formatAmount(d.amount);
    return latestHit;
  }

  function filteredRecords() {
    var fee = document.getElementById('filterFee').value;
    var month = document.getElementById('filterMonth').value;
    var region = document.getElementById('filterRegion').value;
    var channel = document.getElementById('filterChannel').value;
    var status = document.getElementById('filterStatus').value;
    return records.filter(function (r) {
      if (fee && r.fee !== fee) return false;
      if (month && r.month !== month) return false;
      if (region && r.scope.indexOf(region) < 0) return false;
      if (channel && r.scope.indexOf(channel) < 0) return false;
      if (status && r.status !== status) return false;
      return true;
    });
  }

  function renderRecords() {
    var list = filteredRecords();
    document.getElementById('recordBody').innerHTML = list.map(function (r) {
      var cls = r.status === '草稿' ? 'draft' : r.status === '已作废' ? 'void' : '';
      var ops = '';
      if (r.status === '草稿') {
        ops = '<button class="op-link" data-id="' + r.id + '" data-act="edit">编辑</button> ' +
          '<button class="op-link" data-id="' + r.id + '" data-act="confirm">确认</button> ' +
          '<button class="op-link" data-id="' + r.id + '" data-act="void">作废</button>';
      } else if (r.status === '已确认') {
        ops = '<button class="op-link" data-id="' + r.id + '" data-act="void">作废</button>';
      } else {
        ops = '—';
      }
      return '<tr><td class="mono">' + r.id + '</td><td>' + r.fee + '</td><td>' + r.month + '</td><td>' + r.scope + '</td><td class="mono">' + r.sku + '</td><td class="num">' + formatAmount(r.amount) + '</td><td><span class="status-dot ' + cls + '">' + r.status + '</span></td><td>' + ops + '</td></tr>';
    }).join('') || '<tr><td colspan="8" style="text-align:center;color:#6b7280;padding:24px;">暂无数据</td></tr>';
  }

  function setFeeItemByText(text) {
    var sel = document.getElementById('feeItem');
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].text === text) {
        sel.selectedIndex = i;
        return;
      }
    }
  }

  function openModal(id) {
    editingId = id || null;
    resetHitPreview();
    if (id) {
      var row = records.find(function (r) { return r.id === id; });
      if (!row || row.status !== '草稿') return;
      document.getElementById('entryModalTitle').textContent = '编辑手工填报 · ' + id;
      setFeeItemByText(row.fee);
      document.getElementById('month').value = row.month;
      document.getElementById('amount').value = row.amount;
      document.getElementById('currency').value = row.currency || 'CNY';
      document.getElementById('region').value = row.region || 'NA';
      renderCountries(row.country);
      document.getElementById('channel').value = row.channel || '亚马逊';
      document.getElementById('scene').value = row.scene || '居家';
      document.getElementById('category').value = row.category || '';
      document.getElementById('attachmentNo').value = row.attachmentNo || '';
      document.getElementById('remark').value = row.remark || '';
      if (row.sku) {
        latestHit = skuPool.find(function (s) { return s.sku === row.sku; }) || { sku: row.sku, name: '—' };
        document.getElementById('hitSku').textContent = row.sku;
        document.getElementById('hitName').textContent = latestHit.name || '—';
        document.getElementById('hitScope').textContent = row.scope;
        document.getElementById('hitAmount').textContent = (row.currency || 'CNY') + ' ' + formatAmount(row.amount);
      }
    } else {
      document.getElementById('entryModalTitle').textContent = '新增手工填报';
      document.getElementById('feeItem').selectedIndex = 0;
      document.getElementById('month').value = '2026-05';
      document.getElementById('amount').value = '';
      document.getElementById('currency').value = 'CNY';
      document.getElementById('region').value = 'NA';
      renderCountries();
      document.getElementById('channel').selectedIndex = 0;
      document.getElementById('scene').selectedIndex = 0;
      document.getElementById('category').value = '';
      document.getElementById('attachmentNo').value = '';
      document.getElementById('remark').value = '';
    }
    document.getElementById('entryModal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('entryModal').classList.remove('open');
    editingId = null;
    resetHitPreview();
  }

  function buildRecord(status) {
    var d = formData();
    if (!validate(d)) return null;
    var hit = latestHit || hitSku();
    if (!hit) {
      alert('当前范围未命中 SKU，请调整国家、渠道、场景或品类后再提交。');
      return null;
    }
    return {
      id: editingId || ('MN-' + d.month.replace('-', '') + '-' + String(seq++).padStart(3, '0')),
      fee: d.fee,
      month: d.month,
      scope: regionLabel(d.region) + ' / ' + d.country + ' / ' + d.channel + ' / ' + d.scene + ' / ' + (d.category || '全部品类'),
      sku: hit.sku,
      amount: d.amount,
      status: status,
      region: d.region,
      country: d.country,
      channel: d.channel,
      scene: d.scene,
      category: d.category,
      currency: d.currency,
      attachmentNo: document.getElementById('attachmentNo').value,
      remark: document.getElementById('remark').value
    };
  }

  function saveRecord(status) {
    var rec = buildRecord(status);
    if (!rec) return;
    if (editingId) {
      var idx = records.findIndex(function (r) { return r.id === editingId; });
      if (idx >= 0) records[idx] = rec;
    } else {
      records.unshift(rec);
    }
    closeModal();
    renderRecords();
    alert(status === '草稿' ? '已保存草稿' : '已确认提交，费用将挂到命中 SKU：' + rec.sku);
  }

  document.getElementById('region').addEventListener('change', function () {
    renderCountries();
    resetHitPreview();
  });
  ['country', 'channel', 'scene', 'category', 'amount', 'currency'].forEach(function (id) {
    document.getElementById(id).addEventListener('change', resetHitPreview);
  });
  document.getElementById('btnAdd').addEventListener('click', function () { openModal(null); });
  document.getElementById('entryModalClose').addEventListener('click', closeModal);
  document.getElementById('entryModalCancel').addEventListener('click', closeModal);
  document.getElementById('entryModal').addEventListener('click', function (e) {
    if (e.target.id === 'entryModal') closeModal();
  });
  document.getElementById('btnPreview').addEventListener('click', hitSku);
  document.getElementById('btnDraft').addEventListener('click', function () { saveRecord('草稿'); });
  document.getElementById('btnConfirm').addEventListener('click', function () { saveRecord('已确认'); });
  document.getElementById('btnImport').addEventListener('click', function () {
    alert('模板字段：费用项、月份、金额、币种、区域、国家、渠道、场景、品类（非必填）、备注。导入后系统逐行命中最高营收 SKU。');
  });
  document.getElementById('btnSearch').addEventListener('click', renderRecords);
  document.getElementById('recordBody').addEventListener('click', function (e) {
    if (!e.target.dataset.id) return;
    var row = records.find(function (r) { return r.id === e.target.dataset.id; });
    if (!row) return;
    if (e.target.dataset.act === 'edit') openModal(row.id);
    if (e.target.dataset.act === 'confirm') { row.status = '已确认'; renderRecords(); }
    if (e.target.dataset.act === 'void') { row.status = '已作废'; renderRecords(); }
  });

  renderCountries();
  renderRecords();
})();
</script>
</body>
</html>
