<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>费用来源定义</title>
  <link rel="stylesheet" href="fee-mgmt-common.css">
  <style>
    :root {
      --jd-blue: #2f6bff;
      --jd-blue-dark: #1f55d8;
      --jd-bg: #f5f7fb;
      --jd-border: #e5e7eb;
      --jd-text-sub: #6b7280;
    }
    body { background: var(--jd-bg); }
    .header { background: #1f3a8a; }
    .page { padding: 14px 16px 20px; }
    .jd-card {
      background: #fff;
      border: 1px solid var(--jd-border);
      border-radius: 6px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .jd-card-hd {
      min-height: 44px;
      padding: 0 16px;
      border-bottom: 1px solid #eef0f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fbfcff;
      gap: 12px;
    }
    .jd-card-title { font-size: 14px; font-weight: 600; color: #111827; }
    .filter-panel {
      padding: 14px 16px;
      border-bottom: 1px solid #eef0f5;
    }
    .filter-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
    }
    .f-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .f-item > label {
      color: #374151;
      font-size: 12px;
      white-space: nowrap;
    }
    .f-item select,
    .f-item input {
      height: 32px;
      min-width: 120px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 0 9px;
      font-size: 13px;
      background: #fff;
    }
    .btn-primary {
      background: var(--jd-blue);
      border-color: var(--jd-blue);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--jd-blue-dark);
      border-color: var(--jd-blue-dark);
      color: #fff;
    }
    .status-dot {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #ecfdf3;
      color: #067647;
      border: 1px solid #abefc6;
    }
    .status-dot.off {
      background: #f9fafb;
      color: #475467;
      border-color: #d0d5dd;
    }
    .op-link {
      border: none;
      background: transparent;
      color: var(--jd-blue);
      cursor: pointer;
      padding: 0 4px;
      font-size: 13px;
      text-decoration: none;
    }
    .op-link:hover { text-decoration: underline; }
    .table-wrap { max-height: calc(100vh - 280px); min-height: 240px; }
    .data-table th {
      background: #f9fafb;
      color: #374151;
      font-weight: 600;
    }
    .data-table td,
    .data-table th { border-color: #e5e7eb; }
    .toolbar-line { display: flex; gap: 8px; align-items: center; }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="sider-logo" aria-hidden="true"></div>
    <a class="sider-item active" href="index.html">费用</a>
    <a class="sider-item" href="../经营分析明细.html">管报</a>
  </aside>
  <main class="main">
    <header class="header">
      <div class="title">费用来源定义</div>
      <nav class="nav-links">
        <a href="index.html">目录</a>
        <a class="active" href="计提规则配置与月度运行.html">费用来源</a>
        <a href="手工简易填报.html">手工填报</a>
      </nav>
    </header>
    <div class="page">
      <div class="breadcrumb"><a href="index.html">费用管理</a> / 费用来源定义</div>

      <section class="jd-card panel--filter">
        <div class="filter-panel">
          <div class="filter-grid">
            <div class="f-item">
              <label for="filterFee">费用项</label>
              <select id="filterFee">
                <option value="">全部</option>
                <option>退货运费</option>
                <option>尾程运费（FBM）</option>
                <option>线下商超推广费</option>
                <option>平台佣金</option>
                <option>品牌联合投放</option>
              </select>
            </div>
            <div class="f-item">
              <label for="filterSource">费用来源</label>
              <select id="filterSource">
                <option value="">全部</option>
                <option>自动取数</option>
                <option>固定金额</option>
                <option>固定比例</option>
                <option>历史比例</option>
              </select>
            </div>
            <div class="f-item">
              <label for="filterChannel">渠道</label>
              <select id="filterChannel">
                <option value="">全部</option>
                <option>亚马逊</option>
                <option>独立站</option>
                <option>线下商超</option>
                <option>分销</option>
              </select>
            </div>
            <div class="f-item">
              <label for="filterStatus">状态</label>
              <select id="filterStatus">
                <option value="">全部</option>
                <option>启用</option>
                <option>停用</option>
              </select>
            </div>
            <div class="f-item">
              <button type="button" class="btn btn-primary" id="btnQuery">查询</button>
            </div>
          </div>
        </div>
        <div class="jd-card-hd" style="border-top:1px solid #eef0f5;">
          <span class="jd-card-title">费用来源列表</span>
          <div class="toolbar-line">
            <button type="button" class="btn">导出</button>
            <a class="btn btn-primary" href="费用来源编辑.html" style="display:inline-flex;align-items:center;text-decoration:none;">新增来源</a>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>费用项</th>
                <th>费用来源</th>
                <th>适用范围</th>
                <th>来源摘要</th>
                <th>状态</th>
                <th>最近维护</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="sourceBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
(function () {
  var rows = [
    { id: 'F006', fee: '退货运费', source: '历史比例', channel: '亚马逊', summary: '近 12 月 · 历史费用/历史营收', status: '启用', maintainer: 'GTM-李四 · 2026-06-05' },
    { id: 'F007', fee: '尾程运费（FBM）', source: '固定金额', channel: '独立站', summary: '¥85,000 / 月', status: '启用', maintainer: 'GTM-李四 · 2026-06-05' },
    { id: 'F009', fee: '线下商超推广费', source: '固定比例', channel: '线下商超', summary: '8.5% × 当月实际营收', status: '启用', maintainer: 'GTM-王五 · 2026-06-04' },
    { id: 'F001', fee: '平台佣金', source: '自动取数', channel: '亚马逊', summary: '—', status: '启用', maintainer: '系统同步 · 2026-06-03' },
    { id: 'F016', fee: '品牌联合投放', source: '固定金额', channel: '分销', summary: '¥445,000 / 月', status: '停用', maintainer: 'GTM-李四 · 2026-05-28' }
  ];

  function filtered() {
    var fee = document.getElementById('filterFee').value;
    var source = document.getElementById('filterSource').value;
    var channel = document.getElementById('filterChannel').value;
    var status = document.getElementById('filterStatus').value;
    return rows.filter(function (r) {
      if (fee && r.fee !== fee) return false;
      if (source && r.source !== source) return false;
      if (channel && r.channel !== channel) return false;
      if (status && r.status !== status) return false;
      return true;
    });
  }

  function render() {
    var list = filtered();
    document.getElementById('sourceBody').innerHTML = list.map(function (r) {
      var statusCls = r.status === '启用' ? '' : ' off';
      return '<tr>' +
        '<td><strong>' + r.fee + '</strong><div class="mono" style="color:#6b7280;margin-top:2px;">' + r.id + '</div></td>' +
        '<td>' + r.source + '</td>' +
        '<td>' + r.channel + '</td>' +
        '<td style="color:#6b7280;">' + (r.source === '自动取数' ? '系统自动取数' : r.summary) + '</td>' +
        '<td><span class="status-dot' + statusCls + '">' + r.status + '</span></td>' +
        '<td style="font-size:12px;color:#6b7280;">' + r.maintainer + '</td>' +
        '<td><a class="op-link" href="费用来源编辑.html?id=' + r.id + '">编辑</a> ' +
        '<button type="button" class="op-link" data-act="copy">复制</button> ' +
        '<button type="button" class="op-link" data-act="toggle">' + (r.status === '启用' ? '停用' : '启用') + '</button></td></tr>';
    }).join('') || '<tr><td colspan="7" style="text-align:center;color:#6b7280;padding:32px;">暂无数据</td></tr>';
  }

  document.getElementById('btnQuery').onclick = render;
  document.getElementById('sourceBody').addEventListener('click', function (e) {
    if (e.target.dataset.act === 'copy') alert('已复制为新草稿，请在编辑页调整。');
    if (e.target.dataset.act === 'toggle') alert('状态切换（原型示意）');
  });
  render();
})();
</script>
</body>
</html>
