<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>费用来源定义</title>
  <link rel="stylesheet" href="fee-mgmt-common.css">
  <style>
    :root {
      --jd-blue: #2f6bff;
      --jd-blue-dark: #1f55d8;
      --jd-bg: #f5f7fb;
      --jd-border: #e5e7eb;
      --jd-text-sub: #6b7280;
    }
    body {
      background: var(--jd-bg);
    }
    .header {
      background: #1f3a8a;
    }
    .page {
      padding: 14px 16px 20px;
    }
    .jd-card {
      background: #fff;
      border: 1px solid var(--jd-border);
      border-radius: 6px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .jd-card-hd {
      height: 44px;
      padding: 0 16px;
      border-bottom: 1px solid #eef0f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fbfcff;
    }
    .jd-card-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
    }
    .jd-card-sub {
      margin-left: 8px;
      font-size: 12px;
      color: var(--jd-text-sub);
      font-weight: 400;
    }
    .jd-card-bd {
      padding: 16px;
    }
    .jd-form {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 18px;
      align-items: end;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field.full {
      grid-column: 1 / -1;
    }
    .field label {
      color: #374151;
      font-size: 12px;
    }
    .field .req {
      color: #e1251b;
      margin-right: 2px;
    }
    .field input,
    .field select,
    .field textarea {
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 0 9px;
      font-size: 13px;
      background: #fff;
    }
    .field textarea {
      height: 66px;
      padding: 8px 9px;
      resize: vertical;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--jd-blue);
      box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
    }
    .btn-primary {
      background: var(--jd-blue);
      border-color: var(--jd-blue);
    }
    .btn-primary:hover {
      background: var(--jd-blue-dark);
      border-color: var(--jd-blue-dark);
    }
    .source-panel {
      grid-column: 1 / -1;
      padding: 12px;
      border: 1px solid #e5e7eb;
      background: #fafbff;
      border-radius: 6px;
    }
    .source-block {
      display: none;
    }
    .source-block.active {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px 18px;
    }
    .hint {
      margin: 0 0 12px;
      padding: 9px 12px;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      line-height: 1.6;
    }
    .status-dot {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #ecfdf3;
      color: #067647;
      border: 1px solid #abefc6;
    }
    .status-dot.warn {
      background: #fff7ed;
      color: #c2410c;
      border-color: #fed7aa;
    }
    .toolbar-line {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .op-link {
      border: none;
      background: transparent;
      color: var(--jd-blue);
      cursor: pointer;
      padding: 0 4px;
      font-size: 13px;
    }
    .table-wrap {
      max-height: 420px;
    }
    .data-table th {
      background: #f9fafb;
      color: #374151;
      font-weight: 600;
    }
    .data-table td,
    .data-table th {
      border-color: #e5e7eb;
    }
    @media (max-width: 1100px) {
      .jd-form,
      .source-block.active {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="sider-logo" aria-hidden="true"></div>
    <a class="sider-item active" href="index.html">费用</a>
    <a class="sider-item" href="../经营分析明细.html">管报</a>
  </aside>
  <main class="main">
    <header class="header">
      <div class="title">费用来源定义</div>
      <nav class="nav-links">
        <a href="index.html">目录</a>
        <a class="active" href="计提规则配置与月度运行.html">费用来源</a>
        <a href="手工简易填报.html">手工填报</a>
      </nav>
    </header>
    <div class="page">
      <div class="breadcrumb"><a href="index.html">费用管理</a> / 费用来源定义</div>

      <section class="jd-card">
        <div class="jd-card-hd">
          <div>
            <span class="jd-card-title">费用来源配置</span>
            <span class="jd-card-sub">选择不同费用来源后，只展示该来源需要填写的信息</span>
          </div>
          <button class="btn btn-primary" type="button" id="btnSave">保存配置</button>
        </div>
        <div class="jd-card-bd">
          <p class="hint">
            本页只定义费用从哪里来。无法明确到具体 SKU 的费用，不再创建占位 SKU；系统会在计算时按区域、国家、渠道、场景、品类范围命中营收最高的 SKU，并把费用挂到该 SKU。
          </p>
          <div class="jd-form">
            <div class="field">
              <label><span class="req">*</span>费用项</label>
              <select id="feeItem">
                <option value="F006">退货运费（F006）</option>
                <option value="F007">尾程运费（FBM）（F007）</option>
                <option value="F008">线下商超销售退款（F008）</option>
                <option value="F009">线下商超推广费（F009）</option>
                <option value="F016">品牌联合投放（F016）</option>
              </select>
            </div>
            <div class="field">
              <label><span class="req">*</span>费用来源</label>
              <select id="sourceType">
                <option value="auto">自动取数</option>
                <option value="fixedAmount">固定金额</option>
                <option value="fixedRate">固定比例</option>
                <option value="historyRate">历史比例</option>
              </select>
            </div>
            <div class="field">
              <label>启用状态</label>
              <select id="enabled">
                <option>启用</option>
                <option>停用</option>
              </select>
            </div>
            <div class="field">
              <label>生效月份</label>
              <input id="startMonth" type="month" value="2026-05">
            </div>

            <div class="source-panel">
              <div class="source-block active" data-panel="auto">
                <div class="field">
                  <label><span class="req">*</span>系统来源</label>
                  <select>
                    <option>平台账单接口</option>
                    <option>广告 API</option>
                    <option>物流账单接口</option>
                    <option>ERP 已有报表</option>
                  </select>
                </div>
                <div class="field">
                  <label><span class="req">*</span>来源字段</label>
                  <input value="actual_fee_amount">
                </div>
                <div class="field">
                  <label>取数频率</label>
                  <select>
                    <option>每日同步</option>
                    <option>每月一次</option>
                  </select>
                </div>
                <div class="field">
                  <label>异常处理</label>
                  <select>
                    <option>同步失败则标记未就绪</option>
                    <option>沿用上月值并预警</option>
                  </select>
                </div>
              </div>

              <div class="source-block" data-panel="fixedAmount">
                <div class="field">
                  <label><span class="req">*</span>月固定金额</label>
                  <input type="number" value="85000">
                </div>
                <div class="field">
                  <label>币种</label>
                  <select>
                    <option>CNY</option>
                    <option>USD</option>
                    <option>EUR</option>
                  </select>
                </div>
                <div class="field">
                  <label>适用周期</label>
                  <select>
                    <option>每月</option>
                    <option>一次性</option>
                    <option>季度均摊</option>
                  </select>
                </div>
                <div class="field">
                  <label>备注</label>
                  <input placeholder="例如固定月租、固定服务费">
                </div>
              </div>

              <div class="source-block" data-panel="fixedRate">
                <div class="field">
                  <label><span class="req">*</span>比例值</label>
                  <input type="number" step="0.01" value="8.50">
                </div>
                <div class="field">
                  <label><span class="req">*</span>比例基数</label>
                  <select>
                    <option>当月实际营收</option>
                    <option>当月销售额</option>
                    <option>当月销量</option>
                  </select>
                </div>
                <div class="field">
                  <label>计算方式</label>
                  <select>
                    <option>基数 × 比例</option>
                    <option>基数 × 比例后四舍五入</option>
                  </select>
                </div>
                <div class="field">
                  <label>比例来源</label>
                  <input value="GTM 专员维护">
                </div>
              </div>

              <div class="source-block" data-panel="historyRate">
                <div class="field">
                  <label><span class="req">*</span>历史窗口</label>
                  <select>
                    <option>近 12 个月</option>
                    <option>近 6 个月</option>
                    <option>近 3 个月</option>
                  </select>
                </div>
                <div class="field">
                  <label><span class="req">*</span>历史口径</label>
                  <select>
                    <option>历史费用 / 历史营收</option>
                    <option>历史费用 / 历史销售额</option>
                    <option>历史费用 / 历史销量</option>
                  </select>
                </div>
                <div class="field">
                  <label>封顶比例</label>
                  <input type="number" step="0.01" placeholder="可不填">
                </div>
                <div class="field">
                  <label>异常月份</label>
                  <input placeholder="如 2025-11,2025-12">
                </div>
              </div>
            </div>

            <div class="field">
              <label><span class="req">*</span>区域</label>
              <select id="region">
                <option value="NA">北美</option>
                <option value="EU">欧洲</option>
                <option value="APAC">亚太</option>
              </select>
            </div>
            <div class="field">
              <label><span class="req">*</span>国家</label>
              <select id="country"></select>
            </div>
            <div class="field">
              <label><span class="req">*</span>渠道</label>
              <select id="channel">
                <option>亚马逊</option>
                <option>独立站</option>
                <option>线下商超</option>
                <option>分销</option>
              </select>
            </div>
            <div class="field">
              <label><span class="req">*</span>场景</label>
              <select id="scene">
                <option>居家</option>
                <option>户外</option>
                <option>照明</option>
                <option>安防</option>
              </select>
            </div>
            <div class="field">
              <label>品类（非必填）</label>
              <select id="category">
                <option value="">全部品类</option>
                <option>香薰</option>
                <option>灯带</option>
                <option>摄像头</option>
                <option>庭院灯</option>
              </select>
            </div>
            <div class="field">
              <label>命中规则</label>
              <input readonly value="在上述范围内选择营收最高 SKU" style="background:#f9fafb;">
            </div>
            <div class="field full">
              <label>说明</label>
              <textarea placeholder="补充该费用来源的业务说明、例外情况或维护责任人"></textarea>
            </div>
          </div>
        </div>
      </section>

      <section class="jd-card">
        <div class="jd-card-hd">
          <div>
            <span class="jd-card-title">费用来源列表</span>
            <span class="jd-card-sub">示意数据，正式系统按费用项维护版本</span>
          </div>
          <div class="toolbar-line">
            <button type="button" class="btn">导出</button>
            <button type="button" class="btn btn-primary">新增来源</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>费用项</th>
                <th>来源类型</th>
                <th>适用范围</th>
                <th>命中 SKU 规则</th>
                <th>状态</th>
                <th>最近维护</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="sourceBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
(function () {
  var countryMap = {
    NA: ['US', 'CA'],
    EU: ['DE', 'UK', 'FR', 'ES', 'IT'],
    APAC: ['JP', 'AU', 'SG']
  };
  var sourceRows = [
    ['退货运费', '历史比例', '北美 / US / 亚马逊 / 居家 / 全部品类', '命中营收最高 SKU', '启用', 'GTM-李四 · 2026-06-05'],
    ['尾程运费（FBM）', '固定金额', '北美 / US / 独立站 / 户外 / 全部品类', '命中营收最高 SKU', '启用', 'GTM-李四 · 2026-06-05'],
    ['线下商超推广费', '固定比例', '北美 / US / 线下商超 / 居家 / 香薰', '命中营收最高 SKU', '启用', 'GTM-王五 · 2026-06-04'],
    ['平台佣金', '自动取数', '欧洲 / DE / 亚马逊 / 照明 / 全部品类', '优先真实 SKU，缺失时命中营收最高 SKU', '启用', '系统同步 · 2026-06-03']
  ];

  function renderCountries() {
    var region = document.getElementById('region').value;
    document.getElementById('country').innerHTML = countryMap[region].map(function (c) {
      return '<option>' + c + '</option>';
    }).join('');
  }

  function renderSourcePanel() {
    var type = document.getElementById('sourceType').value;
    document.querySelectorAll('.source-block').forEach(function (el) {
      el.classList.toggle('active', el.dataset.panel === type);
    });
  }

  function renderList() {
    document.getElementById('sourceBody').innerHTML = sourceRows.map(function (r) {
      return '<tr><td><strong>' + r[0] + '</strong></td><td>' + r[1] + '</td><td>' + r[2] + '</td><td>' + r[3] + '</td><td><span class="status-dot">' + r[4] + '</span></td><td>' + r[5] + '</td><td><button class="op-link">编辑</button><button class="op-link">复制</button><button class="op-link">停用</button></td></tr>';
    }).join('');
  }

  document.getElementById('region').addEventListener('change', renderCountries);
  document.getElementById('sourceType').addEventListener('change', renderSourcePanel);
  document.getElementById('btnSave').addEventListener('click', function () {
    alert('已保存费用来源配置。计算时将在适用范围内命中营收最高 SKU 并挂账。');
  });
  renderCountries();
  renderSourcePanel();
  renderList();
})();
</script>
</body>
</html>
