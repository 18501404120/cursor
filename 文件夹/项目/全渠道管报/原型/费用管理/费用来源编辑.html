<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>编辑费用来源</title>
  <link rel="stylesheet" href="fee-mgmt-common.css">
  <style>
    :root {
      --jd-blue: #2f6bff;
      --jd-blue-dark: #1f55d8;
      --jd-bg: #f5f7fb;
      --jd-border: #e5e7eb;
    }
    body { background: var(--jd-bg); }
    .header { background: #1f3a8a; }
    .page { padding: 14px 16px 20px; max-width: 1100px; }
    .jd-card {
      background: #fff;
      border: 1px solid var(--jd-border);
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .jd-card-hd {
      min-height: 44px;
      padding: 0 16px;
      border-bottom: 1px solid #eef0f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fbfcff;
    }
    .jd-card-title { font-size: 14px; font-weight: 600; }
    .jd-card-bd { padding: 20px; }
    .jd-form {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px 20px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #374151; font-size: 12px; }
    .field .req { color: #e1251b; margin-right: 2px; }
    .field input,
    .field select,
    .field textarea {
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 0 9px;
      font-size: 13px;
      background: #fff;
    }
    .field textarea {
      height: 72px;
      padding: 8px 9px;
      resize: vertical;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--jd-blue);
      box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
    }
    .source-panel {
      grid-column: 1 / -1;
      padding: 14px;
      border: 1px solid #e5e7eb;
      background: #fafbff;
      border-radius: 6px;
    }
    .source-panel.hidden { display: none; }
    .source-block { display: none; }
    .source-block.active {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px 20px;
    }
    .auto-tip {
      grid-column: 1 / -1;
      padding: 12px 14px;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      line-height: 1.6;
    }
    .section-title {
      grid-column: 1 / -1;
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      padding-bottom: 4px;
      border-bottom: 1px solid #eef0f5;
      margin-top: 4px;
    }
    .btn-primary {
      background: var(--jd-blue);
      border-color: var(--jd-blue);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--jd-blue-dark);
      border-color: var(--jd-blue-dark);
      color: #fff;
    }
    .footer-bar {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #eef0f5;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    @media (max-width: 900px) {
      .jd-form,
      .source-block.active { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sider">
    <div class="sider-logo" aria-hidden="true"></div>
    <a class="sider-item active" href="index.html">费用</a>
    <a class="sider-item" href="../经营分析明细.html">管报</a>
  </aside>
  <main class="main">
    <header class="header">
      <div class="title">编辑费用来源</div>
      <nav class="nav-links">
        <a href="index.html">目录</a>
        <a href="计提规则配置与月度运行.html">费用来源</a>
        <a href="手工简易填报.html">手工填报</a>
      </nav>
    </header>
    <div class="page">
      <div class="breadcrumb">
        <a href="index.html">费用管理</a> /
        <a href="计提规则配置与月度运行.html">费用来源定义</a> /
        <span id="pageMode">编辑</span>
      </div>

      <section class="jd-card">
        <div class="jd-card-hd">
          <span class="jd-card-title" id="formTitle">编辑费用来源</span>
          <a class="btn" href="计提规则配置与月度运行.html">返回列表</a>
        </div>
        <div class="jd-card-bd">
          <div class="jd-form">
            <div class="field">
              <label><span class="req">*</span>费用项</label>
              <select id="feeItem">
                <option value="F006">退货运费（F006）</option>
                <option value="F007">尾程运费（FBM）（F007）</option>
                <option value="F008">线下商超销售退款（F008）</option>
                <option value="F009">线下商超推广费（F009）</option>
                <option value="F001">平台佣金（F001）</option>
                <option value="F016">品牌联合投放（F016）</option>
              </select>
            </div>
            <div class="field">
              <label><span class="req">*</span>费用来源</label>
              <select id="sourceType">
                <option value="auto">自动取数</option>
                <option value="fixedAmount">固定金额</option>
                <option value="fixedRate">固定比例</option>
                <option value="historyRate">历史比例</option>
              </select>
            </div>
            <div class="field">
              <label>启用状态</label>
              <select id="enabled">
                <option>启用</option>
                <option>停用</option>
              </select>
            </div>
            <div class="field">
              <label>生效月份</label>
              <input id="startMonth" type="month" value="2026-05">
            </div>

            <div class="section-title">适用范围</div>
            <div class="field">
              <label><span class="req">*</span>渠道</label>
              <select id="channel">
                <option>亚马逊</option>
                <option>独立站</option>
                <option>线下商超</option>
                <option>分销</option>
              </select>
            </div>

            <div id="autoTip" class="auto-tip full">
              已选择<strong>自动取数</strong>：系统从既有数据源自动同步该费用，无需填写额外规则。仅需确认费用项与适用渠道。
            </div>

            <div id="sourcePanel" class="source-panel hidden">
              <div class="source-block" data-panel="fixedAmount">
                <div class="field">
                  <label><span class="req">*</span>月固定金额</label>
                  <input id="fixedAmount" type="number" value="85000">
                </div>
                <div class="field">
                  <label>币种</label>
                  <select>
                    <option>CNY</option>
                    <option>USD</option>
                    <option>EUR</option>
                  </select>
                </div>
                <div class="field">
                  <label>适用周期</label>
                  <select>
                    <option>每月</option>
                    <option>一次性</option>
                    <option>季度均摊</option>
                  </select>
                </div>
              </div>

              <div class="source-block" data-panel="fixedRate">
                <div class="field">
                  <label><span class="req">*</span>比例值（%）</label>
                  <input id="fixedRate" type="number" step="0.01" value="8.50">
                </div>
                <div class="field">
                  <label><span class="req">*</span>比例基数</label>
                  <select>
                    <option>当月实际营收</option>
                    <option>当月销售额</option>
                    <option>当月销量</option>
                  </select>
                </div>
                <div class="field">
                  <label>计算方式</label>
                  <select>
                    <option>基数 × 比例</option>
                    <option>基数 × 比例后四舍五入</option>
                  </select>
                </div>
              </div>

              <div class="source-block" data-panel="historyRate">
                <div class="field">
                  <label><span class="req">*</span>历史窗口</label>
                  <select>
                    <option>近 12 个月</option>
                    <option>近 6 个月</option>
                    <option>近 3 个月</option>
                  </select>
                </div>
                <div class="field">
                  <label><span class="req">*</span>历史口径</label>
                  <select>
                    <option>历史费用 / 历史营收</option>
                    <option>历史费用 / 历史销售额</option>
                    <option>历史费用 / 历史销量</option>
                  </select>
                </div>
                <div class="field">
                  <label>封顶比例（%）</label>
                  <input type="number" step="0.01" placeholder="可不填">
                </div>
              </div>
            </div>

            <div class="field full" id="remarkField">
              <label>说明</label>
              <textarea id="remark" placeholder="补充业务说明、例外情况或维护责任人"></textarea>
            </div>
          </div>

          <div class="footer-bar">
            <a class="btn" href="计提规则配置与月度运行.html">取消</a>
            <button type="button" class="btn btn-primary" id="btnSave">保存</button>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
(function () {
  var mock = {
    F006: { fee: 'F006', sourceType: 'historyRate', channel: '亚马逊', enabled: '启用' },
    F007: { fee: 'F007', sourceType: 'fixedAmount', channel: '独立站', enabled: '启用', fixedAmount: 85000 },
    F009: { fee: 'F009', sourceType: 'fixedRate', channel: '线下商超', enabled: '启用', fixedRate: 8.5 },
    F001: { fee: 'F001', sourceType: 'auto', channel: '亚马逊', enabled: '启用' },
    F016: { fee: 'F016', sourceType: 'fixedAmount', channel: '分销', enabled: '停用', fixedAmount: 445000 }
  };

  var id = new URLSearchParams(location.search).get('id');
  var isNew = !id;

  if (isNew) {
    document.getElementById('formTitle').textContent = '新增费用来源';
    document.getElementById('pageMode').textContent = '新增';
  } else {
    var data = mock[id];
    if (data) {
      document.getElementById('feeItem').value = data.fee;
      document.getElementById('sourceType').value = data.sourceType;
      document.getElementById('channel').value = data.channel;
      document.getElementById('enabled').value = data.enabled;
      if (data.fixedAmount) document.getElementById('fixedAmount').value = data.fixedAmount;
      if (data.fixedRate) document.getElementById('fixedRate').value = data.fixedRate;
    }
    document.getElementById('formTitle').textContent = '编辑费用来源 · ' + id;
  }

  function renderPanels() {
    var type = document.getElementById('sourceType').value;
    var isAuto = type === 'auto';
    document.getElementById('autoTip').style.display = isAuto ? '' : 'none';
    document.getElementById('sourcePanel').classList.toggle('hidden', isAuto);
    document.querySelectorAll('.source-block').forEach(function (el) {
      el.classList.toggle('active', !isAuto && el.dataset.panel === type);
    });
  }

  document.getElementById('sourceType').addEventListener('change', renderPanels);
  document.getElementById('btnSave').addEventListener('click', function () {
    var type = document.getElementById('sourceType').value;
    var channel = document.getElementById('channel').value;
    if (!channel) {
      alert('请选择适用渠道');
      return;
    }
    if (type === 'auto') {
      alert('已保存：自动取数 · 渠道「' + channel + '」。系统将自动同步，无需额外配置。');
    } else {
      alert('已保存费用来源配置。');
    }
    location.href = '计提规则配置与月度运行.html';
  });

  renderPanels();
})();
</script>
</body>
</html>
