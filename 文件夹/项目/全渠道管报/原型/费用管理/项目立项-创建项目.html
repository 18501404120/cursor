  <script>
    (function () {
      if (typeof ProjectBudgetPlan === "undefined") {
        alert("预算模块脚本加载失败，请通过 HTTP 服务打开本页。");
        return;
      }
      window.budgetApi = ProjectBudgetPlan.init({
        tbodyId: "tbodyBudget",
        btnAddId: "btnBudgetAdd",
        btnBatchDelId: "btnBudgetBatchDel",
        chkAllId: "budgetChkAll",
        onChange: updateTotal
      });

      function formatTotal(n) {
        return Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
      }
      function updateTotal() {
        var el = document.getElementById("budgetTotalDisplay");
        if (el) el.textContent = formatTotal(budgetApi.getTotal());
      }
      function showToast(msg) {
        var el = document.getElementById("budgetToast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(function () { el.classList.remove("show"); }, 2400);
      }

      document.getElementById("btnBudgetSave").addEventListener("click", function () {
        if (!budgetApi.validate()) return;
        budgetApi.persist();
        showToast("预算已保存（合计 " + formatTotal(budgetApi.getTotal()) + "）");
      });

      updateTotal();
    })();
  </script>
