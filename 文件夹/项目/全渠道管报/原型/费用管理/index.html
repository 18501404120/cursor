<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>费用管理 · 原型目录</title>
  <link rel="stylesheet" href="fee-mgmt-common.css">
  <style>
    body {
      background: #f5f7fb;
    }
    .wrap {
      max-width: 960px;
      margin: 48px auto;
      padding: 0 20px;
    }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px 28px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    .lead {
      margin: 0 0 20px;
      color: #6b7280;
      line-height: 1.7;
    }
    .page-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .page-card {
      display: block;
      padding: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      color: inherit;
      text-decoration: none;
      background: #fff;
    }
    .page-card:hover {
      border-color: #2f6bff;
      box-shadow: 0 8px 20px rgba(47, 107, 255, 0.10);
    }
    .page-card strong {
      display: block;
      color: #1f3a8a;
      font-size: 16px;
      margin-bottom: 8px;
    }
    .page-card p {
      margin: 0;
      color: #6b7280;
      line-height: 1.6;
      font-size: 13px;
    }
    .back {
      margin-bottom: 16px;
      font-size: 13px;
    }
    .back a {
      color: #2f6bff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="back"><a href="../index.html">← 全渠道管报原型目录</a></p>
    <div class="card">
      <h1>费用管理 · 费用来源与手工填报</h1>
      <p class="lead">
        本版仅保留两个核心页面：费用来源定义页负责维护自动取数、固定金额、固定比例、历史比例等费用来源规则；手工填报页负责补录无法自动取数的费用。
        不再创建占位 SKU。无法明确到具体 SKU 时，系统按区域、国家、渠道、场景、品类范围命中营收最高的 SKU，并将费用挂到该 SKU。
      </p>
      <div class="page-list">
        <a class="page-card" href="计提规则配置与月度运行.html">
          <strong>费用来源定义</strong>
          <p>筛选 + 列表；弹窗维护来源规则。含固定金额/比例、历史滚动占比、同期占比预估等类型。</p>
        </a>
        <a class="page-card" href="手工简易填报.html">
          <strong>手工费用填报</strong>
          <p>筛选含月份范围；弹窗填报并上传附件。列表支持附件预览与下载。</p>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
