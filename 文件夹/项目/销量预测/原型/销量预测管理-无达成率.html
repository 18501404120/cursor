<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>销量预测管理-无达成率</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #appFrame {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" src="./销量预测管理-原型说明.html" title="销量预测管理-无达成率视图"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('appFrame');

      function hideFilterField(doc, id) {
        var el = doc.getElementById(id);
        if (!el || !el.closest) return;
        var box = el.closest('.f');
        if (box) box.style.display = 'none';
      }

      function stripRateFromOption(opt) {
        if (!opt || typeof opt !== 'object') return opt;
        if (opt.legend && opt.legend[0]) {
          var lg = opt.legend[0];
          if (Array.isArray(lg.data)) {
            lg.data = lg.data.filter(function (name) {
              return String(name).indexOf('达成率') === -1;
            });
          }
          if (lg.selected) {
            Object.keys(lg.selected).forEach(function (k) {
              if (String(k).indexOf('达成率') > -1) delete lg.selected[k];
            });
          }
        }
        if (Array.isArray(opt.series)) {
          opt.series = opt.series.filter(function (s) {
            var n = s && s.name ? String(s.name) : '';
            if (n.indexOf('达成率') > -1) return false;
            if (s && s.type === 'line' && s.yAxisIndex === 1) return false;
            return true;
          });
        }
        if (Array.isArray(opt.yAxis) && opt.yAxis.length > 1) {
          opt.yAxis = [opt.yAxis[0]];
        }
        return opt;
      }

      function wrapChartSetOption(chart) {
        if (!chart || chart.__noRateSetOptionWrapped) return;
        chart.__noRateSetOptionWrapped = true;
        var origSet = chart.setOption.bind(chart);
        chart.setOption = function (option, notMerge, lazyUpdate) {
          return origSet(stripRateFromOption(option), notMerge, lazyUpdate);
        };
      }

      function patchEcharts(win) {
        if (!win || !win.echarts || win.echarts.__noRatePatched) return;
        win.echarts.__noRatePatched = true;
        var origInit = win.echarts.init;
        win.echarts.init = function () {
          var chart = origInit.apply(this, arguments);
          wrapChartSetOption(chart);
          return chart;
        };
      }

      function ensureChartsWrapped(win, doc) {
        if (!win || !win.echarts) return;
        ['chartMain', 'chartTrend'].forEach(function (id) {
          var dom = doc.getElementById(id);
          if (!dom) return;
          var ins = win.echarts.getInstanceByDom(dom);
          wrapChartSetOption(ins);
        });
      }

      function stripRateSeries(win, doc) {
        if (!win.echarts) return;
        var chartIds = ['chartMain', 'chartTrend'];
        chartIds.forEach(function (id) {
          var dom = doc.getElementById(id);
          if (!dom) return;
          var ins = win.echarts.getInstanceByDom(dom);
          if (!ins) return;
          wrapChartSetOption(ins);
          var opt = ins.getOption() || {};
          ins.setOption(stripRateFromOption(opt), true);
        });
      }

      function patchTable(doc) {
        if (doc.getElementById('noRatePatchStyle')) return;
        var style = doc.createElement('style');
        style.id = 'noRatePatchStyle';
        style.textContent = [
          '.kpi.k1, .kpi.k2, .kpi.k3 { display:none !important; }',
          '#thR1, #thR2, #thR3 { display:none !important; }',
          '.rate-cell { display:none !important; }',
          '.right-tools { display:none !important; }',
          '.chart-toolbar { display:none !important; }'
        ].join('\n');
        doc.head.appendChild(style);
      }

      function patchCopy(win, doc) {
        var h2 = doc.querySelector('.chart-panel h2');
        if (h2 && h2.textContent.indexOf('销量预测与达成') > -1) {
          h2.textContent = '销量预测';
        }
      }

      function applyNoRateView(win, doc) {
        if (!win || !doc) return;
        patchEcharts(win);
        ensureChartsWrapped(win, doc);
        hideFilterField(doc, 'filterPredR');
        hideFilterField(doc, 'filterRCompare');
        hideFilterField(doc, 'filterRValue');
        patchCopy(win, doc);
        patchTable(doc);
        stripRateSeries(win, doc);
      }

      frame.addEventListener('load', function () {
        var win = frame.contentWindow;
        var doc = frame.contentDocument;
        if (!win || !doc) return;

        applyNoRateView(win, doc);
        var tries = 0;
        var t = win.setInterval(function () {
          tries++;
          applyNoRateView(win, doc);
          if (tries >= 30) win.clearInterval(t);
        }, 120);
      });
    })();
  </script>
</body>
</html>
