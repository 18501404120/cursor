<html lang="zh-CN">

<style>
:root {

* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); font-size:13px; line-height:1.45; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
.topbar { flex-shrink:0; background:linear-gradient(135deg,#312e81,#4f46e5); color:#fff; padding:14px 24px; }
.topbar h1 { font-size:18px; margin-bottom:3px; }
.topbar p { opacity:.9; font-size:11px; }
.toolbar { flex-shrink:0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 24px; background:#fff; border-bottom:1px solid var(--border); }
.toolbar label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
.btn { border:1px solid var(--border); background:#fff; border-radius:8px; padding:5px 11px; cursor:pointer; font-size:12px; }
.btn:hover { background:#f8fafc; }
.btn.active { background:var(--primary-light); border-color:#a5b4fc; color:var(--primary); font-weight:600; }
.legend { flex-shrink:0; display:flex; flex-wrap:wrap; gap:14px; padding:8px 24px; background:#fff; border-bottom:1px solid var(--border); font-size:11px; color:var(--muted); }
.legend-item { display:flex; align-items:center; gap:6px; }
.swatch { width:14px; height:14px; border-radius:4px; border:1px solid var(--border); }
.canvas-wrap { flex:1; overflow:auto; position:relative; background:#e8ecf4; }
.matrix-container { position:relative; display:inline-block; min-width:100%; padding:12px; }
.matrix { border-collapse:separate; border-spacing:0; table-layout:fixed; }
.matrix th, .matrix td { border:1px solid var(--border); vertical-align:top; }
.corner { position:sticky; left:0; top:0; z-index:40; width:var(--role-w); min-width:var(--role-w); background:#f1f5f9; }
.stage-hdr { position:sticky; top:0; z-index:30; width:var(--col-w); min-width:var(--col-w); height:var(--hdr-h); background:var(--hdr-bg); text-align:center; padding:6px 4px; font-weight:700; font-size:11px; box-shadow:0 2px 4px rgba(0,0,0,.04); }
.stage-hdr .sub { font-weight:400; font-size:9px; color:var(--muted); margin-top:1px; line-height:1.25; }
.stage-hdr.s-CD { background:#f8fafc; border-top:3px solid #94a3b8; }
.stage-hdr.s-KO { background:#eef2ff; border-top:3px solid #6366f1; }
.stage-hdr.s-ES { background:#ecfdf5; border-top:3px solid #10b981; }
.stage-hdr.s-TL { background:#fffbeb; border-top:3px solid #f59e0b; }
.stage-hdr.s-DR { background:#fef2f2; border-top:3px solid #ef4444; }
.stage-hdr.s-BT { background:#f5f3ff; border-top:3px solid #8b5cf6; }
.stage-hdr.s-CR { background:#f0fdf4; border-top:3px solid #22c55e; }
.role-hdr { position:sticky; left:0; z-index:20; width:var(--role-w); min-width:var(--role-w); background:#f8fafc; padding:8px 6px; font-weight:600; font-size:10px; text-align:right; box-shadow:2px 0 4px rgba(0,0,0,.04); }
.cell { width:var(--col-w); min-width:var(--col-w); min-height:72px; padding:var(--cell-inset); background:#fff; position:relative; }
.cell.empty { background:#fafbfc; }
.cell.c-CD { background:#fcfcfd; }
.cell.c-KO { background:#fafaff; }
.cell.c-ES { background:#fafffd; }
.cell.c-TL { background:#fffef8; }
.cell.c-DR { background:#fffafa; }
.cell.c-BT { background:#fdfcff; }
.cell.c-CR { background:#fafffb; }
.cell.has-card { background:#fff; }
.card { background:#fff; border:1px solid var(--border); border-radius:5px; padding:4px 5px; margin:0; cursor:pointer; transition:box-shadow .15s,border-color .15s,opacity .15s; font-size:9.5px; line-height:1.3; position:relative; z-index:10; width:100%; }
.card:last-child { margin-bottom:0; }
.card:hover { box-shadow:0 2px 10px rgba(79,70,229,.1); border-color:#a5b4fc; }
.card.selected { border-color:var(--primary); box-shadow:0 0 0 2px rgba(79,70,229,.2); }
.card.dimmed { opacity:.22; }
.card.iterative { border-left:2px solid var(--warn); }
.card .io { margin-bottom:2px; word-break:break-all; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card .io .tag { display:inline-block; font-size:7px; font-weight:700; padding:0 3px; border-radius:2px; margin-right:2px; vertical-align:top; }
.tag-in { background:#ecfdf5; color:#34d399; }
.tag-out { background:#eff6ff; color:#93c5fd; }
.card .io-text { color:var(--text); }
.card .note { font-size:8px; color:var(--warn); margin-top:2px; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.badge-iter { display:inline-block; background:#fffbeb; color:#b45309; border:1px solid #fcd34d; font-size:7px; padding:0 4px; border-radius:999px; margin-top:2px; }
svg.links { position:absolute; top:12px; left:12px; overflow:visible; z-index:5; }
path.link { fill:none; stroke-linecap:round; stroke-linejoin:round; pointer-events:stroke; stroke-width:1.1; opacity:.88; }
path.link.link-in { stroke:#6ee7b7; }
path.link.link-out { stroke:#93c5fd; }
path.link.cross-stage { stroke-dasharray:6 4; }
path.link.highlight { stroke-width:1.3; }
path.link:hover { stroke-width:1.4; cursor:pointer; }
.link-tip { position:fixed; display:none; background:#1e293b; color:#fff; font-size:11px; padding:6px 10px; border-radius:8px; z-index:300; pointer-events:none; max-width:260px; line-height:1.4; box-shadow:0 4px 16px rgba(0,0,0,.2); }
.scroll-hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); background:rgba(30,41,59,.75); color:#fff; font-size:11px; padding:6px 14px; border-radius:999px; pointer-events:none; z-index:50; opacity:.85; }
.info-panel { position:fixed; right:16px; bottom:16px; width:290px; max-height:340px; overflow:auto; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); padding:14px; display:none; z-index:200; font-size:12px; }
.info-panel.show { display:block; }
.info-panel h3 { font-size:13px; margin-bottom:8px; padding-right:20px; }
.info-panel .close { position:absolute; right:12px; top:12px; cursor:pointer; color:var(--muted); }
.dep-list { margin-top:8px; font-size:11px; color:var(--muted); }
.dep-list ul { max-height:140px; overflow-y:auto; margin-top:4px; padding-left:16px; }
.dep-list li { margin-bottom:3px; }
.panel-io-in .lbl { color:#34d399; font-weight:700; }
.panel-io-out .lbl { color:#93c5fd; font-weight:700; }
.panel-io-in, .panel-io-out { color:var(--text); margin-top:0; }
.panel-io-out { margin-top:6px; }
</style>
</head>

<div class="topbar">
  <h1>H8120 协作泳道图 · 1.0 现状事实</h1>
  <p>横轴=阶段 · 纵轴=角色 · 默认无依赖线 · 点击卡片聚焦上下游 · 线条贴边吸附</p>
</div>
<div class="toolbar">
  <label>角色 <select id="roleFilter"><option value="">全部</option></select></label>
  <label>阶段 <select id="stageFilter"><option value="">全部</option></select></label>
  <label>依赖

      <option value="cross-role">仅跨角色</option>
      <option value="cross-stage">仅跨阶段</option>
      <option value="serial">仅同阶段串行</option>
    </select>
  </label>
  <button class="btn active" id="toggleDeps">聚焦依赖线</button>
  <button class="btn" id="resetView">重置</button>
  <label>缩放 <input type="range" id="zoomRange" min="60" max="120" value="90"/> <span id="zoomVal">90%</span></label>
</div>
<div class="legend">

  <div class="legend-item"><span class="swatch" style="background:#eff6ff;color:#93c5fd;font-size:9px;line-height:14px;text-align:center">出</span>输出（蓝）</div>
  <div class="legend-item"><span class="swatch" style="background:#6ee7b7"></span>上游线（浅绿）</div>
  <div class="legend-item"><span class="swatch" style="background:#93c5fd"></span>下游线（浅蓝）</div>
  <div class="legend-item"><span class="swatch" style="background:repeating-linear-gradient(90deg,#94a3b8 0 3px,transparent 3px 6px)"></span>跨阶段虚线</div>
  <div class="legend-item"><span class="swatch" style="border-left:3px solid #d97706"></span>可迭代</div>
  <div class="legend-item" style="color:#94a3b8">点击卡片显示依赖 · 悬停线条查看交付物</div>
</div>
<div class="canvas-wrap" id="canvasWrap">

    <svg class="links" id="linkSvg"><defs>
      <marker id="arrow-in" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6ee7b7"/></marker>
      <marker id="arrow-out" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#93c5fd"/></marker>
    </defs></svg>
  </div>
</div>

<div class="info-panel" id="infoPanel">

  <div id="infoBody"></div>
</div>

const ROLE_ORDER = ["PM", "ID", "结构工程师", "制冷工程师", "电子工程师", "嵌入式软件工程师", "嵌入式软件测试工程师", "软件产品经理（APP）", "硬件测试工程师", "Sourcing", "DQE", "NPI", "认证工程师", "专利工程师", "包装工程师", "项目经理", "PMC", "SQE"];
const stages = DATA.stages;

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function buildFilters() {
  const rf=document.getElementById('roleFilter'), sf=document.getElementById('stageFilter');
  ROLE_ORDER.forEach(r=>{ const o=document.createElement('option'); o.value=r; o.textContent=r; rf.appendChild(o); });
  stages.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sf.appendChild(o); });
}

function getFilteredRecords() {
  const role=document.getElementById('roleFilter').value;
  const stage=document.getElementById('stageFilter').value;
  return DATA.records.filter(r=>(!role||r.role===role)&&(!stage||r.stage===stage));
}

function getVisibleRoles(records) {
  if (!document.getElementById('roleFilter').value) return ROLE_ORDER;
  return ROLE_ORDER.filter(r=>records.some(x=>x.role===r));
}

function getVisibleStages(records) {
  if (!document.getElementById('stageFilter').value) return stages;
  return stages.filter(s=>records.some(x=>x.stage===s));
}

function renderMatrix() {
  const records=getFilteredRecords();
  const visibleIds=new Set(records.map(r=>r.id));
  const visRoles=getVisibleRoles(records);
  const visStages=getVisibleStages(records);
  const matrix=document.getElementById('matrix');
  let html='<thead><tr><th class="corner">角色 ↓<br/>阶段 →</th>';
  visStages.forEach(s=>{
    const sub=(stageLabels[s]||'').replace(s+' · ','');
    html+=`<th class="stage-hdr s-${s}">${esc(s)}<div class="sub">${esc(sub)}</div></th>`;
  });
  html+='</tr></thead><tbody>';
  visRoles.forEach(role=>{
    html+=`<tr><th class="role-hdr">${esc(role)}</th>`;
    visStages.forEach(stage=>{
      const cellRecs=records.filter(r=>r.role===role&&r.stage===stage);
      const cls=`cell c-${stage}`+(cellRecs.length?' has-card':' empty');
      html+=`<td class="${cls}" data-role="${esc(role)}" data-stage="${stage}">`;
      cellRecs.forEach(r=>{
        const tip=(r.input||'—')+' → '+(r.output||'—');
        html+=`<div class="card${r.iterative?' iterative':''}" id="card-${r.id}" data-id="${r.id}" title="${esc(tip)}">
          <div class="io"><span class="tag tag-in">入</span><span class="io-text">${esc(r.input||'—')}</span></div>
          <div class="io"><span class="tag tag-out">出</span><span class="io-text">${esc(r.output||'—')}</span></div>
          ${r.note?`<div class="note">${esc(r.note)}</div>`:''}
          ${r.iterative?'<span class="badge-iter">↻ 可迭代</span>':''}
        </div>`;
      });
      html+='</td>';
    });
    html+='</tr>';
  });
  html+='</tbody>';
  matrix.innerHTML=html;
  matrix.querySelectorAll('.card').forEach(c=>{
    c.onclick=e=>{ e.stopPropagation(); selectCard(c.dataset.id); };
  });
  requestAnimationFrame(()=>renderLinks(visibleIds));
  return visibleIds;
}

function getAnchor(id) {
  const el=document.getElementById('card-'+id);
  if(!el) return null;
  const container=document.getElementById('matrixContainer');
  const cr=container.getBoundingClientRect();
  const pad=12;
  const r=el.getBoundingClientRect();
  const rec=DATA.records.find(x=>x.id===id);
  const left=r.left-cr.left-pad, top=r.top-cr.top-pad;
  const right=r.right-cr.left-pad, bottom=r.bottom-cr.top-pad;
  return {
    right, left, top, bottom,
    cx:(left+right)/2, cy:(top+bottom)/2,
    stage:rec.stage, role:rec.role,
  };
}

function assignLaneOffsets(deps, selected) {
  const stageIdx = Object.fromEntries(stages.map((s, i) => [s, i]));
  const roleIdx = Object.fromEntries(ROLE_ORDER.map((r, i) => [r, i]));
  const groups = {};
  deps.forEach((d, i) => {
    d._i = i;
    const isIn = d.to === selected;
    const fa = DATA.records.find(r => r.id === d.from);
    const tb = DATA.records.find(r => r.id === d.to);
    const cross = stageIdx[tb.stage] !== stageIdx[fa.stage];
    const key = (isIn ? 'in' : 'out') + '-' + (cross ? 'cross' : 'same') + '|' + fa.stage + '|' + tb.stage;
    (groups[key] ||= []).push(d);
  });
  Object.values(groups).forEach(arr => {
    const isIn = arr[0].to === selected;
    arr.sort((a, b) => {
      const af = DATA.records.find(r => r.id === a.from);
      const at = DATA.records.find(r => r.id === a.to);
      const bf = DATA.records.find(r => r.id === b.from);
      const bt = DATA.records.find(r => r.id === b.to);
      if (isIn) return roleIdx[af.role] - roleIdx[bf.role] || a._i - b._i;
      return roleIdx[at.role] - roleIdx[bt.role] || a._i - b._i;
    });
    arr.forEach((d, i) => { d.laneIdx = i; });
  });
}

function buildOrthogonalPath(a, b, d, stageIdx, roleIdx, isIn) {

  const sameRole = a.role === b.role;
  const lane = (d.laneIdx || 0) * 5;
  const xIn = Math.min(a.left, b.left) + 5 + lane;
  const xOut = Math.max(a.right, b.right) - 5 - lane;

  if (crossStage) {
    const y1 = a.cy, y2 = b.cy;
    const xMid = (a.right + b.left) / 2 + (isIn ? -lane : lane);
    if (isIn) {
      return `M${a.right} ${y1} H${xMid} V${y2} H${b.left}`;
    }
    return `M${a.right} ${y1} H${xMid} V${y2} H${b.left}`;
  }
  if (sameStage && !sameRole) {
    const vertDown = b.cy > a.cy;
    const x = isIn ? xIn : xOut;
    if (vertDown) return `M${x} ${a.bottom} V${b.top}`;
    return `M${x} ${a.top} V${b.bottom}`;
  }
  if (isIn) {
    return `M${xIn} ${a.bottom} V${b.top}`;
  }
  return `M${xOut} ${a.bottom} V${b.top}`;
}

function renderLinks(visibleIds) {
  const svg = document.getElementById('linkSvg');
  const table = document.getElementById('matrix');
  svg.setAttribute('width', table.offsetWidth);
  svg.setAttribute('height', table.offsetHeight);
  [...svg.querySelectorAll('path.link')].forEach(p => p.remove());
  if (!document.getElementById('toggleDeps').classList.contains('active')) return;

  const selected = window._selectedId;
  if (!selected) return;

  const depMode = document.getElementById('depFilter').value;
  const stageIdx = Object.fromEntries(stages.map((s, i) => [s, i]));
  const roleIdx = Object.fromEntries(ROLE_ORDER.map((r, i) => [r, i]));
  const tip = document.getElementById('linkTip');

  const toDraw = DATA.deps.filter(d => {
    if (!visibleIds.has(d.from) || !visibleIds.has(d.to)) return false;
    if (d.from !== selected && d.to !== selected) return false;
    if (depMode === 'cross-role' && !d.cross_role) return false;
    if (depMode === 'cross-stage' && !d.cross_stage) return false;
    if (depMode === 'serial' && !(d.same_stage && d.cross_role)) return false;
    return true;
  });
  assignLaneOffsets(toDraw, selected);

  toDraw.forEach(d => {
    const a = getAnchor(d.from), b = getAnchor(d.to);
    if (!a || !b) return;

    const isIn = d.to === selected;
    const pathD = buildOrthogonalPath(a, b, d, stageIdx, roleIdx, isIn);
    const cls = ['link', isIn ? 'link-in' : 'link-out'];
    if (d.cross_stage) cls.push('cross-stage');
    const marker = isIn ? 'url(#arrow-in)' : 'url(#arrow-out)';

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', pathD);
    path.setAttribute('class', cls.join(' '));
    path.setAttribute('marker-end', marker);
    path.dataset.label = (d.labels || []).join('；') || '';
    path.onmouseenter = e => {
      if (!path.dataset.label) return;
      tip.textContent = path.dataset.label;
      tip.style.display = 'block';
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = (e.clientY + 12) + 'px';
      path.classList.add('highlight');
    };
    path.onmousemove = e => {
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = (e.clientY + 12) + 'px';
    };
    path.onmouseleave = () => {
      tip.style.display = 'none';
      path.classList.remove('highlight');
    };
    svg.appendChild(path);
  });
}

function getRelatedIds(id) {
  const related=new Set([id]);
  DATA.deps.forEach(d=>{ if(d.from===id) related.add(d.to); if(d.to===id) related.add(d.from); });
  return related;
}

function uniqueDepRecords(deps, key) {
  const seen = new Set();
  return deps.map(d => DATA.records.find(r => r.id === d[key])).filter(r => {
    if (!r || seen.has(r.id)) return false;
    seen.add(r.id);
    return true;
  });
}

function selectCard(id) {
  window._selectedId=window._selectedId===id?null:id;
  const rec=DATA.records.find(r=>r.id===id);
  const related=window._selectedId?getRelatedIds(window._selectedId):null;
  document.querySelectorAll('.card').forEach(c=>{
    c.classList.toggle('selected', c.dataset.id===window._selectedId);
    c.classList.toggle('dimmed', related&&!related.has(c.dataset.id));
  });
  const panel=document.getElementById('infoPanel');
  if(!window._selectedId){ panel.classList.remove('show'); renderLinks(new Set(getFilteredRecords().map(r=>r.id))); return; }
  panel.classList.add('show');
  document.getElementById('infoTitle').textContent=rec.stage+' · '+rec.role;
  const up=uniqueDepRecords(DATA.deps.filter(d=>d.to===id), 'from');
  const down=uniqueDepRecords(DATA.deps.filter(d=>d.from===id), 'to');
  const renderDepList=(list)=>list.map(r=>`<li>${esc(r.stage)}·${esc(r.role)}</li>`).join('')||'<li>—</li>';
  document.getElementById('infoBody').innerHTML=`
    <p class="panel-io-in"><span class="lbl">入：</span>${esc(rec.input)}</p>
    <p class="panel-io-out"><span class="lbl">出：</span>${esc(rec.output)}</p>
    ${rec.note?`<p style="margin-top:6px;color:#b45309"><b>注：</b>${esc(rec.note)}</p>`:''}
    <div class="dep-list"><b>上游 ${up.length}</b><ul>${renderDepList(up)}</ul></div>
    <div class="dep-list"><b>下游 ${down.length}</b><ul>${renderDepList(down)}</ul></div>`;
  renderLinks(new Set(getFilteredRecords().map(r=>r.id)));
}

function applyZoom() {
  const s = document.getElementById('zoomRange').value / 100;
  document.documentElement.style.setProperty('--col-w', Math.round(210 * s) + 'px');
  document.documentElement.style.setProperty('--role-w', Math.round(136 * s) + 'px');
  document.documentElement.style.setProperty('--cell-inset', Math.round(14 * s) + 'px');
  document.documentElement.style.setProperty('--hdr-h', Math.round(46 * s) + 'px');
  document.getElementById('zoomVal').textContent = Math.round(s * 100) + '%';
  requestAnimationFrame(() => renderLinks(new Set(getFilteredRecords().map(r => r.id))));
}

function render(){ renderMatrix(); }

document.getElementById('roleFilter').onchange=render;
document.getElementById('stageFilter').onchange=render;
document.getElementById('depFilter').onchange=render;
document.getElementById('toggleDeps').onclick=function(){ this.classList.toggle('active'); render(); };
document.getElementById('resetView').onclick=()=>{
  window._selectedId=null; document.getElementById('infoPanel').classList.remove('show');
  document.getElementById('roleFilter').value=''; document.getElementById('stageFilter').value='';
  document.getElementById('zoomRange').value=90; document.getElementById('canvasWrap').scrollTo(0,0);
  applyZoom(); render();
};
document.getElementById('closePanel').onclick=()=>{ window._selectedId=null; document.getElementById('infoPanel').classList.remove('show'); document.getElementById('linkTip').style.display='none'; renderLinks(new Set(getFilteredRecords().map(r=>r.id))); };
document.getElementById('zoomRange').oninput=applyZoom;
document.getElementById('canvasWrap').addEventListener('click', e => {
  if (e.target.closest('.card') || e.target.closest('.info-panel') || e.target.closest('select') || e.target.closest('button') || e.target.closest('input')) return;
  if (!window._selectedId) return;
  window._selectedId = null;
  document.getElementById('infoPanel').classList.remove('show');
  document.getElementById('linkTip').style.display = 'none';
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected', 'dimmed'));
  renderLinks(new Set(getFilteredRecords().map(r => r.id)));
});
document.getElementById('canvasWrap').addEventListener('scroll',()=>{
  requestAnimationFrame(()=>renderLinks(new Set(getFilteredRecords().map(r=>r.id))));
});
window.addEventListener('resize',()=>renderLinks(new Set(getFilteredRecords().map(r=>r.id))));

buildFilters();
applyZoom();
render();
</script>
</body>
