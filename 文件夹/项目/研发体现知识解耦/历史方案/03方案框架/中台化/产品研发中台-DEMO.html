<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品研发中台 · DEMO</title>
  <style>
    :root {
      --bg: #f3f5fa;
      --card: #fff;
      --text: #172033;
      --muted: #657187;
      --line: #e2e8f1;
      --primary: #335cff;
      --primary-soft: #eef2ff;
      --green: #087c60;
      --green-soft: #eaf8f3;
      --amber: #a96100;
      --amber-soft: #fff5df;
      --navy: #1d2a57;
      --draft: #94a3b8;
      --draft-soft: #f1f5f9;
      --shadow: 0 8px 24px rgba(28, 39, 66, .07);
      --radius: 12px;
      --sidebar: 220px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100%; }

    .side { color: #d7def0; background: var(--navy); padding: 18px 14px; }
    .brand { padding: 4px 8px 18px; }
    .brand small { display: block; opacity: .55; letter-spacing: .08em; font-size: 10px; }
    .brand b { display: block; margin-top: 4px; color: #fff; font-size: 16px; }
    .nav-btn {
      display: block; width: 100%; margin-bottom: 6px; padding: 10px 12px;
      color: #c9d3ea; background: transparent; border: 0; border-radius: 8px; text-align: left;
    }
    .nav-btn:hover { background: rgba(255,255,255,.06); color: #fff; }
    .nav-btn.active { color: #fff; background: #335cff; }
    .side-foot { margin-top: 24px; padding: 10px 12px; color: #9aa6c4; background: rgba(255,255,255,.05); border-radius: 8px; font-size: 11px; }

    .main { min-width: 0; }
    .top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 22px; background: #fff; border-bottom: 1px solid var(--line);
    }
    .top h1 { margin: 0; font-size: 16px; }
    .top p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .workspace { padding: 20px 22px 40px; }
    .view { display: none; }
    .view.show { display: block; }

    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .stat {
      padding: 16px 18px; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .stat b { display: block; margin-top: 4px; font-size: 24px; line-height: 1.2; }
    .stat span { color: var(--muted); font-size: 12px; }

    .card {
      padding: 16px 18px; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }
    .grid-2 { display: grid; grid-template-columns: 1.15fr .85fr; gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .muted { color: var(--muted); }
    h2 { margin: 0 0 10px; font-size: 15px; }
    h3 { margin: 0 0 8px; font-size: 14px; }

    .btn { padding: 7px 12px; color: var(--text); background: #fff; border: 1px solid var(--line); border-radius: 8px; }
    .btn:hover { border-color: #9bacef; }
    .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn.green { color: #fff; background: var(--green); border-color: var(--green); }
    .btn.ghost { background: transparent; }
    .btn.danger { color: #8d2835; }

    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .tag.reuse { color: #08674f; background: var(--green-soft); }
    .tag.change { color: #805000; background: var(--amber-soft); }
    .tag.fresh { color: #27469f; background: var(--primary-soft); }
    .tag.drop { color: #5c6b7f; background: #f1f4f8; }
    .tag.idle { color: #5c6b7f; background: #f1f4f8; }
    .tag.draft { color: #64748b; background: var(--draft-soft); }
    .tag.released { color: #08674f; background: var(--green-soft); }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 8px 8px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); background: #f8fafc; font-size: 11px; }

    .search {
      width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    .split { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 12px; min-height: 560px; }
    .tree {
      padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: auto;
    }
    .tree-node {
      display: block; width: 100%; margin: 1px 0; padding: 6px 8px; color: var(--text);
      background: transparent; border: 0; border-radius: 6px; text-align: left;
    }
    .tree-node:hover { background: #f4f7ff; }
    .tree-node.on { color: var(--primary); background: var(--primary-soft); font-weight: 700; }
    .tree-node .meta { color: var(--muted); font-weight: 500; font-size: 11px; }
    .mod-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .mod-card {
      padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; cursor: pointer;
      border-left: 4px solid var(--draft);
    }
    .mod-card.released { border-left-color: var(--green); }
    .mod-card:hover { border-color: #9bacef; }
    .mod-card h3 { margin: 6px 0 6px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .mini { padding: 3px 7px; background: #f8fafc; border: 1px solid var(--line); border-radius: 6px; font-size: 11px; }

    .steps { display: flex; gap: 8px; margin-bottom: 14px; }
    .step {
      flex: 1; padding: 8px 10px; color: var(--muted); background: #fff; border: 1px solid var(--line);
      border-radius: 8px; text-align: center; font-size: 12px; font-weight: 700;
    }
    .step.on { color: #fff; background: var(--primary); border-color: var(--primary); }
    .step.done { color: #08674f; background: var(--green-soft); border-color: #b7e4d4; }
    .field { margin-bottom: 10px; }
    .field label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 11px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff;
    }
    .decide { display: grid; gap: 12px; }
    .decide-item { padding: 14px; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; }
    .decide-item.dropped { opacity: .55; }
    .decide-ops { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .opt { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .opt.on.reuse { color: #08674f; background: var(--green-soft); border-color: #b7e4d4; }
    .opt.on.change { color: #805000; background: var(--amber-soft); border-color: #f0d59a; }
    .opt.on.fresh { color: #27469f; background: var(--primary-soft); border-color: #c7d4ff; }
    .opt.on.drop { color: #5c6b7f; background: #f1f4f8; }

    .sku-pick {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
    }
    .sku-card {
      padding: 14px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px;
    }
    .sku-card:hover, .sku-card.on { border-color: var(--primary); background: var(--primary-soft); }
    .focus-box {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px;
    }
    .focus-item { padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; text-align: center; }
    .focus-item b { display: block; font-size: 22px; line-height: 1.2; }
    .focus-item.hot { border-color: #c7d4ff; background: var(--primary-soft); }

    .mask {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      padding: 20px; background: rgba(23, 32, 51, .4); z-index: 40;
    }
    .mask.show { display: flex; }
    .dialog {
      width: 760px; max-width: 100%; max-height: 90vh; overflow: auto;
      background: #fff; border-radius: 14px; box-shadow: var(--shadow);
    }
    .dh, .df { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; }
    .dh { border-bottom: 1px solid var(--line); font-weight: 700; }
    .df { border-top: 1px solid var(--line); justify-content: flex-end; gap: 8px; }
    .db { padding: 16px 18px; }

    .toast {
      position: fixed; right: 20px; bottom: 20px; display: none;
      padding: 10px 14px; color: #fff; background: #1d2a57; border-radius: 8px; z-index: 50;
    }
    .toast.show { display: block; }
    .hint { padding: 10px 12px; color: #27469f; background: var(--primary-soft); border-radius: 8px; font-size: 12px; }
    .okbox { padding: 10px 12px; color: #08674f; background: var(--green-soft); border-radius: 8px; font-size: 12px; }
    .crumb { margin-bottom: 10px; color: var(--muted); font-size: 12px; }

    @media (max-width: 1100px) {
      .split, .grid-2, .grid-3, .mod-grid, .stats, .sku-pick, .focus-box { grid-template-columns: 1fr; }
      .app { grid-template-columns: 1fr; }
      .side { display: flex; flex-wrap: wrap; gap: 8px; }
      .brand, .side-foot { width: 100%; }
      .nav-btn { width: auto; }
    }
  </style>
</head>

  <div class="app">

        <b>产品研发中台</b>

          { domain: "结构", family: "灯体结构", moduleId: "STR-S1", decision: "fresh" },
          { domain: "嵌入式", family: "控制固件", moduleId: "FW-F1", decision: "reuse" }
        ]
      },
      {
        model: "H6052", name: "台灯", category: "照明", series: "台灯", launched: "2025-09", status: "released",
        modules: [
          { domain: "光学", family: "灯珠", moduleId: "LED-02", decision: "reuse" },
          { domain: "电子", family: "电源驱动", moduleId: "PSU-C", decision: "reuse" },
          { domain: "结构", family: "灯体结构", moduleId: "STR-S4", decision: "fresh" },
          { domain: "嵌入式", family: "控制固件", moduleId: "FW-F2", decision: "reuse" }
        ]
      },
      {
        model: "H8120", name: "制冰机", category: "家电", series: "制冰", launched: "2025-11", status: "released",
        modules: [
          { domain: "结构", family: "箱体结构", moduleId: "BOX-H1", decision: "fresh" },
          { domain: "电子", family: "电控", moduleId: "ELC-H1", decision: "fresh" },
          { domain: "制冷", family: "制冷系统", moduleId: "RF-01", decision: "fresh" },
          { domain: "嵌入式", family: "控制固件", moduleId: "FW-H1", decision: "fresh" }
        ]
      }
    ]);

    function cloneRowsFrom(product, story) {
      const rows = product.modules.map((x) => ({
        domain: x.domain,
        family: x.family,
        moduleId: x.moduleId,
        decision: "reuse",
        note: `继承 ${product.model} 已定稿模块 ${x.moduleId}`,
        kept: true
      }));
      if (story === "H6199") {
        const psu = rows.find((r) => r.domain === "电子");
        if (psu) {
          psu.decision = "change";
          psu.note = "H6076 电源方案B 只到 10% 调光，H6199 需要 1% 深调。";
        }
        rows.push({
          domain: "嵌入式", family: "传感", moduleId: "", decision: "fresh", kept: true,
          note: "新品要人体感应，货架没有现成方案，先作为 PRD 模块概念。"
        });
      }
      if (story === "H8121") {
        const rf = rows.find((r) => r.domain === "制冷");
        if (rf) {
          rf.decision = "reuse";
          rf.note = "H8120 制冷方案R1 冰量满足，ES 已验证，直接复用。";
        }
        const box = rows.find((r) => r.domain === "结构");
        if (box) {
          box.decision = "change";
          box.note = "外观和储冰仓要改，基于箱体方案H1 二次开发。";
        }
      }
      return rows;
    }

    const seedMatch = () => {
      const source = seedProducts().find((p) => p.model === "H6076");
      return {
        sourceModel: "H6076",
        model: "H6199",
        name: "落地灯 Max",
        category: "照明",
        series: "落地灯",
        launch: "2026-12",
        status: "待匹配",
        step: 1,
        rows: cloneRowsFrom(source, "H6199")
      };
    };

    const state = {
      view: "home",
      modules: seedModules(),
      products: seedProducts(),
      match: seedMatch(),
      shelfQuery: "",
      shelfNode: "all",
      prodQuery: "",
      prodNode: "all"
    };

    const decLabel = { reuse: "复用", change: "二次开发", fresh: "新做", drop: "去掉" };
    const stLabel = { draft: "未定稿", released: "定稿" };
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function toast(text) {
      const el = $("toast");
      el.textContent = text;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 1800);
    }
    function closeDialog() { $("mask").classList.remove("show"); }
    function openDialog(html) { $("dialog").innerHTML = html; $("mask").classList.add("show"); }
    function moduleById(id) { return state.modules.find((m) => m.id === id); }
    function productByModel(model) { return state.products.find((p) => p.model === model); }
    function activeRows() { return state.match.rows.filter((r) => r.kept && r.decision !== "drop"); }
    function incrementRows() { return activeRows().filter((r) => r.decision !== "reuse"); }
    function reuseRows() { return activeRows().filter((r) => r.decision === "reuse"); }
    function specSummary(m) {
      const s = m.specs || {};
      if (m.domain === "光学") return [s.watt, s.cct, "CRI" + s.cri, s.dimming].filter(Boolean);
      if (m.domain === "电子") return [s.pout || s.vin, s.dimMethod, s.dimRange].filter(Boolean);
      if (m.domain === "结构") return [s.mount, s.size, s.ip].filter(Boolean);
      if (m.domain === "制冷") return [s.ice, s.refrigerant, s.coolPower].filter(Boolean);
      if (m.family === "传感") return [s.sense, s.range].filter(Boolean);
      return [s.control, s.channels, s.protocol].filter(Boolean);
    }
    function specTable(specs) {
      return `<table><tbody>${Object.entries(specs || {}).map(([k, v]) => `<tr><th style="width:28%">${SPEC_LABEL[k] || k}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table>`;
    }
    function moduleHaystack(m) {
      return [m.id, m.name, m.family, m.domain, m.category, m.capability, m.status, ...(m.products || []), ...Object.values(m.specs || {}), ...(m.docs || [])].join(" ").toLowerCase();
    }
    function productHaystack(p) {
      const mods = p.modules.map((x) => moduleById(x.moduleId)?.name || "").join(" ");
      return [p.model, p.name, p.series, p.category, p.launched, p.status, mods].join(" ").toLowerCase();
    }
    function statusTag(status) {
      return `<span class="tag ${status === "released" ? "released" : "draft"}">${stLabel[status] || "未定稿"}</span>`;
    }

    function showView(name) {
      state.view = name;
      document.querySelectorAll(".nav-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.view === name));
      document.querySelectorAll(".view").forEach((el) => el.classList.remove("show"));
      $("view-" + name).classList.add("show");
      $("pageTitle").textContent = TITLES[name][0];
      $("pageDesc").textContent = TITLES[name][1];
      render();
    }

    function render() {
      renderHome();
      renderShelf();
      renderMatch();
      renderProducts();
    }

    function renderHome() {
      const releasedMod = state.modules.filter((m) => m.status === "released").length;
      const draftMod = state.modules.filter((m) => m.status !== "released").length;
      const releasedProd = state.products.filter((p) => p.status === "released").length;
      const pending = state.match.status === "已上市回写" ? 0 : 1;
      $("view-home").innerHTML = `
        <div class="stats">
          <div class="stat"><span>定稿模块 · 绿</span><b>${releasedMod}</b></div>
          <div class="stat"><span>未定稿模块 · 灰</span><b>${draftMod}</b></div>
          <div class="stat"><span>定稿产品方案</span><b>${releasedProd}</b></div>
          <div class="stat"><span>待匹配 SKU</span><b>${pending}</b></div>
        </div>
        <div class="grid-2" style="margin-top:14px">
          <article class="card">
            <h2>待处理</h2>
            ${pending ? `
              <p>硬件产品经理要做 <strong>${state.match.name}</strong>（${state.match.model}）。建议从已定稿的 <strong>${state.match.sourceModel}</strong> 起步。</p>
              <p class="muted">先看见历史模块组合，再决定删哪些、改哪些、新做哪些。</p>
              <button class="btn primary" type="button" id="goMatch">从历史 SKU 匹配</button>
            ` : `<div class="okbox">${state.match.model} 已上市回写。新增模块已从灰色未定稿变为绿色定稿，产品方案库可按 model 回看。</div>`}
          </article>
          <article class="card">
            <h2>货架怎么变厚</h2>
            <p class="muted">照明：光学 / 电子 / 结构 / 嵌入式。家电：结构 / 电子 / <strong>制冷</strong> / 嵌入式。</p>
            <p class="muted">已定稿 SKU：H6091、H6076、H6052、H8120。下一款默认演示 H6076 → H6199。</p>
            <p class="muted">灰色方案不能当正式复用基线；立项后先挂未定稿，回写后变绿。</p>
          </article>
        </div>
      `;
      const go = $("goMatch");
      if (go) go.onclick = () => showView("match");
    }

    function shelfFilter() {
      const q = state.shelfQuery.trim().toLowerCase();
      const node = state.shelfNode;
      return state.modules.filter((m) => {
        if (q && !moduleHaystack(m).includes(q)) return false;
        if (node === "all") return true;
        if (node.startsWith("c:")) return m.category === node.slice(2);
        if (node.startsWith("d:")) {
          const [cat, domain] = node.slice(2).split("/");
          return m.category === cat && m.domain === domain;
        }
        if (node.startsWith("f:")) {
          const [cat, domain, family] = node.slice(2).split("/");
          return m.category === cat && m.domain === domain && m.family === family;
        }
        return true;
      });
    }

    function renderShelfTree() {
      const counts = (pred) => state.modules.filter(pred).length;
      let html = `<button class="tree-node ${state.shelfNode === "all" ? "on" : ""}" data-node="all" type="button">全部品类 <span class="meta">${state.modules.length}</span></button>`;
      Object.keys(FAMILIES).forEach((cat) => {
        html += `<button class="tree-node ${state.shelfNode === "c:" + cat ? "on" : ""}" data-node="c:${cat}" type="button" style="padding-left:12px">${cat} <span class="meta">${counts((m) => m.category === cat)}</span></button>`;
        Object.keys(FAMILIES[cat]).forEach((domain) => {
          html += `<button class="tree-node ${state.shelfNode === "d:" + cat + "/" + domain ? "on" : ""}" data-node="d:${cat}/${domain}" type="button" style="padding-left:24px">${domain} <span class="meta">${counts((m) => m.category === cat && m.domain === domain)}</span></button>`;
          FAMILIES[cat][domain].forEach((family) => {
            html += `<button class="tree-node ${state.shelfNode === "f:" + cat + "/" + domain + "/" + family ? "on" : ""}" data-node="f:${cat}/${domain}/${family}" type="button" style="padding-left:36px">${family} <span class="meta">${counts((m) => m.category === cat && m.domain === domain && m.family === family)}</span></button>`;
          });
        });
      });
      return html;
    }

    function renderShelf() {
      const list = shelfFilter();
      $("view-shelf").innerHTML = `
        <div class="split">
          <aside class="tree" id="shelfTree">${renderShelfTree()}</aside>
          <div>
            <div class="row" style="margin-bottom:10px">
              <input class="search" id="shelfSearch" placeholder="搜索方案、制冷、H8120、未定稿、1%">
              <button class="btn primary" type="button" id="addModule">新增方案</button>
            </div>
            <div class="crumb">${list.length} 条 · 左边绿条是定稿，灰条是未定稿</div>
            <div class="mod-grid">
              ${list.map((m) => `
                <article class="mod-card ${m.status === "released" ? "released" : ""}" data-id="${m.id}">
                  <div class="row">${statusTag(m.status)}<span class="tag idle">${m.category}</span><span class="tag idle">${m.domain}</span></div>
                  <h3>${esc(m.name)}</h3>
                  <div class="chips">${specSummary(m).map((x) => `<span class="mini">${esc(x)}</span>`).join("")}</div>
                  <div class="muted">已挂 ${m.products.join("、") || "尚未挂 model"}</div>
                </article>
              `).join("") || `<div class="muted">没有匹配的方案。</div>`}
            </div>
          </div>
        </div>
      `;
      $("shelfSearch").value = state.shelfQuery;
      $("shelfSearch").oninput = (e) => { state.shelfQuery = e.target.value; renderShelf(); };
      $("addModule").onclick = openAddModule;
      $("shelfTree").querySelectorAll("[data-node]").forEach((btn) => {
        btn.onclick = () => { state.shelfNode = btn.dataset.node; renderShelf(); };
      });
      $("view-shelf").querySelectorAll(".mod-card").forEach((card) => {
        card.onclick = () => openModule(card.dataset.id);
      });
    }

    function openModule(id) {
      const m = moduleById(id);
      if (!m) return;
      openDialog(`
        <div class="dh"><span>${esc(m.name)}</span><button class="btn ghost" type="button" id="dlgClose">关闭</button></div>
        <div class="db">
          <p>${statusTag(m.status)} <span class="tag idle">${m.category}</span> <span class="tag idle">${m.domain}</span> <span class="tag idle">${m.family}</span> <strong>${m.id}</strong></p>
          <p class="muted">${esc(m.capability)}</p>
          <h3>结构化指标</h3>
          ${specTable(m.specs)}
          <div class="field" style="margin-top:12px"><label>已挂 model</label><div>${m.products.join("、") || "—"}</div></div>
          <div class="field"><label>关联文档</label><div>${m.docs.join("、") || "—"}</div></div>
        </div>
        <div class="df"><button class="btn" type="button" id="dlgEdit">编辑名称与能力</button></div>
      `);
      $("dlgClose").onclick = closeDialog;
      $("dlgEdit").onclick = () => openEditModule(id);
    }

    function moduleForm(m, mode) {
      const isEdit = mode === "edit";
      const cats = Object.keys(FAMILIES);
      openDialog(`
        <div class="dh"><span>${isEdit ? "编辑模块方案" : "新增模块方案"}</span><button class="btn ghost" type="button" id="dlgClose">关闭</button></div>
        <div class="db">
          <div class="field"><label>名称</label><input id="fName" value="${esc(m?.name || "")}"></div>
          <div class="field"><label>品类</label>
            <select id="fCat">${cats.map((c) => `<option ${m?.category === c ? "selected" : ""}>${c}</option>`).join("")}</select>
          </div>
          <div class="field"><label>专业域</label><select id="fDomain"></select></div>
          <div class="field"><label>方案族</label><select id="fFamily"></select></div>
          <div class="field"><label>状态</label>
            <select id="fStatus">
              <option value="draft" ${m?.status !== "released" ? "selected" : ""}>未定稿</option>
              <option value="released" ${m?.status === "released" ? "selected" : ""}>定稿</option>
            </select>
          </div>
          <div class="field"><label>通用能力</label><input id="fCap" value="${esc(m?.capability || "")}"></div>
          <div class="field"><label>关联文档</label><input id="fDocs" value="${esc(m?.docs?.join("、") || "")}"></div>
        </div>
        <div class="df"><button class="btn primary" type="button" id="dlgSave">保存</button></div>
      `);
      const fillDomain = () => {
        const cat = $("fCat").value;
        const domains = Object.keys(FAMILIES[cat] || {});
        $("fDomain").innerHTML = domains.map((d) => `<option ${m?.domain === d ? "selected" : ""}>${d}</option>`).join("");
        fillFamily();
      };
      const fillFamily = () => {
        const cat = $("fCat").value;
        const domain = $("fDomain").value;
        const families = (FAMILIES[cat] || {})[domain] || [];
        $("fFamily").innerHTML = families.map((f) => `<option ${m?.family === f ? "selected" : ""}>${f}</option>`).join("");
      };
      fillDomain();
      $("fCat").onchange = fillDomain;
      $("fDomain").onchange = fillFamily;
      $("dlgClose").onclick = closeDialog;
      $("dlgSave").onclick = () => {
        const payload = {
          name: $("fName").value.trim(),
          category: $("fCat").value,
          domain: $("fDomain").value,
          family: $("fFamily").value,
          status: $("fStatus").value,
          capability: $("fCap").value.trim(),
          docs: $("fDocs").value.split("、").map((s) => s.trim()).filter(Boolean)
        };
        if (!payload.name) { toast("请填写方案名称"); return; }
        if (isEdit) Object.assign(m, payload);
        else state.modules.unshift({ id: "NEW-" + Date.now().toString().slice(-4), products: [], specs: {}, ...payload });
        closeDialog();
        toast("模块方案已保存");
        render();
      };
    }
    function openAddModule() { moduleForm({ status: "draft" }, "add"); }
    function openEditModule(id) { moduleForm(moduleById(id), "edit"); }

    function applySource(model) {
      const source = productByModel(model);
      const m = state.match;
      if (!source) {
        m.sourceModel = "";
        m.category = "照明";
        m.series = "新品";
        m.rows = [];
        return;
      }
      m.sourceModel = source.model;
      m.category = source.category;
      m.series = source.series;
      const story = source.model === "H6076" ? "H6199" : source.model === "H8120" ? "H8121" : "";
      if (story === "H6199") {
        m.model = "H6199";
        m.name = "落地灯 Max";
      } else if (story === "H8121") {
        m.model = "H8121";
        m.name = "制冰机 Mini";
      } else {
        m.model = source.model.replace(/\d+$/, (n) => String(Number(n) + 1).padStart(n.length, "0"));
        m.name = source.name + " 改款";
      }
      m.rows = cloneRowsFrom(source, story);
    }

    function addMatchRow() {
      const cat = state.match.category || "照明";
      const domain = Object.keys(FAMILIES[cat] || { 结构: [] })[0];
      const family = (FAMILIES[cat][domain] || [""])[0];
      state.match.rows.push({
        domain, family, moduleId: "", decision: "fresh", kept: true,
        note: "新增模块概念，货架若无现成方案则新做。"
      });
    }

    function renderMatch() {
      const m = state.match;
      const step = m.step;
      const released = state.products.filter((p) => p.status === "released");
      let body = "";
      if (step === 1) {
        body = `
          <div class="hint" style="margin-bottom:12px">不要从空白 PRD 开工。先选一个已定稿 SKU，带出它的模块组合。</div>
          <div class="sku-pick">
            ${released.map((p) => `
              <button class="sku-card ${m.sourceModel === p.model ? "on" : ""}" type="button" data-src="${p.model}">
                <div class="row">${statusTag(p.status)}<strong>${p.model}</strong><span class="tag idle">${p.category}</span></div>
                <h3 style="margin-top:8px">${esc(p.name)}</h3>
                <p class="muted">${p.modules.map((x) => x.domain).join(" / ")}</p>
              </button>
            `).join("")}
            <button class="sku-card ${m.sourceModel === "" ? "on" : ""}" type="button" data-src="">
              <div class="row"><span class="tag draft">从空白开始</span></div>
              <h3 style="margin-top:8px">不继承历史 SKU</h3>
              <p class="muted">只在确实没有可参考产品时使用。</p>
            </button>
          </div>
          <div class="grid-2" style="margin-top:14px">
            <div>
              <div class="field"><label>新 Model</label><input id="pModel" value="${esc(m.model)}"></div>
              <div class="field"><label>产品名称</label><input id="pName" value="${esc(m.name)}"></div>
            </div>
            <div>
              <div class="field"><label>上市日期</label><input id="pLaunch" value="${esc(m.launch)}"></div>
              <div class="hint">当前继承：${m.sourceModel || "无"} · 品类 ${m.category}</div>
            </div>
          </div>
        `;
      } else if (step === 2) {
        body = `
          <div class="hint" style="margin-bottom:12px">这是 ${m.sourceModel || "空白"} 的模块组合。可以去掉、换方案，或增加新模块概念。</div>
          <div class="decide">${m.rows.map((r, i) => comboBlock(r, i)).join("")}</div>
          <button class="btn" type="button" id="addRow" style="margin-top:10px">增加模块</button>
        `;
      } else if (step === 3) {
        const all = activeRows();
        const reuse = reuseRows().length;
        const inc = incrementRows().length;
        body = `
          <div class="focus-box">
            <div class="focus-item"><span class="muted">模块总数</span><b>${all.length}</b></div>
            <div class="focus-item"><span class="muted">已验证可复用</span><b>${reuse}</b></div>
            <div class="focus-item hot"><span class="muted">人力应放在</span><b>${inc}</b><span class="muted">个新增 / 改版</span></div>
            <div class="focus-item"><span class="muted">去掉</span><b>${m.rows.filter((r) => !r.kept || r.decision === "drop").length}</b></div>
          </div>
          <div class="decide">${all.map((r, i) => decideBlock(r, m.rows.indexOf(r))).join("")}</div>
        `;
      } else {
        const inc = incrementRows();
        const reuse = reuseRows();
        body = `
          <div class="okbox">复用 ${reuse.length} 项不进项目。${m.model} 项目只接 ${inc.length} 项增量。增量方案先挂灰色未定稿。</div>
          <h3 style="margin-top:14px">引用，不开发</h3>
          <table>
            <thead><tr><th>专业域</th><th>引用方案</th><th>状态</th><th>已验证于</th></tr></thead>
            <tbody>
              ${reuse.map((r) => {
                const mod = moduleById(r.moduleId);
                return `<tr><td>${r.domain}</td><td>${esc(mod?.name || "—")}</td><td>${statusTag(mod?.status || "draft")}</td><td>${esc((mod?.products || []).join("、"))}</td></tr>`;
              }).join("")}
            </tbody>
          </table>
          <h3 style="margin-top:14px">进入项目的增量</h3>
          <table>
            <thead><tr><th>专业域</th><th>基线方案</th><th>决策</th><th>说明</th></tr></thead>
            <tbody>
              ${inc.map((r) => `<tr>
                <td>${r.domain} · ${r.family}</td>
                <td>${r.moduleId ? esc(moduleById(r.moduleId)?.name || r.moduleId) : "无现成方案"}</td>
                <td><span class="tag ${r.decision}">${decLabel[r.decision]}</span></td>
                <td>${esc(r.note)}</td>
              </tr>`).join("")}
            </tbody>
          </table>
          <p class="muted" style="margin-top:10px">当前状态：${m.status}</p>
        `;
      }

      $("view-match").innerHTML = `
        <div class="steps">
          ${["1 选历史 SKU", "2 调整组合", "3 识别焦点", "4 增量回写"].map((t, i) => {
            const n = i + 1;
            return `<div class="step ${n === step ? "on" : (n < step ? "done" : "")}">${t}</div>`;
          }).join("")}
        </div>
        <article class="card">
          ${m.status === "已上市回写" ? `<div class="okbox" style="margin-bottom:12px">${m.model} 已回写。新增模块已变绿，可在货架按 model 查看。</div>` : ""}
          ${body}
          <div class="row" style="margin-top:14px">
            ${step > 1 && m.status !== "已上市回写" ? `<button class="btn" type="button" id="prevStep">上一步</button>` : ""}
            ${step < 4 ? `<button class="btn primary" type="button" id="nextStep">下一步</button>` : ""}
            ${step === 4 && m.status !== "已上市回写" ? `<button class="btn" type="button" id="lockInc">确认增量立项</button>` : ""}
            ${step === 4 && m.status !== "已上市回写" ? `<button class="btn green" type="button" id="writeBack">模拟上市回写</button>` : ""}
          </div>
        </article>
      `;
      $("view-match").querySelectorAll("[data-src]").forEach((btn) => {
        btn.onclick = () => {
          applySource(btn.dataset.src);
          renderMatch();
        };
      });
      const next = $("nextStep");
      const prev = $("prevStep");
      if (prev) prev.onclick = () => { m.step -= 1; renderMatch(); };
      if (next) next.onclick = () => {
        if (step === 1) {
          m.model = ($("pModel")?.value.trim() || m.model);
          m.name = ($("pName")?.value.trim() || m.name);
          m.launch = ($("pLaunch")?.value.trim() || m.launch);
        }
        m.step += 1;
        if (m.step === 4) prepareDrafts();
        renderMatch();
      };
      const addRow = $("addRow");
      if (addRow) addRow.onclick = () => { addMatchRow(); renderMatch(); };
      $("view-match").querySelectorAll("[data-dec]").forEach((btn) => {
        btn.onclick = () => {
          const row = m.rows[Number(btn.dataset.i)];
          row.decision = btn.dataset.dec;
          row.kept = btn.dataset.dec !== "drop";
          renderMatch();
        };
      });
      $("view-match").querySelectorAll("[data-mod]").forEach((sel) => {
        sel.onchange = () => { m.rows[Number(sel.dataset.i)].moduleId = sel.value; renderMatch(); };
      });
      $("view-match").querySelectorAll("[data-domain]").forEach((sel) => {
        sel.onchange = () => {
          const row = m.rows[Number(sel.dataset.i)];
          row.domain = sel.value;
          row.family = (FAMILIES[m.category][row.domain] || [""])[0];
          row.moduleId = "";
          renderMatch();
        };
      });
      $("view-match").querySelectorAll("[data-family]").forEach((sel) => {
        sel.onchange = () => {
          const row = m.rows[Number(sel.dataset.i)];
          row.family = sel.value;
          row.moduleId = "";
          renderMatch();
        };
      });
      const lock = $("lockInc");
      if (lock) lock.onclick = lockIncrement;
      const wb = $("writeBack");
      if (wb) wb.onclick = writeBack;
    }

    function comboBlock(row, i) {
      const cat = state.match.category;
      const domains = Object.keys(FAMILIES[cat] || {});
      const families = (FAMILIES[cat] || {})[row.domain] || [];
      const options = state.modules.filter((x) => x.category === cat && x.domain === row.domain && x.family === row.family);
      return `
        <div class="decide-item ${row.kept && row.decision !== "drop" ? "" : "dropped"}">
          <div class="grid-2">
            <div class="field"><label>专业域</label>
              <select data-domain data-i="${i}">${domains.map((d) => `<option ${row.domain === d ? "selected" : ""}>${d}</option>`).join("")}</select>
            </div>
            <div class="field"><label>方案族</label>
              <select data-family data-i="${i}">${families.map((f) => `<option ${row.family === f ? "selected" : ""}>${f}</option>`).join("")}</select>
            </div>
          </div>
          <div class="field">
            <label>对照货架</label>
            <select data-mod data-i="${i}">
              <option value="">无现成方案 / 新模块概念</option>
              ${options.map((x) => `<option value="${x.id}" ${row.moduleId === x.id ? "selected" : ""}>${x.name} · ${stLabel[x.status]} · ${x.products.join("/") || "未挂"}</option>`).join("")}
            </select>
          </div>
          <p class="muted">${esc(row.note)}</p>
          <div class="decide-ops">
            ${["reuse", "change", "fresh", "drop"].map((d) => `<button class="opt ${d} ${row.decision === d ? "on" : ""}" type="button" data-dec="${d}" data-i="${i}">${decLabel[d]}</button>`).join("")}
          </div>
        </div>
      `;
    }

    function decideBlock(row, i) {
      const picked = moduleById(row.moduleId);
      return `
        <div class="decide-item">
          <div class="row"><strong>${row.domain} · ${row.family}</strong><span class="tag ${row.decision}">${decLabel[row.decision]}</span></div>
          <p class="muted" style="margin-top:8px">${esc(row.note)}</p>
          ${picked ? `<div class="muted">引用 ${esc(picked.name)} ${statusTag(picked.status)} 已挂 ${esc(picked.products.join("、") || "—")}</div>` : `<div class="muted">货架无现成方案，立项后将挂一条灰色未定稿。</div>`}
          <div class="decide-ops">
            ${["reuse", "change", "fresh"].map((d) => `<button class="opt ${d} ${row.decision === d ? "on" : ""}" type="button" data-dec="${d}" data-i="${i}">${decLabel[d]}</button>`).join("")}
          </div>
        </div>
      `;
    }

    function ensureDraftModule(row) {
      if (row.decision === "change" && row.domain === "电子" && row.family === "电源驱动") {
        const id = "PSU-B2";
        if (!moduleById(id)) {
          state.modules.unshift({
            id, category: "照明", domain: "电子", family: "电源驱动", name: "电源方案B-深调版", status: "draft",
            capability: "在方案B上扩展到 1% 深调",
            products: [],
            docs: ["驱动规格-B2.pdf"],
            specs: { vin: "100-240V", pout: "8-12W", dimMethod: "无极 PWM", dimRange: "1%-100%", pf: "0.92 / 88%", certs: "CE / FCC / UL", protect: "过压 / 过温 / 短路" }
          });
        }
        return id;
      }
      if (row.decision === "fresh" && row.family === "传感") {
        const id = "SNS-01";
        if (!moduleById(id)) {
          state.modules.unshift({
            id, category: "照明", domain: "嵌入式", family: "传感", name: "人体感应方案S1", status: "draft",
            capability: "落地灯人体感应开关，新品类能力",
            products: [],
            docs: ["感应规格-S1.pdf"],
            specs: { sense: "PIR", range: "3m", control: "感应开关", standby: "0.15W" }
          });
        }
        return id;
      }
      if (row.decision === "change" && row.family === "箱体结构") {
        const id = "BOX-H2";
        if (!moduleById(id)) {
          state.modules.unshift({
            id, category: "家电", domain: "结构", family: "箱体结构", name: "制冰箱体方案H2", status: "draft",
            capability: "基于 H1 缩小储冰仓与外观",
            products: [],
            docs: ["箱体2D-H2.pdf"],
            specs: { mount: "台面", size: "320 × 380 × 460mm", material: "ABS + 不锈钢内胆", load: "整机 11kg", ip: "IPX4", iface: "门铰 + 水箱卡位" }
          });
        }
        return id;
      }
      if (row.decision === "fresh" && !row.moduleId) {
        const id = "NEW-" + row.family + "-" + Date.now().toString().slice(-4);
        state.modules.unshift({
          id, category: state.match.category, domain: row.domain, family: row.family,
          name: row.family + "新方案", status: "draft", capability: "项目中新立的模块概念",
          products: [], docs: [], specs: {}
        });
        return id;
      }
      return row.moduleId;
    }

    function prepareDrafts() {
      incrementRows().forEach((r) => {
        r.moduleId = ensureDraftModule(r);
      });
    }

    function lockIncrement() {
      prepareDrafts();
      state.match.status = "已立项增量";
      toast("增量已立项。新模块已挂到货架，状态为灰色未定稿");
      render();
    }

    function writeBack() {
      const m = state.match;
      if (state.products.some((p) => p.model === m.model)) { toast("该 model 已经回写过"); return; }
      incrementRows().forEach((r) => { r.moduleId = ensureDraftModule(r); });
      const combo = activeRows().map((r) => {
        const mod = moduleById(r.moduleId);
        if (mod && !mod.products.includes(m.model)) mod.products.push(m.model);
        if (mod && r.decision !== "reuse") mod.status = "released";
        return { domain: r.domain, family: r.family, moduleId: r.moduleId, decision: r.decision };
      });
      state.products.unshift({
        model: m.model, name: m.name, category: m.category, series: m.series,
        launched: m.launch, status: "released", modules: combo
      });
      m.status = "已上市回写";
      toast(m.model + " 已回写。新增模块从灰色变为绿色定稿");
      render();
    }

    function productFilter() {
      const q = state.prodQuery.trim().toLowerCase();
      return state.products.filter((p) => {
        if (q && !productHaystack(p).includes(q)) return false;
        if (state.prodNode === "all") return true;
        if (state.prodNode.startsWith("c:")) return p.category === state.prodNode.slice(2);
        if (state.prodNode.startsWith("s:")) return p.series === state.prodNode.slice(2);
        if (state.prodNode.startsWith("m:")) return p.model === state.prodNode.slice(2);
        return true;
      });
    }

    function renderProductTree() {
      const cats = [...new Set(state.products.map((p) => p.category))];
      let html = `<button class="tree-node ${state.prodNode === "all" ? "on" : ""}" data-node="all" type="button">全部 <span class="meta">${state.products.length}</span></button>`;
      cats.forEach((c) => {
        const inCat = state.products.filter((p) => p.category === c);
        html += `<button class="tree-node ${state.prodNode === "c:" + c ? "on" : ""}" data-node="c:${c}" type="button" style="padding-left:12px">${c} <span class="meta">${inCat.length}</span></button>`;
        [...new Set(inCat.map((p) => p.series))].forEach((s) => {
          const items = inCat.filter((p) => p.series === s);
          html += `<button class="tree-node ${state.prodNode === "s:" + s ? "on" : ""}" data-node="s:${s}" type="button" style="padding-left:24px">${s} <span class="meta">${items.length}</span></button>`;
          items.forEach((p) => {
            html += `<button class="tree-node ${state.prodNode === "m:" + p.model ? "on" : ""}" data-node="m:${p.model}" type="button" style="padding-left:36px">${p.model} <span class="meta">${p.name}</span></button>`;
          });
        });
      });
      return html;
    }

    function renderProducts() {
      const list = productFilter();
      $("view-products").innerHTML = `
        <div class="split">
          <aside class="tree" id="prodTree">${renderProductTree()}</aside>
          <div>
            <input class="search" id="prodSearch" placeholder="搜索 model、制冷、H8120、未定稿">
            <div class="crumb" style="margin-top:10px">${list.length} 个产品方案</div>
            <div class="mod-grid">
              ${list.map((p) => `
                <article class="card" style="border-left:4px solid ${p.status === "released" ? "var(--green)" : "var(--draft)"}">
                  <div class="row">${statusTag(p.status)}<strong>${p.model}</strong><span class="tag idle">${p.category}</span><span class="tag idle">${p.series}</span></div>
                  <h3 style="margin-top:8px">${esc(p.name)}</h3>
                  <p class="muted">上市 ${p.launched}</p>
                  <table>
                    <thead><tr><th>专业域</th><th>模块方案</th><th>决策</th></tr></thead>
                    <tbody>
                      ${p.modules.map((x) => `<tr>
                        <td>${x.domain}</td>
                        <td><button class="btn ghost" type="button" data-open="${x.moduleId || ""}">${esc(moduleById(x.moduleId)?.name || x.moduleId || "—")}</button></td>
                        <td><span class="tag ${x.decision}">${decLabel[x.decision]}</span></td>
                      </tr>`).join("")}
                    </tbody>
                  </table>
                </article>
              `).join("") || `<div class="muted">没有匹配的产品方案。</div>`}
            </div>
          </div>
        </div>
      `;
      $("prodSearch").value = state.prodQuery;
      $("prodSearch").oninput = (e) => { state.prodQuery = e.target.value; renderProducts(); };
      $("prodTree").querySelectorAll("[data-node]").forEach((btn) => {
        btn.onclick = () => { state.prodNode = btn.dataset.node; renderProducts(); };
      });
      $("view-products").querySelectorAll("[data-open]").forEach((btn) => {
        btn.onclick = () => { if (btn.dataset.open) openModule(btn.dataset.open); };
      });
    }

    document.querySelectorAll(".nav-btn").forEach((btn) => {
      btn.onclick = () => showView(btn.dataset.view);
    });
    $("resetBtn").onclick = () => {
      state.modules = seedModules();
      state.products = seedProducts();
      state.match = seedMatch();
      state.shelfQuery = "";
      state.shelfNode = "all";
      state.prodQuery = "";
      state.prodNode = "all";
      toast("演示数据已重置");
      showView("home");
    };
    $("mask").addEventListener("click", (e) => { if (e.target.id === "mask") closeDialog(); });
    render();
  </script>
</body>
</html>
