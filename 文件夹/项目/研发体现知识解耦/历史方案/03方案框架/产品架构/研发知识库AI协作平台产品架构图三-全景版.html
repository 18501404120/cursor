<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研发知识库 AI 协作平台产品架构图</title>
  <style>
    :root {
      --bg: #eef4fb;
      --paper: #fff;
      --text: #17243a;
      --muted: #63718a;
      --line: #cfdcec;
      --blue: #1769e0;
      --blue-dark: #174a93;
      --blue-soft: #eaf3ff;
      --cyan-soft: #ebf8fb;
      --green: #15805e;
      --green-soft: #eaf7f1;
      --purple: #6c49bd;
      --purple-soft: #f1efff;
      --amber: #a86600;
      --amber-soft: #fff7e8;
      --slate-soft: #f2f5f9;
      --navy: #101f40;
      --shadow: 0 8px 28px rgba(24, 43, 76, .07);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    #app { min-height: 100vh; }
    .page {
      width: min(1480px, calc(100vw - 20px));
      margin: 8px auto;
      padding: 14px 16px 12px;
      background: var(--paper);
      border: 1px solid #dbe5f1;
      border-radius: 12px;
      box-shadow: var(--shadow);
    }
    .hero { padding: 0 2px 8px; border-bottom: 1px solid var(--line); }
    .hero h1 { margin: 0; font-size: 22px; line-height: 1.25; }
    .position {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
      padding: 7px 10px;
      background: #f7faff;
      border: 1px solid #d5e2f2;
      border-radius: 8px;
    }
    .position b { color: var(--blue-dark); font-size: 11px; }
    .position span { font-size: 12px; font-weight: 700; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .legend button, .phase {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 4px 12px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }
    .phase { padding: 1px 5px; font-size: 8px; }
    .phase.mvp, .legend .mvp { color: #fff; background: var(--blue); }
    .phase.p2, .legend .p2 { color: var(--green); background: var(--green-soft); }
    .phase.p3, .legend .p3 { color: var(--purple); background: var(--purple-soft); }
    .phase.p4, .legend .p4 { color: var(--amber); background: var(--amber-soft); }
    .legend button.on { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--navy); }

    .architecture {
      padding: 8px;
      background: #dfeeff;
      border: 1px solid #bdd6f2;
      border-radius: 10px;
    }
    .arch-title { padding: 1px 0 7px; color: var(--blue-dark); text-align: center; font-size: 14px; font-weight: 850; }
    .layer {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 6px;
      margin-bottom: 6px;
      padding: 5px;
      background: rgba(255,255,255,.66);
      border: 1px solid #c5d9ee;
      border-radius: 7px;
    }
    .layer:last-child { margin-bottom: 0; }
    .layer.collab-layer { border-color: #c7b7ef; background: #f4f0ff; }
    .layer-name {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 5px 4px;
      color: var(--blue-dark);
      background: #f8fbff;
      border: 1px solid #c8dcef;
      border-radius: 6px;
      text-align: center;
      font-size: 11px;
      font-weight: 850;
    }
    .collab-layer .layer-name { color: #4a2f8f; background: #f8f5ff; border-color: #d2c4f0; }
    .layer-name small { margin-top: 2px; color: #70809a; font-size: 8px; font-weight: 600; }
    .groups { display: grid; gap: 7px; }
    .group {
      padding: 7px;
      background: rgba(255,255,255,.52);
      border: 1px solid #d0dfef;
      border-radius: 7px;
    }
    .group-title { margin: 0 0 6px; color: #54708f; font-size: 10px; font-weight: 800; }
    .cards { display: grid; gap: 5px; }
    .cards.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .cards.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .cards.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .capability {
      position: relative;
      min-width: 0;
      min-height: 52px;
      padding: 7px 5px 6px;
      color: var(--text);
      background: #fff;
      border: 1px solid #cfdeee;
      border-radius: 5px;
      text-align: center;
      transition: border-color .15s, transform .15s;
    }
    .capability:hover { z-index: 2; transform: translateY(-1px); border-color: var(--blue); }
    .capability.core { border-color: #6ba4ed; }
    .capability .phase { position: absolute; top: 3px; right: 3px; }
    .capability strong { display: block; margin: 8px 0 2px; color: #21446f; font-size: 10px; line-height: 1.25; }
    .capability small { display: block; color: var(--muted); font-size: 8px; line-height: 1.3; }
    .layer[data-layer="workbench"] .capability { background: var(--blue-soft); }
    .layer[data-layer="collab"] .capability { background: var(--purple-soft); }
    .layer[data-layer="ai"] .capability { background: var(--cyan-soft); }
    .layer[data-layer="knowledge"] .capability { background: var(--green-soft); }
    .layer[data-layer="skill"] .capability { background: var(--purple-soft); }
    .layer[data-layer="project"] .capability { background: #eef6ff; }
    .layer[data-layer="support"] .capability { background: var(--slate-soft); }

    .bottom { margin-top: 8px; }
    .flow, .boundary {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .flow h2, .boundary h2 { margin: 0 0 7px; font-size: 12px; }
    .steps { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
    .step {
      position: relative;
      display: grid;
      min-height: 40px;
      place-items: center;
      padding: 5px 4px;
      color: #284665;
      background: #f7faff;
      border: 1px solid #d4e0ee;
      border-radius: 7px;
      text-align: center;
      font-size: 9px;
      font-weight: 700;
    }
    .step:not(:last-child)::after {
      content: "→";
      position: absolute;
      right: -11px;
      color: var(--blue);
      font-size: 14px;
    }
    .boundary p { margin: 0; color: var(--muted); font-size: 11px; }
    .roadmap {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 8px;
    }
    .roadmap-item { padding: 8px 9px; border: 1px solid var(--line); border-radius: 7px; background: #fff; }
    .roadmap-item b { display: block; margin-bottom: 4px; }
    .roadmap-item p { margin: 0; color: var(--muted); font-size: 10px; }
    .roadmap-item.mvp { border-color: #b9cff0; background: var(--blue-soft); }
    .roadmap-item.p2 { border-color: #bcded0; background: var(--green-soft); }
    .roadmap-item.p3 { border-color: #d2c7ef; background: var(--purple-soft); }
    .roadmap-item.p4 { border-color: #ead2a1; background: var(--amber-soft); }
    .foot { display: flex; justify-content: space-between; gap: 15px; padding: 13px 3px 0; color: #7a8799; font-size: 9px; }

    .detail-page { padding: 0; overflow: hidden; }
    .detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 18px;
      color: #fff;
      background: var(--navy);
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      color: #fff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 7px;
    }
    .detail-top span { color: rgba(255,255,255,.7); font-size: 10px; }
    .detail-hero {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 24px 18px;
      border-bottom: 1px solid var(--line);
    }
    .detail-code { color: var(--blue); font-size: 11px; font-weight: 850; letter-spacing: .08em; }
    .detail-hero h1 { margin: 4px 0 6px; font-size: 25px; }
    .detail-hero p { margin: 0; color: var(--muted); font-size: 14px; }
    .detail-content {
      display: grid;
      grid-template-columns: .82fr 1.18fr;
      gap: 18px;
      padding: 20px 24px 25px;
      background: #f8fafc;
    }
    .explain-block { padding: 0 0 15px; margin-bottom: 15px; border-bottom: 1px solid var(--line); }
    .explain-block:last-child { margin: 0; border-bottom: 0; }
    .explain-label { margin-bottom: 6px; color: #6d788b; font-size: 10px; font-weight: 850; }
    .explain p { margin: 0; font-size: 13px; }
    .rules { margin: 6px 0 0; padding-left: 18px; }
    .rules li { margin-bottom: 5px; }
    .screen {
      align-self: start;
      min-height: 340px;
      overflow: hidden;
      background: #f3f6fa;
      border: 1px solid #cfd9e6;
      border-radius: 11px;
    }
    .screen-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      color: #31415b;
      background: #fff;
      border-bottom: 1px solid #dfe5ed;
      font-size: 11px;
      font-weight: 800;
    }
    .dots { color: #b7c0ce; letter-spacing: 3px; }
    .screen-layout { display: grid; grid-template-columns: 112px minmax(0, 1fr); min-height: 300px; }
    .screen-nav { padding: 13px 9px; color: #93a0b4; background: #102345; font-size: 9px; }
    .screen-nav b { display: block; margin-bottom: 10px; color: #fff; font-size: 10px; }
    .screen-nav span { display: block; padding: 7px 8px; margin-bottom: 4px; border-radius: 5px; }
    .screen-nav span.on { color: #fff; background: #2265d0; }
    .screen-main { padding: 14px; }
    .mock-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .mock-head strong { font-size: 13px; }
    .mock-action { padding: 3px 7px; color: #fff; background: var(--blue); border-radius: 5px; font-size: 8px; }
    .mock-summary {
      padding: 11px;
      margin-bottom: 9px;
      background: #fff;
      border: 1px solid #dfe5ed;
      border-radius: 7px;
      font-size: 9px;
    }
    .mock-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
    .mock-card { padding: 10px; background: #fff; border: 1px solid #dfe5ed; border-radius: 7px; font-size: 8px; }
    .mock-card b { display: block; margin-bottom: 4px; color: #2e4463; font-size: 9px; }
    .mock-row { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid #edf0f4; }
    .mock-row:last-child { border-bottom: 0; }
    .mock-state { padding: 1px 5px; color: var(--green); background: var(--green-soft); border-radius: 999px; }
    .related { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 24px 22px; background: #f8fafc; }
    .related-label { width: 100%; color: #6d788b; font-size: 10px; font-weight: 850; }
    .related button { padding: 5px 8px; color: #385779; background: #fff; border: 1px solid #d7e0eb; border-radius: 6px; font-size: 10px; }

    @media (max-width: 1150px) {
      .cards.four, .cards.five, .cards.six { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .detail-content, .bottom { grid-template-columns: 1fr; }
      .steps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .step:not(:last-child)::after { display: none; }
    }
    @media (max-width: 750px) {
      .page { width: calc(100vw - 16px); margin: 8px auto; padding: 14px; }
      .hero { grid-template-columns: 1fr; }
      .layer { grid-template-columns: 1fr; }
      .cards.four, .cards.five, .cards.six { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .roadmap { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (() => {
    "use strict";

    const PHASES = {
      mvp: { label: "一期", name: "一期 · AI 项目知识协作 MVP" },
      p2: { label: "二期", name: "二期 · 受控知识与用户协作图" },
      p3: { label: "三期", name: "三期 · 项目自主协作" },
      p4: { label: "四期", name: "四期 · 汇入验收与智能运营" }
    };

    const PHASE_RANK = { mvp: 1, p2: 2, p3: 3, p4: 4 };
    let viewPhase = "p4";

    const LAYERS = [
      { id: "workbench", name: "角色项目工作台", note: "人从当前工作进入" },
      { id: "collab", name: "用户协作图", note: "看见人与角色依赖" },
      { id: "ai", name: "AI 协作工作区", note: "问答、生成与确认归档" },
      { id: "knowledge", name: "项目知识库", note: "AI 可调度的事实空间" },
      { id: "skill", name: "Skill 规范中心", note: "把专家经验转成规则" },
      { id: "project", name: "项目协作与智能运营", note: "解耦、能力、汇入与运营" },
      { id: "support", name: "基础支撑", note: "项目、权限、模型与连接" }
    ];

    const F = (id, layer, group, phase, title, subtitle, problem, solution, rules, mock, core = false) => ({
      id, layer, group, phase, title, subtitle, problem, solution, rules, mock, core
    });

    const FEATURES = [
      F("W-01","workbench","版本二已有","mvp","当前项目","项目类型 / 项目知识上下文",
        "成员进入系统后先面对一堆模块，无法快速进入当前项目及其知识上下文。",
        "工作台以当前项目为入口，自动加载项目类型、阶段和项目知识库上下文。",
        ["工作必须以当前项目为上下文；","切换项目时同步切换知识、角色和待办；","项目上下文是 AI 问答与生成的边界。"],
        ["当前项目 H8120","类型：新品研发","阶段：ES","知识上下文已加载"]),
      F("W-02","workbench","版本二已有","mvp","当前角色","岗位职责 / 角色工作范围",
        "同一人在不同项目中承担不同职责，系统无法按角色给出应看资料和应交付内容。",
        "绑定当前角色后，只展示该角色的工作范围、输入输出和 AI 协作入口。",
        ["角色切换同步权限与待处理事项；","同一用户可在不同项目承担不同角色；","角色范围由 Skill 定义。"],
        ["当前角色：制冷工程师","工作范围已绑定","输入 5 项","输出 3 项"]),
      F("W-03","workbench","版本二已有","mvp","当前环节","项目节点 / 当前工作目标",
        "资料和工作目标与项目节点脱节，用户不清楚当前该完成什么。",
        "按项目环节加载当前工作目标、应关注资料和输出清单。",
        ["环节变化时刷新输入输出清单；","目标必须可对应到交付资料；","允许提前准备后续环节资料。"],
        ["当前环节：ES 工程样机","本周目标 3","关联资料 12","待交付 2"]),
      F("W-04","workbench","版本二已有","mvp","上游输入","应有资料 / 已有与缺失项",
        "用户不知道开始工作前缺哪些上游资料，只能在群里反复询问。",

      F("W-05","workbench","版本二已有","mvp","本角色输出","应交付资料 / 完成状态",
        "角色交付物不清晰，完成后也不知道该归档到哪里、该通知谁。",
        "集中展示本角色应交付资料、完成状态、归档位置和确认入口。",
        ["输出必须绑定目录和版本；","AI 生成结果需责任人确认后归档；","完成后提醒下游角色。"],
        ["应交付 3","已完成 2","待确认 1","待通知角色 2"]),
      F("W-06","workbench","后续加法","p2","审核与知识工作台","待更新、退回意见与正式发布",
        "知识责任人和审核人分散在多个目录中处理更新、退回和发布。",
        "在工作台追加审核与知识维护入口，不改原有五项工作上下文。",

      F("W-09","workbench","后续加法","p3","能力方工作台","能力请求、承诺与交付",

        ["请求必须说明所需能力与输出；","确认后形成可追踪承诺；","交付结果回写原请求。"],
        ["待响应 7","本周承诺 12","容量冲突 2","按时交付率 91%"]),
      F("W-10","workbench","后续加法","p4","JP 汇入驾驶舱","齐套、证据、结论与快照",

        "集中呈现汇入清单、证据、风险例外、通过策略和回退范围。",
        ["支持通过、带条件通过和不通过；","结论必须关联证据版本；","快照形成后不得原地修改。"],
        ["A档齐套 87%","有效证据 42","带条件项 3","阻断项 1"]),

      F("C-01","collab","用户协作图 · 版本三核心加法","p2","角色协作关系图","项目中谁与谁协作",
        "项目成员只看见自己的输入输出，看不到人与人、角色与角色之间的协作结构。",
        "以角色为节点绘制项目协作图，展示主责、配合、评审和能力支持关系。这是人/角色关系图，不是知识图谱。",
        ["节点是角色或责任人，不是知识原子；","关系必须来自角色输入输出 Skill 或协同记录；","图随项目成员和角色变化更新。"],
        ["角色节点 8","协作边 14","当前角色已高亮","跨组关系 4"]),
      F("C-02","collab","用户协作图 · 版本三核心加法","p2","输入输出链路","谁给谁提供什么资料",
        "上下游资料依赖藏在目录和聊天里，无法一眼看出交付链路。",

        "问答、分类和生成需要统一组织项目上下文并调用模型。",

        "支持常用办公文档格式读取和文本提取。",
        ["解析失败保留原文件；","不在 MVP 做 CAD 深度解析；","提取结果进入索引。"],

    ];

    function phaseBadge(phase) {
      return `<span class="phase ${phase}">${PHASES[phase].label}</span>`;
    }

    function cardsClass(count) {
      if (count <= 4) return "cards four";
      if (count === 5 || count === 10) return "cards five";
      return "cards six";
    }

    function visibleFeatures() {
      const rank = PHASE_RANK[viewPhase];
      return FEATURES.filter(item => PHASE_RANK[item.phase] <= rank);
    }

    function architecturePage() {
      return `
        <main class="page">
          <header class="hero">
            <h1>研发知识库 AI 协作平台产品架构图</h1>
          </header>
          <div class="position"><b>产品定位</b><span>以项目知识库为上下文，以 Skill 固化规范，以用户协作图看见人与角色依赖，用 AI 辅助完成归档、协作与标准化输出。</span></div>
          <div class="legend">
            <button class="mvp ${viewPhase === "mvp" ? "on" : ""}" data-phase="mvp">一期</button>
            <button class="p2 ${viewPhase === "p2" ? "on" : ""}" data-phase="p2">二期</button>
            <button class="p3 ${viewPhase === "p3" ? "on" : ""}" data-phase="p3">三期</button>
            <button class="p4 ${viewPhase === "p4" ? "on" : ""}" data-phase="p4">四期</button>
          </div>
          <section class="architecture">
            ${LAYERS.map(layerHtml).join("")}
          </section>
          <section class="bottom">
            <div class="flow">
              <h2>一期 MVP 业务闭环</h2>
              <div class="steps">
                <div class="step">选择项目类型</div>
                <div class="step">预生成知识目录</div>
                <div class="step">上传项目资料</div>
                <div class="step">AI 解析并建议归档</div>
                <div class="step">识别角色输入与缺口</div>
                <div class="step">AI 对话并生成输出</div>
                <div class="step">用户确认归档新版本</div>
                <div class="step">更新进度并提醒角色</div>
              </div>
            </div>
          </section>
          <section class="roadmap">
            <div class="roadmap-item mvp"><b>一期 · MVP</b><p>上传、智能归档、角色缺口、AI 生成和确认归档闭环。</p></div>
            <div class="roadmap-item p2"><b>二期 · 协作图与知识治理</b><p>先看见人/角色依赖，再建设知识原子、审核发布和 Skill 治理。</p></div>
            <div class="roadmap-item p3"><b>三期 · 项目自主协作</b><p>跑通解耦单元、条件工作网、协同调整和组织能力。</p></div>
            <div class="roadmap-item p4"><b>四期 · 汇入与智能运营</b><p>形成 JP、影响分析、多 Agent 和跨项目运营。</p></div>
          </section>
          <footer class="foot"><span>点击任一能力查看详情；左上角可返回本图</span><span>版本：V3.2 · 2026-08-20</span></footer>
        </main>
      `;
    }

    function layerHtml(layer) {
      const items = visibleFeatures().filter(item => item.layer === layer.id);
      if (!items.length) return "";
      return `
        <div class="layer ${layer.id === "collab" ? "collab-layer" : ""}" data-layer="${layer.id}">
          <div class="layer-name">${layer.name}<small>${layer.note}</small></div>
          <div class="${cardsClass(items.length)}">${items.map(capabilityCard).join("")}</div>
        </div>
      `;
    }

    function capabilityCard(item) {
      return `<button class="capability ${item.core ? "core" : ""}" data-feature="${item.id}" aria-label="查看${item.title}详情">
        ${phaseBadge(item.phase)}<strong>${item.title}</strong><small>${item.subtitle}</small>
      </button>`;
    }

    function detailPage(item) {
      const layer = LAYERS.find(layerItem => layerItem.id === item.layer);
      const related = FEATURES.filter(feature => feature.id !== item.id && (feature.layer === item.layer || feature.group === item.group)).slice(0, 6);
      return `
        <main class="page detail-page">
          <div class="detail-top">
            <button class="back" data-back>← 返回产品架构图</button>
            <span>${layer.name}</span>
          </div>
          <section class="detail-hero">
            <div>
              <div class="detail-code">${item.id}</div>
              <h1>${item.title}</h1>
              <p>${item.subtitle}</p>
            </div>
            ${phaseBadge(item.phase)}
          </section>
          <section class="detail-content">
            <div class="explain">
              <div class="explain-block"><div class="explain-label">解决什么问题</div><p>${item.problem}</p></div>
              <div class="explain-block"><div class="explain-label">怎么解决</div><p>${item.solution}</p></div>
              <div class="explain-block"><div class="explain-label">关键规则</div><ul class="rules">${item.rules.map(rule => `<li>${rule}</li>`).join("")}</ul></div>
              <div class="explain-block"><div class="explain-label">建设阶段</div><p><b>${PHASES[item.phase].name}</b>。</p></div>
            </div>
            ${mockScreen(item)}
          </section>
          <section class="related">
            <div class="related-label">相关能力</div>
            ${related.map(feature => `<button data-feature="${feature.id}">${feature.id} · ${feature.title}</button>`).join("")}
          </section>
        </main>
      `;
    }

    function mockScreen(item) {
      return `
        <div class="screen">
          <div class="screen-bar"><span>研发知识库 · H8120 制冰机项目</span><span class="dots">●●●</span></div>
          <div class="screen-layout">
            <aside class="screen-nav"><b>${LAYERS.find(layerItem => layerItem.id === item.layer).name}</b><span class="on">${item.title}</span><span>相关对象</span><span>版本记录</span><span>消息与待办</span></aside>
            <div class="screen-main">
              <div class="mock-head"><strong>${item.title}</strong><span class="mock-action">${PHASES[item.phase].label}</span></div>
              <div class="mock-summary">${item.solution}</div>
              <div class="mock-grid">
                ${item.mock.map((text, index) => `<div class="mock-card"><b>${index + 1}. ${text}</b><div class="mock-row"><span>${index % 2 ? "当前状态" : "业务信息"}</span><span class="mock-state">${index % 2 ? "处理中" : "已就绪"}</span></div></div>`).join("")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function showArchitecture(push = true, scroll = true) {
      document.getElementById("app").innerHTML = architecturePage();
      document.title = "研发知识库 AI 协作平台产品架构图";
      if (push) history.pushState({ view: "architecture", phase: viewPhase }, "", location.pathname + location.search);
      if (scroll) window.scrollTo(0, 0);
    }

    function showDetail(id, push = true) {
      const item = FEATURES.find(feature => feature.id === id);
      if (!item) return showArchitecture(push);
      document.getElementById("app").innerHTML = detailPage(item);
      document.title = `${item.title} · 产品架构图`;
      if (push) history.pushState({ view: "detail", id }, "", `#${id}`);
      window.scrollTo(0, 0);
    }

    document.addEventListener("click", event => {
      const phaseButton = event.target.closest("[data-phase]");
      if (phaseButton) {
        viewPhase = phaseButton.dataset.phase;
        showArchitecture(false, false);
        return;
      }
      const featureButton = event.target.closest("[data-feature]");
      if (featureButton) {
        showDetail(featureButton.dataset.feature);
        return;
      }
      if (event.target.closest("[data-back]")) showArchitecture();
    });

    window.addEventListener("popstate", () => {
      const id = location.hash.replace("#", "");
      if (id && FEATURES.some(item => item.id === id)) showDetail(id, false);
      else showArchitecture(false);
    });

    const initialId = location.hash.replace("#", "");
    if (initialId && FEATURES.some(item => item.id === initialId)) showDetail(initialId, false);
    else showArchitecture(false);
  })();
  </script>
</body>
</html>
