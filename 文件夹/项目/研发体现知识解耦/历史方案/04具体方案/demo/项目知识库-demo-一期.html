<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>一期受控研发知识库 Demo</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #e4e7ec;
      --primary: #2754c5;
      --primary-2: #1e3fa0;
      --primary-soft: #eef3ff;
      --green: #16825d;
      --green-soft: #eaf8f2;
      --amber: #b46505;
      --amber-soft: #fff6e8;
      --red: #c43c3c;
      --red-soft: #fff0f0;
      --purple: #6941c6;
      --purple-soft: #f3efff;
      --nav: 226px;
      --shadow: 0 8px 30px rgba(22, 34, 57, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    #app { min-height: 100%; }

    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 20px;
      color: #fff;
      background: #17264a;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .brand {
      min-width: 235px;
      font-size: 15px;
      font-weight: 760;
      letter-spacing: 0.01em;
    }
    .brand small {
      display: block;
      margin-top: -2px;
      color: rgba(255,255,255,.62);
      font-size: 10px;
      font-weight: 500;
    }
    .phase-chip {
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 999px;
      padding: 3px 9px;
      color: #dbe6ff;
      background: rgba(255,255,255,.07);
      white-space: nowrap;
    }
    .top-spacer { flex: 1; }
    .role-select {
      height: 34px;
      min-width: 210px;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 8px;
      padding: 0 10px;
      color: #fff;
      background: #223868;
      outline: none;
    }
    .top-button {
      height: 34px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 8px;
      padding: 0 11px;
      color: #fff;
      background: transparent;
    }
    .top-button:hover { background: rgba(255,255,255,.08); }

    .layout {
      display: grid;
      grid-template-columns: var(--nav) minmax(0, 1fr);
      min-height: calc(100vh - 58px);
    }
    .nav {
      padding: 16px 12px;
      background: var(--surface);
      border-right: 1px solid var(--line);
      position: sticky;
      top: 58px;
      height: calc(100vh - 58px);
      overflow: auto;
    }
    .nav-title {
      padding: 0 10px 7px;
      color: #98a2b3;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .08em;
    }
    .nav-button {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 2px 0;
      border: 0;
      border-radius: 9px;
      padding: 8px 10px;
      color: #475467;
      background: transparent;
      text-align: left;
      font-weight: 650;
    }
    .nav-button:hover { background: #f5f7fa; }
    .nav-button.on { color: var(--primary); background: var(--primary-soft); }
    .nav-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #667085;
      background: #f2f4f7;
      font-size: 11px;
      font-weight: 800;
    }
    .nav-button.on .nav-icon { color: #fff; background: var(--primary); }
    .nav-count {
      margin-left: auto;
      min-width: 20px;
      border-radius: 999px;
      padding: 1px 6px;
      color: #667085;
      background: #f2f4f7;
      text-align: center;
      font-size: 10px;
    }
    .nav-note {
      margin: 18px 5px 0;
      border: 1px solid #dce5fa;
      border-radius: 10px;
      padding: 10px;
      color: #395078;
      background: #f6f9ff;
      font-size: 11px;
    }
    .main {
      min-width: 0;
      padding: 22px 26px 50px;
    }
    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .page-head h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
      letter-spacing: -.01em;
    }
    .page-head p { margin: 5px 0 0; color: var(--muted); }
    .crumb { margin-bottom: 8px; color: var(--muted); font-size: 12px; }
    .crumb button {
      border: 0;
      padding: 0;
      color: var(--primary);
      background: transparent;
    }

    .btns { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 12px;
      color: #344054;
      background: #fff;
      font-weight: 650;
    }
    .btn:hover { background: #f8fafc; }
    .btn.primary { border-color: var(--primary); color: #fff; background: var(--primary); }
    .btn.primary:hover { background: var(--primary-2); }
    .btn.green { border-color: var(--green); color: #fff; background: var(--green); }
    .btn.red { border-color: #f2b8b8; color: var(--red); background: var(--red-soft); }
    .btn.small { min-height: 28px; padding: 4px 9px; font-size: 12px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(16,24,40,.02);
    }
    .card-pad { padding: 16px; }
    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .card-title h2, .card-title h3 { margin: 0; font-size: 15px; }
    .section-title {
      margin: 20px 0 10px;
      color: #475467;
      font-size: 12px;
      font-weight: 750;
    }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .mono { font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status.green { color: var(--green); background: var(--green-soft); }
    .status.amber { color: var(--amber); background: var(--amber-soft); }
    .status.red { color: var(--red); background: var(--red-soft); }
    .status.blue { color: var(--primary); background: var(--primary-soft); }
    .status.purple { color: var(--purple); background: var(--purple-soft); }
    .status.gray { color: #667085; background: #f2f4f7; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat { padding: 15px 16px; }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin: 5px 0 1px; font-size: 25px; line-height: 1.1; }
    .stat .trend { color: var(--green); font-size: 11px; }
    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, .8fr);
      gap: 14px;
    }
    .space-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .space-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px;
      background: #fff;
    }
    .space-card:hover { border-color: #b9c9ef; }
    .space-head { display: flex; justify-content: space-between; gap: 10px; }
    .space-head strong { font-size: 14px; }
    .space-meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .space-progress { height: 5px; margin-top: 10px; overflow: hidden; border-radius: 999px; background: #edf0f5; }
    .space-progress i { display: block; height: 100%; border-radius: inherit; background: var(--primary); }

    .list { display: flex; flex-direction: column; }
    .list-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      border-top: 1px solid #f0f2f5;
      padding: 10px 0;
    }
    .list-row:first-child { border-top: 0; }
    .link-button {
      border: 0;
      padding: 0;
      color: var(--primary);
      background: transparent;
      text-align: left;
      font-weight: 720;
    }
    .row-meta { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .notice {
      border: 1px solid #f3d7a7;
      border-radius: 10px;
      padding: 10px 12px;
      color: #7a4707;
      background: var(--amber-soft);
    }
    .notice.info { border-color: #ccdaf8; color: #314b85; background: #f2f6ff; }
    .notice.red { border-color: #f1c2c2; color: #8f2f2f; background: var(--red-soft); }

    .atom-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 290px;
      gap: 14px;
      align-items: start;
    }
    .atom-hero { padding: 18px; margin-bottom: 12px; }
    .atom-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .atom-title-row h1 { margin: 2px 0 0; font-size: 21px; }
    .atom-code { color: var(--muted); font-size: 11px; }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 15px;
    }
    .meta-item { border-radius: 8px; padding: 9px 10px; background: var(--surface-2); }
    .meta-item span { display: block; color: var(--muted); font-size: 10px; }
    .meta-item b { display: block; margin-top: 2px; font-size: 12px; }
    .content-block { padding: 16px; margin-bottom: 12px; }
    .content-block h3 { margin: 0 0 10px; font-size: 14px; }
    .value-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    .value-box { border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
    .value-box span { color: var(--muted); font-size: 11px; }
    .value-box b { display: block; margin-top: 3px; font-size: 15px; }
    .attachment {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid #f0f2f5;
      padding: 8px 0;
    }
    .attachment:first-of-type { border-top: 0; }
    .file-icon {
      width: 30px;
      height: 30px;
      display: inline-grid;
      place-items: center;
      margin-right: 8px;
      border-radius: 7px;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 10px;
      font-weight: 800;
    }
    .relation-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .relation { border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
    .relation em { color: var(--purple); font-size: 10px; font-style: normal; font-weight: 750; }
    .timeline { padding: 14px; }
    .timeline-item {
      position: relative;
      padding: 0 0 17px 19px;
      border-left: 1px solid #d9deea;
    }
    .timeline-item:last-child { padding-bottom: 0; border-left-color: transparent; }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: -5px;
      top: 4px;
      width: 9px;
      height: 9px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #98a2b3;
      box-shadow: 0 0 0 1px #cfd5df;
    }
    .timeline-item.current::before { background: var(--primary); }
    .timeline-item b { font-size: 12px; }
    .timeline-item p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }

    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field-wrap.full { grid-column: 1 / -1; }
    .field-wrap label { display: block; margin-bottom: 4px; color: #475467; font-size: 11px; font-weight: 700; }
    .field {
      width: 100%;
      min-height: 36px;
      border: 1px solid #d6dae3;
      border-radius: 8px;
      padding: 7px 9px;
      color: var(--text);
      background: #fff;
      outline: none;
    }
    .field:focus { border-color: #8ea8e6; box-shadow: 0 0 0 3px #edf2ff; }
    textarea.field { min-height: 92px; resize: vertical; }

    .review-layout {
      display: grid;
      grid-template-columns: 300px minmax(0,1fr);
      gap: 14px;
      align-items: start;
    }
    .queue { padding: 8px; }
    .queue-item {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 11px;
      color: var(--text);
      background: transparent;
      text-align: left;
    }
    .queue-item:hover { background: #f7f8fa; }
    .queue-item.on { background: var(--primary-soft); }
    .queue-item + .queue-item { margin-top: 3px; }
    .queue-item b { display: block; }
    .queue-item span { color: var(--muted); font-size: 11px; }
    .review-main { padding: 17px; }
    .check-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; margin: 12px 0; }
    .check-card { border: 1px solid var(--line); border-radius: 9px; padding: 11px; }
    .check-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid #f1f2f4; }
    .check-row:first-of-type { border-top: 0; }
    .diff-table, .permission-table, .data-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    .diff-table th, .diff-table td,
    .permission-table th, .permission-table td,
    .data-table th, .data-table td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: middle;
      font-size: 12px;
    }
    .diff-table th, .permission-table th, .data-table th { color: #475467; background: #f8fafc; font-size: 11px; }
    .diff-new { color: var(--red); font-weight: 700; }
    .empty { padding: 50px 20px; color: var(--muted); text-align: center; }

    .permission-layout { display: grid; grid-template-columns: minmax(0,1fr) 320px; gap: 14px; align-items: start; }
    .permission-card { padding: 16px; overflow: auto; }
    .yes { color: var(--green); font-weight: 800; }
    .no { color: #c7ccd4; }
    .audit-list { padding: 0 14px 12px; }
    .audit-row { border-top: 1px solid #f0f2f5; padding: 10px 0; }
    .audit-row:first-child { border-top: 0; }
    .audit-row p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px;
      background: #fff;
    }
    .toolbar .field { width: auto; min-width: 132px; }
    .toolbar .search-field { flex: 1; min-width: 220px; }
    .search-layout { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 14px; margin-top: 12px; align-items: start; }
    .result-list { padding: 4px 14px; }
    .result-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 12px;
      align-items: center;
      border-top: 1px solid var(--line);
      padding: 13px 0;
    }
    .result-row:first-child { border-top: 0; }
    .result-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .result-title b { font-size: 14px; }
    .topic-panel { position: sticky; top: 80px; padding: 15px; }
    .topic-ref { border: 1px solid var(--line); border-radius: 9px; padding: 10px; margin-top: 8px; }
    .topic-ref.stale { border-color: #efc477; background: var(--amber-soft); }
    .topic-ref-head { display: flex; justify-content: space-between; gap: 8px; }
    .topic-ref p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }

    .modal-bg {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(15, 23, 42, .48);
    }
    .modal {
      width: min(680px, 100%);
      max-height: 88vh;
      overflow: auto;
      border-radius: 14px;
      padding: 18px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .modal h2 { margin: 0; font-size: 18px; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 80;
      transform: translateX(-50%);
      border-radius: 999px;
      padding: 9px 16px;
      color: #fff;
      background: #17264a;
      box-shadow: var(--shadow);
      font-size: 12px;
    }

    @media (max-width: 1100px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .dashboard-grid, .atom-layout, .permission-layout, .search-layout { grid-template-columns: 1fr; }
      .topic-panel { position: static; }
      .meta-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 820px) {
      :root { --nav: 72px; }
      .brand { min-width: auto; }
      .brand small, .phase-chip { display: none; }
      .nav-button { justify-content: center; }
      .nav-button > span:not(.nav-icon):not(.nav-count), .nav-title, .nav-note { display: none; }
      .nav-count { display: none; }
      .main { padding: 18px 14px 38px; }
      .review-layout { grid-template-columns: 1fr; }
      .space-list, .check-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 620px) {
      .role-select { min-width: 132px; max-width: 150px; }
      .top-button { display: none; }
      .stats, .value-grid, .field-grid, .relation-grid { grid-template-columns: 1fr; }
      .meta-grid { grid-template-columns: repeat(2, 1fr); }
      .page-head, .atom-title-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (() => {
    "use strict";

    const STORE_KEY = "rd-controlled-kb-phase1-demo-v1";
    const TODAY = "2026-08-19";

          ],

            {

          </div>
          <aside class="card timeline">
            <div class="card-title"><h3>版本与审计</h3><span class="muted small">不可覆盖</span></div>
            ${item.versions.map((verItem, index) => `<div class="timeline-item ${index === 0 ? "current" : ""}">
              <b>${esc(verItem.id)} · ${esc(STATUS_LABEL[verItem.status])}</b>
              <p>${esc(verItem.summary || "无变更摘要")}</p>
              <p>创建 ${esc(verItem.author)} · ${esc(verItem.createdAt)}</p>
              ${verItem.reviewer ? `<p>审核 ${esc(verItem.reviewer)} · ${esc(verItem.publishedAt)}</p>` : ""}
              ${verItem.obsoleteReason ? `<p style="color:var(--red)">废止原因：${esc(verItem.obsoleteReason)}</p>` : ""}
            </div>`).join("")}
            <div class="notice info small" style="margin-top:14px">当前正式依据：${formal ? `${esc(formal.id)}，发布于 ${esc(formal.publishedAt)}` : "暂无已发布版本"}。草稿与待审核版本不可被专题正式引用。</div>
          </aside>
        </div>
      `;
    }
    function versionContent(item, verItem) {
      return `
        <section class="card content-block">
          <div class="card-title"><h3>结构化内容</h3><span class="muted small">${esc(verItem.id)} · ${esc(verItem.summary)}</span></div>
          <div class="value-grid">${Object.entries(verItem.fields || {}).map(([key, value]) => `<div class="value-box"><span>${esc(key)}</span><b>${esc(value)}</b></div>`).join("")}</div>
          <div class="section-title">业务说明</div>
          <p>${esc(verItem.body)}</p>
          <div class="section-title">来源依据</div>
          <p>${esc(item.source)}</p>
        </section>
        <section class="card content-block">
          <div class="card-title"><h3>附件证据</h3><span class="status blue">${(verItem.attachments || []).length} 个</span></div>
          ${(verItem.attachments || []).map(file => `<div class="attachment"><div><span class="file-icon">${esc(file.type)}</span><b>${esc(file.name)}</b></div><span class="muted small">${esc(file.size)}</span></div>`).join("") || `<p class="muted">当前版本没有附件。</p>`}
        </section>
      `;
    }
    function draftEditor(item, verItem, editing) {
      if (!editing) {
        return `<div class="notice" style="margin-bottom:12px"><b>${esc(verItem.id)} 是未发布草稿。</b> 当前角色不能编辑；团队正式使用仍以 ${esc(latestPublished(item)?.id || "无")} 为准。</div>${versionContent(item, verItem)}`;
      }
      const entries = Object.entries(verItem.fields || {});
      return `
        <section class="card content-block">
          <div class="card-title"><h3>编辑草稿 ${esc(verItem.id)}</h3><span class="status gray">仅责任人/授权编辑人可维护</span></div>
          ${verItem.returnNote ? `<div class="notice red" style="margin-bottom:10px"><b>审核退回：</b>${esc(verItem.returnNote)}</div>` : ""}
          <div class="field-grid">
            ${entries.map(([key, value], index) => `<div class="field-wrap"><label>${esc(key)}</label><input class="field draft-field" data-key="${esc(key)}" value="${esc(value)}" /></div>`).join("")}
            <div class="field-wrap full"><label>适用范围</label><input id="draftScope" class="field" value="${esc(item.scope)}" /></div>
            <div class="field-wrap full"><label>变更摘要</label><input id="draftSummary" class="field" value="${esc(verItem.summary)}" /></div>
            <div class="field-wrap full"><label>业务说明</label><textarea id="draftBody" class="field">${esc(verItem.body)}</textarea></div>
          </div>
          <div class="section-title">附件随本版本冻结</div>
          ${(verItem.attachments || []).map(file => `<div class="attachment"><div><span class="file-icon">${esc(file.type)}</span><b>${esc(file.name)}</b></div><span class="muted small">${esc(file.size)}</span></div>`).join("") || `<div class="notice">正式提交前至少保留 1 个关键附件。Demo 新版本已复制上一正式版本附件。</div>`}
          <div class="btns" style="margin-top:14px"><button class="btn" data-act="save-draft" data-id="${item.id}">保存草稿</button><button class="btn primary" data-act="submit-review" data-id="${item.id}">提交审核</button></div>
        </section>
      `;
    }

    function reviewView() {
      const queue = pendingAtoms();
      if (queue.length && !queue.some(item => item.id === ui.reviewAtomId)) ui.reviewAtomId = queue[0].id;
      const selected = atom(ui.reviewAtomId);
      const selectedVersion = selected ? latestVersion(selected) : null;
      const base = selected ? latestPublished(selected) : null;
      return `
        <div class="page-head">
          <div><h1>审核发布中心</h1><p>审核内容、来源、适用范围、附件和权限，形成不可覆盖的正式版本。</p></div>
          <span class="status ${canReview() ? "green" : "gray"}">${canReview() ? "当前可审核发布" : "当前仅可查看"}</span>
        </div>
        <div class="stats">
          <div class="card stat"><span class="label">待我审核</span><strong>${queue.length}</strong><span class="muted small">按专业域聚合</span></div>
          <div class="card stat"><span class="label">待补充</span><strong>${draftAtoms().filter(item => latestVersion(item).returnNote).length}</strong><span class="muted small">已退回责任人</span></div>
          <div class="card stat"><span class="label">权限异常</span><strong>1</strong><span class="muted small">发布前必须检查</span></div>
          <div class="card stat"><span class="label">本月发布</span><strong>26</strong><span class="trend">正式版本均可追溯</span></div>
        </div>
        <div class="review-layout">
          <section class="card queue">
            <div class="card-title" style="padding:7px 7px 2px"><h3>审核队列</h3><span class="status amber">${queue.length}</span></div>
            ${queue.map(item => {
              const verItem = latestVersion(item);
              return `<button class="queue-item ${ui.reviewAtomId === item.id ? "on" : ""}" data-act="select-review" data-id="${item.id}">
                <b>${esc(item.name)} · ${esc(verItem.id)}</b><span>${esc(space(item.spaceId).name)} · ${esc(item.owner)} · ${esc(verItem.createdAt)}</span>
              </button>`;
            }).join("") || `<div class="empty">暂无待审核知识。<br>可切换“知识负责人”，在知识原子详情新建版本并提交。</div>`}
          </section>
          ${selected && selectedVersion && selectedVersion.status === "pending" ? reviewDetail(selected, selectedVersion, base) : `<section class="card empty">请选择一条待审核知识。</section>`}
        </div>
        <div class="section-title">已发布知识管理</div>
        <section class="card card-pad">
          <div class="list">
            ${state.atoms.filter(item => latestPublished(item)).slice(0, 4).map(item => {
              const formal = latestPublished(item);
              return `<div class="list-row"><div><button class="link-button" data-act="open-atom" data-id="${item.id}">${esc(item.name)} · ${esc(formal.id)}</button><div class="row-meta">发布人 ${esc(formal.reviewer || "—")} · ${esc(formal.publishedAt || "—")}</div></div>${canReview() && formal.status === "published" ? `<button class="btn red small" data-act="obsolete" data-id="${item.id}">废止当前正式版</button>` : statusBadge(formal.status)}</div>`;
            }).join("")}
          </div>
        </section>
      `;
    }
    function reviewDetail(item, candidate, base) {
      const checks = [
        ["责任人", item.owner ? "完整" : "缺失", !!item.owner],
        ["适用范围", item.scope ? "完整" : "缺失", !!item.scope],
        ["关键附件", candidate.attachments && candidate.attachments.length ? `${candidate.attachments.length} 个` : "缺失", !!(candidate.attachments && candidate.attachments.length)],
        ["变更摘要", candidate.summary ? "完整" : "缺失", !!candidate.summary]
      ];
      const keys = Array.from(new Set([...Object.keys(base?.fields || {}), ...Object.keys(candidate.fields || {})]));
      return `<section class="card review-main">
        <div class="card-title"><div><h2 style="margin:0;font-size:17px">${esc(item.name)} · ${esc(candidate.id)}</h2><span class="muted small">${esc(item.code)} · 提交人 ${esc(candidate.author)}</span></div>${statusBadge("pending")}</div>
        <div class="check-grid">
          <div class="check-card"><b>发布检查</b>${checks.map(row => `<div class="check-row"><span>${esc(row[0])}</span><span class="status ${row[2] ? "green" : "red"}">${esc(row[1])}</span></div>`).join("")}</div>
          <div class="check-card"><b>权限检查</b><div class="check-row"><span>继承专业域权限</span><span class="status green">正常</span></div><div class="check-row"><span>敏感级别</span><span class="status ${item.sensitivity === "普通" ? "green" : "amber"}">${esc(item.sensitivity)}</span></div><div class="check-row"><span>审核发布角色</span><span class="status ${canReview() ? "green" : "red"}">${canReview() ? "有效" : "无权限"}</span></div></div>
        </div>
        <div class="section-title">版本差异</div>
        <div style="overflow:auto"><table class="diff-table"><thead><tr><th>字段</th><th>${esc(base?.id || "无正式版")} 正式值</th><th>${esc(candidate.id)} 待审值</th><th>判断</th></tr></thead><tbody>
          ${keys.map(key => {
            const oldValue = base?.fields?.[key] || "—";
            const newValue = candidate.fields?.[key] || "—";
            const changed = oldValue !== newValue;
            return `<tr><td>${esc(key)}</td><td>${esc(oldValue)}</td><td class="${changed ? "diff-new" : ""}">${esc(newValue)}</td><td>${changed ? `<span class="status amber">有变化</span>` : `<span class="status gray">无变化</span>`}</td></tr>`;
          }).join("")}
        </tbody></table></div>
        <div class="notice info" style="margin-top:12px"><b>变更摘要：</b>${esc(candidate.summary)}<br><b>来源与范围：</b>${esc(item.source)}；${esc(item.scope)}</div>
        <div class="btns" style="margin-top:14px"><button class="btn" data-act="open-atom" data-id="${item.id}">查看完整知识</button><button class="btn red" data-act="return-review" data-id="${item.id}" ${canReview() ? "" : "disabled"}>退回补充</button><button class="btn green" data-act="approve" data-id="${item.id}" ${canReview() ? "" : "disabled"}>审核通过并发布</button></div>
      </section>`;
    }

    function permissionView() {
      const rows = [
        ["空间管理员 · 赵敏", true, true, true, true, true],
        ["知识负责人 · 王工", true, true, true, false, false],
        ["知识编辑人 · 周工", true, "被授权对象", false, false, false],
        ["审核发布人 · 李工", true, false, false, true, false],
        ["研发只读成员 · 陈工", true, false, false, false, false]
      ];
      return `
        <div class="page-head">
          <div><h1>权限管理</h1><p>以空间角色继承为主，敏感和跨域知识设置受控对象例外。</p></div>
          <div class="btns"><button class="btn primary" data-act="toggle-exception">${state.permissionException ? "取消受限例外" : "新增受限例外"}</button></div>
        </div>
        <div class="notice info" style="margin-bottom:14px"><b>继承链：</b>公司研发域 → 制冷技术知识库 → 知识原子。对象例外只能收紧权限，不能扩大上级禁止权限。</div>
        <div class="permission-layout">
          <section class="card permission-card">
            <div class="card-title"><h2>制冷技术知识库 · 空间角色矩阵</h2><span class="status green">运行中</span></div>
            <table class="permission-table"><thead><tr><th>角色 / 人员</th><th>查看</th><th>编辑</th><th>提交审核</th><th>审核发布</th><th>管理权限</th></tr></thead><tbody>
              ${rows.map(row => `<tr><td><b>${esc(row[0])}</b></td>${row.slice(1).map(value => `<td>${value === true ? `<span class="yes">✓</span>` : value === false ? `<span class="no">—</span>` : `<span class="status blue">${esc(value)}</span>`}</td>`).join("")}</tr>`).join("")}
            </tbody></table>
          </section>
          <aside>
            <section class="card card-pad">
              <div class="card-title"><h3>对象权限例外</h3><span class="status ${state.permissionException ? "amber" : "gray"}">${state.permissionException ? "已生效" : "未设置"}</span></div>
              ${state.permissionException ? `<b>核心供应商成本参数</b><p class="muted small">严格受限 · 仅空间管理员、知识负责人和审核发布人可查看。</p><div class="notice small">普通研发成员的空间查看权限在此对象上被收紧。</div>` : `<p class="muted">当前所有知识均继承空间默认权限。</p>`}
            </section>
            <section class="card" style="margin-top:12px">
              <div class="card-title" style="padding:14px 14px 0"><h3>权限变更审计</h3><span class="muted small">全程留痕</span></div>
              <div class="audit-list">${state.permissionAudit.map(log => `<div class="audit-row"><b>${esc(log.action)}</b><p>${esc(log.by)} · ${esc(log.at)}</p></div>`).join("")}</div>
            </section>
          </aside>
        </div>
      `;
    }

    function searchView() {
      const results = searchResults();
      const currentTopic = topic();
      const staleCount = currentTopic.refs.filter(ref => topicRefState(ref).stale).length;
      return `
        <div class="page-head">
          <div><h1>搜索与专题组装</h1><p>在权限范围内检索正式知识，并通过引用组装为业务专题。</p></div>
          <span class="status ${staleCount ? "amber" : "green"}">${staleCount ? `${staleCount} 个引用待评估` : "专题引用均为最新"}</span>
        </div>
        <div class="toolbar">
          <input id="searchInput" class="field search-field" placeholder="搜索知识名称、编码、正文或适用范围" value="${esc(ui.search)}" />
          <select id="searchSpace" class="field"><option value="all">全部专业域</option>${state.spaces.map(item => `<option value="${item.id}" ${ui.searchSpace === item.id ? "selected" : ""}>${esc(item.name)}</option>`).join("")}</select>
          <select id="searchType" class="field"><option value="all">全部类型</option>${Array.from(new Set(state.atoms.map(item => item.type))).map(type => `<option value="${esc(type)}" ${ui.searchType === type ? "selected" : ""}>${esc(type)}</option>`).join("")}</select>
          <select id="searchStatus" class="field"><option value="published" ${ui.searchStatus === "published" ? "selected" : ""}>仅已发布</option><option value="all" ${ui.searchStatus === "all" ? "selected" : ""}>全部状态</option></select>
          <button class="btn primary" data-act="do-search">搜索</button>
        </div>
        <div class="search-layout">
          <section class="card result-list">
            <div class="card-title" style="padding-top:11px"><h2>检索结果</h2><span class="muted small">${results.length} 条 · 已应用当前角色权限</span></div>
            ${results.map(item => {
              const formal = latestPublished(item);
              const current = latestVersion(item);
              const accessible = isAccessible(item);
              const ref = currentTopic.refs.find(entry => entry.atomId === item.id);
              const referable = accessible && !!formal;
              return `<div class="result-row">
                <div>
                  <div class="result-title"><button class="link-button" data-act="open-atom" data-id="${item.id}">${esc(item.name)}</button>${accessible ? statusBadge(current.status) : `<span class="status red">无查看权限</span>`}</div>
                  <div class="row-meta">${esc(item.code)} · ${esc(space(item.spaceId).name)} · ${esc(item.type)} · 责任人 ${esc(item.owner)}</div>
                  <p class="small muted" style="margin:5px 0 0">适用范围：${esc(item.scope)}</p>
                </div>
                ${ref ? `<span class="status purple">已在专题 · ${esc(ref.versionId)}</span>` : referable ? `<button class="btn small" data-act="add-topic" data-id="${item.id}" ${canMaintainTopic() ? "" : "disabled"}>引用到专题</button>` : `<span class="status gray">不可引用</span>`}
              </div>`;
            }).join("") || `<div class="empty">没有匹配的权限内知识。</div>`}
          </section>
          <aside class="card topic-panel">
            <div class="card-title"><div><h2>${esc(currentTopic.name)}</h2><span class="muted small">专题组装页 · 维护人 ${esc(currentTopic.owner)}</span></div><span class="status purple">${currentTopic.refs.length}</span></div>
            <p class="muted small">${esc(currentTopic.desc)}</p>
            <div class="notice info small"><b>引用规则：</b>专题只记录知识原子及其正式版本，不复制源内容；源发布新版本后由专题维护人评估升级。</div>
            ${currentTopic.refs.map(ref => {
              const info = topicRefState(ref);
              return `<div class="topic-ref ${info.stale ? "stale" : ""}">
                <div class="topic-ref-head"><button class="link-button" data-act="open-atom" data-id="${info.item.id}">${esc(info.item.name)}</button>${info.stale ? `<span class="status amber">源已更新</span>` : `<span class="status green">当前</span>`}</div>
                <p>本专题引用 ${esc(ref.versionId)}${info.latest ? ` · 最新正式 ${esc(info.latest.id)}` : ""}</p>
                ${info.stale && canMaintainTopic() ? `<div class="btns" style="margin-top:7px"><button class="btn primary small" data-act="upgrade-topic" data-id="${info.item.id}">升级引用</button><button class="btn small" data-act="keep-topic" data-id="${info.item.id}">保持当前版</button></div>` : ""}
              </div>`;
            }).join("")}
          </aside>
        </div>
      `;
    }
    function searchResults() {
      const q = ui.search.trim().toLowerCase();
      return state.atoms.filter(item => {
        const current = latestVersion(item);
        const formal = latestPublished(item);
        if (!isAccessible(item)) return false;
        if (ui.searchSpace !== "all" && item.spaceId !== ui.searchSpace) return false;
        if (ui.searchType !== "all" && item.type !== ui.searchType) return false;
        if (ui.searchStatus === "published" && !formal) return false;
        if (!q) return true;
        const text = [item.name, item.code, item.scope, item.source, current.body, item.type, item.owner].join(" ").toLowerCase();
        return text.includes(q);
      });
    }

    function modalHtml() {
      if (ui.modal.type === "permission") {
        return `<div class="modal-bg" data-act="close-modal"><div class="modal" onclick="event.stopPropagation()">
          <div class="card-title"><h2>${state.permissionException ? "取消对象权限例外" : "新增对象权限例外"}</h2><button class="btn small" data-act="close-modal">关闭</button></div>
          <p>对象：<b>核心供应商成本参数</b></p>
          <div class="notice">${state.permissionException ? "取消后，该对象将重新继承制冷技术空间的普通查看权限。" : "设置后，研发只读成员与知识编辑人将不能查看该对象；操作会进入权限审计。"}</div>
          <div class="btns" style="margin-top:14px"><button class="btn" data-act="close-modal">取消</button><button class="btn primary" data-act="confirm-exception">确认变更</button></div>
        </div></div>`;
      }
      return "";
    }

    function readDraft(item) {
      const verItem = latestVersion(item);
      document.querySelectorAll(".draft-field").forEach(input => { verItem.fields[input.dataset.key] = input.value.trim(); });
      const scopeInput = document.getElementById("draftScope");
      const summaryInput = document.getElementById("draftSummary");
      const bodyInput = document.getElementById("draftBody");
      if (scopeInput) item.scope = scopeInput.value.trim();
      if (summaryInput) verItem.summary = summaryInput.value.trim();
      if (bodyInput) verItem.body = bodyInput.value.trim();
      verItem.createdAt = TODAY;
    }
    function validateDraft(item) {
      const verItem = latestVersion(item);
      if (!item.owner) return "缺少责任人";
      if (!item.scope) return "缺少适用范围";
      if (!verItem.summary) return "缺少变更摘要";
      if (!verItem.attachments || !verItem.attachments.length) return "缺少关键附件";
      return "";
    }

    function onClick(event) {
      const el = event.target.closest("[data-act]");
      if (!el) return;
      const act = el.dataset.act;
      const id = el.dataset.id;
      if (act === "view") { ui.view = el.dataset.view; render(); return; }
      if (act === "browse-space") { ui.searchSpace = id; ui.searchStatus = "published"; ui.view = "search"; render(); return; }
      if (act === "open-atom") { ui.atomId = id; ui.view = "atom"; render(); return; }
      if (act === "goto-review") { ui.reviewAtomId = id; ui.view = "review"; render(); return; }
      if (act === "select-review") { ui.reviewAtomId = id; render(); return; }
      if (act === "reset") {
        if (window.confirm("恢复一期 Demo 预置数据？当前演示操作将被清除。")) {
          state = seed();
          ui.view = "home";
          ui.atomId = "perf";
          ui.reviewAtomId = "frame";
          toast("已恢复预置数据");
        }
        return;
      }
      if (act === "new-version") {
        const item = atom(id);
        if (!canMaintain(item)) { toast("当前角色没有维护该知识的权限"); return; }
        const base = latestPublished(item);
        if (!base) { toast("当前没有可继承的正式版本"); return; }
        const next = clone(base);
        next.id = nextVersionId(item);
        next.status = "draft";
        next.createdAt = TODAY;
        next.publishedAt = "";
        next.author = currentRole().person;
        next.reviewer = "";
        next.summary = `基于 ${base.id} 创建新版本`;
        delete next.obsoleteReason;
        item.versions.unshift(next);
        toast(`已创建草稿 ${next.id}，正式依据仍为 ${base.id}`);
        return;
      }
      if (act === "save-draft") {
        const item = atom(id);
        readDraft(item);
        toast(`草稿 ${latestVersion(item).id} 已保存`);
        return;
      }
      if (act === "submit-review") {
        const item = atom(id);
        readDraft(item);
        const error = validateDraft(item);
        if (error) { toast(`不能提交：${error}`); return; }
        latestVersion(item).status = "pending";
        ui.reviewAtomId = item.id;
        toast(`已提交 ${latestVersion(item).id} 审核`);
        return;
      }
      if (act === "approve") {
        if (!canReview()) { toast("当前角色不是审核发布人"); return; }
        const item = atom(id);
        const candidate = latestVersion(item);
        if (candidate.status !== "pending") return;
        candidate.status = "published";
        candidate.reviewer = currentRole().person;
        candidate.publishedAt = TODAY;
        ui.atomId = item.id;
        toast(`${candidate.id} 已审核发布，旧正式版本仍保留`);
        return;
      }
      if (act === "return-review") {
        if (!canReview()) { toast("当前角色不是审核发布人"); return; }
        const item = atom(id);
        const candidate = latestVersion(item);
        const reason = window.prompt("请输入退回原因：", "请补充适用范围依据并确认关键附件版本。");
        if (!reason) return;
        candidate.status = "draft";
        candidate.returnNote = reason;
        toast(`${candidate.id} 已退回责任人补充`);
        return;
      }
      if (act === "obsolete") {
        if (!canReview()) { toast("当前角色不是审核发布人"); return; }
        const item = atom(id);
        const formal = latestPublished(item);
        if (!formal) return;
        const reason = window.prompt(`请输入废止 ${formal.id} 的原因：`, "已有新版规范替代，历史版本仅保留追溯。");
        if (!reason) return;
        formal.status = "obsolete";
        formal.obsoleteReason = reason;
        toast(`${item.name} ${formal.id} 已废止并保留历史`);
        return;
      }
      if (act === "toggle-exception") { ui.modal = { type: "permission" }; render(); return; }
      if (act === "close-modal") { ui.modal = null; render(); return; }
      if (act === "confirm-exception") {
        state.permissionException = !state.permissionException;
        const restricted = atom("supplier");
        restricted.restrictedTo = state.permissionException ? ["admin", "owner", "reviewer"] : null;
        state.permissionAudit.unshift({
          at: `${TODAY} 10:52`,
          by: currentRole().person,
          action: state.permissionException ? "设置“核心供应商成本参数”为严格受限" : "取消“核心供应商成本参数”对象权限例外"
        });
        ui.modal = null;
        toast("权限例外已更新并记录审计");
        return;
      }
      if (act === "do-search") {
        ui.search = document.getElementById("searchInput").value;
        ui.searchSpace = document.getElementById("searchSpace").value;
        ui.searchType = document.getElementById("searchType").value;
        ui.searchStatus = document.getElementById("searchStatus").value;
        render();
        return;
      }
      if (act === "add-topic") {
        if (!canMaintainTopic()) { toast("当前角色不能维护专题"); return; }
        const item = atom(id);
        const formal = latestPublished(item);
        if (!formal || !isAccessible(item)) { toast("只有权限内已发布知识可以正式引用"); return; }
        if (!topic().refs.some(ref => ref.atomId === id)) topic().refs.push({ atomId: id, versionId: formal.id });
        toast(`已引用 ${item.name} ${formal.id}`);
        return;
      }
      if (act === "upgrade-topic") {
        if (!canMaintainTopic()) return;
        const ref = topic().refs.find(entry => entry.atomId === id);
        const formal = latestPublished(atom(id));
        if (ref && formal) ref.versionId = formal.id;
        toast(`专题引用已升级到 ${formal.id}`);
        return;
      }
      if (act === "keep-topic") {
        toast("已保持当前正式版本；下次源更新前不改变专题内容");
      }
    }

    document.getElementById("app").addEventListener("click", onClick);
    document.getElementById("app").addEventListener("change", event => {
      if (event.target.id === "roleSelect") {
        state.role = event.target.value;
        toast(`已切换为 ${currentRole().name} · ${currentRole().person}`);
      }
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && ui.modal) {
        ui.modal = null;
        render();
      }
    });
    render();
  })();
  </script>
</body>
</html>
