<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>方案设计 · GitHub Pages 入口</title>
  <style>
    :root { --bg: #f4f6f9; --card: #fff; --border: #e2e8f0; --text: #1e293b; --muted: #64748b; --link: #0369a1; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 24px; background: var(--bg); color: var(--text); line-height: 1.6; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p.lead { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
    .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--text); }
    ul { margin: 0; padding-left: 20px; }
    li { margin: 8px 0; font-size: 14px; }
    a { color: var(--link); text-decoration: none; word-break: break-all; }
    a:hover { text-decoration: underline; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>方案设计仓库 · 静态预览入口</h1>
    <p class="lead">通过 GitHub Pages 打开下方链接即可在浏览器中预览 HTML 原型（路径相对于仓库根目录）。</p>

    <div class="card">
      <h2>销量预测（示例）</h2>
      <ul>
        <li><a href="文件夹/项目/销量预测/原型/销量预测管理-原型.html">销量预测管理 · 原型</a></li>
        <li><a href="文件夹/项目/销量预测/原型/销量预测配置中心-原型.html">销量预测配置中心 · 原型</a></li>
        <li><a href="文件夹/项目/销量预测/原型/销量预测项目-领导汇报展示.html">销量预测 · 领导汇报展示</a></li>
        <li><a href="文件夹/项目/销量预测/销量预测方案展示.html">销量预测方案 · 全景展示</a></li>
      </ul>
    </div>

    <div class="card">
      <h2>全渠道管报（示例）</h2>
      <ul>
        <li><a href="文件夹/项目/全渠道管报/项目规划（思想）/全渠道管报项目规划原型.html">全渠道管报 · 项目规划原型</a></li>
      </ul>
    </div>

    <p class="hint">
      若本站仍显示 404，请到仓库 <strong>Settings → Pages</strong> 确认已选择 <code>main</code> 分支与 <code>/(root)</code>，并在 <strong>Actions</strong> 中查看 <code>pages build and deployment</code> 是否成功（见下文「第一步」）。
    </p>
  </div>
</body>
</html>
