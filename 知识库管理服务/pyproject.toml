[project]
name = "kb-orchestrator"
version = "0.1.0"
description = "ERP 知识库自动多轮构建编排器（策略 A：检测反问后自动回复继续）"
requires-python = ">=3.10"
dependencies = [
  "cursor-sdk>=0.1.0",
]

[project.scripts]
kb-orchestrator = "kb_orchestrator.cli:main"
kb-manager = "kb_orchestrator.service.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kb_orchestrator*"]
