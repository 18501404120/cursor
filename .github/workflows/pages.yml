# 发布到分支 gh-pages（避开 deploy-pages / configure-pages 触发的 git 128）
# 推送成功后：Settings → Pages → Source 选「Deploy from a branch」→ Branch: gh-pages / folder: /(root)
# 若仍选「GitHub Actions」为源，本分支不会生效，请改回「从分支发布」
#
# 仓库根目录为「本地/」，静态站点内容来自「方案设计/」子目录，以保持 Pages URL 不变。
#
# 加固：
# 1) 每次写入 .pages-deploy-stamp，即使业务文件无 diff 也会强制更新 gh-pages
# 2) 支持 workflow_dispatch 手动重跑部署
# 3) 部署后轮询官方 pages build and deployment；失败则自动 Re-run 一次

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pages-gh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deploy_started_at: ${{ steps.stamp.outputs.deploy_started_at }}
      source_sha: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Refresh preview directory trees
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=方案设计/知识库管理服务 python3 -m kb_orchestrator.service.preview_tree

      - name: Prepare static files
        id: stamp
        shell: bash
        run: |
          set -euo pipefail
          SRC="方案设计"
          if [[ ! -d "$SRC" ]]; then
            echo "missing source directory: $SRC"
            exit 1
          fi
          mkdir -p _site
          touch _site/.nojekyll
          shopt -s dotglob nullglob
          for path in "$SRC"/*; do
            case "$path" in
              .|..|$SRC/.git|$SRC/.github|_site|node_modules|.DS_Store|.cursor) continue ;;
            esac
            if [[ "$path" == *.log ]]; then continue; fi
            cp -a "$path" _site/
          done
          # 断链符号链接会导致官方 pages-build-deployment 的 build 步骤失败
          find _site -type l | while IFS= read -r link; do
            if [[ ! -e "$link" ]]; then
              echo "remove broken symlink: $link"
              rm -f "$link"
            fi
          done
          # 子模块占位目录（无内容）可能引起异常，整目录去掉
          rm -rf _site/文件夹/mcp/mcp_excalidraw 2>/dev/null || true
          if [[ ! -f _site/index.html ]]; then
            echo "missing index.html"
            ls -la _site
            exit 1
          fi

          # 强制每次 gh-pages 都有变更，避免「Deploy success 但未触发 Pages 重建」
          DEPLOY_STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "deployed_at=${DEPLOY_STARTED_AT}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "actor=${GITHUB_ACTOR}"
          } > _site/.pages-deploy-stamp
          echo "deploy_started_at=${DEPLOY_STARTED_AT}" >> "$GITHUB_OUTPUT"
          echo "wrote deploy stamp:"
          cat _site/.pages-deploy-stamp
          ls -la _site | head -20

      - name: Push to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          single-commit: true
          force: true

  ensure-pages-live:
    name: Ensure Pages build live
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait / rerun pages-build-deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_STARTED_AT: ${{ needs.deploy.outputs.deploy_started_at }}
          SOURCE_SHA: ${{ needs.deploy.outputs.source_sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, time, urllib.error, urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          since = os.environ["DEPLOY_STARTED_AT"]
          source_sha = os.environ["SOURCE_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "pages-ensure",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(method: str, path: str, body: dict | None = None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/{path}",
                  data=data,
                  headers={**headers, **({"Content-Type": "application/json"} if body is not None else {})},
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      raw = resp.read().decode()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  detail = e.read().decode(errors="replace")
                  raise RuntimeError(f"{method} {path} -> {e.code}: {detail}") from e

          def live_stamp_ok() -> bool:
              try:
                  req = urllib.request.Request(
                      "https://18501404120.github.io/cursor/.pages-deploy-stamp",
                      headers={"User-Agent": "pages-ensure", "Cache-Control": "no-cache"},
                  )
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      text = resp.read().decode(errors="replace")
                  print("live stamp:\n" + text)
                  return f"sha={source_sha}" in text
              except Exception as e:
                  print(f"live stamp check: {e}")
                  return False

          def latest_pages_run():
              data = api("GET", f"repos/{repo}/actions/runs?branch=gh-pages&per_page=30")
              runs = [
                  r
                  for r in data.get("workflow_runs", [])
                  if r.get("name") == "pages build and deployment" and (r.get("created_at") or "") >= since
              ]
              runs.sort(key=lambda r: r.get("created_at") or "", reverse=True)
              return runs[0] if runs else None

          print(f"Deploy started at: {since}")
          print(f"Source sha: {source_sha}")

          run = None
          for i in range(1, 19):
              run = latest_pages_run()
              if run:
                  print(
                      f"Found pages build: id={run['id']} status={run.get('status')} "
                      f"conclusion={run.get('conclusion')} url={run.get('html_url')}"
                  )
                  break
              if live_stamp_ok():
                  print("Live stamp already matches source sha; treat as success.")
                  raise SystemExit(0)
              print(f"poll appear #{i}: not found yet")
              time.sleep(10)

          if not run:
              if live_stamp_ok():
                  print("No Actions run found, but live stamp matches; treat as success.")
                  raise SystemExit(0)
              raise SystemExit(
                  "::error::未找到 pages build and deployment（请确认 Settings→Pages 源为 gh-pages 分支）"
              )

          run_id = run["id"]

          def wait_done(rid: int):
              for j in range(1, 37):
                  info = api("GET", f"repos/{repo}/actions/runs/{rid}")
                  status = info.get("status")
                  conclusion = info.get("conclusion")
                  url = info.get("html_url")
                  print(f"poll done #{j}: status={status} conclusion={conclusion}")
                  if status == "completed":
                      return conclusion, url
                  time.sleep(10)
              raise SystemExit(f"::error::pages build 超时未完成: {url}")

          conclusion, url = wait_done(run_id)
          if conclusion == "success" or live_stamp_ok():
              print(f"Pages build success: {url}")
              raise SystemExit(0)

          print(f"::warning::Pages build failed ({conclusion}), auto re-run once: {url}")
          try:
              api("POST", f"repos/{repo}/actions/runs/{run_id}/rerun-failed-jobs")
          except Exception as e:
              print(f"rerun-failed-jobs failed ({e}); fallback to full rerun")
              api("POST", f"repos/{repo}/actions/runs/{run_id}/rerun")

          time.sleep(15)
          conclusion, url = wait_done(run_id)
          if conclusion == "success" or live_stamp_ok():
              print(f"Pages build success after re-run: {url}")
              raise SystemExit(0)

          raise SystemExit(
              f"::error::Pages build 仍失败（已自动重跑一次）: {url}\n"
              "可在 Actions 手动 Re-run，或再跑一次本工作流（workflow_dispatch）。"
          )
          PY
