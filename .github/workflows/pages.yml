# Pages 发布源请在 Settings → Pages 选择「GitHub Actions」
# 已去掉 configure-pages（部分仓库会触发 git exit 128）；用 bash 复制避免 rsync/符号链接问题

name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Prepare static files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          shopt -s dotglob nullglob
          for path in *; do
            case "$path" in
              .|..|.git|.github|_site|node_modules|.DS_Store|.cursor) continue ;;
            esac
            cp -a "$path" _site/
          done
          if [[ ! -f _site/index.html ]]; then
            echo "missing index.html"
            ls -la _site
            exit 1
          fi
          echo "OK: index.html present, listing _site (top):"
          ls -la _site | head -25

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
