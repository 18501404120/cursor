# 发布到分支 gh-pages（避开 deploy-pages / configure-pages 触发的 git 128）
# 推送成功后：Settings → Pages → Source 选「Deploy from a branch」→ Branch: gh-pages / folder: /(root)
# 若仍选「GitHub Actions」为源，本分支不会生效，请改回「从分支发布」

name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages-gh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Prepare static files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          shopt -s dotglob nullglob
          for path in *; do
            case "$path" in
              .|..|.git|.github|_site|node_modules|.DS_Store|.cursor) continue ;;
            esac
            cp -a "$path" _site/
          done
          if [[ ! -f _site/index.html ]]; then
            echo "missing index.html"
            ls -la _site
            exit 1
          fi
          touch _site/.nojekyll
          ls -la _site | head -20

      - name: Push to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          single-commit: true
