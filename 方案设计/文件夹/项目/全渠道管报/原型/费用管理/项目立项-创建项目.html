<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>全渠道管理报表数字化项目 - 预算</title>
  <style>
    :root {
      --pmp-header: #3c8dbc;
      --sider-bg: #222d32;
      --sider-w: 56px;
      --page-bg: #ecf0f5;
      --card: #fff;
      --line: #e4e8ee;
      --text: #333;
      --text-sec: #666;
      --brand: #3c8dbc;
      --danger: #ff4d4f;
      --border: #d9d9d9;
      --req: #ff4d4f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--page-bg);
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* 左侧导航（对齐 PMP 截图） */
    .app-sider {
      width: var(--sider-w);
      flex-shrink: 0;
      background: var(--sider-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0 12px;
      color: rgba(255,255,255,.65);
    }
    .sider-logo {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: linear-gradient(135deg, #3c8dbc, #2b6fa8);
      margin: 4px 0 14px;
      flex-shrink: 0;
    }
    .sider-item {
      width: 44px;
      min-height: 44px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      margin: 2px 0;
      cursor: default;
      font-size: 10px;
      line-height: 1.1;
      text-align: center;
      padding: 4px 2px;
      position: relative;
    }
    .sider-item .ico {
      font-size: 16px;
      line-height: 1;
      opacity: .85;
    }
    .sider-item.active {
      background: rgba(60, 141, 188, .35);
      color: #fff;
    }
    .sider-item .dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff4d4f;
    }
    .sider-spacer { flex: 1; min-height: 12px; }
    .sider-foot {
      font-size: 9px;
      color: rgba(255,255,255,.4);
      text-align: center;
      padding: 8px 4px 0;
      line-height: 1.3;
    }

    .app-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* 顶栏（对齐截图：项目上下文 + 横向模块菜单） */
    .pmp-top {
      height: 50px;
      background: var(--pmp-header);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 12px 0 8px;
      gap: 0;
      font-size: 13px;
      flex-shrink: 0;
    }
    .pmp-top-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding-right: 12px;
      margin-right: 4px;
      border-right: 1px solid rgba(255,255,255,.15);
      max-width: 280px;
    }
    .pmp-top-left .ctx-label {
      font-size: 12px;
      opacity: .85;
      white-space: nowrap;
    }
    .pmp-top-left .ctx-project {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      cursor: default;
    }
    .pmp-top-left .ctx-project::after {
      content: "";
      border: 4px solid transparent;
      border-top-color: rgba(255,255,255,.8);
      margin-top: 3px;
      flex-shrink: 0;
    }
    .pmp-top-nav {
      display: flex;
      align-items: center;
      gap: 0;
      overflow-x: auto;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
    }
    .pmp-top-nav a {
      color: rgba(255,255,255,.88);
      text-decoration: none;
      padding: 0 11px;
      height: 50px;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      font-size: 13px;
    }
    .pmp-top-nav a:hover { color: #fff; background: rgba(0,0,0,.08); }
    .pmp-top-nav a.active {
      color: #fff;
      font-weight: 600;
      background: rgba(0,0,0,.12);
    }
    .pmp-top-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      padding-left: 8px;
    }
    .pmp-top-right .ico-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,.9);
      border-radius: 4px;
      cursor: default;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pmp-top-right .ico-btn:hover { background: rgba(0,0,0,.1); }
    .pmp-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #fff;
      color: var(--brand);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-wrap {
      flex: 1;
      overflow: auto;
      padding: 12px 16px 20px;
    }

    .form-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: visible;
    }
    .form-card-hd {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      font-weight: 600;
      font-size: 14px;
      background: linear-gradient(180deg, #fafbfc, #fff);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-card-bd { padding: 16px; }
    .req-mark { color: var(--req); margin-right: 2px; }

    .phase-table-wrap,
    .budget-table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 4px;
      max-height: calc(100vh - 168px);
      /* 允许行内组件弹层相对定位时不被过早裁切；主弹层仍走 body portal */
      overflow-x: auto;
      overflow-y: auto;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table th, .data-table td {
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      padding: 8px 10px;
      text-align: left;
      vertical-align: middle;
    }
    .data-table th:last-child, .data-table td:last-child { border-right: none; }
    .data-table th {
      background: #f0f5fa;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    .data-table input:not([type="checkbox"]),
    .data-table select {
      width: 100%; min-width: 80px; height: 28px;
      border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 6px; font-size: 12px; box-sizing: border-box;
    }

    .budget-total { font-size: 13px; margin-left: auto; }
    .budget-total em { font-style: normal; font-weight: 700; color: var(--brand); font-size: 15px; }
    .table-toolbar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px;
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 32px; padding: 0 15px; font-size: 13px; border-radius: 4px;
      border: 1px solid #d9d9d9; background: #fff; color: var(--text);
      cursor: pointer; font-family: inherit;
    }
    .btn:hover { border-color: var(--brand); color: var(--brand); }
    .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn-primary:hover { filter: brightness(1.05); color: #fff; }
    .btn-danger-outline { border-color: #ff4d4f; color: #ff4d4f; }
    .btn-danger-outline:disabled { opacity: 0.45; cursor: not-allowed; }

    #tblBudget.data-table {
      table-layout: fixed;
      width: 100%;
      min-width: 2560px;
    }
    #tblBudget th:nth-child(1), #tblBudget td:nth-child(1) {
      width: 44px; min-width: 44px; max-width: 44px;
      padding: 8px 4px; text-align: center;
    }
    #tblBudget input[type="checkbox"] {
      width: 14px; height: 14px; min-width: 14px; max-width: 14px;
      margin: 0; padding: 0; cursor: pointer; accent-color: var(--brand);
    }
    #tblBudget .chk-cell-inner {
      display: flex; align-items: center; justify-content: center;
      width: 100%; min-height: 28px;
    }
    /* 1勾选 2日期 3营销类型 4类型 5分摊模式 6部门 7场景 8model 9SKU 10新品 11区域 12国家 13渠道 14店铺 15金额 16币种 17操作 */
    #tblBudget th:nth-child(2), #tblBudget td:nth-child(2) { width: 260px; }
    #tblBudget th:nth-child(3), #tblBudget td:nth-child(3) { width: 170px; }
    #tblBudget th:nth-child(4), #tblBudget td:nth-child(4) { width: 150px; }
    #tblBudget th:nth-child(5), #tblBudget td:nth-child(5) { width: 110px; }
    #tblBudget th:nth-child(6), #tblBudget td:nth-child(6) { width: 260px; }
    #tblBudget th:nth-child(7), #tblBudget td:nth-child(7) { width: 240px; }
    #tblBudget th:nth-child(8), #tblBudget td:nth-child(8) { width: 110px; }
    #tblBudget th:nth-child(9), #tblBudget td:nth-child(9) { width: 180px; }
    #tblBudget th:nth-child(10), #tblBudget td:nth-child(10) { width: 120px; }
    #tblBudget th:nth-child(11), #tblBudget td:nth-child(11) { width: 120px; }
    #tblBudget th:nth-child(12), #tblBudget td:nth-child(12) { width: 150px; }
    #tblBudget th:nth-child(13), #tblBudget td:nth-child(13) { width: 150px; }
    #tblBudget th:nth-child(14), #tblBudget td:nth-child(14) { width: 150px; }
    #tblBudget th:nth-child(15), #tblBudget td:nth-child(15) { width: 128px; min-width: 128px; }
    #tblBudget th:nth-child(16), #tblBudget td:nth-child(16) { width: 78px; min-width: 78px; }
    #tblBudget th.actions, #tblBudget td.actions { width: 150px; min-width: 150px; }
    #tblBudget th.chk-col, #tblBudget td.chk-col {
      position: sticky; left: 0; z-index: 3; background: #fff;
      box-shadow: 2px 0 6px -4px rgba(0,0,0,.15);
    }
    #tblBudget thead th.chk-col { z-index: 5; background: #f0f5fa; }
    #tblBudget th.actions, #tblBudget td.actions {
      position: sticky; right: 0; z-index: 3; background: #fff;
      box-shadow: -8px 0 8px -8px rgba(0,0,0,.18);
      white-space: nowrap;
    }
    #tblBudget thead th.actions { z-index: 4; background: #f0f5fa; }
    /* 日期控件限制在单元格内，避免清空「×」溢出到下一列看起来像幽灵列 */
    .plan-row-dr-host {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      display: block;
    }
    #tblBudget .plan-row-dr-host .drp-wrap {
      display: block;
      width: 100%;
      max-width: 100%;
    }
    #tblBudget .plan-row-dr-host .drp-trigger {
      min-width: 0 !important;
      width: 100%;
      max-width: 100%;
    }
    /* 文本溢出省略，但不要裁切挂到 body 的下拉/校验气泡所依赖的触发展示 */
    #tblBudget td {
      overflow: visible;
    }
    #tblBudget td.chk-col,
    #tblBudget td.actions {
      overflow: hidden;
    }
    #tblBudget .msf-plan-row {
      min-width: 0;
      max-width: 100%;
      width: 100%;
    }
    #tblBudget .msf-plan-row .msf-root {
      min-width: 0 !important;
      max-width: 100%;
      width: 100%;
      display: block;
    }
    #tblBudget .msf-plan-row .msf-trigger-wrap,
    #tblBudget .msf-plan-row .msf-trigger {
      max-width: 100%;
    }
    #tblBudget .msf-plan-row .msf-trigger-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #tblBudget .msf-plan-row .msf-trigger {
      min-height: 28px;
      height: 28px;
      font-size: 12px;
      padding-right: 24px;
    }
    #tblBudget .msf-plan-row.msf-cell-narrow .msf-trigger {
      padding-left: 6px;
      padding-right: 22px;
    }
    #tblBudget select.js-budget-currency {
      min-width: 0 !important;
      width: 100%;
      padding: 2px 4px;
      text-align: center;
      font-size: 12px;
    }
    #tblBudget select.js-budget-alloc-mode {
      min-width: 0 !important;
      width: 100%;
    }
    /* 覆盖全局 select min-width:80px，避免窄列被撑破 */
    #tblBudget select {
      min-width: 0;
    }
    #tblBudget input.js-budget-amt {
      min-width: 0;
      width: 100%;
      text-align: right;
      padding-right: 6px;
    }
    #tblBudget .budget-dept-wrap {
      position: relative;
      display: block;
      width: 100%;
      max-width: 100%;
    }
    /* 覆盖 is-compact 固定 156px，让部门下拉贴满单元格宽度 */
    #tblBudget .budget-dept-wrap .fee-tree-select,
    #tblBudget .budget-dept-wrap .fee-tree-select.is-compact {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      display: block;
    }
    #tblBudget .budget-dept-wrap .fee-tree-select-trigger {
      width: 100%;
      height: 28px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
      box-sizing: border-box;
    }
    #tblBudget .budget-dept-wrap .ctl-clear {
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: rgba(0, 0, 0, 0.25);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 2px 4px;
      z-index: 1;
    }
    #tblBudget .budget-dept-wrap .ctl-clear:hover { color: rgba(0, 0, 0, 0.45); }
    #tblBudget .budget-dept-wrap .ctl-clear[hidden] { display: none; }
    /* 部门树形下拉展开/收拢 */
    .dept-tree-option { display: flex; align-items: center; gap: 2px; min-height: 30px; border-radius: 6px; }
    .dept-tree-option:hover { background: #f1f5ff; }
    .dept-tree-option.is-selected { background: #e6f0ff; }
    .dept-tree-toggle { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; cursor: pointer; color: #64748b; font-size: 13px; flex-shrink: 0; user-select: none; }
    .dept-tree-toggle:hover { color: #1677ff; }
    .dept-tree-toggle-placeholder { display: inline-block; width: 18px; flex-shrink: 0; }
    .dept-tree-label-btn { flex: 1; border: none; background: transparent; text-align: left; cursor: pointer; font-size: 13px; color: #111827; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .dept-tree-label-btn:hover { color: #1677ff; }
    td.num, th.num { text-align: right; }
    .link {
      border: none; background: none; color: var(--brand);
      cursor: pointer; font-size: 12px; padding: 0 4px;
    }
    .link.danger { color: var(--danger); }
    .empty { text-align: center; color: var(--text-sec); padding: 24px !important; }

    .toast {
      position: fixed; left: 50%; bottom: 80px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(0,0,0,.78); color: #fff;
      padding: 10px 18px; border-radius: 6px; font-size: 13px;
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
      z-index: 9999; max-width: 90vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
  <link rel="stylesheet" href="fee-dept-master.css">
  <link rel="stylesheet" href="fee-item-master.css">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sider" aria-label="全局导航">
      <div class="sider-logo" title="PMP"></div>
      <div class="sider-item" title="首页"><span class="ico">⌂</span></div>
      <div class="sider-item" title="项目集"><span class="ico">▦</span></div>
      <div class="sider-item" title="产品"><span class="ico">◫</span></div>
      <div class="sider-item" title="执行"><span class="ico">⚙</span></div>
      <div class="sider-item" title="需求"><span class="ico">☰</span></div>
      <div class="sider-item" title="测试"><span class="ico">✓</span><span class="dot"></span></div>
      <div class="sider-item" title="DevOps"><span class="ico">∞</span></div>
      <div class="sider-item" title="评审"><span class="ico">◎</span></div>
      <div class="sider-item" title="文档"><span class="ico">📄</span></div>
      <div class="sider-item" title="发布管理"><span class="ico">↑</span></div>
      <div class="sider-spacer"></div>
      <div class="sider-item active" title="项目"><span class="ico">▣</span>项目</div>
      <div class="sider-foot">研发综合<br />界面</div>
    </aside>

    <div class="app-main">
      <header class="pmp-top">
        <div class="pmp-top-left">
          <span class="ctx-label">项目</span>
          <span class="ctx-project" title="全渠道管理报表数字化项目">全渠道管理报表数字化项目</span>
        </div>
        <nav class="pmp-top-nav" id="topModuleNav">
          <a href="#">仪表盘</a>
          <a href="#">迭代</a>
          <a href="#">需求</a>
          <a href="#">计划</a>
          <a href="#">测试</a>
          <a href="#">变更</a>
          <a href="#">DevOps</a>
          <a href="#">文档</a>
          <a href="#">版本</a>
          <a href="#">发布</a>
          <a href="#">动态</a>
          <a href="#">设置</a>
          <a href="#">奖金</a>
          <a href="#" class="active" data-pa-key="nav-budget">预算</a>
          <a href="#">甘特图</a>
          <a href="#">决策图</a>
        </nav>
        <div class="pmp-top-right">
          <button type="button" class="ico-btn" title="新建">＋</button>
          <button type="button" class="ico-btn" title="搜索">⌕</button>
          <button type="button" class="ico-btn" title="通知">🔔</button>
          <span class="pmp-avatar" title="用户">陈</span>
        </div>
      </header>

      <div class="page-wrap">
        <section class="form-card" id="sectionBudget" data-pa-key="section-budget">
          <div class="form-card-hd" data-pa-key="budget-header">
            <span class="req-mark">*</span> 项目预算
            <span class="budget-total" data-pa-key="budget-total">合计：<em id="budgetTotalDisplay">0</em></span>
          </div>
          <div class="form-card-bd">
            <div class="table-toolbar">
              <button type="button" class="btn" id="btnBudgetAdd" data-pa-key="btn-budget-add">新增一行</button>
              <button type="button" class="btn btn-danger-outline" id="btnBudgetBatchDel" data-pa-key="btn-budget-batch-del" disabled>批量删除</button>
              <button type="button" class="btn btn-primary" id="btnBudgetSave" data-pa-key="btn-budget-save">保存预算</button>
            </div>
            <div class="budget-table-wrap" data-pa-key="budget-table-wrap">
              <table class="data-table" id="tblBudget">
                <thead>
                  <tr>
                    <th class="chk-col" data-pa-key="col-chk"><span class="chk-cell-inner"><input type="checkbox" id="budgetChkAll" title="全选" aria-label="全选" /></span></th>
                    <th data-pa-key="col-revenue-date"><span class="req-mark">*</span> 收益日期范围</th>
                    <th data-pa-key="col-marketing-type"><span class="req-mark">*</span> 营销类型</th>
                    <th data-pa-key="col-budget-type"><span class="req-mark">*</span> 类型</th>
                    <th data-pa-key="col-alloc-mode"><span class="req-mark">*</span> 分摊模式</th>
                    <th data-pa-key="col-dept">费用部门</th>
                    <th data-pa-key="col-scene-cat">场景品类</th>
                    <th data-pa-key="col-model">model</th>
                    <th data-pa-key="col-sku">SKU</th>
                    <th data-pa-key="col-np-tag">新品标签</th>
                    <th data-pa-key="col-region">区域</th>
                    <th data-pa-key="col-country">国家</th>
                    <th data-pa-key="col-channel">渠道</th>
                    <th data-pa-key="col-store">店铺</th>
                    <th class="num" data-pa-key="col-amount"><span class="req-mark">*</span> 营销费用规划</th>
                    <th data-pa-key="col-currency">币种</th>
                    <th class="actions" data-pa-key="col-ops">操作</th>
                  </tr>
                </thead>
                <tbody id="tbodyBudget"></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>

      <div class="toast" id="budgetToast"></div>
    </div><!-- /.app-main -->
  </div><!-- /.app-layout -->

  <script src="../../../../规范/assets/date-range-picker.js"></script>
  <script src="../../../../规范/assets/multi-select-filter.js"></script>

  <script>
    (function () {
      if (typeof ProjectBudgetPlan === "undefined") {
        alert("预算模块脚本加载失败，请通过 HTTP 服务打开本页。");
        return;
      }
      window.budgetApi = ProjectBudgetPlan.init({
        tbodyId: "tbodyBudget",
        btnAddId: "btnBudgetAdd",
        btnBatchDelId: "btnBudgetBatchDel",
        chkAllId: "budgetChkAll",
        onChange: updateTotal
      });

      function formatTotal(n) {
        return Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 0 });
      }
      function updateTotal() {
        var el = document.getElementById("budgetTotalDisplay");
        if (el) el.textContent = formatTotal(budgetApi.getTotal());
      }
      function showToast(msg) {
        var el = document.getElementById("budgetToast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(el._t);
        el._t = setTimeout(function () { el.classList.remove("show"); }, 2400);
      }

      document.getElementById("btnBudgetSave").addEventListener("click", function () {
        if (!budgetApi.validate()) return;
        budgetApi.persist();
        showToast("预算已保存（合计 " + formatTotal(budgetApi.getTotal()) + "）");
      });

      updateTotal();
    })();
  </script>
