<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>费用填报管理</title>
  <link rel="stylesheet" href="fee-mgmt-common.css">
  <link rel="stylesheet" href="fee-item-master.css">
  <link rel="stylesheet" href="../../../../规范/assets/import-modal-kit.css">
  <style>
    :root {
      --jd-blue: #2f6bff;
      --jd-blue-dark: #1f55d8;
      --jd-red: #e1251b;
      --jd-bg: #f5f7fb;
      --jd-border: #e5e7eb;
      --jd-sub: #6b7280;
    }
    body { background: var(--jd-bg); }
    .header { background: #1f3a8a; }
    .page { padding: 14px 16px 20px; }
    .jd-card {
      background: #fff;
      border: 1px solid var(--jd-border);
      border-radius: 6px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .jd-card-hd {
      min-height: 44px;
      padding: 0 16px;
      border-bottom: 1px solid #eef0f5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fbfcff;
      gap: 12px;
    }
    .jd-card-title { font-size: 14px; font-weight: 600; color: #111827; }
    .filter-panel { padding: 14px 16px; border-bottom: 1px solid #eef0f5; }
    .filter-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: center;
    }
    .f-item { display: flex; align-items: center; gap: 8px; }
    .f-item > label { color: #374151; font-size: 12px; white-space: nowrap; }
    .f-item select {
      height: 32px;
      min-width: 120px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 0 9px;
      font-size: 13px;
      background: #fff;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label { color: #374151; font-size: 12px; }
    .field .req { color: var(--jd-red); margin-right: 2px; }
    .field input,
    .field select,
    .field textarea {
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 0 9px;
      font-size: 13px;
      background: #fff;
    }
    .field textarea {
      height: 70px;
      padding: 8px 9px;
      resize: vertical;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      outline: none;
      border-color: var(--jd-blue);
      box-shadow: 0 0 0 2px rgba(47, 107, 255, 0.12);
    }
    .field .ssel-root { width: 100%; display: block; }
    .field .ssel-trigger { width: 100%; min-width: 0; }
    .ssel-panel.ssel-show { z-index: 1500 !important; }
    .btn-primary {
      background: var(--jd-blue);
      border-color: var(--jd-blue);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--jd-blue-dark);
      border-color: var(--jd-blue-dark);
      color: #fff;
    }
    .hint {
      margin: 0 0 12px;
      padding: 9px 12px;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 12px;
      line-height: 1.6;
    }
    .hit-box {
      border: 1px solid #c7d2fe;
      background: #eef2ff;
      border-radius: 6px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 4px;
    }
    .hit-item span {
      display: block;
      color: #64748b;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .hit-item strong {
      display: block;
      color: #1e3a8a;
      font-size: 14px;
      word-break: break-all;
    }
    .status-dot {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #ecfdf3;
      color: #067647;
      border: 1px solid #abefc6;
    }
    .status-dot.draft {
      background: #f9fafb;
      color: #475467;
      border-color: #d0d5dd;
    }
    .status-dot.void {
      background: #fef3f2;
      color: #b42318;
      border-color: #fecdca;
    }
    .op-link {
      border: none;
      background: transparent;
      color: var(--jd-blue);
      cursor: pointer;
      padding: 0 4px;
      font-size: 13px;
    }
    .op-link:hover { text-decoration: underline; }
    .table-wrap { max-height: calc(100vh - 280px); min-height: 240px; }
    .data-table th {
      background: #f9fafb;
      color: #374151;
      font-weight: 600;
    }
    .data-table td,
    .data-table th { border-color: #e5e7eb; }
    .toolbar-line { display: flex; gap: 8px; align-items: center; }
    .upload-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 32px;
    }
    .upload-name {
      font-size: 13px;
      color: #374151;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .upload-name.empty { color: #9ca3af; }
    .attach-cell .op-link { margin-right: 4px; }
    .preview-box {
      min-height: 320px;
      border: 1px dashed #d1d5db;
      border-radius: 6px;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.6;
    }
    .import-alloc-frame {
      width: 100%;
      height: calc(100vh - 200px);
      min-height: 640px;
      border: none;
      display: block;
      background: #f0f2f5;
    }
    .modal-intro { margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
    .modal-intro-banner {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      color: #1e40af;
      font-size: 12px;
      line-height: 1.65;
    }
    .modal-intro-banner strong { color: #1e40af; font-weight: 600; }
    .modal-intro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-intro-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      background: #f8fafc;
      font-size: 12px;
      line-height: 1.65;
      color: #334155;
    }
    .modal-intro-card h4 { margin: 0 0 6px; font-size: 12px; color: #0f2f63; }
    .modal-intro-card ul { margin: 0; padding-left: 1.15em; }
    .modal-intro-card li { margin: 4px 0; }
    .modal-intro-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .modal-intro-tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 11px;
    }
    .import-upload {
      margin: 12px 0;
      padding: 14px;
      border: 1px dashed #d1d5db;
      border-radius: 6px;
      background: #f9fafb;
    }
    .import-upload label { display: block; font-size: 12px; color: #64748b; margin-bottom: 8px; }
    .import-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; align-items: flex-start; }
    .import-result {
      margin-top: 12px;
      padding: 9px 12px;
      border-radius: 4px;
      border: 1px solid #bbf7d0;
      background: #f0fdf4;
      color: #166534;
      font-size: 12px;
      display: none;
    }
    .import-result.show { display: block; }
    @media (max-width: 720px) {
      .modal-intro-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
