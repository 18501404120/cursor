<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研发知识库 AI 协作平台 Demo · 版本二</title>
  <style>
    :root {
      --bg: #f3f6fa;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #e1e7ef;
      --primary: #2367d1;
      --primary-dark: #174b9b;
      --primary-soft: #eaf2ff;
      --cyan-soft: #eaf8fb;
      --green: #13835f;
      --green-soft: #e9f7f1;
      --amber: #a76000;
      --amber-soft: #fff5e3;
      --red: #c23c4b;
      --red-soft: #fff0f2;
      --purple: #6847be;
      --purple-soft: #f1edff;
      --nav: 218px;
      --shadow: 0 8px 28px rgba(23, 42, 77, .07);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    #app { min-height: 100%; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 58px;
      padding: 0 18px;
      color: #fff;
      background: #17264a;
    }
    .brand { min-width: 250px; font-size: 15px; font-weight: 800; }
    .brand small { display: block; margin-top: -2px; color: rgba(255,255,255,.62); font-size: 10px; font-weight: 500; }
    .version {
      padding: 3px 9px;
      color: #dce9ff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .top-spacer { flex: 1; }
    .top-select {
      height: 34px;
      min-width: 190px;
      padding: 0 9px;
      color: #fff;
      background: #223868;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 8px;
      outline: none;
    }
    .top-button {
      height: 34px;
      padding: 0 11px;
      color: #fff;
      background: transparent;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 8px;
    }
    .top-button:hover { background: rgba(255,255,255,.08); }

    .layout {
      display: grid;
      grid-template-columns: var(--nav) minmax(0, 1fr);
      min-height: calc(100vh - 58px);
    }
    .nav {
      position: sticky;
      top: 58px;
      height: calc(100vh - 58px);
      overflow: auto;
      padding: 15px 11px;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }
    .nav-title {
      padding: 0 10px 7px;
      color: #98a2b3;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .nav-button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 42px;
      margin: 2px 0;
      padding: 8px 10px;
      color: #475467;
      background: transparent;
      border: 0;
      border-radius: 9px;
      text-align: left;
      font-weight: 700;
    }
    .nav-button:hover { background: #f5f7fa; }
    .nav-button.on { color: var(--primary); background: var(--primary-soft); }
    .nav-icon {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      color: #667085;
      background: #f0f3f7;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 800;
    }
    .nav-button.on .nav-icon { color: #fff; background: var(--primary); }
    .nav-count {
      min-width: 20px;
      margin-left: auto;
      padding: 1px 6px;
      color: #667085;
      background: #eef1f5;
      border-radius: 999px;
      text-align: center;
      font-size: 10px;
    }
    .role-note {
      margin: 17px 5px 0;
      padding: 11px;
      color: #385375;
      background: #f6f9ff;
      border: 1px solid #dce6f6;
      border-radius: 10px;
      font-size: 11px;
    }
    .role-note b { display: block; margin-bottom: 3px; color: var(--primary-dark); }
    .main { min-width: 0; padding: 18px 22px 42px; }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .page-head h1 { margin: 0; font-size: 22px; line-height: 1.25; }
    .page-head p { margin: 4px 0 0; color: var(--muted); }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn {
      min-height: 34px;
      padding: 6px 12px;
      color: #344054;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-weight: 700;
    }
    .btn:hover { background: #f8fafc; }
    .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn.green { color: #fff; background: var(--green); border-color: var(--green); }
    .btn.small { min-height: 28px; padding: 3px 9px; font-size: 11px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .project-strip {
      display: grid;
      grid-template-columns: 1.2fr repeat(4, minmax(0, .72fr));
      gap: 9px;
      margin-bottom: 13px;
    }
    .project-main, .metric {
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px;
    }
    .project-main { background: #f8fbff; border-color: #cdddf2; }
    .project-main strong { display: block; margin-bottom: 2px; color: var(--primary-dark); font-size: 15px; }
    .project-main span, .metric span { color: var(--muted); font-size: 10px; }
    .metric b { display: block; margin-bottom: 1px; font-size: 17px; }
    .metric b.good { color: var(--green); }
    .metric b.warn { color: var(--amber); }

    .workspace {
      display: grid;
      grid-template-columns: 238px minmax(360px, 1fr) 330px;
      gap: 12px;
      min-height: 650px;
    }
    .panel {
      min-width: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(16,24,40,.02);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 48px;
      padding: 10px 13px;
      background: #fbfcfe;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: 14px; }
    .panel-head small { color: var(--muted); }

    .tree { padding: 8px; }
    .tree-project {
      width: 100%;
      padding: 9px 10px;
      margin-bottom: 5px;
      color: var(--primary-dark);
      background: var(--primary-soft);
      border: 0;
      border-radius: 8px;
      text-align: left;
      font-weight: 800;
    }
    .folder { margin-bottom: 3px; }
    .folder-row {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      min-height: 34px;
      padding: 6px 8px;
      color: #344054;
      background: transparent;
      border: 0;
      border-radius: 7px;
      text-align: left;
    }
    .folder-row:hover, .folder-row.on { background: #f3f6fa; }
    .folder-code { color: #8090a6; font-size: 10px; font-weight: 800; }
    .folder-count { margin-left: auto; color: #98a2b3; font-size: 10px; }
    .doc-list { padding: 2px 5px 5px 27px; }
    .doc-item {
      display: block;
      width: 100%;
      padding: 5px 6px;
      overflow: hidden;
      color: #667085;
      background: transparent;
      border: 0;
      border-radius: 5px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
    }
    .doc-item:hover { color: var(--primary); background: var(--primary-soft); }

    .chat-panel { display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; }
    .context-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 9px 12px;
      background: #f7faff;
      border-bottom: 1px solid var(--line);
    }
    .context-chip {
      padding: 3px 7px;
      color: #36567c;
      background: #fff;
      border: 1px solid #d6e2f2;
      border-radius: 999px;
      font-size: 10px;
    }
    .quick-prompts {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 12px;
      overflow-x: auto;
    }
    .quick {
      flex: 0 0 auto;
      height: 28px;
      padding: 0 10px;
      color: #37557b;
      background: #fff;
      border: 1px solid #d7e1ef;
      border-radius: 7px;
      font-size: 12px;
      line-height: 26px;
      white-space: nowrap;
    }
    .quick:hover { color: var(--primary); background: var(--primary-soft); border-color: #bcd0ef; }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      padding: 10px 14px 14px;
      overflow: auto;
    }
    .message {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 10px;
      white-space: pre-line;
    }
    .message.user { align-self: flex-end; color: #fff; background: var(--primary); }
    .message.ai { align-self: flex-start; color: #30425d; background: #f4f7fb; border: 1px solid #e1e7ef; }
    .message strong { display: block; margin-bottom: 4px; color: #1f3c64; }
    .sources {
      margin-top: 8px;
      padding-top: 7px;
      color: #486b9f;
      border-top: 1px solid #dce5f0;
      font-size: 10px;
    }
    .composer {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      padding: 11px;
      background: #fbfcfe;
      border-top: 1px solid var(--line);
    }
    .composer input {
      min-width: 0;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #cfd8e5;
      border-radius: 8px;
      outline: none;
    }
    .composer.kb-ask { grid-template-columns: 1fr auto; }

    .context-panel { display: flex; flex-direction: column; }
    .context-body { padding: 12px; overflow: auto; }
    .role-card {
      padding: 11px;
      color: #294465;
      background: #f6f9ff;
      border: 1px solid #d9e5f5;
      border-radius: 9px;
    }
    .role-card b { display: block; margin-bottom: 3px; color: var(--primary-dark); }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 7px;
      font-size: 12px;
      font-weight: 800;
    }
    .check-list { display: grid; gap: 6px; }
    .check-item {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      width: 100%;
      padding: 8px;
      color: inherit;
      background: #fafbfc;
      border: 1px solid #e8ecf2;
      border-radius: 7px;
      text-align: left;
    }
    .check-item.has-doc { cursor: pointer; }
    .check-item.has-doc:hover { border-color: #c5d8f0; background: #f7fbff; }
    .check-item.unread { background: #fff8f8; border-color: #f3c4c8; }
    .unread-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 4px;
      background: #e11d48;
      border-radius: 50%;
      vertical-align: middle;
    }
    .status.red { color: #e11d48; background: #fff1f2; }
    .check {
      display: grid;
      width: 18px;
      height: 18px;
      place-items: center;
      color: #fff;
      background: #aeb8c6;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 800;
    }
    .check.ok { background: var(--green); }
    .check.missing { color: var(--amber); background: var(--amber-soft); border: 1px solid #edc77f; }
    .check-item strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .check-item small { display: block; color: var(--muted); font-size: 9px; }
    .status {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status.green { color: var(--green); background: var(--green-soft); }
    .status.amber { color: var(--amber); background: var(--amber-soft); }
    .status.blue { color: var(--primary); background: var(--primary-soft); }
    .status.gray { color: #667085; background: #eef1f5; }
    .status.purple { color: var(--purple); background: var(--purple-soft); }

    .draft {
      margin-top: 12px;
      padding: 11px;
      background: #fffdf8;
      border: 1px solid #ead8b2;
      border-radius: 9px;
    }
    .draft h3 { margin: 0 0 6px; color: #80571d; font-size: 13px; }
    .draft p { margin: 0 0 7px; color: #665842; font-size: 10px; }
    .draft ul { margin: 5px 0 9px; padding-left: 17px; color: #665842; font-size: 10px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat { padding: 14px; }
    .stat b { display: block; margin: 2px 0; font-size: 23px; }
    .stat span { color: var(--muted); font-size: 10px; }
    .content-grid { display: grid; grid-template-columns: 255px minmax(0, 1fr); gap: 12px; }
    .kb-grid { display: grid; grid-template-columns: 238px minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
    .kb-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
    }
    .kb-search input, .kb-ask input {
      min-width: 0;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #cfd8e5;
      border-radius: 8px;
      outline: none;
    }
    .kb-search input:focus, .kb-ask input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(35,103,209,.1); }
    .kb-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      min-height: 26px;
      padding: 2px 9px;
      color: #475467;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .chip.on { color: var(--primary); background: var(--primary-soft); border-color: #b9d0f3; }
    .folder-row.filter-on { color: var(--primary); background: var(--primary-soft); }
    .cite-list { display: grid; gap: 8px; margin-top: 8px; }
    .cite-card {
      width: 100%;
      padding: 8px 9px;
      color: inherit;
      background: #fff;
      border: 1px solid #d6e2f2;
      border-radius: 8px;
      text-align: left;
    }
    .cite-card:hover { border-color: var(--primary); background: #f7fbff; }
    .cite-quote {
      margin-top: 5px;
      padding: 6px 8px;
      color: #294465;
      background: #f4f8ff;
      border-left: 3px solid var(--primary);
      font-size: 11px;
      line-height: 1.45;
    }
    .kb-ask-panel { display: flex; flex-direction: column; min-height: 560px; }
    .kb-messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 320px;
      max-height: 460px;
      padding: 12px;
      overflow: auto;
    }
    .history-list { display: grid; gap: 8px; margin-top: 10px; }
    .history-item {
      padding: 9px 10px;
      background: #fafbfc;
      border: 1px solid #e8ecf2;
      border-radius: 8px;
    }
    .history-item b { display: block; margin-bottom: 2px; }
    .diff-row { display: grid; gap: 6px; margin-top: 8px; }
    .diff-line { padding: 7px 9px; border-radius: 6px; font-size: 12px; line-height: 1.45; }
    .diff-line.del { color: #9f1239; background: #fff1f2; text-decoration: line-through; }
    .diff-line.add { color: #047857; background: #ecfdf5; }
    .legend-note { color: var(--muted); font-size: 10px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .card-pad { padding: 15px; }
    .card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .card-title h2, .card-title h3 { margin: 0; }
    .doc-table { width: 100%; border-collapse: collapse; }
    .doc-table th, .doc-table td { padding: 10px 9px; border-bottom: 1px solid #edf0f4; text-align: left; vertical-align: top; }
    .doc-table th { color: #667085; background: #f8fafc; font-size: 10px; }
    .doc-table tr:last-child td { border-bottom: 0; }
    .doc-table tbody tr { cursor: pointer; }
    .doc-table tbody tr:hover { background: #f8fbff; }
    .doc-name { font-weight: 750; }
    .doc-meta { color: var(--muted); font-size: 10px; }
    .change-sum { margin-top: 3px; font-size: 10px; font-weight: 700; color: #667085; }
    .change-sum.hot { color: #b45309; }

    .skills {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 11px;
    }
    .skill-card {
      min-height: 190px;
      padding: 15px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .skill-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .skill-code { color: var(--purple); font-size: 10px; font-weight: 800; }
    .skill-card h3 { margin: 2px 0 0; font-size: 15px; }
    .skill-card p { color: var(--muted); font-size: 11px; }
    .rule-list { margin: 8px 0 0; padding-left: 17px; color: #475467; font-size: 10px; }

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(17, 28, 51, .52);
    }
    .modal {
      width: min(680px, 96vw);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .modal.wide { width: min(980px, 96vw); }
    .doc-tabs { display: flex; gap: 6px; margin: 0 0 12px; }
    .doc-tab {
      min-height: 30px;
      padding: 4px 12px;
      color: #475467;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .doc-tab.on { color: #fff; background: var(--primary); border-color: var(--primary); }
    .field-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
      padding: 9px 11px;
      color: #3d4f68;
      background: #f7faff;
      border: 1px solid #d9e6f6;
      border-radius: 8px;
      font-size: 11px;
    }
    .field-summary b { color: var(--primary-dark); }
    .field-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .field-list { display: grid; gap: 7px; }
    .field-row {
      padding: 10px 11px;
      background: #fafbfc;
      border: 1px solid #e8ecf2;
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
    }
    .field-row:hover { border-color: #c5d8f0; background: #f7fbff; }
    .field-row.on { border-color: #b9d0f3; background: #f4f8ff; }
    .field-row.removed { background: #fafafa; }
    .field-row.lv2 { margin-left: 18px; }
    .field-value.removed { color: #98a2b3; text-decoration: line-through; }
    .field-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .field-top strong { display: block; font-size: 13px; }
    .field-path { color: #8090a6; font-size: 10px; font-weight: 700; }
    .field-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
    .field-value { margin-top: 6px; color: #344054; font-size: 12px; line-height: 1.45; }
    .field-panel {
      margin-top: 10px;
      padding: 10px;
      background: #fff;
      border: 1px dashed #d5deea;
      border-radius: 8px;
    }
    .field-panel h4 { margin: 0 0 6px; font-size: 12px; }
    .slice-paper {
      padding: 10px 12px;
      color: #2c3a4d;
      background: #fffdf8;
      border: 1px solid #ead8b2;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-line;
    }
    .file-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    .file-paper {
      padding: 16px 18px 20px;
      background: #f6f4ee;
      border: 1px solid #e4dcc8;
      border-radius: 10px;
    }
    .file-paper-head {
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e4dcc8;
    }
    .file-paper-head b { display: block; font-size: 15px; }
    .file-sec {
      margin-top: 10px;
      padding: 10px 12px;
      background: #fff;
      border: 1px solid #e8e2d6;
      border-radius: 8px;
    }
    .file-sec.on { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(35,103,209,.18); }
    .file-sec small { display: block; color: #9a8f78; font-size: 10px; font-weight: 800; }

    }
    function persist() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")

        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function currentProject() { return state.projects.find(item => item.id === state.projectId); }
    function currentRole() { return state.roles[state.roleId]; }

    function readMap() {
      state.readAt = state.readAt || {};
      state.readAt[readKey()] = state.readAt[readKey()] || {};
      return state.readAt[readKey()];
    }
    function lastReadVersion(docId) { return readMap()[docId]; }
    function isUnreadDoc(itemDoc) { return Boolean(itemDoc && lastReadVersion(itemDoc.id) !== itemDoc.version); }
    function unreadInputs() { return currentNode().inputs.filter(item => isUnreadDoc(doc(item.docId))); }
    function markDocRead(id) {
      const item = doc(id);

      readMap()[id] = item.version;

    function openDoc(id) {
      const item = doc(id);
      ui.modal = {
        type: "doc",

        fieldFilter: "all"

    function fieldChangeLabel(change) {
      return { changed: "修改", unchanged: "未改", added: "新增", removed: "删除" }[change] || "未改";
    }
    function fieldChangeTone(change) {
      return { changed: "amber", unchanged: "gray", added: "blue", removed: "red" }[change] || "gray";
    }
    function isFieldRelevant(field) {
      return Array.isArray(field.relevant) && field.relevant.includes(state.roleId);
    }
    function isFirstPack(item) {
      return !(item.history && item.history.length > 1);
    }
    function fieldCounts(item) {
      const fields = item.fields || [];
      return {
        changed: fields.filter(field => field.change === "changed").length,
        added: fields.filter(field => field.change === "added").length,
        removed: fields.filter(field => field.change === "removed").length,
        unchanged: fields.filter(field => field.change === "unchanged").length
      };
    }
    function packChangeTotal(item) {
      if (isFirstPack(item) || !(item.fields || []).length) return 0;
      const counts = fieldCounts(item);
      return counts.changed + counts.added + counts.removed;
    }
    function packChangeLine(item) {
      const n = (item.fields || []).length;
      if (!n) return { text: "尚未拆切片", hot: false };
      if (isFirstPack(item)) return { text: `首版 · 已拆 ${n} 节`, hot: false };
      const counts = fieldCounts(item);
      const parts = [];
      if (counts.changed) parts.push(`修改 ${counts.changed}`);
      if (counts.added) parts.push(`新增 ${counts.added}`);
      if (counts.removed) parts.push(`删除 ${counts.removed}`);
      if (!parts.length) return { text: `相对上一包未改 · ${n} 节`, hot: false };
      return { text: parts.join(" · "), hot: true };

          ${open ? `<div class="doc-list">${folderDocs.map(docItem => `<button class="doc-item" data-act="open-doc" data-id="${docItem.id}" title="${esc(docItem.name)}">${esc(docItem.name)}</button>`).join("") || `<span class="doc-item">暂无资料</span>`}</div>` : ""}
        </div>`;
      }).join("")}</div>`;
    }

    function filteredDocs() {
      const query = (ui.kbQuery || "").trim().toLowerCase();
      return docs().filter(item => {
        if (ui.folderFilter && item.folderId !== ui.folderFilter) return false;
        if (ui.kbFilter === "confirmed" && !isConfirmed(item)) return false;
        if (ui.kbFilter === "draft" && isConfirmed(item)) return false;
        if (ui.kbFilter === "changed" && !packChangeTotal(item)) return false;
        if (!query) return true;
        const blob = [item.name, item.type, item.owner, item.source, item.excerpt, item.loc, ...(item.fields || []).map(field => field.name + " " + (field.value || ""))].join(" ").toLowerCase();
        return blob.includes(query);
      });
    }

    function citeButtons(cites) {
      if (!cites?.length) return "";
      return `<div class="cite-list">${cites.map(item => `<button class="cite-card" data-act="open-doc" data-id="${item.id}">
        <div class="btns" style="margin-bottom:4px"><b>${esc(item.name)}</b><span class="status ${statusTone(item)}">${statusLabel(item)}</span><span class="status ${versionTone(item.version)}">${esc(item.version)}</span></div>
        <div class="cite-quote">「${esc(item.excerpt || "")}」<div class="doc-meta">${esc(item.loc || "原文摘录")} · 点击查看资料</div></div>
      </button>`).join("")}</div>`;
    }

          <section class="card">
            <div class="card-pad">

              <div class="kb-search">

              <tbody>${list.map(item => {

            <div class="kb-messages">

    function modalHtml() {

      if (ui.modal.type === "diff") return diffModal(ui.modal.id);
      if (ui.modal.type === "draft") return draftModal();

    function uploadModal() {

            <div class="modal-head"><div><h2>上传资料并智能归档</h2><span class="doc-meta">演示文件已预置，归档到当前项目</span></div><button class="close" data-act="close-modal">×</button></div>
            <div class="modal-body">
              <div class="card card-pad">
                <div class="card-title"><div><h3>${esc(preset.fileName)}</h3><span class="doc-meta">PDF · 上传人：${esc(preset.owner)}</span></div><span class="status blue">解析完成</span></div>
              </div>
              <div class="analysis-box">
                <div class="card-title"><div><h3>AI 分类与归档建议</h3><span class="doc-meta">依据“文件识别分类 Skill”分析</span></div><span class="status green">置信度 96%</span></div>
                <div class="analysis-grid">
                  <div class="analysis-item"><small>识别类型</small><b>${esc(preset.type)}</b></div>
                  <div class="analysis-item"><small>建议目录</small><b>${esc(folder(preset.folderId)?.code)} ${esc(folder(preset.folderId)?.name)}</b></div>
                  <div class="analysis-item"><small>关联角色</small><b>${esc(preset.related)}</b></div>
                  <div class="analysis-item"><small>当前项目</small><b>${esc(currentProject().id.toUpperCase())}</b></div>
                </div>
                <p class="doc-meta" style="margin:10px 0 0">${esc(preset.hint)}</p>
              </div>
            </div>
            <div class="modal-foot"><button class="btn" data-act="close-modal">取消</button><button class="btn primary" data-act="confirm-upload" ${already ? "disabled" : ""}>${already ? "已归档" : "确认归档并通知角色"}</button></div>
          </section>
        </div>
      `;
    }

    function docModal(id) {
      const item = doc(id);
      if (!item) return "";
      return item.fields && item.fields.length ? richDocModal(item) : simpleDocModal(item);
    }

    function simpleDocModal(item) {
      const history = docHistory(item);
      const canCite = isConfirmed(item);
      const fromVersion = ui.modal.fromVersion;
      const updated = fromVersion && fromVersion !== item.version;
      const isInput = currentNode().inputs.some(entry => entry.docId === item.id);
      return `
        <div class="modal-mask">
          <section class="modal">
            <div class="modal-head"><div><h2>${esc(item.name)}</h2><span class="doc-meta">${esc(item.type)} · <span class="status ${statusTone(item)}">${statusLabel(item)}</span> · <span class="status ${versionTone(item.version)}">${esc(item.version)}</span></span></div><button class="close" data-act="close-modal">×</button></div>
            <div class="modal-body">
              ${updated ? `<div class="analysis-box" style="border-color:#f3c4c8;background:#fff8f8"><b>输入有更新</b><p class="doc-meta" style="margin:6px 0 0">你上次已读 ${esc(fromVersion)}，当前为 ${esc(item.version)}。打开本页即视为已读，红点将消失。${canCite ? "生成将使用最新已确认稿。" : "该资料为工作稿，仅提醒你查看，AI 仍不引用。"}</p></div>` : ""}
              <div class="analysis-grid">
                <div class="analysis-item"><small>归档目录</small><b>${esc(folder(item.folderId)?.code)} ${esc(folder(item.folderId)?.name)}</b></div>
                <div class="analysis-item"><small>资料责任人</small><b>${esc(item.owner)}</b></div>
                <div class="analysis-item"><small>当前节点关系</small><b>${isInput ? "上游输入" : "项目资料"}</b></div>
                <div class="analysis-item"><small>AI 默认可引用</small><b>${canCite ? "是" : "否，工作稿"}</b></div>
              </div>
              <div class="cite-quote">「${esc(item.excerpt || "暂无正文摘录")}」<div class="doc-meta">${esc(item.loc || "原文摘录")}</div></div>
              <div class="analysis-box"><b>AI 可用说明</b><p class="doc-meta" style="margin:6px 0 0">${canCite ? "该资料为已确认稿，问资料和工作台生成时可作为来源，并应回链到本摘录。" : "该资料为工作稿，知识库可检索，但问资料默认不会引用。责任人确认后才会进入 AI 上下文。"}</p></div>
            </div>
            <div class="modal-foot">
              ${history.length > 1 ? `<button class="btn" data-act="open-history" data-id="${item.id}">查看历史版本</button>` : ""}
              ${history.length > 1 ? `<button class="btn" data-act="open-diff" data-id="${item.id}">与上一版对比</button>` : ""}
              <button class="btn primary" data-act="close-modal">关闭</button>
            </div>
          </section>
        </div>
      `;
    }

    function richDocModal(item) {
      const history = docHistory(item);
      const fromVersion = ui.modal.fromVersion;
      const updated = fromVersion && fromVersion !== item.version;
      const tab = ui.modal.tab || "fields";
      const filter = ui.modal.fieldFilter || "all";
      const file = item.file || {};
      const counts = fieldCounts(item);
      return `
        <div class="modal-mask">
          <section class="modal wide">
            <div class="modal-head"><div><h2>${esc(item.name)}</h2><span class="doc-meta">${esc(item.type)} · <span class="status ${statusTone(item)}">${statusLabel(item)}</span> · 文件 ${esc(item.version)}</span></div><button class="close" data-act="close-modal">×</button></div>
            <div class="modal-body">
              ${updated ? `<div class="analysis-box" style="border-color:#f3c4c8;background:#fff8f8"><b>资料包有更新</b><p class="doc-meta" style="margin:6px 0 0">你上次看过文件 ${esc(fromVersion)}，当前是 ${esc(item.version)}。下面只标相对上一包的变化，未改的可以不看。</p></div>` : ""}
              <p class="doc-meta" style="margin:0 0 10px">${esc(file.uploadedBy || item.owner)} 于 ${esc(file.uploadedAt || item.updated)} 上传 · ${esc(file.name || item.name)} · ${esc(folder(item.folderId)?.code)} ${esc(folder(item.folderId)?.name)}</p>
              <div class="field-summary">${isFirstPack(item)
                ? `本包为首版，共 ${(item.fields || []).length} 个切片。再次上传后才会对照打未改 / 修改 / 新增 / 删除。内容只能重新上传修改。`
                : `对照上一包：<b>修改 ${counts.changed}</b> · 新增 ${counts.added} · 删除 ${counts.removed} · 未改 ${counts.unchanged}。内容只能重新上传修改，不能在切片上直接改。`}</div>
              <div class="doc-tabs">
                <button class="doc-tab ${tab === "fields" ? "on" : ""}" data-act="doc-tab" data-tab="fields">字段视图</button>
                <button class="doc-tab ${tab === "file" ? "on" : ""}" data-act="doc-tab" data-tab="file">原文件</button>
              </div>
              ${tab === "file" ? originalFileView(item) : fieldView(item, filter)}
            </div>
            <div class="modal-foot">
              <button class="btn" data-act="open-reupload" data-id="${item.id}">重新上传</button>
              ${history.length > 1 ? `<button class="btn" data-act="open-history" data-id="${item.id}">文件版本历史</button>` : ""}
              <button class="btn primary" data-act="close-modal">关闭</button>
            </div>
          </section>
        </div>
      `;
    }

    function fieldView(item, filter) {
      const list = visibleFields(item);
      const chips = isFirstPack(item)
        ? [["all", "全部"], ["mine", "与我相关"]]
        : [["all", "全部"], ["mine", "与我相关"], ["changed", "有变化"]];
      const empty = isFirstPack(item) && filter === "changed"
        ? "本包为首版，还没有对照变化"
        : "当前筛选下没有切片";
      return `
        <div class="field-filters">${chips.map(([id, label]) => `<button class="chip ${filter === id ? "on" : ""}" data-act="field-filter" data-filter="${id}">${label}</button>`).join("")}</div>
        <div class="field-list">${list.map(field => fieldRowHtml(item, field)).join("") || `<div class="empty">${empty}</div>`}</div>
      `;
    }

    function fieldRowHtml(item, field) {
      const open = ui.modal.fieldId === field.id;
      const removed = field.change === "removed";
      return `
        <div class="field-row ${open ? "on" : ""} ${removed ? "removed" : ""} ${field.level > 1 ? "lv2" : ""}" role="button" tabindex="0" data-act="toggle-field" data-field="${field.id}">
          <div class="field-top">
            <div>
              <span class="field-path">${esc(field.path)}</span>
              <strong>${esc(field.name)}</strong>
            </div>
            ${isFirstPack(item) ? "" : `<span class="status ${fieldChangeTone(field.change)}">${esc(fieldChangeLabel(field.change))}</span>`}
          </div>
          <div class="field-value ${removed ? "removed" : ""}">${esc(field.value || "")}</div>
          ${open ? fieldPanelHtml(item, field) : ""}
        </div>
      `;
    }

    function fieldPanelHtml(item, field) {
      const removed = field.change === "removed";
      return `
        <div class="field-panel" data-act="noop">
          ${field.prev && field.change === "changed" ? `<div class="doc-meta" style="margin-bottom:6px">上一包：${esc(field.prev)}</div>` : ""}
          <div class="slice-paper">${esc(field.slice || field.value || "")}</div>
          <div class="doc-meta" style="margin-top:6px">${removed ? "本包原文件中已无此节" : `原文件位置：${esc(field.loc || "原文件")}`}</div>
          ${!removed && field.attachments && field.attachments.length ? `<div class="attach-list">${field.attachments.map(file => `<button class="attach" data-act="open-attach" data-name="${esc(file.name)}">${esc(file.name)}</button>`).join("")}</div>` : ""}
          <div class="btns" style="margin-top:10px">
            ${removed ? `<span class="doc-meta">删除的切片不能定位到本包原文件</span>` : `<button class="btn small" data-act="locate-file" data-field="${field.id}">定位到原文件</button>`}
          </div>
        </div>
      `;
    }

    function originalFileView(item) {
      const file = item.file || {};
      const highlight = ui.modal.highlightField;
      const sections = (item.fields || []).filter(field => field.change !== "removed");
      return `
        <div class="file-toolbar">
          <span class="doc-meta">${esc(file.format || "PDF")} · ${esc(String(file.pages || "-"))} 页 · ${esc(file.size || "")} · ${esc(file.uploadedBy || item.owner)} 于 ${esc(file.uploadedAt || item.updated)} 上传</span>
          <button class="btn small" data-act="open-attach" data-name="${esc(file.name || item.name)}">打开原文件</button>
        </div>
        <div class="file-paper">
          <div class="file-paper-head"><b>${esc(file.name || item.name)}</b><span class="doc-meta">原文件预览 · 与字段视图按标题对应</span></div>
          ${sections.map(field => `
            <div class="file-sec ${highlight === field.id ? "on" : ""}">
              <small>${esc(field.path)} · ${esc(field.loc || "")}</small>
              <b>${esc(field.name)}</b>
              <p>${esc(field.slice || field.value || "")}</p>
            </div>
          `).join("")}
        </div>
      `;
    }

    function reuploadModal() {
      const item = doc(ui.modal.id);
      if (!item) return "";
      const file = item.file || {};
      const counts = fieldCounts(item);
      return `
        <div class="modal-mask">
          <section class="modal">
            <div class="modal-head"><div><h2>重新上传 · ${esc(item.name)}</h2><span class="doc-meta">只能上传新文件修改，不能在切片上直接改</span></div><button class="close" data-act="close-modal">×</button></div>
            <div class="modal-body">
              <p>上传后系统按标题对照上一包，给每条打 <b>未改 / 修改 / 新增 / 删除</b>。未改的切片保持原样，不会让下游误以为整包都变了。</p>
              <div class="analysis-box"><b>本次文件</b><p class="doc-meta" style="margin:6px 0 0">${esc(file.name || item.name)} · 将追加为新的文件 ${esc(item.version)}，不覆盖旧包。</p></div>
              <div class="field-summary" style="margin-top:10px">${isFirstPack(item)
                ? `本包为首版，共 ${(item.fields || []).length} 个切片。上传新文件后才会对照打标签。`
                : `对照结果：修改 ${counts.changed} · 新增 ${counts.added} · 删除 ${counts.removed} · 未改 ${counts.unchanged}`}</div>
            </div>
            <div class="modal-foot">
              <button class="btn" data-act="open-doc" data-id="${item.id}">返回</button>
              <button class="btn primary" data-act="confirm-reupload" data-id="${item.id}">确认上传并对照</button>
            </div>
          </section>
        </div>
      `;
    }

    function historyModal(id) {
      const item = doc(id);
      if (!item) return "";
      const history = docHistory(item);
      return `
        <div class="modal-mask">
          <section class="modal">
            <div class="modal-head"><div><h2>版本历史 · ${esc(item.name)}</h2><span class="doc-meta">示意能力：不覆盖旧版，只追加</span></div><button class="close" data-act="close-modal">×</button></div>
            <div class="modal-body">
              <div class="history-list">${history.map((ver, index) => `<div class="history-item">
                <b><span class="status ${versionTone(ver.version)}">${esc(ver.version)}</span> <span class="status ${ver.status === "confirmed" ? "green" : "amber"}">${ver.status === "confirmed" ? "已确认" : "工作稿"}</span> ${index === history.length - 1 ? "<span class='status blue'>当前</span>" : ""}</b>
                <div class="doc-meta">${esc(ver.date)} · ${esc(ver.owner)} · ${esc(ver.note)}</div>
                <p style="margin:6px 0 0">${esc(ver.body || "")}</p>
              </div>`).join("")}</div>
            </div>
            <div class="modal-foot">
              ${history.length > 1 ? `<button class="btn" data-act="open-diff" data-id="${item.id}">查看版本差异</button>` : ""}
              <button class="btn" data-act="open-doc" data-id="${item.id}">返回资料</button>
            </div>
          </section>
        </div>
      `;
    }

    function diffModal(id) {
      const item = doc(id);
      if (!item) return "";
      const history = docHistory(item);
      const current = history[history.length - 1];
      const prev = history[history.length - 2];
      const changes = current?.changes?.length ? current.changes : [
        { type: "del", text: prev?.body || "上一版正文" },
        { type: "add", text: current?.body || item.excerpt || "当前版正文" }
      ];
      return `
        <div class="modal-mask">
          <section class="modal">
            <div class="modal-head"><div><h2>版本差异 · ${esc(item.name)}</h2><span class="doc-meta">${esc(prev?.version || "上一版")} → ${esc(current?.version || item.version)} · 文本类示意</span></div><button class="close" data-act="close-modal">×</button></div>
            <div class="modal-body">
              <p class="legend-note">Demo 仅对方案/定义类文本做段落对比。图纸和 PDF 后续只提供换版说明，不做像素 diff。</p>
              <div class="diff-row">${changes.map(line => `<div class="diff-line ${line.type}">${line.type === "add" ? "新增：" : "删除："}${esc(line.text)}</div>`).join("")}</div>
            </div>
            <div class="modal-foot"><button class="btn" data-act="open-history" data-id="${item.id}">返回历史</button><button class="btn primary" data-act="close-modal">关闭</button></div>
          </section>
        </div>
      `;
    }

    function draftModal() {
      const draft = state.generated;
      const node = currentNode();
      const missing = node.inputs.filter(item => !hasDoc(item.docId)).map(item => item.name);
      return `
        <div class="modal-mask">
          <section class="modal">
            <div class="modal-head"><div><h2>${esc(draft.title)}</h2><span class="doc-meta">AI 生成初稿 · 等待责任人确认</span></div><button class="close" data-act="close-modal">×</button></div>
            <div class="modal-body">
              <p><b>1. 工作目标</b></p><p>${esc(node.note)}。输出面向当前节点“${esc(nodeLabel(node))}”，不自动判定下游开工。</p>
              <p><b>2. 输入依据</b></p><p>${node.inputs.map(item => {
                const itemDoc = doc(item.docId);
                return itemDoc ? `${itemDoc.name} ${itemDoc.version}` : `${item.name}（尚未归档）`;
              }).join("、")}。</p>
              <p><b>3. 当前判断</b></p><p>${missing.length ? `初稿可先形成，但正式结论仍缺：${missing.join("、")}。` : "当前节点输入已齐套，可形成责任人确认稿。"}</p>
              <p><b>4. 待跟踪事项</b></p><p>${node.outputs.filter(item => !hasDoc(item.docId)).map(item => item.name).join("、") || "本节点输出均已有对应资料。"}</p>
              <div class="analysis-box"><b>来源清单</b><p class="doc-meta" style="margin:6px 0 0">${esc(draft.sources)}</p></div>
            </div>
            <div class="modal-foot"><button class="btn" data-act="close-modal">返回修改</button><button class="btn green" data-act="archive" ${draft.archived ? "disabled" : ""}>${draft.archived ? "已归档" : "确认并归档"}</button></div>
          </section>
        </div>
      `;
    }

    function addMessage(type, text, sources = "") { state.messages.push({ type, text, sources }); }

    function answerPrompt(prompt) {
      const role = currentRole();
      const node = currentNode();
      const project = currentProject();
      addMessage("user", prompt);
      if (prompt.includes("缺口")) {
        const inputMissing = node.inputs.filter(item => !hasDoc(item.docId)).map(item => item.name);
        const outputMissing = node.outputs.filter(item => !hasDoc(item.docId)).map(item => item.name);
        addMessage("ai", `当前节点“${nodeLabel(node)}”还有以下缺口：\n输入缺口：${inputMissing.length ? inputMissing.join("、") : "无"}。\n输出缺口：${outputMissing.length ? outputMissing.join("、") : "无"}。\n缺项不会强制阻断你继续工作，但正式归档前应由责任人确认影响。`, "角色输入输出 Skill · 当前项目资料清单");
      } else if (prompt.includes("更新")) {
        const recent = docs().filter(item => item.updated >= "2026-08-14").slice(0, 4);
        addMessage("ai", recent.length
          ? `本项目近期资料更新：\n${recent.map((item, index) => `${index + 1}. ${item.name} ${item.version}（${item.updated}）`).join("\n")}\n是否影响当前节点，由你对照右侧输入清单判断。`
          : "当前项目暂无 8 月 14 日之后的资料更新。", `项目资料更新时间 · ${project.name}`);
      } else if (prompt.includes("风险")) {
        const missing = [...node.inputs, ...node.outputs].filter(item => !hasDoc(item.docId)).map(item => item.name);
        addMessage("ai", missing.length
          ? `识别到当前节点资料风险：${missing.join("、")} 尚未归档。\n系统只提醒缺口，不自动判定下游是否可开工。`
          : "当前节点输入输出均已有对应资料，主要风险转为版本是否需升版。", "资料完整性检查 Skill");
      } else if (prompt.includes("生成") || prompt.includes("输出") || prompt.includes("验证结论")) {
        generateDraft();
        addMessage("ai", `${state.generated.title} 初稿已生成，并显示在右侧“角色输入与输出”区域。\n${state.generated.summary}\n你可以预览全文，确认后归档为当前项目新版本。`, state.generated.sources);
      } else {
        addMessage("ai", `已基于“${role.name} / ${nodeLabel(node)}”处理你的问题。当前默认可引用 ${confirmedDocs().length} 份已确认资料；工作稿不会进入生成上下文。如需形成正式输出，请使用“生成工作输出”，并在归档前人工确认。`, `${project.name} · 当前节点上下文`);
      }
      render();
    }

    function generateDraft() {
      const node = currentNode();
      const project = currentProject();
      const ready = node.inputs.filter(item => isConfirmed(doc(item.docId)));
      const missing = node.inputs.filter(item => !hasDoc(item.docId));
      const unconfirmed = node.inputs.filter(item => hasDoc(item.docId) && !isConfirmed(doc(item.docId)));
      const pendingOut = node.outputs.find(item => !hasDoc(item.docId)) || node.outputs[0];
      state.generated = {
        roleId: state.roleId,
        nodeId: node.id,
        title: `${project.id.toUpperCase()} ${pendingOut.name}`,
        summary: missing.length || unconfirmed.length
          ? `已确认输入 ${ready.length} 项。缺档 ${missing.map(item => item.name).join("、") || "无"}；工作稿未引用 ${unconfirmed.map(item => item.name).join("、") || "无"}。`
          : "当前节点已确认输入已齐套，初稿可提交责任人确认。",
        sections: ["目标与适用范围", "输入资料与版本", "关键数据与判断", "风险及待跟踪事项", "来源与版本记录"],
        sources: ready.length ? ready.map(item => `${doc(item.docId).name} ${doc(item.docId).version}（已确认）`).join(" · ") : "当前节点尚无已确认输入",
        archived: false
      };
    }

    function askKnowledge(prompt) {
      const text = prompt.toLowerCase();
      const tokens = prompt.split(/[\s，。？?、]/).filter(item => item.length >= 2);
      const hit = item => tokens.some(token => `${item.name} ${item.excerpt || ""} ${item.type}`.toLowerCase().includes(token.toLowerCase()));
      const pick = ids => ids.map(id => doc(id)).filter(isConfirmed);
      let cites = [];
      let answer = "";
      let blocked = docs().filter(item => !isConfirmed(item) && hit(item)).map(item => `${item.name} ${item.version}`).join("、");
      if (state.projectId === "h8120" && /产冰|12kg|性能目标/.test(text)) {
        cites = pick(["prd", "perf", "test-method"]);
        answer = "按已确认资料：38℃ 环境下日产冰量目标为 12kg，允许偏差 ±5%；测试需在 38℃ 稳定后连续称重 24 小时有效产冰量。";
      } else if (/制冷方案|制冷系统方案/.test(text)) {
        cites = pick(["prd", "curve", "envelope"]);
        answer = "「制冷系统方案」当前是工作稿，问资料默认不引用。下面只给出已确认资料里与制冷相关的原文。";
        blocked = blocked || "H8120 制冷系统方案 v0.8";
      } else if (/包络|安装空间|压缩机仓/.test(text)) {
        cites = pick(["envelope"]);
        answer = "按已确认的结构包络：压缩机仓有效安装空间 186×142×128mm，冷凝器厚度不得超过 22mm。";
      } else if (state.projectId === "h8130") {
        cites = pick(["h8130-base"]);
        answer = cites.length
          ? "衍生项目目前只有基线包为已确认稿。产品定义、差异清单仍是工作稿，未纳入引用。"
          : "当前没有可引用的已确认资料。";
      } else {
        cites = confirmedDocs().filter(hit).slice(0, 3);
        answer = cites.length
          ? "根据已确认资料，相关原文如下。答案只绑定这些摘录，工作稿未纳入引用。"
          : "在已确认资料中没有找到可引用原文。可用上方检索查看工作稿，但不能把工作稿当作答案依据。";
      }
      ui.kbMessages.push({ type: "user", text: prompt });
      ui.kbMessages.push({ type: "ai", text: answer, cites, blocked });
      ui.kbAsk = "";
      render();
    }

    function confirmReupload(id) {
      const item = doc(id);
      if (!item) return;
      ui.modal = {
        type: "doc",
        id,
        fromVersion: item.version,
        tab: "fields",
        fieldId: "",
        highlightField: "",
        fieldFilter: "all"
      };
      toast("已按标题对照上一包归档。之后改内容请再上传新文件，不能在切片上直接改。");
    }

    function confirmUpload() {
      const preset = uploadPreset();
      if (!hasDoc(preset.id)) {
        docs().push({
          id: preset.id, folderId: preset.folderId, name: preset.title, type: preset.type,
          version: "v1.0", status: "confirmed", owner: preset.owner, updated: TODAY,
          source: `AI 分类后由${preset.owner}确认归档`, loc: "智能归档摘录", excerpt: preset.hint
        });
        currentProject().nodes.forEach(node => {
          node.inputs.concat(node.outputs).forEach(item => {
            if (!item.docId && (item.name === preset.title || item.name.includes(preset.type) || preset.title.includes(item.name))) item.docId = preset.id;
          });
        });
      }
      ui.modal = null;
      addMessage("ai", `新资料“${preset.title}”已归档至“${folder(preset.folderId).code} ${folder(preset.folderId).name}”。\n已按文件名和类型尝试回写当前项目节点的输入/输出项。`, "文件识别分类 Skill · 角色输入输出 Skill");
      toast("资料已归档到当前项目，并尝试回写节点齐套状态");
    }

    function archiveDraft() {
      if (!state.generated) return;
      state.generated.archived = true;
      const node = currentNode();
      const outputId = `${node.id}-out`;
      if (!hasDoc(outputId)) {
        docs().push({
          id: outputId, folderId: "output", name: state.generated.title, type: "角色工作输出",
          version: "v0.9", status: "confirmed", owner: currentRole().person, updated: TODAY,
          source: "AI 初稿经责任人确认", loc: "确认归档摘要", excerpt: state.generated.summary
        });
      }
      const target = node.outputs.find(item => !hasDoc(item.docId)) || node.outputs.find(item => !item.docId);
      if (target) target.docId = outputId;
      markDocRead(outputId);
      ui.modal = null;
      addMessage("ai", `“${state.generated.title}”已归档至“99 项目正式输出”。\n状态为已确认，版本为 v0.9（版本号仍为 v0.x 黄色，但状态为绿色已确认，问资料可以引用）。`, "文档格式 Skill · 项目知识目录 Skill");
      toast("已确认归档：状态=已确认，版本=v0.9");
    }

    document.addEventListener("click", event => {
      if (event.target.classList.contains("modal-mask")) {
        ui.modal = null;
        render();
        return;
      }
      const target = event.target.closest("[data-act]");
      if (!target) return;
      const act = target.dataset.act;
      if (act === "view") { ui.view = target.dataset.view; render(); return; }
      if (act === "toggle-folder") {
        const id = target.dataset.id;
        ui.openFolders = ui.openFolders.includes(id) ? ui.openFolders.filter(item => item !== id) : [...ui.openFolders, id];
        ui.folderFilter = ui.folderFilter === id ? "" : id;
        render();
        return;
      }
      if (act === "clear-folder") { ui.folderFilter = ""; render(); return; }
      if (act === "kb-filter") { ui.kbFilter = target.dataset.filter; render(); return; }
      if (act === "kb-search") {
        ui.kbQuery = document.getElementById("kbSearch")?.value || "";
        render();
        return;
      }
      if (act === "kb-ask" || act === "kb-quick") {
        const prompt = act === "kb-quick" ? (target.dataset.prompt || "") : (document.getElementById("kbAsk")?.value.trim() || "");
        if (prompt) askKnowledge(prompt);
        return;
      }
      if (act === "noop") return;
      if (act === "doc-tab") {
        ui.modal.tab = target.dataset.tab;
        render();
        return;
      }
      if (act === "field-filter") {
        ui.modal.fieldFilter = target.dataset.filter;
        render();
        return;
      }
      if (act === "toggle-field") {
        const fieldId = target.dataset.field;
        ui.modal.fieldId = ui.modal.fieldId === fieldId ? "" : fieldId;
        ui.modal.highlightField = ui.modal.fieldId;
        render();
        return;
      }
      if (act === "locate-file") {
        const docId = target.dataset.id || ui.modal.id || ui.modal.docId;
        ui.modal = {
          type: "doc",
          id: docId,
          fromVersion: ui.modal.fromVersion,
          tab: "file",
          fieldId: target.dataset.field || "",
          highlightField: target.dataset.field || "",
          fieldFilter: ui.modal.fieldFilter || "all"
        };
        render();
        return;
      }
      if (act === "open-reupload") {
        ui.modal = { type: "reupload", id: target.dataset.id, fromVersion: ui.modal.fromVersion, fieldFilter: ui.modal.fieldFilter || "all" };
        render();
        return;
      }
      if (act === "confirm-reupload") {
        confirmReupload(target.dataset.id);
        return;
      }
      if (act === "open-attach") {
        toast(`Demo 示意打开「${target.dataset.name}」。正式环境将打开原件。`);
        return;
      }
      if (act === "open-history") { ui.modal = { type: "history", id: target.dataset.id }; render(); return; }
      if (act === "open-diff") { ui.modal = { type: "diff", id: target.dataset.id }; render(); return; }
      if (act === "upload") { ui.modal = { type: "upload" }; render(); return; }
      if (act === "open-map") { ui.modal = { type: "map" }; render(); return; }
      if (act === "select-node") {
        switchContext({ nodeId: target.dataset.id });
        ui.modal = null;
        toast("已切换到自己的工作节点，输入输出与 AI 上下文已更新");
        return;
      }
      if (act === "locked-node") {
        toast("只能切换归属自己角色的格子，其他人的节点仅供查看依赖");
        return;
      }
      if (act === "confirm-upload") { confirmUpload(); return; }
      if (act === "open-doc") { openDoc(target.dataset.id); return; }
      if (act === "close-modal") { ui.modal = null; render(); return; }
      if (act === "quick") { answerPrompt(target.dataset.prompt || ""); return; }
      if (act === "send") {
        const input = document.getElementById("chatInput");
        const prompt = input?.value.trim();
        if (prompt) answerPrompt(prompt);
        return;
      }
      if (act === "preview-draft") { ui.modal = { type: "draft" }; render(); return; }
      if (act === "archive") { archiveDraft(); return; }
      if (act === "reset") {
        if (window.confirm("恢复版本二 Demo 的预置示例数据？当前演示操作将被清除。")) {
          state = seed();
          ui.openFolders = ["product", "structure", "cooling", "quality"];
          ui.kbMessages = [];
          ui.kbQuery = "";
          ui.kbFilter = "all";
          ui.folderFilter = "";
          ui.view = "workbench";
          toast("已恢复预置示例数据");
        }
      }
    });

    document.addEventListener("change", event => {
      if (event.target.id === "projectSelect") {
        switchContext({ projectId: event.target.value });
        ui.view = "workbench";
        toast(`已切换到 ${currentProject().name}`);
        return;
      }
      if (event.target.id === "roleSelect") {
        switchContext({ roleId: event.target.value });
        toast(`已切换为 ${currentRole().name} 上下文`);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Enter" && event.target.id === "chatInput") {
        event.preventDefault();
        const prompt = event.target.value.trim();
        if (prompt) answerPrompt(prompt);
      }
      if (event.key === "Enter" && event.target.id === "kbSearch") {
        event.preventDefault();
        ui.kbQuery = event.target.value;
        render();
      }
      if (event.key === "Enter" && event.target.id === "kbAsk") {
        event.preventDefault();
        const prompt = event.target.value.trim();
        if (prompt) askKnowledge(prompt);
      }
      if (event.key === "Escape" && ui.modal) {
        ui.modal = null;
        render();
      }
    });

    render();
  })();
  </script>
</body>
</html>
