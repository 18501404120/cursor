<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研发任务中心 · DEMO</title>
  <style>
    :root {
      --bg: #f3f5f9; --card: #fff; --text: #1a2336; --muted: #6b7690;
      --line: #e6ebf3; --primary: #2f5bff; --soft: #eef2ff;
      --navy: #1d2a57; --green: #087c60; --gsoft: #eaf8f3;
      --amber: #a96100; --asoft: #fff5df; --red: #bd3948; --rsoft: #fff0f2;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; color: var(--text);
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-rows: 54px auto 1fr; height: 100%; }
    .top { display: flex; align-items: center; gap: 12px; padding: 0 16px; color: #fff;
      background: linear-gradient(135deg, #182348, #29428b); min-width: 0; }
    .brand { font-weight: 800; font-size: 15px; white-space: nowrap; flex: 0 0 auto; }
    .brand span { display: block; font-size: 10px; font-weight: 600; opacity: .65; }
    .tabs { display: flex; gap: 4px; flex: 1 1 auto; min-width: 0; }
    .tab { border: 0; background: transparent; color: rgba(255,255,255,.7); padding: 7px 12px; border-radius: 8px; font-weight: 700; white-space: nowrap; flex: 0 0 auto; }
    .tab.on { color: #fff; background: rgba(255,255,255,.16); }
    .top select { width: auto; min-width: 10.5em; flex: 0 0 auto; border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.1); color: #fff; border-radius: 8px; padding: 6px 8px; }
    .top select option { color: var(--text); }
    .ghost { flex: 0 0 auto; white-space: nowrap; border: 1px solid rgba(255,255,255,.28); background: transparent; color: #fff; border-radius: 8px; padding: 6px 10px; }
    .hint { display: flex; align-items: center; gap: 8px; padding: 7px 16px; background: #fff7ed; color: #9a5b12; font-size: 12px; border-bottom: 1px solid #f3d19a; line-height: 1.45; }
    .hint b { color: #7c3d00; }
    .shell { min-height: 0; overflow: hidden; }
    .split { display: grid; grid-template-columns: 248px 1fr; min-height: 100%; height: 100%; }
    .list { background: #fff; border-right: 1px solid var(--line); overflow: auto; }
    .list h2 { margin: 0; padding: 16px 16px 4px; font-size: 14px; }
    .list p { margin: 0; padding: 0 16px 12px; color: var(--muted); font-size: 12px; }
    .item { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: #fff; padding: 12px 16px; }
    .item:hover { background: #f8faff; }
    .item.on { background: var(--soft); }
    .item b { display: block; font-size: 13px; }
    .item small { color: var(--muted); font-size: 11px; }
    .main { padding: 16px 20px 36px; overflow: auto; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .hd { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .hd h1 { margin: 0 0 4px; font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .hd p { margin: 0; color: var(--muted); font-size: 12px; max-width: 52em; }
    .bd { padding: 16px 18px 20px; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.pri { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.ok { background: var(--green); border-color: var(--green); color: #fff; }
    .btn.warn { background: var(--asoft); border-color: #f0d59a; color: var(--amber); }
    .btn.sm { padding: 5px 9px; font-size: 12px; }
    .btn.link { border: 0; background: transparent; color: var(--muted); font-weight: 600; padding: 4px 6px; }
    .btn.link:hover { color: var(--red); background: var(--rsoft); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .s-draft { background: #f1f5f9; color: #475569; }
    .s-pub { background: #eef2f7; color: #4b5874; }
    .s-on { background: var(--soft); color: #27469f; }
    .s-wait { background: var(--asoft); color: var(--amber); }
    .s-done { background: var(--gsoft); color: var(--green); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-2 { display: grid; grid-template-columns: 1fr 220px; gap: 12px; margin-bottom: 12px; }
    .box { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #f8fafc; }
    .box label, .fld label { display: block; font-size: 11px; font-weight: 800; color: var(--navy); margin-bottom: 6px; }
    .fld { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .fld.acc { background: var(--gsoft); border-color: #b7e4d4; }
    input, textarea, select { border: 1px solid var(--line); border-radius: 7px; padding: 7px 8px; background: #fff; }
    .bd input, .bd textarea, .bd select, .box input { width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table tr[data-act="sel"] { cursor: pointer; }
    table tr.on td { background: var(--soft); }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { color: var(--muted); background: #f7f9fc; font-size: 11px; font-weight: 700; }
    .task-table { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .task-table table { margin: 0; }
    .task-table th, .task-table td { background: #fff; }
    .task-table thead th { background: #f7f9fc; }
    .task-table .col-id { width: 64px; color: var(--muted); font-weight: 700; }
    .task-table .col-owner { width: 108px; }
    .task-table .col-st { width: 118px; }
    .task-table .col-act { width: 132px; white-space: nowrap; }
    .task-table .name { font-weight: 700; }
    .task-table .name.ph { color: var(--muted); font-weight: 600; }
    .kv { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
    .kv table { margin: 0; }
    .kv th { background: #f7f9fc; }
    .kv td { background: #fff; }
    .kv .col-act { width: 72px; text-align: right; }
    .section { margin-top: 18px; }
    .section-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .section-hd h3 { margin: 0; font-size: 13px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .editor { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .editor h2 { margin: 0 0 12px; font-size: 15px; }
    .banner { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; }
    .banner.wait { background: var(--asoft); color: #7c4a00; }
    .banner.ok { background: var(--gsoft); color: #08674f; }
    .banner.no { background: var(--rsoft); color: var(--red); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .muted { color: var(--muted); }
    .toast { position: fixed; right: 16px; top: 70px; display: none; max-width: 380px; padding: 12px 14px; background: var(--navy); color: #fff; border-radius: 10px; z-index: 40; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    .log { display: grid; gap: 8px; }
    .log article { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 12px; }
    .mask { position: fixed; inset: 0; background: rgba(23, 32, 51, .36); display: flex; align-items: center; justify-content: center; z-index: 30; padding: 24px; }
    .modal { width: min(560px, 100%); background: #fff; border-radius: 14px; box-shadow: 0 18px 50px rgba(23, 32, 51, .18); }
    .modal .hd { border-bottom: 1px solid var(--line); }
    .modal .bd textarea { min-height: 180px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .modal .hint-box { margin: 0 0 10px; padding: 10px 12px; background: #f7f9fc; border-radius: 8px; color: var(--muted); font-size: 12px; }
    @media (max-width: 960px) { .split, .grid, .form-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">任务中心<span>DEMO · 不管上下文</span></div>
      <nav class="tabs">
        <button class="tab" data-view="dispatch" type="button">解耦投放</button>
        <button class="tab" data-view="mine" type="button">我的任务</button>
        <button class="tab" data-view="accept" type="button">验收</button>
        <button class="tab" data-view="sum" type="button">项目汇总</button>
      </nav>
      <select id="role"></select>
      <button class="ghost" type="button" id="reset">重置</button>
    </header>
    <div class="hint"><b>演示：</b>组委会写任务并发布 → 可中途增补独立任务（写完再发布）→ 开工 → 主责确认完工。禁止把已有对象拆成下一阶段。尺子归组委会。</div>
    <div class="shell" id="app"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const KEY = "rd-task-demo-v7";
    const ST = {
      draft: { l: "待发布", c: "s-draft" },
      published: { l: "已发布 · 未开工", c: "s-pub" },
      active: { l: "已开工", c: "s-on" },
      review: { l: "验收中", c: "s-wait" },
      done: { l: "已闭环", c: "s-done" }
    };
    const ROLES = [
      { id: "committee", name: "组委会", home: "dispatch" },
      { id: "rd", name: "陈结构 · 主责人", home: "mine" },
      { id: "te", name: "李 TE", home: "accept" },
      { id: "pjm", name: "王项目", home: "sum" }
    ];
    const PEOPLE = [
      { id: "zhou", name: "周ID", role: "id" },
      { id: "chen", name: "陈结构", role: "rd" },
      { id: "sun", name: "孙制冷", role: "rf" },
      { id: "wu", name: "吴电子", role: "ee" }
    ];
    const ui = { role: "committee", view: "dispatch", pid: "PX12", sel: "T03", modal: "" };

    function P(label, value) { return { id: "p" + Math.random().toString(36).slice(2, 7), label, value }; }
    function C(name, target) { return { id: "c" + Math.random().toString(36).slice(2, 7), name, target }; }
    function person(id) { return PEOPLE.find(x => x.id === id); }
    function applyOwner(task, ownerId) {
      const p = person(ownerId);
      task.ownerId = ownerId || "";
      task.owner = p ? p.name : "待指定";
      task.ownerRole = p ? p.role : "";
    }
    function t(id, name, ownerId, helpers, params, criteria, content, block) {
      const row = { id, name, helpers: helpers || [], params, criteria,
        content: content || "", block: block || "", status: "draft", records: [], changes: [], asks: [] };
      applyOwner(row, ownerId);
      return row;
    }
    function proj(id) { return db.projects.find(x => x.id === (id || ui.pid)); }
    function current() { return proj(ui.pid) || db.projects[0]; }
    function task(id, pid) { const p = proj(pid || ui.pid); return p && p.tasks.find(x => x.id === id); }

    function seed() {
      return {
        projects: [
          {
            id: "PX12", name: "PX-12 商用制冰机", published: false,
            tasks: [
              t("T01", "ID 外观", "zhou", ["结构 · 陈结构"],
                [P("交付对象", "可独立验收的外观手板"), P("台面高度", "860±5mm")],
                [C("外观色差", "ΔE≤1.5")],
                "面向量产外观手板，可脱离整机验收。"),
              t("T02", "整机结构", "chen", ["ID · 周ID", "工艺 · 赵工"],
                [P("交付对象", "可承载蒸发器的整机骨架"), P("过门宽度", "≤700mm"), P("接口约束", "不改蒸发器外廓")],
                [C("振动后结构", "无裂纹")],
                "可承载蒸发器的整机骨架，不按节点拆两阶段。"),
              t("T03", "蒸发器", "chen", ["制冷 · 孙制冷", "TE · 李TE"],
                [P("交付对象", "蒸发箱式挤冰器，可脱离整机验收"), P("出冰量", "≥120kg/24h"), P("安装接口", "286×164mm，4-M6")],
                [C("测试台出冰", "≥120kg/24h"), C("保压", "2.5MPa / 30min 无泄漏")],
                "蒸发箱式挤冰器，可脱离整机在测试台验收。"),
              t("T04", "压缩机", "sun", ["结构 · 陈结构"],
                [P("交付对象", "可台架验收的压缩机"), P("匹配接口", "按蒸发器安装面匹配")],
                [C("台架制冷量", "达到匹配曲线")],
                "可台架验收的压缩机，接口跟随蒸发器。",
                "蒸发器安装接口未确认"),
              t("T05", "电子主控", "wu", ["嵌入式 · 冯嵌入式"],
                [P("交付对象", "可独立功能验收的主控板"), P("待机功耗", "≤3W")],
                [C("保护动作", "过流/过温可测")],
                "可独立功能验收的主控板。"),
              t("T06", "挤冰电机", "chen", ["电子 · 吴电子"],
                [P("交付对象", "可台架验收的挤冰电机"), P("堵转扭矩", "≥2.8N·m")],
                [C("扭矩台架", "≥2.8N·m")],
                "可台架验收的挤冰电机。"),
              t("T07", "水路模块", "sun", ["结构 · 陈结构"],
                [P("交付对象", "可打压验收的水路"), P("打压", "0.6MPa 无渗漏")],
                [C("打压", "0.6MPa 无渗漏")],
                "可打压验收的水路模块。"),
              t("T08", "冷凝器", "sun", ["结构 · 陈结构"],
                [P("交付对象", "可风洞验收的冷凝器"), P("风道空间", "待结构确认")],
                [C("风洞换热", "达标")],
                "可风洞验收的冷凝器。")
            ]
          },
          {
            id: "PX08", name: "PX-08 商用烤箱", published: false,
            tasks: [
              t("T01", "外观 ID", "zhou", ["结构 · 陈结构"],
                [P("交付对象", "烤箱门板与把手")], [C("色差", "ΔE≤1.5")],
                "可独立验收的外观件，不绑整机腔体。"),
              t("T02", "腔体结构", "chen", ["ID · 周ID"],
                [P("交付对象", "可独立打压的腔体")], [C("打压", "无泄漏")],
                "面向量产腔体，不拆成两阶段任务。"),
              t("T03", "加热管", "wu", ["结构 · 陈结构"],
                [P("交付对象", "可台架验收的加热管")], [C("功率", "达标")],
                "脱离整机台架验收。")
            ]
          }
        ]
      };
    }

    let db = load();
    function load() {
      try {
        const x = JSON.parse(localStorage.getItem(KEY));
        if (x && Array.isArray(x.projects)) return x;
      } catch (e) {}
      return seed();
    }
    function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
    function toast(m) {
      const el = document.getElementById("toast");
      el.textContent = m; el.style.display = "block";
      clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = "none", 4000);
    }
    function chip(s) { const x = ST[s] || ST.draft; return `<span class="chip ${x.c}">${x.l}</span>`; }
    function now() { return new Date().toLocaleString("zh-CN", { hour12: false }); }
    function log(t, text, by) { t.changes.unshift({ time: now(), by, text }); }
    function ownerOpts(id) {
      return `<option value="">待指定</option>` + PEOPLE.map(p =>
        `<option value="${p.id}" ${p.id === id ? "selected" : ""}>${esc(p.name)}</option>`).join("");
    }
    function nextTaskId(p) {
      let n = p.tasks.length + 1, id;
      do { id = "T" + String(n).padStart(2, "0"); n++; } while (p.tasks.some(x => x.id === id));
      return id;
    }
    function nextProjId() {
      let n = db.projects.length + 1, id;
      do { id = "P" + String(n).padStart(2, "0"); n++; } while (db.projects.some(x => x.id === id));
      return id;
    }
    function walkTasks(fn) {
      const out = [];
      db.projects.forEach(p => p.tasks.forEach(t => out.push(fn(p, t))));
      return out;
    }
    function listed(kind) {
      return walkTasks((p, t) => ({ p, t })).filter(({ p, t }) => {
        if (t.status === "draft") return false;
        if (kind === "mine" && ui.role === "rd") return t.ownerRole === "rd";
        return true;
      });
    }
    function draftsOf(p) { return p.tasks.filter(x => x.status === "draft"); }
    function openAsks(t) { return (t.asks || []).filter(a => a.open); }
    function rulerOk(t) { return ui.role === "committee" && t && t.status !== "review" && t.status !== "done"; }
    function incompleteRuler(x) {
      return !x.params.length || x.params.some(pr => !String(pr.label || "").trim() || !String(pr.value || "").trim())
        || !x.criteria.length || x.criteria.some(c => !String(c.name || "").trim() || !String(c.target || "").trim());
    }
    function closeAsks(t) { (t.asks || []).forEach(a => { a.open = false; }); }
    function asksHtml(t) {
      const list = t.asks || [];
      if (!list.length) return `<p class="muted">还没有改参申请。</p>`;
      return `<div class="log">${list.map(a => `<article>
        <div class="muted">${esc(a.time)} · ${esc(a.by)} · ${a.open ? "待组委会确认" : "已处理"}</div>
        <div>${esc(a.text)}</div>
      </article>`).join("")}</div>`;
    }
    function parseParams(raw) {
      const text = String(raw || "").trim();
      if (!text) return [];
      if (text.startsWith("[") || text.startsWith("{")) {
        try {
          const j = JSON.parse(text);
          const arr = Array.isArray(j) ? j : (Array.isArray(j.params) ? j.params : []);
          return arr.map(x => {
            if (Array.isArray(x)) return P(String(x[0] || "").trim(), String(x[1] || "").trim());
            return P(String(x.label || x.name || x.key || "").trim(), String(x.value || x.target || x.val || "").trim());
          }).filter(x => x.label || x.value);
        } catch (err) {
          return null;
        }
      }
      return text.split(/\r?\n/).map(line => {
        const s = line.trim();
        if (!s) return null;
        let label = "", value = "";
        if (s.includes("\t")) {
          const parts = s.split("\t");
          label = parts[0]; value = parts.slice(1).join("\t");
        } else if (s.includes("，")) {
          const i = s.indexOf("，");
          label = s.slice(0, i); value = s.slice(i + 1);
        } else if (s.includes(",")) {
          const i = s.indexOf(",");
          label = s.slice(0, i); value = s.slice(i + 1);
        } else {
          label = s;
        }
        label = label.replace(/^["']|["']$/g, "").trim();
        value = value.replace(/^["']|["']$/g, "").trim();
        if (/^(参数名|参数|label|name|key)$/i.test(label) && /^(目标值|量产向目标值|value|target|val)$/i.test(value)) return null;
        if (!label && !value) return null;
        return P(label, value);
      }).filter(Boolean);
    }
    function kvTable(cols, rows, emptyText) {
      return `<div class="kv"><table>
        <thead><tr>${cols.map(c => `<th${c.w ? ` class="${c.w}"` : ""}>${c.t}</th>`).join("")}</tr></thead>
        <tbody>${rows || `<tr><td colspan="${cols.length}" class="muted">${emptyText}</td></tr>`}</tbody>
      </table></div>`;
    }
    function rulerFields(t, p, editable) {
      const pid = p.id;
      const params = t.params.map((pr, i) => `<tr>
        <td>${editable ? `<input data-act="param-label" data-pid="${pid}" data-id="${t.id}" data-i="${i}" value="${esc(pr.label)}" placeholder="如 出冰量">` : esc(pr.label)}</td>
        <td>${editable ? `<input data-act="param-val" data-pid="${pid}" data-id="${t.id}" data-i="${i}" value="${esc(pr.value)}" placeholder="量产向目标值">` : esc(pr.value)}</td>
        ${editable ? `<td class="col-act"><button class="btn link sm" type="button" data-act="del-param" data-pid="${pid}" data-id="${t.id}" data-i="${i}">删除</button></td>` : ""}
      </tr>`).join("");
      const crits = t.criteria.map((c, i) => `<tr>
        <td>${editable ? `<input data-act="crit-name" data-pid="${pid}" data-id="${t.id}" data-i="${i}" value="${esc(c.name)}" placeholder="如 保压">` : esc(c.name)}</td>
        <td>${editable ? `<input data-act="crit-tgt" data-pid="${pid}" data-id="${t.id}" data-i="${i}" value="${esc(c.target)}" placeholder="目标值">` : esc(c.target)}</td>
        ${editable ? `<td class="col-act"><button class="btn link sm" type="button" data-act="del-crit" data-pid="${pid}" data-id="${t.id}" data-i="${i}">删除</button></td>` : ""}
      </tr>`).join("");
      return `
        <div class="section">
          <div class="section-hd">
            <h3>参数（${t.params.length}）${editable ? " · 组委会写尺子" : " · 只读"}</h3>
            ${editable ? `<div class="toolbar">
              <button class="btn sm" type="button" data-act="add-param" data-pid="${pid}" data-id="${t.id}">增加参数</button>
              <button class="btn sm" type="button" data-act="open-import" data-pid="${pid}" data-id="${t.id}">导入参数</button>
            </div>` : ""}
          </div>
          ${kvTable(
            [{ t: "参数名" }, { t: "目标值" }].concat(editable ? [{ t: "", w: "col-act" }] : []),
            params,
            editable ? "还没有参数。可增加一行，或从表格粘贴导入。" : "还没有参数。"
          )}
        </div>
        <div class="section">
          <div class="section-hd">
            <h3>验收条件（${t.criteria.length}）${editable ? " · 组委会写尺子" : " · 只读"}</h3>
            ${editable ? `<div class="toolbar">
              <button class="btn sm" type="button" data-act="add-crit" data-pid="${pid}" data-id="${t.id}">增加验收条件</button>
            </div>` : ""}
          </div>
          ${kvTable(
            [{ t: "验收项" }, { t: "目标值" }].concat(editable ? [{ t: "", w: "col-act" }] : []),
            crits,
            editable ? "还没有验收条件。点「增加验收条件」。" : "还没有验收条件。"
          )}
        </div>`;
    }
    function importModal(t, p) {
      if (ui.modal !== "import" || !t) return "";
      return `<div class="mask" data-act="close-import">
        <div class="modal" data-act="noop">
          <div class="hd">
            <div>
              <h1>导入参数 · ${esc(t.id)} ${esc(t.name || "未命名任务")}</h1>
              <p>导入到当前选中任务，不影响其他任务。</p>
            </div>
            <button class="btn sm" type="button" data-act="close-import">关闭</button>
          </div>
          <div class="bd">
            <p class="hint-box">每行一条：参数名,目标值。也支持 Tab 分隔，或 JSON 数组 [{"label":"出冰量","value":"≥120kg/24h"}]。</p>
            <label class="fld" style="margin-bottom:12px">选择文件
              <input id="param-file" type="file" accept=".csv,.txt,.tsv,.json">
            </label>
            <label class="fld">粘贴内容
              <textarea id="imp-text" placeholder="交付对象,可台架验收的加热管&#10;功率,2.0kW±5%&#10;安装接口,待结构确认"></textarea>
            </label>
            <div class="row" style="margin-top:12px">
              <button class="btn pri" type="button" data-act="import-append" data-pid="${p.id}" data-id="${t.id}">追加导入</button>
              <button class="btn" type="button" data-act="import-replace" data-pid="${p.id}" data-id="${t.id}">覆盖后导入</button>
            </div>
          </div>
        </div>
      </div>`;
    }

    function render() {
      if (!proj(ui.pid) && db.projects[0]) ui.pid = db.projects[0].id;
      document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.view === ui.view));
      const root = document.getElementById("app");
      if (ui.view === "dispatch") root.innerHTML = viewDispatch();
      else if (ui.view === "sum") root.innerHTML = viewSum();
      else root.innerHTML = viewSplit();
    }

    function projList(extra) {
      const can = ui.role === "committee";
      return `<aside class="list">
        <h2>项目</h2>
        <p>每个项目各自拆任务、可分批发布，也可中途增补。</p>
        ${db.projects.map(p => `<button class="item ${p.id === ui.pid ? "on" : ""}" data-act="sel-proj" data-id="${p.id}" type="button">
          <b>${esc(p.name)}</b>
          <small>${draftsOf(p).length ? (p.published ? "可增补" : "拆解中") : (p.published ? "已发布" : "拆解中")} · ${p.tasks.length} 条任务${draftsOf(p).length ? " · 待发布 " + draftsOf(p).length : ""}</small>
        </button>`).join("")}
        ${can ? `<div style="padding:12px 16px"><button class="btn" type="button" data-act="add-proj">新建项目</button></div>` : ""}
        ${extra || ""}
      </aside>`;
    }

    function viewDispatch() {
      const p = current();
      const can = ui.role === "committee";
      const drafts = draftsOf(p);
      if (!p.tasks.find(x => x.id === ui.sel) && p.tasks[0]) ui.sel = p.tasks[0].id;
      if (p.tasks.length && !p.tasks.find(x => x.id === ui.sel)) ui.sel = p.tasks[0].id;
      if (!p.tasks.length) ui.sel = "";
      const sel = p.tasks.find(x => x.id === ui.sel);
      const ruler = sel && rulerOk(sel);
      const ident = can && sel && sel.status === "draft";
      return `<div class="split">
        ${projList()}
        <div class="main">
          <section class="panel">
            <div class="hd">
              <div>
                <h1>${can && !p.published ? `<input class="title-input" data-act="proj-name" data-pid="${p.id}" value="${esc(p.name)}" placeholder="项目名称">` : esc(p.name)}</h1>
                <p>未发布任务可删除。参数可删、可导入。已发布任务的名称 / 内容 / 责任人冻结。</p>
              </div>
              <div class="row">
                <button class="btn" type="button" data-act="add-task" ${can ? "" : "disabled"}>再拆一条</button>
                <button class="btn pri" type="button" data-act="publish" ${can && drafts.length ? "" : "disabled"}>${drafts.length ? (p.published ? "发布新增任务（" + drafts.length + "）" : "发布本项目任务") : "没有待发布任务"}</button>
              </div>
            </div>
            <div class="bd">
              ${p.tasks.length ? `<div class="task-table"><table>
                <thead><tr><th class="col-id">编号</th><th>任务名称</th><th class="col-owner">责任人</th><th class="col-st">状态</th><th class="col-act">操作</th></tr></thead>
                <tbody>
                  ${p.tasks.map(row => `<tr data-act="sel" data-pid="${p.id}" data-id="${row.id}" class="${row.id === ui.sel ? "on" : ""}">
                    <td class="col-id">${row.id}${openAsks(row).length ? `<div class="muted">待改参 ${openAsks(row).length}</div>` : ""}</td>
                    <td class="name${row.name ? "" : " ph"}">${esc(row.name || "未命名任务")}</td>
                    <td>${esc(row.owner)}</td>
                    <td>${chip(row.status)}</td>
                    <td class="col-act">
                      ${can && row.status === "published" ? `<button class="btn pri sm" data-act="activate" data-pid="${p.id}" data-id="${row.id}" type="button">开工</button>` : ""}
                      ${can && row.status === "draft" ? `<button class="btn link sm" data-act="del-task" data-pid="${p.id}" data-id="${row.id}" type="button">删除</button>` : ""}
                    </td>
                  </tr>`).join("")}
                </tbody>
              </table></div>` : `<p class="muted">还没有任务。点「再拆一条」，在下方填写后发布。</p>`}
              ${sel ? `<div class="editor">
                <h2>${sel.id} ${esc(sel.name || "未命名任务")} · ${ident ? "待发布，可改名称 / 内容 / 责任人" : (ruler ? "名称已冻结，组委会可改尺子" : "当前不可改尺子")}</h2>
                ${ident ? `<div class="form-2">
                  <div class="fld"><label>任务名称</label><input data-act="task-name" data-pid="${p.id}" data-id="${sel.id}" value="${esc(sel.name)}" placeholder="如 蒸发器"></div>
                  <div class="fld"><label>责任人</label><select data-act="task-owner" data-pid="${p.id}" data-id="${sel.id}">${ownerOpts(sel.ownerId)}</select></div>
                </div>
                <div class="fld" style="margin-bottom:12px"><label>任务内容</label><textarea data-act="task-content" data-pid="${p.id}" data-id="${sel.id}" rows="2" placeholder="量产向交付说明，可独立验收">${esc(sel.content)}</textarea></div>`
                : `<div class="fld" style="margin-bottom:12px"><label>任务内容 · 责任人 ${esc(sel.owner)}</label><div>${esc(sel.content) || "—"}</div></div>`}
                ${openAsks(sel).length ? `<div class="banner wait">主责待确认的改参申请，改完尺子即视为已对齐。</div>` : ""}
                ${rulerFields(sel, p, ruler)}
                <div class="section">
                  <div class="section-hd"><h3>改参申请</h3></div>
                  ${asksHtml(sel)}
                </div>
              </div>` : ""}
            </div>
          </section>
        </div>
        ${importModal(sel, p)}
      </div>`;
    }

    function viewSplit() {
      const isAcc = ui.view === "accept";
      const items = listed(isAcc ? "accept" : "mine");
      if (!items.find(x => x.p.id === ui.pid && x.t.id === ui.sel) && items[0]) {
        ui.pid = items[0].p.id; ui.sel = items[0].t.id;
      }
      const hit = items.find(x => x.p.id === ui.pid && x.t.id === ui.sel);
      const title = isAcc ? ["验收", "提验前可看条件、做准备。主责确认完工后才能交记录。"]
        : ["我的任务", "按人看任务。参数和验收条件只读。主责推进任务并确认完工；有问题向组委会提改参。"];
      return `<div class="split">
        <aside class="list">
          <h2>${title[0]}</h2>
          <p>${title[1]}</p>
          ${items.map(x => `<button class="item ${x.p.id === ui.pid && x.t.id === ui.sel ? "on" : ""}" data-act="sel" data-pid="${x.p.id}" data-id="${x.t.id}" type="button">
            <b>${x.t.id} ${esc(x.t.name)}</b>
            <small>${esc(x.p.name)} · ${esc(x.t.owner)} · ${ST[x.t.status].l}</small>
          </button>`).join("") || `<div class="empty">还没有已发布的任务。<br>请组委会先按项目拆任务并发布。</div>`}
        </aside>
        <div class="main">${hit ? (isAcc ? viewAccept(hit.t, hit.p) : viewMine(hit.t, hit.p)) : `<div class="empty">选择左侧任务</div>`}</div>
      </div>`;
    }

    function viewMine(t, p) {
      const pid = p.id;
      const own = ui.role === "rd" && t.ownerRole === "rd";
      const canFinish = own && t.status === "active";
      const last = t.records[0];
      const failed = last && !last.pass;
      const pending = openAsks(t);
      return `<section class="panel">
        <div class="hd">
          <div>${chip(t.status)}<h1 style="margin-top:8px">${t.id} ${esc(t.name)}</h1>
            <p>${esc(p.name)} · 主责 ${esc(t.owner)} · 辅助 ${t.helpers.join(" / ") || "—"}</p></div>
          ${canFinish ? `<button class="btn pri" type="button" data-act="finish" data-pid="${pid}" data-id="${t.id}">确认研发完工</button>` : ""}
        </div>
        <div class="bd">
          ${t.content ? `<div class="fld" style="margin-bottom:12px"><label>任务内容</label><div>${esc(t.content)}</div></div>` : ""}
          ${t.status === "review" ? `<div class="banner wait">已提验，尺子冻结。等待 TE 按当前验收条件落记录。</div>` : ""}
          ${t.status === "done" ? `<div class="banner ok">已闭环。对象结束，不是下一圈。</div>` : ""}
          ${t.status === "active" && failed ? `<div class="banner no">上次验收不通过。请与组委会对齐后改尺子，或按原尺子返工，再次确认完工才能再验。</div>` : ""}
          ${t.status === "published" ? `<div class="banner wait">已发布未开工。组委会开工后才能确认完工。尺子只读。</div>` : ""}
          ${pending.length ? `<div class="banner wait">已向组委会提改参，等待改尺子。当前参数仍按原尺子执行。</div>` : ""}
          ${rulerFields(t, p, false)}
          ${canFinish ? `<h3 style="margin:16px 0 8px;font-size:13px">向组委会提改参</h3>
            <textarea id="ask-txt" rows="2" placeholder="写明建议改哪一项参数或验收条件，以及原因"></textarea>
            <p style="margin:8px 0 16px"><button class="btn warn" type="button" data-act="propose" data-pid="${pid}" data-id="${t.id}">提交改参申请</button></p>` : ""}
          <h3 style="margin:16px 0 8px;font-size:13px">改参申请</h3>
          ${asksHtml(t)}
          <h3 style="margin:16px 0 8px;font-size:13px">验收记录</h3>
          ${recordsHtml(t)}
          <h3 style="margin:16px 0 8px;font-size:13px">变更</h3>
          ${changeHtml(t)}
        </div>
      </section>`;
    }

    function viewAccept(t, p) {
      const te = ui.role === "te";
      const canRecord = te && t.status === "review";
      const pid = p.id;
      return `<section class="panel">
        <div class="hd"><div>${chip(t.status)}<h1 style="margin-top:8px">${t.id} ${esc(t.name)}</h1>
          <p>${esc(p.name)} · 提验前只看条件。主责确认完工后才能交记录。</p></div></div>
        <div class="bd">
          ${t.content ? `<div class="fld" style="margin-bottom:12px"><label>任务内容</label><div>${esc(t.content)}</div></div>` : ""}
          ${t.status === "done" ? `<div class="banner ok">已闭环。对象结束，不是下一圈。</div>` : ""}
          ${t.status === "review" && te ? `<div class="banner wait">主责已确认完工。按当前验收条件检，结果必须留下记录。</div>` : ""}
          <h3 style="margin:0 0 8px;font-size:13px">验收条件（只读）</h3>
          <div class="grid">
            ${t.criteria.map(c => `<div class="fld acc"><label>${esc(c.name)}</label><div>${esc(c.target)}</div></div>`).join("")}
          </div>
          <h3 style="margin:16px 0 8px;font-size:13px">本次验收</h3>
          ${canRecord ? `<div class="grid">
            ${t.criteria.map((c, i) => `<div class="box">
              <label>${esc(c.name)} · 目标 ${esc(c.target)}</label>
              <input id="a-${i}" placeholder="实测值">
              <label style="margin-top:8px"><input type="checkbox" id="ap-${i}"> 本项通过</label>
            </div>`).join("")}
          </div>
          <textarea id="a-note" rows="2" placeholder="说明" style="margin:10px 0"></textarea>
          <div class="row">
            <button class="btn ok" type="button" data-act="rec-pass" data-pid="${pid}" data-id="${t.id}">提交验收记录 · 通过</button>
            <button class="btn warn" type="button" data-act="rec-fail" data-pid="${pid}" data-id="${t.id}">提交验收记录 · 不通过</button>
          </div>` : teNote(t)}
          <h3 style="margin:18px 0 8px;font-size:13px">已落记录</h3>
          ${recordsHtml(t)}
        </div>
      </section>`;
    }

    function teNote(t) {
      if (t.status === "done") return "";
      if (t.status === "published") return `<p class="muted">已发布未开工。可先看验收条件、准备实验室，不能交记录。</p>`;
      if (t.status === "active") return `<p class="muted">已开工，主责尚未确认完工。可看条件、做准备，不能交记录。</p>`;
      if (t.status === "review" && ui.role !== "te") return `<p class="muted">请切到李 TE 提交验收记录。</p>`;
      return `<p class="muted">当前不能交验收记录。</p>`;
    }

    function recordsHtml(t) {
      if (!t.records.length) return `<p class="muted">还没有验收记录。</p>`;
      return `<div class="log">${t.records.map(r => `<article>
        <div class="muted">${esc(r.time)} · ${esc(r.by)} · ${r.pass ? "通过" : "不通过"}</div>
        ${r.items.map(i => `<div>${esc(i.name)}：目标 ${esc(i.target)} / 实测 ${esc(i.actual)} · ${i.ok ? "过" : "不过"}</div>`).join("")}
        ${r.note ? `<div>说明：${esc(r.note)}</div>` : ""}
      </article>`).join("")}</div>`;
    }
    function changeHtml(t) {
      if (!t.changes.length) return `<p class="muted">还没有变更。</p>`;
      return `<div class="log">${t.changes.map(c => `<article><span class="muted">${esc(c.time)} · ${esc(c.by)}</span><div>${esc(c.text)}</div></article>`).join("")}</div>`;
    }

    function viewSum() {
      const p = current();
      const n = p.tasks.filter(t => t.status !== "draft").length;
      const rec = p.tasks.reduce((s, t) => s + t.records.length, 0);
      return `<div class="split">
        ${projList(`<p class="muted" style="padding:0 14px 14px">只读汇总。人的入口不是这张表。</p>`)}
        <div class="main"><section class="panel">
          <div class="hd"><div><h1>项目汇总 · ${esc(p.name)}</h1>
            <p>只读。上下文不在任务中心。</p></div></div>
          <div class="bd">
            <p class="muted">${p.published ? "已发布" : "未发布"} · 任务 ${n} · 验收记录 ${rec}</p>
            <table>
              <thead><tr><th>任务</th><th>责任人</th><th>任务内容</th><th>状态</th><th>验收记录</th><th>待改参</th><th>闸门</th></tr></thead>
              <tbody>${p.tasks.map(row => `<tr>
                <td><b>${row.id}</b> ${esc(row.name)}</td>
                <td>${esc(row.owner)}</td>
                <td>${esc(row.content)}</td>
                <td>${chip(row.status)}</td>
                <td>${row.records.length}</td>
                <td>${openAsks(row).length || "—"}</td>
                <td>${row.block && row.status === "published" ? esc(row.block) : "—"}</td>
              </tr>`).join("") || `<tr><td colspan="7" class="muted">还没有任务。</td></tr>`}</tbody>
            </table>
          </div>
        </section></div>
      </div>`;
    }

    function esc(s) { return String(s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m])); }
    function who() { return ROLES.find(r => r.id === ui.role).name; }
    function flushFields() {
      document.querySelectorAll("[data-act='proj-name'],[data-act='task-name'],[data-act='task-content'],[data-act='task-owner'],[data-act='param-label'],[data-act='param-val'],[data-act='crit-name'],[data-act='crit-tgt']").forEach(el => {
        const pr = proj(el.dataset.pid || ui.pid);
        if (!pr) return;
        if (el.dataset.act === "proj-name") { if (!pr.published) pr.name = el.value; return; }
        const row = task(el.dataset.id, pr.id);
        if (!row) return;
        if (row.status === "draft") {
          if (el.dataset.act === "task-name") row.name = el.value;
          if (el.dataset.act === "task-content") row.content = el.value;
          if (el.dataset.act === "task-owner") applyOwner(row, el.value);
        }
        if (rulerOk(row) && el.dataset.i != null) {
          const i = +el.dataset.i;
          if (el.dataset.act === "param-label" && row.params[i]) row.params[i].label = el.value;
          if (el.dataset.act === "param-val" && row.params[i]) row.params[i].value = el.value;
          if (el.dataset.act === "crit-name" && row.criteria[i]) row.criteria[i].name = el.value;
          if (el.dataset.act === "crit-tgt" && row.criteria[i]) row.criteria[i].target = el.value;
        }
      });
    }

    function collectRecord(t) {
      return t.criteria.map((c, i) => ({
        name: c.name, target: c.target,
        actual: (document.getElementById("a-" + i) || {}).value || "",
        ok: !!(document.getElementById("ap-" + i) && document.getElementById("ap-" + i).checked)
      }));
    }

    document.getElementById("role").innerHTML = ROLES.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
    document.getElementById("role").onchange = e => {
      const r = ROLES.find(x => x.id === e.target.value);
      ui.role = r.id; ui.view = r.home; render();
    };
    document.getElementById("reset").onclick = () => {
      db = seed(); localStorage.removeItem(KEY);
      ui.role = "committee"; ui.view = "dispatch"; ui.pid = "PX12"; ui.sel = "T03"; ui.modal = "";
      document.getElementById("role").value = "committee";
      toast("已重置。从组委会选项目、拆任务开始。"); render();
    };
    document.body.addEventListener("click", e => {
      const b = e.target.closest("[data-view], [data-act]");
      if (!b) return;
      if (b.dataset.view) { ui.view = b.dataset.view; render(); return; }
      const act = b.dataset.act, id = b.dataset.id, pid = b.dataset.pid || ui.pid;
      if (["task-name", "task-content", "task-owner", "param-label", "param-val", "crit-name", "crit-tgt", "noop"].includes(act)) return;
      const t0 = id && task(id, pid);
      if (act === "sel-proj") { ui.pid = id; ui.modal = ""; render(); return; }
      if (act === "sel") { ui.pid = pid; ui.sel = id; ui.modal = ""; render(); return; }
      if (act === "close-import") { ui.modal = ""; render(); return; }
      if (act === "open-import") {
        if (!rulerOk(t0)) return;
        ui.pid = pid; ui.sel = id; ui.modal = "import"; render(); return;
      }
      if (act === "import-append" || act === "import-replace") {
        if (!rulerOk(t0)) return;
        const rows = parseParams((document.getElementById("imp-text") || {}).value || "");
        if (rows === null) return toast("JSON 无法解析。请检查格式。");
        if (!rows.length) return toast("没有读到参数。每行一条：参数名,目标值。");
        if (act === "import-replace" && t0.params.length && !confirm("覆盖将删除当前任务已有参数，继续？")) return;
        const n = rows.length;
        if (act === "import-replace") t0.params = rows;
        else t0.params = t0.params.concat(rows);
        if (openAsks(t0).length) { closeAsks(t0); log(t0, "组委会已改尺子，改参申请关闭", who()); }
        log(t0, (act === "import-replace" ? "覆盖导入参数 " : "追加导入参数 ") + n + " 项", who());
        ui.modal = "";
        save(); toast("已导入 " + n + " 项参数。"); render(); return;
      }
      if (act === "del-task") {
        const p = proj(pid);
        if (ui.role !== "committee" || !p || !t0 || t0.status !== "draft") return;
        if (!confirm("删除未发布任务「" + t0.id + " " + (t0.name || "未命名任务") + "」？")) return;
        p.tasks = p.tasks.filter(x => x.id !== t0.id);
        if (ui.sel === t0.id) ui.sel = (p.tasks[0] && p.tasks[0].id) || "";
        save(); toast("已删除未发布任务。已发布任务不能删。"); render(); return;
      }
      if (act === "del-param") {
        if (!rulerOk(t0)) return;
        flushFields();
        const i = +b.dataset.i;
        const row = t0.params[i];
        if (!row) return;
        t0.params.splice(i, 1);
        if (openAsks(t0).length) { closeAsks(t0); log(t0, "组委会已改尺子，改参申请关闭", who()); }
        log(t0, "删除参数「" + (row.label || "未命名") + "」", who());
        save(); render(); return;
      }
      if (act === "del-crit") {
        if (!rulerOk(t0)) return;
        const i = +b.dataset.i;
        const row = t0.criteria[i];
        if (!row) return;
        t0.criteria.splice(i, 1);
        if (openAsks(t0).length) { closeAsks(t0); log(t0, "组委会已改尺子，改参申请关闭", who()); }
        log(t0, "删除验收条件「" + (row.name || "未命名") + "」", who());
        save(); render(); return;
      }
      if (act === "add-proj") {
        if (ui.role !== "committee") return;
        const nid = nextProjId();
        db.projects.push({ id: nid, name: "新项目", published: false, tasks: [] });
        ui.pid = nid; ui.modal = ""; save(); toast("已新建项目。先写项目下的任务名称、内容和责任人。"); render();
      }
      if (act === "add-task") {
        const p = current();
        if (ui.role !== "committee") return;
        const row = t(nextTaskId(p), "", "", [], [], [], "");
        p.tasks.push(row);
        ui.sel = row.id; ui.modal = "";
        save(); toast(p.published ? "已增补一条待发布任务。必须是可独立验收的新对象，不要把已有任务拆成两阶段。" : "已加一条。请填写名称、内容、责任人，并写参数和验收条件。"); render();
      }
      if (act === "publish") {
        const p = current();
        if (ui.role !== "committee") return;
        const drafts = draftsOf(p);
        if (!drafts.length) return toast(p.published ? "没有待发布的新增任务。" : "请先拆至少一条任务。");
        flushFields();
        const miss = drafts.find(x => !String(x.name || "").trim() || !String(x.content || "").trim() || !x.ownerId || incompleteRuler(x));
        if (miss) return toast("待发布任务都要有名称、内容、责任人，以及完整参数和验收条件。");
        const n = drafts.length;
        p.published = true;
        drafts.forEach(x => { x.status = "published"; });
        save(); toast(n === p.tasks.length ? "本项目已发布。之后可增补独立任务，仍须先发布再开工。" : "已发布 " + n + " 条新增任务。已有任务不受影响。"); render();
      }
      if (act === "activate") {
        if (ui.role !== "committee" || !t0) return;
        const p = proj(pid);
        if (p.id === "PX12" && t0.id === "T04") {
          const ev = task("T03", p.id);
          const ready = ev && ["active", "review", "done"].includes(ev.status);
          if (!ready) return toast("不能开工：蒸发器尚未就绪。推迟开工，不要拆成两阶段任务。");
          t0.block = "";
        }
        if (t0.block) return toast("开工条件未满足，保持未开工。");
        t0.status = "active"; save(); toast(t0.name + " 已开工。不等于可验收。"); render();
      }
      if (act === "finish") {
        if (!(ui.role === "rd" && t0 && t0.ownerRole === "rd") || t0.status !== "active") return;
        if (incompleteRuler(t0)) return toast("验收条件不完整，请组委会先写完尺子。");
        t0.status = "review";
        log(t0, "确认研发完工，提验", who());
        save(); toast("已提验。尺子冻结，TE 可以开始验收。"); render();
      }
      if (act === "propose") {
        if (!(ui.role === "rd" && t0 && t0.ownerRole === "rd" && t0.status === "active")) return;
        const text = (document.getElementById("ask-txt") || {}).value?.trim();
        if (!text) return toast("请写明建议改哪项参数或验收条件。");
        t0.asks = t0.asks || [];
        t0.asks.unshift({ time: now(), by: who(), text, open: true });
        log(t0, "向组委会提改参：" + text, who());
        save(); toast("已提交组委会。尺子仍只读，对齐后由组委会改。"); render();
      }
      if (act === "add-param") {
        if (!rulerOk(t0)) return;
        flushFields();
        t0.params.push(P("", ""));
        save(); render();
      }
      if (act === "add-crit") {
        if (!rulerOk(t0)) return;
        flushFields();
        t0.criteria.push(C("", ""));
        if (openAsks(t0).length) { closeAsks(t0); log(t0, "组委会已改尺子，改参申请关闭", who()); }
        log(t0, "增加验收条件", who()); save(); render();
      }
      if (act === "rec-pass" || act === "rec-fail") {
        if (ui.role !== "te" || !t0 || t0.status !== "review") return;
        const items = collectRecord(t0);
        const pass = act === "rec-pass";
        if (pass && items.some(i => !i.ok)) return toast("还有项未勾通过。不通过请走「提交验收记录 · 不通过」。");
        if (!pass && items.every(i => i.ok)) return toast("既已全部通过，请用「通过」提交。");
        t0.records.unshift({ time: now(), by: who(), pass, items, note: (document.getElementById("a-note") || {}).value || "" });
        if (pass) {
          t0.status = "done";
          toast("验收记录已保存，任务闭环。");
        } else {
          t0.status = "active";
          toast("验收记录已保存。任务回到已开工。请与组委会对齐后改尺子，主责再确认完工。验收中途不改条件。");
        }
        save(); render();
      }
    });
    document.body.addEventListener("change", e => {
      const el = e.target;
      if (el.id === "param-file") {
        const f = el.files && el.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          const box = document.getElementById("imp-text");
          if (box) box.value = String(reader.result || "");
        };
        reader.readAsText(f, "utf-8");
        return;
      }
      const act = el.dataset.act, id = el.dataset.id, pid = el.dataset.pid || ui.pid;
      const p = proj(pid);
      const t0 = id && task(id, pid);
      if (act === "proj-name") {
        if (ui.role !== "committee" || !p || p.published) return;
        p.name = el.value; save(); return;
      }
      if (["task-name", "task-content", "task-owner"].includes(act)) {
        if (ui.role !== "committee" || !t0 || t0.status !== "draft") return;
        if (act === "task-name") t0.name = el.value;
        if (act === "task-content") t0.content = el.value;
        if (act === "task-owner") applyOwner(t0, el.value);
        save(); return;
      }
      if (!t0 || !rulerOk(t0)) return;
      const i = +el.dataset.i;
      let changed = false;
      if (act === "param-label") {
        if (t0.params[i].label === el.value) return;
        log(t0, "改参数名「" + t0.params[i].label + "」→ " + el.value, who()); t0.params[i].label = el.value; changed = true;
      }
      if (act === "param-val") {
        if (t0.params[i].value === el.value) return;
        log(t0, "改参数「" + t0.params[i].label + "」→ " + el.value, who()); t0.params[i].value = el.value; changed = true;
      }
      if (act === "crit-name") {
        if (t0.criteria[i].name === el.value) return;
        log(t0, "改验收条件名称 → " + el.value, who()); t0.criteria[i].name = el.value; changed = true;
      }
      if (act === "crit-tgt") {
        if (t0.criteria[i].target === el.value) return;
        log(t0, "改验收目标「" + t0.criteria[i].name + "」→ " + el.value, who()); t0.criteria[i].target = el.value; changed = true;
      }
      if (changed && openAsks(t0).length) { closeAsks(t0); log(t0, "组委会已改尺子，改参申请关闭", who()); }
      if (changed) { save(); render(); }
    });

    render();
  </script>
</body>
</html>
