<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研发知识库 AI 协作平台 Demo · 版本二</title>
  <style>
    :root {
      --bg: #f3f6fa;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #e1e7ef;
      --primary: #2367d1;
      --primary-dark: #174b9b;
      --primary-soft: #eaf2ff;
      --cyan-soft: #eaf8fb;
      --green: #13835f;
      --green-soft: #e9f7f1;
      --amber: #a76000;
      --amber-soft: #fff5e3;
      --red: #c23c4b;
      --red-soft: #fff0f2;
      --purple: #6847be;
      --purple-soft: #f1edff;
      --nav: 218px;
      --shadow: 0 8px 28px rgba(23, 42, 77, .07);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    #app { min-height: 100%; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 58px;
      padding: 0 18px;
      color: #fff;
      background: #17264a;
    }
    .brand { min-width: 250px; font-size: 15px; font-weight: 800; }
    .brand small { display: block; margin-top: -2px; color: rgba(255,255,255,.62); font-size: 10px; font-weight: 500; }
    .version {
      padding: 3px 9px;
      color: #dce9ff;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .top-spacer { flex: 1; }
    .top-select {
      height: 34px;
      min-width: 190px;
      padding: 0 9px;
      color: #fff;
      background: #223868;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 8px;
      outline: none;
    }
    .top-button {
      height: 34px;
      padding: 0 11px;
      color: #fff;
      background: transparent;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 8px;
    }
    .top-button:hover { background: rgba(255,255,255,.08); }

    .layout {
      display: grid;
      grid-template-columns: var(--nav) minmax(0, 1fr);
      min-height: calc(100vh - 58px);
    }
    .nav {
      position: sticky;
      top: 58px;
      height: calc(100vh - 58px);
      overflow: auto;
      padding: 15px 11px;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }
    .nav-title {
      padding: 0 10px 7px;
      color: #98a2b3;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
    }
    .nav-button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 42px;
      margin: 2px 0;
      padding: 8px 10px;
      color: #475467;
      background: transparent;
      border: 0;
      border-radius: 9px;
      text-align: left;
      font-weight: 700;
    }
    .nav-button:hover { background: #f5f7fa; }
    .nav-button.on { color: var(--primary); background: var(--primary-soft); }
    .nav-icon {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      color: #667085;
      background: #f0f3f7;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 800;
    }
    .nav-button.on .nav-icon { color: #fff; background: var(--primary); }
    .nav-count {
      min-width: 20px;
      margin-left: auto;
      padding: 1px 6px;
      color: #667085;
      background: #eef1f5;
      border-radius: 999px;
      text-align: center;
      font-size: 10px;
    }
    .role-note {
      margin: 17px 5px 0;
      padding: 11px;
      color: #385375;
      background: #f6f9ff;
      border: 1px solid #dce6f6;
      border-radius: 10px;
      font-size: 11px;
    }
    .role-note b { display: block; margin-bottom: 3px; color: var(--primary-dark); }
    .main { min-width: 0; padding: 18px 22px 42px; }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .page-head h1 { margin: 0; font-size: 22px; line-height: 1.25; }
    .page-head p { margin: 4px 0 0; color: var(--muted); }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn {
      min-height: 34px;
      padding: 6px 12px;
      color: #344054;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-weight: 700;
    }
    .btn:hover { background: #f8fafc; }
    .btn.primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn.green { color: #fff; background: var(--green); border-color: var(--green); }
    .btn.small { min-height: 28px; padding: 3px 9px; font-size: 11px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .project-strip {
      display: grid;
      grid-template-columns: 1.2fr repeat(4, minmax(0, .72fr));
      gap: 9px;
      margin-bottom: 13px;
    }
    .project-main, .metric {
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 11px;
    }
    .project-main { background: #f8fbff; border-color: #cdddf2; }
    .project-main strong { display: block; margin-bottom: 2px; color: var(--primary-dark); font-size: 15px; }
    .project-main span, .metric span { color: var(--muted); font-size: 10px; }
    .metric b { display: block; margin-bottom: 1px; font-size: 17px; }
    .metric b.good { color: var(--green); }
    .metric b.warn { color: var(--amber); }

    .workspace {
      display: grid;
      grid-template-columns: 238px minmax(360px, 1fr) 330px;
      gap: 12px;
      min-height: 650px;
    }
    .panel {
      min-width: 0;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 1px 2px rgba(16,24,40,.02);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 48px;
      padding: 10px 13px;
      background: #fbfcfe;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: 14px; }
    .panel-head small { color: var(--muted); }

    .tree { padding: 8px; }
    .tree-project {
      width: 100%;
      padding: 9px 10px;
      margin-bottom: 5px;
      color: var(--primary-dark);
      background: var(--primary-soft);
      border: 0;
      border-radius: 8px;
      text-align: left;
      font-weight: 800;
    }
    .folder { margin-bottom: 3px; }
    .folder-row {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      min-height: 34px;
      padding: 6px 8px;
      color: #344054;
      background: transparent;
      border: 0;
      border-radius: 7px;
      text-align: left;
    }
    .folder-row:hover, .folder-row.on { background: #f3f6fa; }
    .folder-code { color: #8090a6; font-size: 10px; font-weight: 800; }
    .folder-count { margin-left: auto; color: #98a2b3; font-size: 10px; }
    .doc-list { padding: 2px 5px 5px 27px; }
    .doc-item {
      display: block;
      width: 100%;
      padding: 5px 6px;
      overflow: hidden;
      color: #667085;
      background: transparent;
      border: 0;
      border-radius: 5px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
    }
    .doc-item:hover { color: var(--primary); background: var(--primary-soft); }

    .chat-panel { display: grid; grid-template-rows: auto auto 1fr auto; }
    .context-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 9px 12px;
      background: #f7faff;
      border-bottom: 1px solid var(--line);
    }
    .context-chip {
      padding: 3px 7px;
      color: #36567c;
      background: #fff;
      border: 1px solid #d6e2f2;
      border-radius: 999px;
      font-size: 10px;
    }
    .quick-prompts {
      display: flex;
      gap: 6px;
      padding: 9px 12px 0;
      overflow-x: auto;
    }
    .quick {
      flex: 0 0 auto;
      padding: 5px 8px;
      color: #37557b;
      background: #fff;
      border: 1px solid #d7e1ef;
      border-radius: 7px;
      font-size: 10px;
    }
    .quick:hover { color: var(--primary); background: var(--primary-soft); border-color: #bcd0ef; }
    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 380px;
      max-height: 500px;
      padding: 14px;
      overflow: auto;
    }
    .message {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 10px;
      white-space: pre-line;
    }
    .message.user { align-self: flex-end; color: #fff; background: var(--primary); }
    .message.ai { align-self: flex-start; color: #30425d; background: #f4f7fb; border: 1px solid #e1e7ef; }
    .message strong { display: block; margin-bottom: 4px; color: #1f3c64; }
    .sources {
      margin-top: 8px;
      padding-top: 7px;
      color: #486b9f;
      border-top: 1px solid #dce5f0;
      font-size: 10px;
    }
    .composer {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      padding: 11px;
      background: #fbfcfe;
      border-top: 1px solid var(--line);
    }
    .composer input {
      min-width: 0;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #cfd8e5;
      border-radius: 8px;
      outline: none;
    }
    .composer.kb-ask { grid-template-columns: 1fr auto; }

    .context-panel { display: flex; flex-direction: column; }
    .context-body { padding: 12px; overflow: auto; }
    .role-card {
      padding: 11px;
      color: #294465;
      background: #f6f9ff;
      border: 1px solid #d9e5f5;
      border-radius: 9px;
    }
    .role-card b { display: block; margin-bottom: 3px; color: var(--primary-dark); }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 7px;
      font-size: 12px;
      font-weight: 800;
    }
    .check-list { display: grid; gap: 6px; }
    .check-item {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      width: 100%;
      padding: 8px;
      color: inherit;
      background: #fafbfc;
      border: 1px solid #e8ecf2;
      border-radius: 7px;
      text-align: left;
    }
    .check-item.has-doc { cursor: pointer; }
    .check-item.has-doc:hover { border-color: #c5d8f0; background: #f7fbff; }
    .check-item.unread { background: #fff8f8; border-color: #f3c4c8; }
    .unread-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 4px;
      background: #e11d48;
      border-radius: 50%;
      vertical-align: middle;
    }
    .status.red { color: #e11d48; background: #fff1f2; }
    .check {
      display: grid;
      width: 18px;
      height: 18px;
      place-items: center;
      color: #fff;
      background: #aeb8c6;
      border-radius: 50%;
      font-size: 10px;
      font-weight: 800;
    }
    .check.ok { background: var(--green); }
    .check.missing { color: var(--amber); background: var(--amber-soft); border: 1px solid #edc77f; }
    .check-item strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .check-item small { display: block; color: var(--muted); font-size: 9px; }
    .status {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
    }
    .status.green { color: var(--green); background: var(--green-soft); }
    .status.amber { color: var(--amber); background: var(--amber-soft); }
    .status.blue { color: var(--primary); background: var(--primary-soft); }
    .status.gray { color: #667085; background: #eef1f5; }
    .status.purple { color: var(--purple); background: var(--purple-soft); }

    .draft {
      margin-top: 12px;
      padding: 11px;
      background: #fffdf8;
      border: 1px solid #ead8b2;
      border-radius: 9px;
    }
    .draft h3 { margin: 0 0 6px; color: #80571d; font-size: 13px; }
    .draft p { margin: 0 0 7px; color: #665842; font-size: 10px; }
    .draft ul { margin: 5px 0 9px; padding-left: 17px; color: #665842; font-size: 10px; }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat { padding: 14px; }
    .stat b { display: block; margin: 2px 0; font-size: 23px; }
    .stat span { color: var(--muted); font-size: 10px; }
    .content-grid { display: grid; grid-template-columns: 255px minmax(0, 1fr); gap: 12px; }
    .kb-grid { display: grid; grid-template-columns: 238px minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
    .kb-search {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
    }
    .kb-search input, .kb-ask input {
      min-width: 0;
      height: 36px;
      padding: 0 10px;
      border: 1px solid #cfd8e5;
      border-radius: 8px;
      outline: none;
    }
    .kb-search input:focus, .kb-ask input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(35,103,209,.1); }
    .kb-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
      min-height: 26px;
      padding: 2px 9px;
      color: #475467;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .chip.on { color: var(--primary); background: var(--primary-soft); border-color: #b9d0f3; }
    .folder-row.filter-on { color: var(--primary); background: var(--primary-soft); }
    .cite-list { display: grid; gap: 8px; margin-top: 8px; }
    .cite-card {
      width: 100%;
      padding: 8px 9px;
      color: inherit;
      background: #fff;
      border: 1px solid #d6e2f2;
      border-radius: 8px;
      text-align: left;
    }
    .cite-card:hover { border-color: var(--primary); background: #f7fbff; }
    .cite-quote {
      margin-top: 5px;
      padding: 6px 8px;
      color: #294465;
      background: #f4f8ff;
      border-left: 3px solid var(--primary);
      font-size: 11px;
      line-height: 1.45;
    }
    .kb-ask-panel { display: flex; flex-direction: column; min-height: 560px; }
    .kb-messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 320px;
      max-height: 460px;
      padding: 12px;
      overflow: auto;
    }
    .history-list { display: grid; gap: 8px; margin-top: 10px; }
    .history-item {
      padding: 9px 10px;
      background: #fafbfc;
      border: 1px solid #e8ecf2;
      border-radius: 8px;
    }
    .history-item b { display: block; margin-bottom: 2px; }
    .diff-row { display: grid; gap: 6px; margin-top: 8px; }
    .diff-line { padding: 7px 9px; border-radius: 6px; font-size: 12px; line-height: 1.45; }
    .diff-line.del { color: #9f1239; background: #fff1f2; text-decoration: line-through; }
    .diff-line.add { color: #047857; background: #ecfdf5; }
    .legend-note { color: var(--muted); font-size: 10px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .card-pad { padding: 15px; }
    .card-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .card-title h2, .card-title h3 { margin: 0; }
    .doc-table { width: 100%; border-collapse: collapse; }
    .doc-table th, .doc-table td { padding: 10px 9px; border-bottom: 1px solid #edf0f4; text-align: left; vertical-align: top; }
    .doc-table th { color: #667085; background: #f8fafc; font-size: 10px; }
    .doc-table tr:last-child td { border-bottom: 0; }
    .doc-table tbody tr { cursor: pointer; }
    .doc-table tbody tr:hover { background: #f8fbff; }
    .doc-name { font-weight: 750; }
    .doc-meta { color: var(--muted); font-size: 10px; }

    .skills {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 11px;
    }
    .skill-card {
      min-height: 190px;
      padding: 15px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .skill-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .skill-code { color: var(--purple); font-size: 10px; font-weight: 800; }
    .skill-card h3 { margin: 2px 0 0; font-size: 15px; }
    .skill-card p { color: var(--muted); font-size: 11px; }
    .rule-list { margin: 8px 0 0; padding-left: 17px; color: #475467; font-size: 10px; }

    .modal-mask {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(17, 28, 51, .52);
    }
    .modal {
      width: min(680px, 96vw);
      max-height: 88vh;
      overflow: auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .modal-body { padding: 17px 18px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 13px 18px; background: #f8fafc; border-top: 1px solid var(--line); }
    .analysis-box { padding: 13px; margin-top: 12px; background: #f6f9ff; border: 1px solid #d8e5f5; border-radius: 9px; }
    .analysis-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 9px; }
    .analysis-item { padding: 9px; background: #fff; border: 1px solid #e0e7f0; border-radius: 7px; }
    .analysis-item small { display: block; color: var(--muted); }
    .analysis-item b { display: block; margin-top: 2px; }
    .close { color: #667085; background: transparent; border: 0; font-size: 20px; }
    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 80;
      max-width: 380px;
      padding: 11px 14px;
      color: #fff;
      background: #22314f;
      border-radius: 9px;
      box-shadow: var(--shadow);
    }
    .empty { padding: 25px 12px; color: var(--muted); text-align: center; }
    .metric.action {
      appearance: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      text-align: left;
      border-color: #c5d8f0;
    }
    .metric.action:hover { background: #f7fbff; border-color: var(--primary); }
    .metric-hint { display: block; margin-top: 3px; color: var(--primary); font-size: 10px; font-weight: 700; }
    .map-mask {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      grid-template-rows: auto auto 1fr;
      background: #e8ecf4;
    }
    .map-top {
      padding: 14px 20px 10px;
      color: #fff;
      background: linear-gradient(135deg, #17264a, #2754c5);
    }
    .map-top h2 { margin: 0 0 4px; font-size: 18px; }
    .map-top p { margin: 0; opacity: .88; font-size: 12px; }
    .map-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 8px 20px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      color: var(--muted);
    }
    .map-legend { display: flex; flex-wrap: wrap; gap: 12px; }
    .swatch { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); font-size: 9px; font-weight: 800; }
    .map-canvas { overflow: auto; padding: 12px; }
    .map-table { border-collapse: separate; border-spacing: 0; min-width: 980px; background: #fff; }
    .map-table th, .map-table td { border: 1px solid #e2e8f0; vertical-align: top; }
    .map-corner { position: sticky; left: 0; top: 0; z-index: 4; width: 108px; background: #f1f5f9; font-size: 11px; }
    .map-stage { position: sticky; top: 0; z-index: 3; min-width: 168px; padding: 8px 6px; background: #fff; text-align: center; font-size: 12px; font-weight: 800; }
    .map-stage small { display: block; color: var(--muted); font-weight: 500; font-size: 10px; }
    .map-stage.s-CD { border-top: 3px solid #94a3b8; background: #f8fafc; }
    .map-stage.s-KO { border-top: 3px solid #6366f1; background: #eef2ff; }
    .map-stage.s-ES { border-top: 3px solid #10b981; background: #ecfdf5; }

    let state = loadState();
    const ui = { view: "workbench", openFolders: ["product", "structure", "cooling", "quality"], modal: null, toast: "", kbQuery: "", kbFilter: "all", folderFilter: "", kbAsk: "", kbMessages: [] };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.projects) && parsed.projects[0]?.docs?.[0]?.status) return parsed;
        }
      } catch (error) {}
      return seed();
    }
    function persist() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function currentProject() { return state.projects.find(item => item.id === state.projectId); }
    function currentRole() { return state.roles[state.roleId]; }
    function currentNode() {
      const project = currentProject();
      const nodeId = project.currentNodeByRole[state.roleId];
      return project.nodes.find(item => item.id === nodeId) || project.nodes.find(item => item.roleId === state.roleId);
    }
    function nodeLabel(node) { return node ? `${node.stage} ${node.title}` : ""; }
    function docs() { return currentProject().docs; }
    function doc(id) { return docs().find(item => item.id === id); }
    function folder(id) { return state.folders.find(item => item.id === id); }
    function hasDoc(id) { return Boolean(id && doc(id)); }
    function isConfirmed(item) { return Boolean(item && item.status === "confirmed"); }
    function readKey() { return `${state.projectId}:${state.roleId}`; }
    function readMap() {
      state.readAt = state.readAt || {};
      state.readAt[readKey()] = state.readAt[readKey()] || {};
      return state.readAt[readKey()];
    }
    function lastReadVersion(docId) { return readMap()[docId]; }
    function isUnreadDoc(itemDoc) { return Boolean(itemDoc && lastReadVersion(itemDoc.id) !== itemDoc.version); }
    function unreadInputs() { return currentNode().inputs.filter(item => isUnreadDoc(doc(item.docId))); }
    function markDocRead(id) {
      const item = doc(id);
      if (!item) return;
      readMap()[id] = item.version;
    }
    function openDoc(id) {
      const item = doc(id);
      ui.modal = { type: "doc", id, fromVersion: item ? lastReadVersion(id) : "" };
      markDocRead(id);
      render();

    function isConfirmed(item) { return Boolean(item && item.status === "confirmed"); }
    function statusLabel(item) { return isConfirmed(item) ? "已确认" : "工作稿"; }
    function statusTone(item) { return isConfirmed(item) ? "green" : "amber"; }
    function versionTone(version) { return String(version || "").startsWith("v0") ? "amber" : "green"; }
    function confirmedDocs() { return docs().filter(isConfirmed); }
    function docHistory(item) { return item.history && item.history.length ? item.history : [{ version: item.version, status: item.status, date: item.updated, owner: item.owner, note: item.source, body: item.excerpt || "", changes: [] }]; }
    function roleProgress(items) { return items.filter(item => hasDoc(item.docId)).length; }

    function diffModal(id) {

      const current = history[history.length - 1];
      const prev = history[history.length - 2];
      const changes = current?.changes?.length ? current.changes : [
        { type: "del", text: prev?.body || "上一版正文" },
        { type: "add", text: current?.body || item.excerpt || "当前版正文" }
      ];
      return `
        <div class="modal-mask">
          <section class="modal">
            <div class="modal-head"><div><h2>版本差异 · ${esc(item.name)}</h2><span class="doc-meta">${esc(prev?.version || "上一版")} → ${esc(current?.version || item.version)} · 文本类示意</span></div><button class="close" data-act="close-modal">×</button></div>
            <div class="modal-body">
              <p class="legend-note">Demo 仅对方案/定义类文本做段落对比。图纸和 PDF 后续只提供换版说明，不做像素 diff。</p>
              <div class="diff-row">${changes.map(line => `<div class="diff-line ${line.type}">${line.type === "add" ? "新增：" : "删除："}${esc(line.text)}</div>`).join("")}</div>

            <div class="modal-foot"><button class="btn" data-act="open-history" data-id="${item.id}">返回历史</button><button class="btn primary" data-act="close-modal">关闭</button></div>

        </div>

    }

    function addMessage(type, text, sources = "") { state.messages.push({ type, text, sources }); }

    function answerPrompt(prompt) {
      const role = currentRole();
      const node = currentNode();
      const project = currentProject();
      addMessage("user", prompt);
      if (prompt.includes("缺口")) {
        const inputMissing = node.inputs.filter(item => !hasDoc(item.docId)).map(item => item.name);
        const outputMissing = node.outputs.filter(item => !hasDoc(item.docId)).map(item => item.name);
        addMessage("ai", `当前节点“${nodeLabel(node)}”还有以下缺口：\n输入缺口：${inputMissing.length ? inputMissing.join("、") : "无"}。\n输出缺口：${outputMissing.length ? outputMissing.join("、") : "无"}。\n缺项不会强制阻断你继续工作，但正式归档前应由责任人确认影响。`, "角色输入输出 Skill · 当前项目资料清单");
      } else if (prompt.includes("更新")) {
        const recent = docs().filter(item => item.updated >= "2026-08-14").slice(0, 4);
        addMessage("ai", recent.length
          ? `本项目近期资料更新：\n${recent.map((item, index) => `${index + 1}. ${item.name} ${item.version}（${item.updated}）`).join("\n")}\n是否影响当前节点，由你对照右侧输入清单判断。`
          : "当前项目暂无 8 月 14 日之后的资料更新。", `项目资料更新时间 · ${project.name}`);
      } else if (prompt.includes("风险")) {
        const missing = [...node.inputs, ...node.outputs].filter(item => !hasDoc(item.docId)).map(item => item.name);
        addMessage("ai", missing.length
          ? `识别到当前节点资料风险：${missing.join("、")} 尚未归档。\n系统只提醒缺口，不自动判定下游是否可开工。`
          : "当前节点输入输出均已有对应资料，主要风险转为版本是否需升版。", "资料完整性检查 Skill");
      } else if (prompt.includes("生成") || prompt.includes("输出") || prompt.includes("验证结论")) {
        generateDraft();
        addMessage("ai", `${state.generated.title} 初稿已生成，并显示在右侧“角色输入与输出”区域。\n${state.generated.summary}\n你可以预览全文，确认后归档为当前项目新版本。`, state.generated.sources);
      } else {
        addMessage("ai", `已基于“${role.name} / ${nodeLabel(node)}”处理你的问题。当前默认可引用 ${confirmedDocs().length} 份已确认资料；工作稿不会进入生成上下文。如需形成正式输出，请使用“生成工作输出”，并在归档前人工确认。`, `${project.name} · 当前节点上下文`);
      }
      render();
    }

    function generateDraft() {
      const node = currentNode();
      const project = currentProject();
      const ready = node.inputs.filter(item => isConfirmed(doc(item.docId)));
      const missing = node.inputs.filter(item => !hasDoc(item.docId));
      const unconfirmed = node.inputs.filter(item => hasDoc(item.docId) && !isConfirmed(doc(item.docId)));
      const pendingOut = node.outputs.find(item => !hasDoc(item.docId)) || node.outputs[0];
      state.generated = {
        roleId: state.roleId,
        nodeId: node.id,
        title: `${project.id.toUpperCase()} ${pendingOut.name}`,
        summary: missing.length || unconfirmed.length
          ? `已确认输入 ${ready.length} 项。缺档 ${missing.map(item => item.name).join("、") || "无"}；工作稿未引用 ${unconfirmed.map(item => item.name).join("、") || "无"}。`
          : "当前节点已确认输入已齐套，初稿可提交责任人确认。",
        sections: ["目标与适用范围", "输入资料与版本", "关键数据与判断", "风险及待跟踪事项", "来源与版本记录"],
        sources: ready.length ? ready.map(item => `${doc(item.docId).name} ${doc(item.docId).version}（已确认）`).join(" · ") : "当前节点尚无已确认输入",
        archived: false
      };
    }

    function askKnowledge(prompt) {
      const text = prompt.toLowerCase();
      const tokens = prompt.split(/[\s，。？?、]/).filter(item => item.length >= 2);
      const hit = item => tokens.some(token => `${item.name} ${item.excerpt || ""} ${item.type}`.toLowerCase().includes(token.toLowerCase()));
      const pick = ids => ids.map(id => doc(id)).filter(isConfirmed);
      let cites = [];
      let answer = "";
      let blocked = docs().filter(item => !isConfirmed(item) && hit(item)).map(item => `${item.name} ${item.version}`).join("、");
      if (state.projectId === "h8120" && /产冰|12kg|性能目标/.test(text)) {
        cites = pick(["prd", "perf", "test-method"]);
        answer = "按已确认资料：38℃ 环境下日产冰量目标为 12kg，允许偏差 ±5%；测试需在 38℃ 稳定后连续称重 24 小时有效产冰量。";
      } else if (/制冷方案|制冷系统方案/.test(text)) {
        cites = pick(["prd", "curve", "envelope"]);
        answer = "「制冷系统方案」当前是工作稿，问资料默认不引用。下面只给出已确认资料里与制冷相关的原文。";
        blocked = blocked || "H8120 制冷系统方案 v0.8";
      } else if (/包络|安装空间|压缩机仓/.test(text)) {
        cites = pick(["envelope"]);
        answer = "按已确认的结构包络：压缩机仓有效安装空间 186×142×128mm，冷凝器厚度不得超过 22mm。";
      } else if (state.projectId === "h8130") {
        cites = pick(["h8130-base"]);
        answer = cites.length
          ? "衍生项目目前只有基线包为已确认稿。产品定义、差异清单仍是工作稿，未纳入引用。"
          : "当前没有可引用的已确认资料。";
      } else {
        cites = confirmedDocs().filter(hit).slice(0, 3);
        answer = cites.length
          ? "根据已确认资料，相关原文如下。答案只绑定这些摘录，工作稿未纳入引用。"
          : "在已确认资料中没有找到可引用原文。可用上方检索查看工作稿，但不能把工作稿当作答案依据。";
      }
      ui.kbMessages.push({ type: "user", text: prompt });
      ui.kbMessages.push({ type: "ai", text: answer, cites, blocked });
      ui.kbAsk = "";
      render();
    }

    function confirmUpload() {
      const preset = uploadPreset();
      if (!hasDoc(preset.id)) {
        docs().push({
          id: preset.id, folderId: preset.folderId, name: preset.title, type: preset.type,
          version: "v1.0", status: "confirmed", owner: preset.owner, updated: TODAY,
          source: `AI 分类后由${preset.owner}确认归档`, loc: "智能归档摘录", excerpt: preset.hint
        });
        currentProject().nodes.forEach(node => {
          node.inputs.concat(node.outputs).forEach(item => {
            if (!item.docId && (item.name === preset.title || item.name.includes(preset.type) || preset.title.includes(item.name))) item.docId = preset.id;
          });
        });
      }
      ui.modal = null;
      addMessage("ai", `新资料“${preset.title}”已归档至“${folder(preset.folderId).code} ${folder(preset.folderId).name}”。\n已按文件名和类型尝试回写当前项目节点的输入/输出项。`, "文件识别分类 Skill · 角色输入输出 Skill");
      toast("资料已归档到当前项目，并尝试回写节点齐套状态");
    }

    function archiveDraft() {
      if (!state.generated) return;
      state.generated.archived = true;
      const node = currentNode();
      const outputId = `${node.id}-out`;
      if (!hasDoc(outputId)) {
        docs().push({
          id: outputId, folderId: "output", name: state.generated.title, type: "角色工作输出",
          version: "v0.9", status: "confirmed", owner: currentRole().person, updated: TODAY,
          source: "AI 初稿经责任人确认", loc: "确认归档摘要", excerpt: state.generated.summary
        });
      }
      const target = node.outputs.find(item => !hasDoc(item.docId)) || node.outputs.find(item => !item.docId);
      if (target) target.docId = outputId;
      ui.modal = null;
      addMessage("ai", `“${state.generated.title}”已归档至“99 项目正式输出”。\n状态为已确认，版本为 v0.9（版本号仍为 v0.x 黄色，但状态为绿色已确认，问资料可以引用）。`, "文档格式 Skill · 项目知识目录 Skill");
      toast("已确认归档：状态=已确认，版本=v0.9");
    }

    document.addEventListener("click", event => {
      if (event.target.classList.contains("modal-mask")) {
        ui.modal = null;
        render();
        return;
      }
      const target = event.target.closest("[data-act]");
      if (!target) return;
      const act = target.dataset.act;
      if (act === "view") { ui.view = target.dataset.view; render(); return; }
      if (act === "toggle-folder") {
        const id = target.dataset.id;
        ui.openFolders = ui.openFolders.includes(id) ? ui.openFolders.filter(item => item !== id) : [...ui.openFolders, id];
        ui.folderFilter = ui.folderFilter === id ? "" : id;
        render();
        return;
      }
      if (act === "clear-folder") { ui.folderFilter = ""; render(); return; }
      if (act === "kb-filter") { ui.kbFilter = target.dataset.filter; render(); return; }
      if (act === "kb-search") {
        ui.kbQuery = document.getElementById("kbSearch")?.value || "";
        render();
        return;
      }
      if (act === "kb-ask" || act === "kb-quick") {
        const prompt = act === "kb-quick" ? (target.dataset.prompt || "") : (document.getElementById("kbAsk")?.value.trim() || "");
        if (prompt) askKnowledge(prompt);
        return;
      }
      if (act === "open-history") { ui.modal = { type: "history", id: target.dataset.id }; render(); return; }
      if (act === "open-diff") { ui.modal = { type: "diff", id: target.dataset.id }; render(); return; }
      if (act === "upload") { ui.modal = { type: "upload" }; render(); return; }
      if (act === "open-map") { ui.modal = { type: "map" }; render(); return; }
      if (act === "select-node") {
        switchContext({ nodeId: target.dataset.id });
        ui.modal = null;
        toast("已切换到自己的工作节点，输入输出与 AI 上下文已更新");
        return;
      }
      if (act === "locked-node") {
        toast("只能切换归属自己角色的格子，其他人的节点仅供查看依赖");
        return;
      }
      if (act === "confirm-upload") { confirmUpload(); return; }
      if (act === "open-doc") { ui.modal = { type: "doc", id: target.dataset.id }; render(); return; }
      if (act === "close-modal") { ui.modal = null; render(); return; }
      if (act === "quick") { answerPrompt(target.dataset.prompt || ""); return; }
      if (act === "send") {
        const input = document.getElementById("chatInput");
        const prompt = input?.value.trim();
        if (prompt) answerPrompt(prompt);
        return;
      }
      if (act === "preview-draft") { ui.modal = { type: "draft" }; render(); return; }
      if (act === "archive") { archiveDraft(); return; }
      if (act === "reset") {
        if (window.confirm("恢复版本二 Demo 的预置示例数据？当前演示操作将被清除。")) {
          state = seed();
          ui.openFolders = ["product", "structure", "cooling", "quality"];
          ui.kbMessages = [];
          ui.kbQuery = "";
          ui.kbFilter = "all";
          ui.folderFilter = "";
          ui.view = "workbench";
          toast("已恢复预置示例数据");
        }
      }
    });

    document.addEventListener("change", event => {
      if (event.target.id === "projectSelect") {
        switchContext({ projectId: event.target.value });
        ui.view = "workbench";
        toast(`已切换到 ${currentProject().name}`);
        return;
      }
      if (event.target.id === "roleSelect") {
        switchContext({ roleId: event.target.value });
        toast(`已切换为 ${currentRole().name} 上下文`);
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Enter" && event.target.id === "chatInput") {
        event.preventDefault();
        const prompt = event.target.value.trim();
        if (prompt) answerPrompt(prompt);
      }
      if (event.key === "Enter" && event.target.id === "kbSearch") {
        event.preventDefault();
        ui.kbQuery = event.target.value;
        render();
      }
      if (event.key === "Enter" && event.target.id === "kbAsk") {
        event.preventDefault();
        const prompt = event.target.value.trim();
        if (prompt) askKnowledge(prompt);
      }
      if (event.key === "Escape" && ui.modal) {
        ui.modal = null;
        render();
      }
    });

    render();
  })();
  </script>
</body>
</html>
