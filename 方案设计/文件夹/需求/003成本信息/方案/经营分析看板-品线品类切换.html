<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>经营分析看板（新）· 品线 / 品类切换</title>
  <style>
    :root { --line:#e6edf5; --ink:#0f2f63; --muted:#64748b; --blue:#1677ff; --bg:#f3f6fb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#0f172a; }
    .top { height:48px; background:var(--blue); color:#fff; display:flex; align-items:center; padding:0 16px; }
    .main { padding:16px; }
    .filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .filters span { background:#fff; border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px; }
    .head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
    h2 { margin:0; font-size:15px; color:var(--ink); }
    .switch { display:flex; border:1px solid #bfdbfe; border-radius:6px; overflow:hidden; }
    .switch button { border:0; background:#fff; color:#1677ff; padding:4px 12px; cursor:pointer; }
    .switch button.on { background:#1677ff; color:#fff; }
    .layout { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px; }
    .crumb { font-size:13px; margin:8px 0; }
    .crumb button { border:0; background:transparent; color:#1677ff; cursor:pointer; padding:0; }
    .pie-wrap { display:flex; gap:16px; align-items:center; min-height:280px; }
    .pie { width:220px; height:220px; border-radius:50%; flex:none; cursor:pointer; }
    .legend { font-size:12px; flex:1; }
    .legend div { padding:4px 0; cursor:pointer; }
    .tabs { display:flex; gap:12px; font-size:13px; margin-bottom:8px; }
    .tabs span { cursor:pointer; color:var(--muted); }
    .tabs span.on { color:var(--blue); font-weight:700; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th, td { border-bottom:1px solid var(--line); padding:6px 8px; text-align:left; }
    td.n, th.n { text-align:right; }
    .bars { display:flex; align-items:flex-end; gap:10px; height:180px; margin-top:16px; }
    .bars i { display:block; width:36px; background:#34d399; border-radius:3px 3px 0 0; }
    .hint { font-size:12px; color:var(--muted); }
    button.exp { border:1px solid #bfdbfe; background:#fff; color:#1677ff; border-radius:6px; padding:4px 10px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="top">经营分析看板（新） · 品线销售额</div>
  <div class="main">
    <div class="filters">
      <span>平台 shopify</span><span>站点 全部</span><span>国家 全部</span>
      <span>北京时间 2026-10-14 至 2026-10-20</span>
    </div>
    <div class="card">
      <div class="head">
        <h2>品线销售趋势</h2>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="switch">
            <button type="button" id="btnLine" class="on">品线</button>
            <button type="button" id="btnCat">品类</button>
          </div>
          <button class="exp" type="button" id="exp">导出</button>
        </div>
      </div>
      <div class="layout">
        <div>
          <div class="tabs"><span id="tabChart" class="on">图表</span><span id="tabTable">明细</span></div>
          <div class="crumb" id="crumb"></div>
          <div id="chartPane">
            <div class="hint" id="pieTitle">品线销售额占比</div>
            <div class="pie-wrap">
              <div class="pie" id="pie"></div>
              <div class="legend" id="legend"></div>
            </div>
          </div>
          <div id="tablePane" style="display:none"></div>
        </div>
        <div>
          <div class="head"><strong>品线趋势图</strong><span class="hint">始终按品线，不随左侧切换</span></div>
          <div class="bars" id="bars"></div>
          <div class="hint" id="barNames" style="margin-top:8px"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const lines = [
      { name: "51线", value: 80000, cats: [{ name: "灯泡", value: 50000 }, { name: "灯条", value: 30000 }] },
      { name: "户外", value: 40000, cats: [{ name: "露营灯", value: 25000 }, { name: "灯带", value: 15000 }] },
      { name: "家电", value: 120000, cats: [{ name: "台灯", value: 50000 }, { name: "落地灯", value: 40000 }, { name: "灯带", value: 30000 }] },
      { name: "季节", value: 30000, cats: [{ name: "节日灯", value: 30000 }] },
      { name: "游戏", value: 10000, cats: [{ name: "氛围灯", value: 10000 }] },
      { name: "观影", value: 20000, cats: [{ name: "投影灯", value: 12000 }, { name: "屏幕灯", value: 8000 }] }
    ];
    const total = lines.reduce((s, x) => s + x.value, 0);
    const colors = ["#1677ff", "#34d399", "#fb923c", "#a78bfa", "#f472b6", "#facc15", "#2dd4bf", "#94a3b8"];
    let mode = "line";
    let selected = "";
    let tab = "chart";

    function money(n) { return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function currentItems() {
      if (mode === "line" && !selected) {
        return lines.map((x) => ({ label: x.name, value: x.value, base: total, clickable: true, key: x.name }));
      }
      if (mode === "line" && selected) {
        const line = lines.find((x) => x.name === selected);
        return line.cats.map((c) => ({ label: c.name, value: c.value, base: line.value, clickable: false }));
      }
      const all = [];
      lines.forEach((line) => line.cats.forEach((c) => {
        const dup = lines.filter((l) => l.cats.some((x) => x.name === c.name)).length > 1;
        all.push({ label: dup ? line.name + " / " + c.name : c.name, value: c.value, base: total, clickable: false });
      }));
      return all;
    }
    function viewName() {
      if (mode === "cat") return "全部品类";
      if (selected) return "品线「" + selected + "」下的品类";
      return "品线";
    }
    function render() {
      document.getElementById("btnLine").classList.toggle("on", mode === "line");
      document.getElementById("btnCat").classList.toggle("on", mode === "cat");
      document.getElementById("tabChart").classList.toggle("on", tab === "chart");
      document.getElementById("tabTable").classList.toggle("on", tab === "table");
      document.getElementById("chartPane").style.display = tab === "chart" ? "" : "none";
      document.getElementById("tablePane").style.display = tab === "table" ? "" : "none";
      const items = currentItems();
      document.getElementById("pieTitle").textContent = (mode === "line" && !selected ? "品线" : "品类") + "销售额占比 · 分母 " + money(items[0] ? items[0].base : total);
      document.getElementById("crumb").innerHTML = mode === "line" && selected
        ? "<button type=\"button\" id=\"back\">全部品线</button> / " + selected
        : (mode === "cat" ? "全部品类" : "全部品线");
      let acc = 0;
      const stops = items.map((it, i) => {
        const start = acc;
        acc += it.value / it.base * 100;
        return colors[i % colors.length] + " " + start.toFixed(2) + "% " + acc.toFixed(2) + "%";
      });
      document.getElementById("pie").style.background = "conic-gradient(" + stops.join(",") + ")";
      document.getElementById("legend").innerHTML = items.map((it, i) =>
        "<div data-i=\"" + i + "\">" + it.label + "：" + money(it.value) + "（" + (it.value / it.base * 100).toFixed(2) + "%）</div>"
      ).join("");
      document.getElementById("tablePane").innerHTML = "<table><tr><th>" + (mode === "line" && !selected ? "品线" : "品类") + "</th><th class=\"n\">销售额</th><th class=\"n\">占比</th></tr>" +
        items.map((it) => "<tr><td>" + it.label + "</td><td class=\"n\">" + money(it.value) + "</td><td class=\"n\">" + (it.value / it.base * 100).toFixed(2) + "%</td></tr>").join("") +
        "</table>";
      const back = document.getElementById("back");
      if (back) back.onclick = () => { selected = ""; render(); };
    }
    document.getElementById("btnLine").onclick = () => { mode = "line"; selected = ""; render(); };
    document.getElementById("btnCat").onclick = () => { mode = "cat"; selected = ""; render(); };
    document.getElementById("tabChart").onclick = () => { tab = "chart"; render(); };
    document.getElementById("tabTable").onclick = () => { tab = "table"; render(); };
    document.getElementById("legend").onclick = (e) => {
      const el = e.target.closest("[data-i]");
      if (!el || mode !== "line" || selected) return;
      selected = currentItems()[Number(el.dataset.i)].key;
      render();
    };
    document.getElementById("pie").onclick = (e) => {
      if (mode !== "line" || selected) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;
      let deg = Math.atan2(y, x) * 180 / Math.PI + 90;
      if (deg < 0) deg += 360;
      const items = currentItems();
      let acc = 0;
      for (let i = 0; i < items.length; i++) {
        acc += items[i].value / items[i].base * 360;
        if (deg <= acc) { selected = items[i].key; render(); return; }
      }
    };
    document.getElementById("exp").onclick = () => {
      const items = currentItems();
      const linesCsv = ["名称,销售额,占比,视图"].concat(items.map((it) => it.label + "," + it.value + "," + (it.value / it.base * 100).toFixed(2) + "%," + viewName()));
      const blob = new Blob(["\uFEFF" + linesCsv.join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "品线销售额-" + viewName() + ".csv";
      a.click();
    };
    document.getElementById("bars").innerHTML = [70, 88, 60, 76, 64, 48, 40].map((h) => "<i style=\"height:" + h + "%\"></i>").join("");
    document.getElementById("barNames").textContent = lines.map((x) => x.name).join("  ");
    render();
  </script>
</body>
</html>
