<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERP 原型分享</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-title">
        <span class="title-text">原型目录</span>
        <button type="button" class="icon-btn" id="refreshBtn" title="刷新">↻</button>
      </div>
      <div class="search-wrap">
        <input id="filterInput" type="search" placeholder="筛选…" autocomplete="off" />
        <div class="tree-toolbar">
          <label class="proto-filter">
            <input id="prototypeOnlyCheck" type="checkbox" />
            <span>原型</span>
          </label>
          <span class="toolbar-sep" aria-hidden="true"></span>
          <button type="button" class="text-btn" id="expandAllBtn">全部展开</button>
          <button type="button" class="text-btn" id="collapseAllBtn">全部收拢</button>
        </div>
      </div>
      <div class="tree" id="tree" role="tree"></div>
      <div class="sidebar-footer">
        <div class="lan-line">
          <span>局域网</span>
          <code id="lanUrl">-</code>
        </div>
        <button type="button" class="text-btn" id="copyLanBtn">复制首页链接</button>
      </div>
    </aside>

    <main class="main">
      <div class="main-empty" id="mainEmpty">
        <h1>原型分享</h1>
        <p>像资源管理器一样展开左侧目录，在需求或 HTML 旁点「分享」，把链接发给同事即可。</p>
        <ul>
          <li>点三角展开 / 折叠</li>
          <li>点名称进入该目录详情</li>
          <li>「分享」复制局域网链接</li>
        </ul>
      </div>

      <div class="detail" id="detail" hidden>
        <header class="detail-head">
          <div>
            <div class="detail-path" id="detailPath"></div>
            <h1 id="detailTitle">-</h1>
          </div>
          <div class="detail-actions">
            <button type="button" class="btn" id="detailShareBtn">分享此目录</button>
            <a class="btn primary" id="detailPreviewBtn" target="_blank" rel="noopener" hidden>打开原型</a>
          </div>
        </header>
        <div class="detail-files" id="detailFiles"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
