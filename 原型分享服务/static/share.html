<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>共享原型</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="share-body">
  <div class="share-app">
    <header class="share-bar">
      <div>
        <div class="share-label">共享目录</div>
        <h1 id="folderName">加载中…</h1>
        <div class="share-path" id="folderPath"></div>
      </div>
      <a class="btn primary" id="openPrimary" target="_blank" rel="noopener" hidden>新窗口打开</a>
    </header>
    <div class="share-preview" id="previewWrap" hidden>
      <iframe id="previewFrame" title="原型预览"></iframe>
    </div>
    <section class="share-list-wrap">
      <div class="share-list-title">文件</div>
      <div id="fileList" class="file-rows"></div>
      <p class="empty" id="empty" hidden>暂无可查看文件</p>
    </section>
  </div>
  <script src="/static/share.js"></script>
</body>
</html>
